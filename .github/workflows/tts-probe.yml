name: tts probe (temporary)
on:
  push:
    paths: ['.github/workflows/tts-probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install "edge-tts>=7,<8" && pip show edge-tts | head -2
      - run: |
          for v in zh-TW-YunJheNeural zh-TW-HsiaoChenNeural en-IE-ConnorNeural; do
            edge-tts --voice $v --text "你好 hello" --write-media /tmp/$v.mp3 && ls -la /tmp/$v.mp3 || echo "FAIL $v"
          done
          edge-tts --voice zh-TW-YunJheNeural --rate=+6% --pitch=-4Hz --text "打工的時候突然生病" --write-media /tmp/a.mp3 && ls -la /tmp/a.mp3 || echo FAIL-prosody
          pip install -q -U edge-tts && pip show edge-tts | head -2 && edge-tts --voice zh-TW-YunJheNeural --text "你好" --write-media /tmp/b.mp3 && ls -la /tmp/b.mp3 || echo FAIL-latest
