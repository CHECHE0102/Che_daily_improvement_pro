name: Daily short audio
on:
  push:
    branches: ['claude/**']
    paths: ['social/daily/*/script.json']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "edge-tts>=7,<8"
      - run: python tools/make_daily_short_audio.py social/daily/*/script.json
      - run: |
          git config user.name "CHECHE0102"; git config user.email "CHECHE0102@users.noreply.github.com"
          git add social/daily && git commit -qm "Daily short audio" && git push -q origin HEAD:${GITHUB_REF_NAME} || echo nothing
