name: Publish daily articles
# The daily task pushes new articles to a branch named claude/articles-YYYY-MM-DD.
# This merges that branch into main (which GitHub Pages serves) and then deletes it.
on:
  push:
    branches: ['claude/articles-**']
permissions:
  contents: write
concurrency: publish-articles
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge article branch into main
        run: |
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          BR="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BR"
          # only daily content may come in this way: articles, reasoning questions, IELTS/TOEIC weekly sets
          CHANGED=$(git diff --name-only "$(git merge-base origin/main "origin/$BR")" "origin/$BR")
          echo "$CHANGED"
          if [ -n "$CHANGED" ] && echo "$CHANGED" | grep -qvE '^(articles|reason|ielts/weeks|toeic/weeks)/'; then echo "Branch changes files outside the daily content folders — refusing"; exit 1; fi
          git merge --no-edit "origin/$BR"
          # bump the app version so phones pick up the new content (year.month.build, build resets each month)
          python3 - <<'PY'
          import re, json, datetime
          s = open("index.html").read(); m = re.search(r'APP_VERSION="(\d+)\.(\d+)\.(\d+)"', s)
          now = datetime.datetime.utcnow(); y, mo, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
          v = f"{now.year}.{now.month}.{b + 1 if (y, mo) == (now.year, now.month) else 1}"
          open("index.html", "w").write(s[:m.start()] + f'APP_VERSION="{v}"' + s[m.end():])
          json.dump({"v": v}, open("version.json", "w"), separators=(",", ":"))
          print("version", v)
          PY
          git add index.html version.json
          git commit -q -m "Bump version for daily content" || true
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin main && break; sleep 5; done
          git push origin --delete "$BR"
