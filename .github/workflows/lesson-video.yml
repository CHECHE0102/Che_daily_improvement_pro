name: Lesson video
on:
  push:
    paths: ['lessons/scripts/**', 'tools/make_lesson_video.py', 'tools/render_frames.js', '.github/workflows/lesson-video.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk
      - run: pip install "edge-tts>=7,<8" numpy
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Build videos
        run: for f in lessons/scripts/*.json; do python tools/make_lesson_video.py "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-videos
          path: lessons/out/*.mp4
          retention-days: 30
      - name: Push previews to the lesson-videos branch (kept off main so Pages stays small)
        run: |
          mkdir /tmp/pv && cp lessons/out/*.mp4 /tmp/pv/
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          git checkout --orphan lesson-videos-tmp && git rm -rfq . && cp /tmp/pv/*.mp4 .
          git add *.mp4 && git commit -qm "Lesson video previews"
          git push -fq origin HEAD:lesson-videos
