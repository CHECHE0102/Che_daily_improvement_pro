name: News proofreading pack
# Builds plain-text pages of the last 3 days' news (all levels, zh sentences, glossary, questions)
# for the outside proofreader (ChatGPT task) and publishes them to review/ on main.
# Read: https://binbindaily.com/review/latest.md
on:
  workflow_run:
    workflows: ['Publish daily articles']
    types: [completed]
  schedule:
    - cron: '5 8 * * *'    # backup runs after the daily + regional news land
    - cron: '5 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-review
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/make_review_pack.py out 3
      - name: Publish to review/ on main (GitHub Pages serves it at binbindaily.com/review/)
        run: |
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -rf review && mkdir -p review && cp -r out/. review/
            git add -A review
            git diff --cached --quiet && { echo "no change"; exit 0; }
            git commit -q -m "News proofreading pack $(date -u +%F' '%H:%M)"
            git push -q origin HEAD:main && exit 0
            sleep $((i*7))
          done
          exit 1
