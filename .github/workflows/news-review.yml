name: News proofreading pack
# Builds plain-text pages of the last 3 days' news (all levels, zh sentences, glossary, questions)
# for the outside proofreader (ChatGPT task) and publishes them to the branch "news-review".
# Read: https://raw.githubusercontent.com/CHECHE0102/Che_daily_improvement_pro/news-review/latest.md
on:
  workflow_run:
    workflows: ['Publish daily articles']
    types: [completed]
  schedule:
    - cron: '5 8 * * *'    # backup runs after the daily + regional news land
    - cron: '5 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-review
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/make_review_pack.py out 3
      - name: Publish to branch "news-review" (replaced every run)
        run: |
          cd out
          git init -q -b news-review
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          git add -A
          git commit -q -m "News proofreading pack $(date -u +%F' '%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" news-review
