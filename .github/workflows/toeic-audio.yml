name: TOEIC listening audio
on:
  push:
    branches: [main]
    paths: ['toeic/tests.json', 'toeic/weeks/**', 'tools/make_toeic_audio.py', '.github/workflows/toeic-audio.yml']
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toeic-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "edge-tts>=6.1,<8"
      - run: python tools/make_toeic_audio.py
      - name: Commit audio
        run: |
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          git add -A toeic/audio
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update TOEIC listening audio"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
