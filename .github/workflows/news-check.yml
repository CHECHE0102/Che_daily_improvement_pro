name: Daily news check
# Fails (so GitHub e-mails the owner) when today's news is not live on the site by mid-morning:
# no national article for today's Irish date, or today's main article has no read-aloud audio.
# It reads the live site, so it also catches a Pages deploy that never went out.
on:
  schedule:
    - cron: '30 8 * * *'    # 08:30 UTC = 08:30 Irish winter time / 09:30 summer time, after the 06:43 news task and the relay
    - cron: '30 11 * * *'   # second look later in the morning (a late run may have fixed it by then)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check today's articles and audio on the live site
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, datetime, zoneinfo
          SITE = "https://binbindaily.com/"
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Europe/Dublin")).date().isoformat()
          def get(path):
              req = urllib.request.Request(SITE + path + "?t=" + str(datetime.datetime.now().timestamp()), headers={"User-Agent": "BinBinNewsCheck/1.0", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          problems = []
          try:
              arts = get("articles/index.json")["articles"]
          except Exception as e:
              print(f"::error::Could not read articles/index.json from the site: {e}"); sys.exit(1)
          national = [a for a in arts if a.get("date") == today and not a.get("region")]
          print(f"{today}: {len(national)} national article(s) live")
          if not national:
              latest = max((a.get("date", "") for a in arts), default="none")
              problems.append(f"No national news for {today} on the site (latest is {latest}). Check the daily news task, then the relay branch and the 'Publish daily articles' run.")
          else:
              try:
                  items = get("news-audio.json")["items"]
                  main = today
                  have = sorted(k.split("|")[1] for k in items if k.split("|")[0] == main)
                  print(f"read-aloud audio for {main}: {have or 'none'}")
                  if not have:
                      problems.append(f"Today's main article {main} has no read-aloud audio yet. Check the 'News read-aloud audio' run.")
              except Exception as e:
                  problems.append(f"Could not read news-audio.json from the site: {e}")
          for p in problems:
              print("::error::" + p)
          sys.exit(1 if problems else 0)
          PY
