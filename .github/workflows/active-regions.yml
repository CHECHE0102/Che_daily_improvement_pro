name: Export active news regions
# Reads the app's region activity from Firestore (public doc stats/regions)
# and saves it to articles/active-regions.json so the daily regional news task can read it.
on:
  schedule:
    # GitHub runs scheduled jobs late on this repo (05:00 runs landed 11:30-13:00 UTC),
    # so also run the evening before; either run is fresh enough for the 6-day window.
    - cron: '23 18 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish-articles
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch stats/regions
        run: |
          curl -sf "https://firestore.googleapis.com/v1/projects/che-daily-improvement-pro/databases/(default)/documents/stats/regions" -o raw.json || echo '{}' > raw.json
          python3 - <<'PY'
          import json, datetime
          raw = json.load(open("raw.json"))
          fields = raw.get("fields", {})
          regions = {k: v.get("stringValue", "") for k, v in fields.items()}
          # The list is for the NEXT regional news run (07:23 Dublin). Runs after 08:00 UTC
          # (the late 05:00 run and evening runs before midnight) are for tomorrow's news.
          now = datetime.datetime.utcnow()
          news_day = now.date() + datetime.timedelta(days=1 if now.hour >= 8 else 0)
          # A region gets news for 7 days counting the day it was last seen (seen 11-16 -> news up to 11-22).
          cutoff = (news_day - datetime.timedelta(days=6)).isoformat()
          active = sorted([k for k, d in regions.items() if d >= cutoff and k != "IE"], key=lambda k: regions[k], reverse=True)
          out = {"updated": now.strftime("%Y-%m-%dT%H:%M:%SZ"), "newsDay": news_day.isoformat(), "cutoff": cutoff, "ok": bool(raw), "regions": regions, "active": active}
          json.dump(out, open("articles/active-regions.json", "w"), indent=1, ensure_ascii=False)
          print(out)
          PY
          rm raw.json
      - name: Commit
        run: |
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          git add articles/active-regions.json
          git diff --cached --quiet || (git commit -m "Update active regions" && git push origin main)
