name: Long lesson video
# Renders the 5-10 minute lessons (lessons/long/*.json, 1920x1080 for YouTube) and stores the mp4 on the
# lesson-videos branch next to the short lesson videos (kept off main so GitHub Pages stays small).
on:
  push:
    paths: ['lessons/long/**', 'tools/make_long_lesson.py', 'tools/render_long_frames.js', 'assets/art/lesson/niamh/**', '.github/workflows/long-lesson.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: long-lesson-${{ github.ref }}
  cancel-in-progress: true
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "edge-tts>=7,<8" numpy
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-color-emoji
      - name: Restore voice clips from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: lessons/out/*/a*
          key: long-lesson-tts-${{ github.run_id }}
          restore-keys: long-lesson-tts-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Render
        # the TTS service sometimes refuses for a few minutes; finished clips stay on disk, so each pass carries on
        run: |
          npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          for f in lessons/long/*.json; do
            for i in 1 2 3 4; do python tools/make_long_lesson.py "$f" && break; echo "pass $i failed, waiting"; sleep 90; done
          done
          ls -la lessons/out/*.mp4
      - name: Keep voice clips for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lessons/out/*/a*
          key: long-lesson-tts-${{ github.run_id }}
      - name: Keep each video under GitHub's 100 MB file limit
        run: |
          for f in lessons/out/*.mp4; do
            if [ "$(stat -c%s "$f")" -gt 90000000 ]; then
              echo "::warning::$f is over 90 MB, encoding it again at a lower bitrate"
              ffmpeg -y -v error -i "$f" -c:v libx264 -preset slow -b:v 1300k -maxrate 1500k -bufsize 3000k -pix_fmt yuv420p -c:a copy -movflags +faststart /tmp/small.mp4 && mv /tmp/small.mp4 "$f"
            fi
          done
          ls -la lessons/out/*.mp4
      - name: Store videos on the lesson-videos branch
        run: |
          mkdir -p /tmp/pv && cp lessons/out/*.mp4 /tmp/pv/
          if git fetch -q origin lesson-videos; then git worktree add -q /tmp/vb origin/lesson-videos && cd /tmp/vb && git checkout -q -B lesson-videos
          else git worktree add -q --detach /tmp/vb && cd /tmp/vb && git checkout -q --orphan lesson-videos && git rm -rfq .; fi
          git config user.name "CHECHE0102"
          git config user.email "CHECHE0102@users.noreply.github.com"
          cp /tmp/pv/*.mp4 . && git add *.mp4
          git commit -qm "Long lesson video" || exit 0
          git push -q origin HEAD:lesson-videos
