/* ================= onboarding (first launch) ================= */
const ONB_KEY="che-pro-onb";
function onbMaybe(){
  let done=null; try{ done=localStorage.getItem(ONB_KEY); }catch(e){}
  const g=S.game, fresh=!S.words.size&&!S.days.size&&(!g||((g.lv||1)<=1&&!g.exp));
  if(!done&&fresh){ S.onb={step:0}; onbRender(); }
  else if(!done){ try{ localStorage.setItem(ONB_KEY,"old"); }catch(e){} }
}
function onbClose(start){
  try{ localStorage.setItem(ONB_KEY,"1"); }catch(e){}
  actPing({o:S.onb?S.onb.step:0});
  S.onb=null; onbRender();
  if(start&&mainArticle()){ S.tab="today"; S.backTo="today"; S.articleId=mainArticle().id; S.view="read"; S.quiz=null; render(); window.scrollTo(0,0); } else { S.tab="today"; S.view="today"; render(); }
}
function onbRender(){
  let el=document.getElementById("onb");
  if(!S.onb){ if(el) el.remove(); document.body.classList.remove("onb-open"); return; }
  if(!el){ el=document.createElement("div"); el.id="onb"; el.className="onb"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); document.body.append(el); }
  document.body.classList.add("onb-open");
  const st=S.onb.step, N=4, dots=`<div class="onb-dots">${Array.from({length:N},(_,i)=>`<i class="${i===st?"on":""}"></i>`).join("")}</div>`;
  let body="";
  if(st===0) body=`<img src="assets/binbin-head.webp" alt="" class="onb-dog"><h2>${T("onbHi")}</h2><p>${T("onbHiSub")}</p>`;
  else if(st===1) body=`<div class="onb-ic">🌏</div><h2>${T("onbLang")}</h2><div class="onb-opts">${LANGS.map(l=>`<button class="opt set-opt${l.k===langKey()?" right":""}" data-act="onblang" data-k="${l.k}" data-nosc><b>${l.label}</b></button>`).join("")}</div>`;
  else if(st===2) body=`<div class="onb-ic">🎯</div><h2>${T("onbLevel")}</h2><p class="sm-t">${T("onbLevelSub")}</p><div class="onb-opts">${LEVELS.map(l=>`<button class="opt set-opt${l.k===LEVEL?" right":""}" data-act="onblvl" data-k="${l.k}"><b>${l.k==="IELTS"?"IELTS 7–8":l.k}</b><span class="optm">${T("lv"+l.k)}</span></button>`).join("")}</div>`;
  else body=`<div class="onb-ic">🐶</div><h2>${T("onbHow")}</h2><ol class="onb-steps"><li><b>📰</b><span>${T("onbHow1")}</span></li><li><b>✅</b><span>${T("onbHow2")}</span></li><li><b>🧠</b><span>${T("onbHow3")}</span></li><li><b>🎮</b><span>${T("onbHow4")}</span></li></ol>`;
  const nav=st<N-1?`<button class="btn" data-act="onbnext">${T("onbNext")}</button>`:`<button class="btn" data-act="onbstart">${T("onbStart")}</button><button class="btn ghost" data-act="onblook">${T("onbLook")}</button>`;
  el.innerHTML=`<div class="onb-card">${st>0?`<button class="onb-back" data-act="onbback" aria-label="back">‹</button>`:""}<button class="onb-skip" data-act="onbskip">${T("onbSkip")}</button>${body}${dots}<div class="onb-nav">${nav}</div></div>`;
  scApply&&scApply();
}
function onbCoach(){
  let done=null; try{ done=localStorage.getItem(ONB_KEY); }catch(e){}
  if(done!=="1") return "";

document.addEventListener("click",e=>{ const t=e.target.closest("#onb [data-act]"); if(!t||!S.onb) return; const a=t.dataset.act; e.stopPropagation();
  if(a==="onbnext"){ S.onb.step=Math.min(3,S.onb.step+1); actPing({o:S.onb.step}); return onbRender(); }
  if(a==="onbback"){ S.onb.step=Math.max(0,S.onb.step-1); return onbRender(); }

/* ================= retention: anonymous per-device activity (act/{deviceId}) ================= */
function devId(){ let v=null; try{ v=localStorage.getItem("che-pro-did"); if(!v){ v=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join(""); localStorage.setItem("che-pro-did",v); } }catch(e){ v=null; } return v; }
function firstDay(){ let f=null; try{ f=localStorage.getItem("che-pro-first"); if(!f){ const ds=[...S.days.values()].map(d=>d&&d.date).filter(Boolean).sort(); f=ds[0]||today(); localStorage.setItem("che-pro-first",f); } }catch(e){ f=today(); } return f; }
async function actPing(extra){
  if(!CLOUD.fb||DEV||CLOUD.deleting) return; const id=devId(); if(!id) return; const t=today();
  let sent=null; try{ sent=localStorage.getItem("che-pro-actday"); }catch(e){}
  if(sent===t&&!extra) return;
  const {fsM,db}=CLOUD.fb;
  try{ await fsM.setDoc(fsM.doc(db,"act",id),{f:firstDay(), d:{[t]:1}, lang:langKey(), lvl:LEVEL, u:!!CLOUD.user, ...(extra||{})},{merge:true}); try{ localStorage.setItem("che-pro-actday",t); }catch(e){} }catch(e){}
}
function actFirstRead(){ let r=null; try{ r=localStorage.getItem("che-pro-actr"); }catch(e){} if(r) return; try{ localStorage.setItem("che-pro-actr",today()); }catch(e){} actPing({r:today()}); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") actPing(); });
function devRetHtml(A){
  const head=`<div class="eyebrow">📈 ${T("drTitle")}</div>`;
  if(!A) return head+`<p class="muted sm-t">${T("drNone")}</p>`;
  const t=today(), add=(d,n)=>{ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return ymd(x); };
  const act=(a,d)=>!!(a.d&&a.d[d]);
  const N=A.length, newT=A.filter(a=>a.f===t).length, dau=A.filter(a=>act(a,t)).length;
  const wau=A.filter(a=>Object.keys(a.d||{}).some(d=>d>add(t,-7))).length;
  const ret=n=>{ const c=A.filter(a=>a.f&&a.f<=add(t,-n)); const r=c.filter(a=>act(a,add(a.f,n))); return c.length?`${Math.round(r.length/c.length*100)}%<small> ${r.length}/${c.length}</small>`:"–"; };
  const back=(()=>{ const c=A.filter(a=>a.f&&a.f<t); const r=c.filter(a=>Object.keys(a.d||{}).some(d=>d>a.f)); return c.length?`${Math.round(r.length/c.length*100)}%<small> ${r.length}/${c.length}</small>`:"–"; })();
  const onb=A.filter(a=>(a.o||0)>=3).length, rd=A.filter(a=>a.r).length;
  const tile=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  return head+`<div class="stats ds-tiles">${tile(N,T("drDevices"))}${tile(newT,T("drNew"))}${tile(dau,T("drDau"))}${tile(wau,T("drWau"))}${tile(ret(1),"D1")}${tile(ret(7),"D7")}${tile(ret(30),"D30")}${tile(back,T("drBack"))}${tile(`${onb}/${N}`,T("drOnb"))}${tile(`${rd}/${N}`,T("drRead"))}</div><p class="muted sm-t">${T("drNote")}</p>`;
}

/* ================= spaced repetition: each word has a box (1–6) and a due date ================= */
const SRS_INT=[0,1,2,4,7,15,30], SRS_MAX=15;
function srsAdd(d,n){ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return ymd(x); }
const srsDue=w=>w.srsDue||srsAdd(w.firstSeen||today(),1);
function srsNext(w,ok){ const b=ok?Math.min(6,(w.srsB||0)+1):1; return {srsB:b, srsDue:srsAdd(today(), ok?SRS_INT[b]:1)}; }
function srsDueList(){ const t=today(); return [...S.words.values()].filter(w=>!w.filler&&srsDue(w)<=t).sort((a,b)=>srsDue(a).localeCompare(srsDue(b))||(a.srsB||0)-(b.srsB||0)); }
const srsCountOn=d=>[...S.words.values()].filter(w=>!w.filler&&srsDue(w)===d).length;
function srsCard(){
  if(!S.words.size) return "";
  const due=srsDueList().length, tm=srsCountOn(srsAdd(today(),1));
  const boxes=[1,2,3,4,5,6].map(b=>[...S.words.values()].filter(w=>(w.srsB||0)===b).length), fresh=[...S.words.values()].filter(w=>!w.srsB).length;
  const bar=`<div class="srs-boxes" title="${esc(T("srsBoxes"))}">${(()=>{ const all=[fresh,...boxes], mx=Math.max(1,...all); return all; })().map((n,i,all)=>`<span style="--h:${n?Math.round(12+70*n/Math.max(1,...all)):4}%"><i></i><small>${i?SRS_INT[i]+"d":"new"}</small><b>${n}</b></span>`).join("")}</div>`;
  return `<section class="card srs-card"><div class="srs-top"><div class="srs-ic" aria-hidden="true">🧠</div><div><b>${T("srsTitle")}</b><span class="muted sm-t">${due?T("srsDueN",{n:due}):T("srsClear",{n:tm})}</span></div>${due?`<button class="btn sm" data-act="srs">${T("srsStart",{n:Math.min(SRS_MAX,due)})}</button>`:""}</div>${bar}<p class="muted sm-t" style="margin:6px 0 0">${T("srsHow")}</p></section>`;
}

function readMark(pi){ READ.cur=pi; document.querySelectorAll("#article p").forEach((p,i)=>p.classList.toggle("reading",i===pi)); const el=document.querySelectorAll("#article p")[pi]; if(el&&READ.lastPi!==pi){ READ.lastPi=pi; el.scrollIntoView({behavior:"smooth",block:"center"}); } }
function readChunks(){ const out=[]; document.querySelectorAll("#article p").forEach((p,pi)=>{ p.textContent.split(/(?<=[.!?…])\s+(?=["“‘(]?[A-Z0-9])/).forEach(t=>{ t=t.trim(); if(t) out.push({pi,t}); }); }); return out; }
function readStart(){
  if(!window.speechSynthesis) return toast(T("readNoTts"));
  try{ speechSynthesis.cancel(); }catch(e){}
  READ.chunks=readChunks(); READ.i=0; READ.on=true; READ.paused=false; READ.art=S.articleId||(currentArticle()||{}).id; READ.lastPi=-1;
  readNext(); readUi();
}
function readNext(){
  if(!READ.on||READ.paused) return; const c=READ.chunks[READ.i]; if(!c){ readStop(); return; }
  readMark(c.pi); const tok=++READ.tok, u=new SpeechSynthesisUtterance(c.t), v=ieVoices().F;
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB"; u.rate=READ.rate;
  const go=()=>{ if(tok!==READ.tok||!READ.on||READ.paused) return; READ.i++; readUi(); readNext(); };
  u.onend=go; u.onerror=go; speechSynthesis.speak(u);
}
function readPause(){ READ.paused=true; READ.tok++; try{ speechSynthesis.cancel(); }catch(e){} readUi(); }
function readResume(){ READ.paused=false; readNext(); readUi(); }
function readStop(){ READ.on=false; READ.paused=false; READ.tok++; try{ speechSynthesis.cancel(); }catch(e){} READ.cur=-1; document.querySelectorAll("#article p.reading").forEach(p=>p.classList.remove("reading")); readUi(); }

async function deleteAccount(){
  if(S.delBusy) return; S.delBusy=true; render();
  const wipeLocal=()=>{ try{ Object.keys(localStorage).filter(k=>/^che-(pro|daily-pro)/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){} };
  try{
    if(CLOUD.user&&CLOUD.fb){
      const {fsM,db,authM,auth}=CLOUD.fb, uid=CLOUD.user.uid, g=game();
      // Google requires a recent sign-in before an account can be deleted: ask first, while we still have the tap
      const last=Date.parse((auth.currentUser&&auth.currentUser.metadata&&auth.currentUser.metadata.lastSignInTime)||0);
      if(authM.reauthenticateWithPopup&&!(Date.now()-last<4*60e3)){ await authM.reauthenticateWithPopup(auth.currentUser,new authM.GoogleAuthProvider()); }
      CLOUD.deleting=true; clearTimeout(CLOUD.timer); CLOUD.dirtyWords.clear(); CLOUD.delWords.clear(); CLOUD.dirtyMain=false;
      const del=async ref=>{ try{ await fsM.deleteDoc(ref); }catch(e){} };
      const ws=await fsM.getDocs(wordsCol()); const ids=[]; ws.forEach(d=>ids.push(d.id));
      for(let i=0;i<ids.length;i+=400){ const b=fsM.writeBatch(db); ids.slice(i,i+400).forEach(id=>b.delete(fsM.doc(wordsCol(),id))); await b.commit(); }
      await del(userRef()); await del(fsM.doc(db,"leaderboard",uid)); await del(fsM.doc(db,"allies",uid));
      if(g.nick){ try{ const r=fsM.doc(db,"nicks",nickKey(g.nick)), d=await fsM.getDoc(r); if(d.exists()&&d.data().uid===uid) await fsM.deleteDoc(r); }catch(e){} }
      const pm=(()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return ymd(d).slice(0,7); })();
      for(const m of [monthKey(),pm]){ await del(fsM.doc(db,"readMonths",m,"u",uid)); await del(fsM.doc(db,"ieltsMonths",m,"scores",uid)); }
      await del(fsM.doc(db,"ieltsWeeks",isoWeek().id,"scores",uid));
      if(PUSH.id) await del(fsM.doc(db,"push",PUSH.id));
      const did=devId(); if(did) await del(fsM.doc(db,"act",did));
      try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
      if(authM.deleteUser) await authM.deleteUser(auth.currentUser);
    } else if(CLOUD.fb){ const {fsM,db}=CLOUD.fb; const did=devId(); try{ if(PUSH.id) await fsM.deleteDoc(fsM.doc(db,"push",PUSH.id)); if(did) await fsM.deleteDoc(fsM.doc(db,"act",did)); }catch(e){} }
    wipeLocal(); toast(T("delDone")); setTimeout(()=>location.reload(),1200);
  }catch(e){
    CLOUD.deleting=false; S.delBusy=false;
    const c=e&&e.code||""; toast(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?T("delCancel"):T("delFail")); render();
  }
}
