<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Che Daily Improvement Pro</title>
<meta name="description" content="Learn English from daily Irish news — 繁體中文 · English · हिन्दी. Earn gold from quizzes, buy elemental gear, fight Celtic monsters.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Che Pro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: phone app shell — sticky masthead, one scrolling column, bottom tab bar; article set like a newspaper column */
:root{
  --paper:#F2F5F3; --card:#FFFFFF; --ink:#18221F; --muted:#5B6A66; --line:#D3DCD8;
  --accent:#1D6A5A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7;
  --gorse:#F0BE45; --gorse-soft:#FBEBC0; --good:#2E8B57; --good-soft:#DDF1E4; --bad:#C0443B; --bad-soft:#F7DEDB;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-read:"Newsreader","Iowan Old Style",Georgia,"Kohinoor Devanagari","Noto Sans Devanagari",serif;
  --f-ui:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Kohinoor Devanagari","Noto Sans Devanagari",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111816; --card:#19221F; --ink:#E4ECE9; --muted:#93A29D; --line:#2B3632;
  --accent:#5DB6A1; --accent-ink:#0D1513; --accent-soft:#1E3530;
  --gorse:#E2B23B; --gorse-soft:#3D3318; --good:#5CC48A; --good-soft:#1B3527; --bad:#E7756B; --bad-soft:#3E2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816; --card:#19221F; --ink:#E4ECE9; --muted:#93A29D; --line:#2B3632;
  --accent:#5DB6A1; --accent-ink:#0D1513; --accent-soft:#1E3530;
  --gorse:#E2B23B; --gorse-soft:#3D3318; --good:#5CC48A; --good-soft:#1B3527; --bad:#E7756B; --bad-soft:#3E2220; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.mast small{text-align:right}
.brand span{color:var(--accent)}
.mast small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Today: three steps */
.hero h1{font-size:26px;line-height:1.15;margin-top:4px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.step.now{border-color:var(--accent)}
.step.now .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.step.locked{opacity:.55}
.step b{display:block;font-size:15px}
.step span.s{font-size:13px;color:var(--muted)}
.step .go{font-size:13px;color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* Article */
.art-head h1{font-family:var(--f-read);font-weight:600;font-size:28px;line-height:1.18;margin:6px 0 8px}
.art-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.art-meta a{color:var(--accent)}
.zh-sum{font-size:14px;color:var(--muted);border-left:3px solid var(--gorse);padding-left:10px}
.article{font-family:var(--f-read);font-size:20px;line-height:1.62;max-width:65ch}
.article p{margin:0 0 1em}
.w{border-radius:3px;padding:0 1px;margin:0 -1px;cursor:pointer;transition:background .15s}
.w:active{background:var(--accent-soft)}
.w.known{text-decoration:underline dotted var(--accent);text-underline-offset:4px}
.w.hit{background:var(--gorse-soft);box-shadow:inset 0 -2px 0 var(--gorse)}
.tip{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tip i{display:inline-block;width:18px;height:12px;background:var(--gorse-soft);box-shadow:inset 0 -2px 0 var(--gorse);border-radius:2px}
.lock{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.12);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .wd{font-family:var(--f-read);font-size:30px;font-weight:600;display:flex;align-items:center;gap:10px}
.sheet .zh{font-size:22px;margin:6px 0 4px;font-weight:600}
.pos{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);font-family:var(--f-ui);font-weight:500}
.say{background:var(--accent-soft);color:var(--accent);border:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.say svg{width:18px;height:18px}
.ex{font-family:var(--f-read);font-style:italic;color:var(--muted);font-size:16px;margin-top:10px}
.ex b{font-style:normal;color:var(--ink)}
/* Quiz */
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{display:flex;flex-direction:column;gap:14px}
.qprompt{font-family:var(--f-read);font-size:32px;font-weight:600;line-height:1.2}
.qprompt.zh{font-family:var(--f-ui);font-size:26px}
.qprompt.cloze{font-size:20px;font-weight:400;line-height:1.5}
.qprompt.cloze u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 1.5em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:16px}
.opt.en{font-family:var(--f-read);font-size:19px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;min-height:21px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.score{font-family:var(--f-display);font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
/* Dictionary */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dict{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ent{border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent>button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.ent .en{font-family:var(--f-read);font-size:19px;font-weight:600}
.ent .z{grid-column:1;font-size:14px;color:var(--muted);min-width:0}
.ent .acc{grid-row:1/3;grid-column:2;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.meter{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600}
.chip.new{background:var(--gorse-soft);color:var(--ink)}
.more{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.arch{display:flex;flex-direction:column;gap:10px}
.arch button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.arch b{font-family:var(--f-read);font-size:18px;font-weight:600;line-height:1.25}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
.danger{color:var(--bad);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.topic{background:var(--accent-soft);color:var(--accent)}
.optm{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:2px}
.exp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.exp.bad{border-color:var(--bad)}
.exp p{margin:0}
.exp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exp-head .en{font-family:var(--f-read);font-size:21px;font-weight:600}
.exp-head .z{color:var(--muted);flex:1;min-width:0}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.mark.ok{background:var(--good-soft);color:var(--good)} .mark.no{background:var(--bad-soft);color:var(--bad)}
.lab{display:inline-block;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--muted);margin-right:8px;text-transform:uppercase}
.mist{background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.en-i{font-family:var(--f-read);font-style:italic;font-size:16px}
.en-i b{font-style:normal}

/* ---- adventure ---- */
:root{--metal:#A8861F;--wood:#3C8A4A;--water:#2A68B0;--fire:#C9461D;--earth:#8B6235;--none:#8A9592;--night:#16211E;--night-ink:#EAF2EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--metal:#E0BE55;--wood:#6CC27A;--water:#6AA6EC;--fire:#F07A4F;--earth:#C9965F;--none:#7F8B88;--night:#0B1210;--night-ink:#E4ECE9}}
:root[data-theme="dark"]{--metal:#E0BE55;--wood:#6CC27A;--water:#6AA6EC;--fire:#F07A4F;--earth:#C9965F;--none:#7F8B88;--night:#0B1210;--night-ink:#E4ECE9}
.mast small b{color:var(--accent);font-variant-numeric:tabular-nums}
.el{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;vertical-align:middle;flex:none;font-family:var(--f-ui)}
.el.big{width:40px;height:40px;font-size:19px;border-radius:12px}
.el-metal{background:var(--metal)}.el-wood{background:var(--wood)}.el-water{background:var(--water)}.el-fire{background:var(--fire)}.el-earth{background:var(--earth)}.el-none{background:var(--none)}
.el-fill-metal{fill:var(--metal)}.el-fill-wood{fill:var(--wood)}.el-fill-water{fill:var(--water)}.el-fill-fire{fill:var(--fire)}.el-fill-earth{fill:var(--earth)}
.mon-seal.el-bg-metal{--c:var(--metal)}.mon-seal.el-bg-wood{--c:var(--wood)}.mon-seal.el-bg-water{--c:var(--water)}.mon-seal.el-bg-fire{--c:var(--fire)}.mon-seal.el-bg-earth{--c:var(--earth)}
.adv-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--night);color:var(--night-ink);border:0;border-radius:var(--r);padding:14px 16px}
.adv-banner span{display:flex;flex-direction:column;gap:2px}.adv-banner .muted{color:var(--night-ink);opacity:.7;font-size:13px}.adv-banner .go{color:var(--gorse);font-weight:700}
.reward{background:var(--card);border:1.5px solid var(--gorse);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.reward.win{border-color:var(--good)}.reward.lose{border-color:var(--bad)}
.rw-row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}.rw-row b{font-family:var(--f-display)}
.rw-row.lvup b{color:var(--accent);font-size:20px}
.hero-card{background:var(--night);color:var(--night-ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero-card .eyebrow{color:var(--night-ink);opacity:.65}
.hc-top{display:flex;align-items:flex-end;gap:16px}.hc-top>div:first-child{flex:1}.hc-top h2{font-size:30px}
.purse{text-align:right}.purse b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gorse);font-variant-numeric:tabular-nums}.purse span{font-size:11px;opacity:.7}
.xp{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.xp i{display:block;height:100%;background:var(--gorse)}
.hero-card .muted{color:var(--night-ink);opacity:.7}
.hc-stats{display:flex;gap:16px;font-size:14px}.hc-stats b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}
.slot span{display:flex;flex-direction:column;min-width:0}.slot small{opacity:.6;font-size:11px}
.rules summary{cursor:pointer;font-weight:600}.rules p{font-size:14px;margin:8px 0 0}
.cycle{width:100%;max-width:240px;display:block;margin:8px auto 0}
.cy-arrow{stroke:var(--muted);stroke-width:1.6}.cy-head{fill:var(--muted)}.cy-t{fill:#fff;font-weight:700;font-size:16px;font-family:var(--f-ui)}
.region{display:flex;flex-direction:column;gap:8px}.region.locked{opacity:.5}
.rg-head{display:flex;justify-content:space-between;align-items:flex-end}.rg-head h3{font-size:18px}
.mons,.items{display:flex;flex-direction:column;gap:8px}
.mon,.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.item.on{border-color:var(--accent)}
.it-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;font-size:13px}.it-main b{font-size:15px}
.tier{font-family:var(--f-display);color:var(--muted);font-size:12px}
.go-t{color:var(--accent);font-weight:700;font-size:14px}
.btn.sm{padding:7px 14px;font-size:13px;flex:none}.sm-t{font-size:12px;flex:none}
.adv{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--muted);font-weight:600}
.adv.good{background:var(--good-soft);color:var(--good)}.adv.bad{background:var(--bad-soft);color:var(--bad)}
.vs{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.lore{font-family:var(--f-read);font-style:italic;color:var(--muted);margin:4px 0 0;font-size:15px}
.mon-seal{--c:var(--none);aspect-ratio:1;max-width:100%;border-radius:22px;background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--c) 75%,#fff), var(--c) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);transition:transform .15s}
.mon-seal.boss{box-shadow:inset 0 0 0 3px var(--gorse),0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.ms-el{font-size:44px;font-weight:800;line-height:1;font-family:var(--f-ui)}.ms-name{font-size:11px;font-weight:600;opacity:.9;text-align:center;padding:0 6px}
.mon-seal.hit,.you.hit .you-card{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.mon-seal.hit,.you.hit .you-card{animation:none}}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end;background:var(--night);border-radius:18px;padding:16px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.you-card{background:rgba(255,255,255,.08);color:var(--night-ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.hp{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.hp i{display:block;height:100%;transition:width .3s}.hp.m i{background:var(--bad)}.hp.p i{background:var(--good)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.blog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:260px;overflow:auto}
.blog li{padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.blog li.lm{color:var(--bad)} .blog li.lp b{color:var(--accent)}
.mast-r{display:flex;align-items:center;gap:10px}
.lang-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--ink);min-width:36px}
.el{font-size:11px}.el.big{font-size:16px}
.conq-head{display:flex;flex-direction:column;gap:6px}
.conq-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.conq-bar i{display:block;height:100%;background:var(--gorse)}
.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:70px}
.ire-map{width:100%;max-width:380px;display:block;margin:0 auto}
.land{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round}
.tw{cursor:pointer}.tw-hit{fill:transparent}
.tw-own{fill:var(--gorse);stroke:var(--ink);stroke-width:1.5}
.tw-open{stroke:#fff;stroke-width:1.5}
.tw-lock{fill:var(--none);opacity:.55}
.tw-ring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2}
.tw-lab{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;font-family:var(--f-ui)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.lg{display:inline-block;width:11px;height:11px;border-radius:50%}
.lg.tw-own{background:var(--gorse);border:1.5px solid var(--ink)}.lg.tw-lock{background:var(--none)}.lg-open{background:linear-gradient(90deg,var(--metal),var(--wood),var(--water),var(--fire),var(--earth))}
.town-card{background:var(--card);border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.town-card.own{border-color:var(--gorse)}
.tc-top{display:flex;gap:12px;align-items:center}
.mon.own{border-color:var(--gorse)}.mon.locked{opacity:.55}
.lvl-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt b{display:block}
.mon-seal{position:relative;overflow:hidden}
.ms-art{width:86%;height:86%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.ms-badge{position:absolute;top:8px;right:8px}
.thumb{position:relative;flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 75%)}
.thumb.sm{width:52px;height:52px;border-radius:13px}
.thumb .mon-art{width:90%;height:90%}
.thumb .el{position:absolute;right:-4px;bottom:-4px;box-shadow:0 0 0 2px var(--card)}
.el-th-metal{--c:var(--metal)}.el-th-wood{--c:var(--wood)}.el-th-water{--c:var(--water)}.el-th-fire{--c:var(--fire)}.el-th-earth{--c:var(--earth)}
.mon.locked .thumb{filter:grayscale(.85)}
.wx{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.wx-row{display:flex;flex-direction:column;gap:6px}
.wx-row .lab{margin:0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-family:var(--f-read);font-size:16px}
.wx-row .en-i{font-size:17px;line-height:1.5}
.sm-say{width:30px;height:30px;align-self:flex-start}
.sm-say svg{width:15px;height:15px}
.sheet{max-height:85vh;overflow-y:auto}
.acct{display:flex;flex-direction:column;gap:10px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;align-self:flex-start}
.avatar{width:36px;height:36px;border-radius:50%;flex:none}
.bad-t{color:var(--bad)}

function fillerWords(art, exclude, n){
  const toks=parasOf(art).join(" ").match(WORD_RE)||[]; const seen=new Set(exclude), cand=[];
  for(const tok of toks){ const k=tok.toLowerCase(), g=glossFor(art,tok); if(!g||!g.lvl||g.lvl==="PN"||STOP.has(k)) continue;
    const b=(g.base||k).toLowerCase(); if(seen.has(b)) continue; seen.add(b); cand.push({tok,g,b,r:CEFR_RANK[g.lvl]||2}); }

  while(pool.length<n && min>0){ pool=cand.filter(c=>c.r>=min); min--; }
  pool=shuffle(pool).sort((a,b)=>b.r-a.r).slice(0,n);
  return pool.map(({tok,g,b})=>{ const key=keyOf(g.base||tok); const saved=S.words.get(key); if(saved) return saved;

/* ---------- weighting: how likely each word is drawn in the review quiz ---------- */
function weightOf(w, ref=today()){
  const c=w.correct||0, x=w.wrong||0;
  const acc=(c+1)/(c+x+2);                       // smoothed accuracy, new words start at 50%
  const since=daysBetween(w.lastTested||w.firstSeen, ref);
  const stale=1+Math.min(Math.max(since,0),10)/10; // up to ×2 for words not seen in 10+ days
  return ((1-acc)+0.08)*stale;
}
function eligible(ref=today()){ return [...S.words.values()].filter(w=>w.firstSeen < ref); }
function probMap(){ const el=eligible(); const ws=el.map(w=>weightOf(w)); const tot=ws.reduce((a,b)=>a+b,0)||1; const m=new Map(); el.forEach((w,i)=>m.set(w.key, ws[i]/tot)); return m; }
function weightedPick(list, n){ // Efraimidis–Spirakis weighted sampling without replacement
  return list.map(w=>({w, k:Math.pow(Math.random(), 1/weightOf(w))})).sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.w);
}

async function importData(file){
  try{
    const o=JSON.parse(await file.text()); const items=o.items||{}; let n=0;
    const score=v=>(v.correct||0)+(v.wrong||0)+(v.lookups||0);
    for(const [k,v] of Object.entries(items)){

function notePack(n){

/* ---------- word sheet ---------- */
async function lookup(surface){
  const art=currentArticle(); if(!art) return;
  let g=glossFor(art,surface);
  const ex=sentenceWith(art,surface);
  S.sheet={surface, g, ex, loading:!g};
  renderSheet();
  if(!g){
    if(!sample){ S.sheet.loading=false; S.sheet.err=T("noGloss"); renderSheet(); return; }
    try{
      const r=await sample.json(`Translate the English word "${surface}" as used in this sentence into Traditional Chinese (Taiwan). Sentence: "${ex}". Reply with only JSON: {"zh":"short meaning in context, ≤12 chars","pos":"n./v./adj./adv./prep./conj./pron./det.","base":"dictionary base form"}`,{modelTier:"quick",cache:{gcTime:86400000}});
      g={zh:String(r.zh||"?"),pos:String(r.pos||""),base:String(r.base||surface)};
      (art.gloss=art.gloss||{})[surface.toLowerCase()]=g;
    }catch(e){ S.sheet.loading=false; S.sheet.err= e&&e.code==="not_granted"?"未允許翻譯功能。":"翻譯失敗，請再點一次。"; renderSheet(); return; }
    if(!S.sheet||S.sheet.surface!==surface) return;
    S.sheet.g=g; S.sheet.loading=false;
  }
  if(g && !STOP.has(surface.toLowerCase())) record(surface,g,ex,art); else if(g) S.sheet.skip=true;
  render();
}
function record(surface,g,ex,art){
  const lemma=(g.base||surface).trim(), key=keyOf(lemma), now=today();
  const old=S.words.get(key);
  const forms=new Set([...(old&&old.forms||[]), surface.toLowerCase(), lemma.toLowerCase()]);
  const rec=old?{...old, forms:[...forms], lookups:(old.lookups||1)+1, lastLookup:new Date().toISOString(), example:old.example||ex, note:old.note||g.note||null, noteHi:old.noteHi||g.noteHi||null, noteEn:old.noteEn||g.noteEn||null, noteEs:old.noteEs||g.noteEs||null, hi:old.hi||g.hi||"", en:old.en||g.en||"", es:old.es||g.es||""}
    :{type:"word", key, word:lemma, zh:g.zh, pos:g.pos||"", forms:[...forms], example:ex, articleDate:art.date, firstSeen:now, lookups:1, lastLookup:new Date().toISOString(), correct:0, wrong:0, lastTested:null, note:g.note||null, noteHi:g.noteHi||null, noteEn:g.noteEn||null, noteEs:g.noteEs||null, hi:g.hi||"", en:g.en||"", es:g.es||""};
  persist(key,rec);
  S.sheet.rec=rec; S.sheet.isNew=!old;
  const d=dayRec(), ll=lemma.toLowerCase();
  if(isMain(art)){ if(!(d.lookedUp||[]).includes(ll)) saveDay({...d, lookedUp:[...(d.lookedUp||[]), ll]}); }
  else { const by={...(d.lookedUpBy||{})}; const cur=by[art.id]||[]; if(!cur.includes(ll)){ by[art.id]=[...cur,ll]; saveDay({...d, lookedUpBy:by}); } }
}

/* ---------- explanations (prepared with each article) ---------- */
function glossOf(w){
  const b=w.word.toLowerCase();
  for(const a of S.articles) for(const g of Object.values(a.gloss||{})) if((g.base||"").toLowerCase()===b && g.zh===w.zh) return g;
  for(const a of S.articles) for(const g of Object.values(a.gloss||{})) if((g.base||"").toLowerCase()===b) return g;
  return null;
}
function findNote(w){
  if(w.note) return {note:w.note, noteHi:w.noteHi, noteEn:w.noteEn, noteEs:w.noteEs};
  const g=glossOf(w); return g&&g.note?{note:g.note, noteHi:g.noteHi, noteEn:g.noteEn, noteEs:g.noteEs}:null;
}
// older saved words may lack Hindi/English meanings: fill them from loaded articles
function fillMeanings(){
  let changed=false;
  for(const [k,w] of S.words){ if(w.hi&&w.en&&w.es&&(w.note||!glossOf(w)||!glossOf(w).note)) continue; const g=glossOf(w); if(!g) continue;
    const nw={...w, hi:w.hi||g.hi||"", en:w.en||g.en||"", es:w.es||g.es||"", note:w.note||g.note||null, noteHi:w.noteHi||g.noteHi||null, noteEn:w.noteEn||g.noteEn||null, noteEs:w.noteEs||g.noteEs||null};
    if(JSON.stringify(nw)!==JSON.stringify(w)){ S.words.set(k,nw); changed=true; } }
  if(changed) lsSave();
}
function explainAnswer(ans){
  const w=S.words.get(ans.w.key)||ans.w; const n=findNote(w);
  if(n) ans.exp=n;
}
function answerBlock(ans, full){
  const w=S.words.get(ans.w.key)||ans.w;
  const head=`<div class="exp-head"><span class="mark ${ans.ok?"ok":"no"}">${ans.ok?"✓":"✗"}</span><span class="en">${esc(w.word)}</span><span class="pos">${esc(w.pos||"")}</span><span class="z">${esc(mean(w))}</span><button class="say" data-say="${esc(w.word)}" aria-label="${T("pron")}">${SPEAK_SVG}</button></div>`;
  const wrong = !ans.ok ? `<p class="mist"><span class="lab">${T("youPicked")}</span>${ans.picked.meaning?T("pickedMeans",{a:esc(ans.picked.label),b:esc(ans.picked.meaning)}):T("pickedPlain",{a:esc(ans.picked.label)})} ${T("correctIs",{w:esc(w.word),m:esc(mean(w))})}</p>` : "";
  const others=(w.forms||[]).filter(f=>f!==w.word.toLowerCase());
  const basic = `<p><span class="lab">${T("basic")}</span>${T("basicTxt",{w:esc(w.word),p:esc(w.pos||""),m:esc(mean(w))})}${others.length?T("forms",{f:esc(others.join(", "))}):""}</p>`;
  const ex = w.example ? `<p><span class="lab">${T("sentence")}</span><span class="en-i">${highlight(w.example,w.forms)}</span></p>` : "";

/* ---------- quizzes ---------- */
function distractorPool(){
  const pool=new Map();
  for(const w of S.words.values()) pool.set(w.word.toLowerCase(),{en:w.word, zh:mean(w)});
  for(const a of S.articles.slice(0,8)) for(const [k,g] of Object.entries(a.gloss||{})){
    if(STOP.has(k)||!/^(n|v|adj|adv)\./.test(g.pos||"")||/[A-Z]/.test(g.base||"")) continue;
    const b=(g.base||k).toLowerCase(); if(!pool.has(b)) pool.set(b,{en:g.base||k, zh:mean(g)});
  }
  return [...pool.values()];
}
function makeQuestion(w){
  const wm=mean(w); const pool=distractorPool().filter(p=>p.en.toLowerCase()!==w.word.toLowerCase() && p.zh!==wm);
  const hasForm=f=>new RegExp("\\b"+reEsc(f)+"\\b","i").test(w.example||"");
  const types=["en2zh","zh2en"]; if(w.example && (w.forms||[]).some(hasForm)) types.push("cloze");
  const type=types[Math.floor(Math.random()*types.length)];
  const ds=shuffle(pool).slice(0,3);
  if(type==="en2zh") return {type, w, prompt:w.word, opts:shuffle([{label:wm, meaning:w.word, ok:true}, ...ds.map(d=>({label:d.zh, meaning:d.en}))])};
  if(type==="zh2en") return {type, w, prompt:wm, opts:shuffle([{label:w.word, meaning:wm, ok:true}, ...ds.map(d=>({label:d.en, meaning:d.zh}))])};
  const form=(w.forms||[]).find(hasForm);
  const m=w.example.match(new RegExp("\\b"+reEsc(form)+"\\b","i"));
  return {type, w, prompt:w.example, blank:m[0], opts:shuffle([{label:m[0], meaning:wm, ok:true}, ...ds.map(d=>({label:d.en, meaning:d.zh}))])};
}
function startQuiz(kind, art){
  let words;
  const d=dayRec();
  if(kind==="pre"){ const el=eligible(); words=weightedPick(el, Math.min(10, el.length)); }
  else {
    words=shuffle(lookedUpFor(d,art).map(l=>S.words.get(keyOf(l))).filter(Boolean)).slice(0,10);
    if(words.length<10) words=words.concat(fillerWords(art, words.map(w=>w.word.toLowerCase()), 10-words.length));
  }
  if(!words.length){
    if(kind==="pre") saveDay({...d, preDone:true, preScore:0, preTotal:0});
    else finishPost(art,0,0);
    S.view="today"; S.tab="today"; render(); return;
  }
  S.quiz={kind, artId:art&&art.id, qs:words.map(makeQuestion), i:0, score:0, picked:null, answers:[], hasFill:words.some(w=>w.filler)};
  S.view="quiz"; render(); window.scrollTo(0,0);
}
function finishPost(art, score, total){
  const d=dayRec();
  if(isMain(art)) saveDay({...d, read:d.read||art.id, postDone:true, postScore:score, postTotal:total});
  else saveDay({...d, postBy:{...(d.postBy||{}), [art.id]:{score,total}}});
}
function viewQuiz(){

    return `<div class="view"><div class="eyebrow">${T("done",{t:title})}</div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="score">${Q.score}<span class="muted" style="font-size:28px">/${Q.qs.length}</span></div>
      <div class="muted">${Q.score<Q.qs.length?T("sumWrong"):T("sumAll")}</div>${Q.hasFill?`<div class="muted sm-t">${T("fillNote")}</div>`:""}</div>
      ${rewardBox(Q.reward)}
      <h2 style="font-size:20px">${T("explainAll")}</h2>
      <div style="display:flex;flex-direction:column;gap:12px">${order.map(a=>answerBlock(a,true)).join("")}</div>
      ${nextBtn}</div>`;
  }
  const q=Q.qs[Q.i], pickedI=Q.picked, ans=Q.answers[Q.i];
  const prompt = q.type==="cloze" ? `<div class="qprompt cloze">${esc(q.prompt).replace(new RegExp("\\b"+reEsc(esc(q.blank))+"\\b"), "<u></u>")}</div>`
    : `<div class="qprompt ${q.type==="zh2en"?"zh":""}">${esc(q.prompt)}</div>`;
  const lead={en2zh:T("qMeaning"),zh2en:T("qWord"),cloze:T("qCloze")}[q.type];
  return `<div class="view"><div class="row" style="justify-content:space-between"><span class="eyebrow">${title}</span><span class="muted" style="font-size:13px;font-variant-numeric:tabular-nums">${Q.i+1} / ${Q.qs.length}</span></div>
    <div class="qbar"><i style="width:${(Q.i+(pickedI!=null?1:0))/Q.qs.length*100}%"></i></div>
    <div class="qcard"><div class="muted" style="font-size:14px">${lead}${q.w.filler?` <span class="chip new">${T("fillTag")}</span>`:""}</div>${prompt}
    <div class="opts">${q.opts.map((o,i)=>{ let c="opt"+(q.type==="en2zh"?"":" en"); if(pickedI!=null){ if(o.ok) c+=" right"; else if(i===pickedI) c+=" wrong"; } return `<button class="${c}" data-pick="${i}" ${pickedI!=null?"disabled":""}>${esc(o.label)}${pickedI!=null&&!o.ok&&o.meaning?`<span class="optm">${esc(o.meaning)}</span>`:""}</button>`; }).join("")}</div>
    ${ans?`<div class="fb ${ans.ok?"ok":"no"}">${ans.ok?T("right"):T("wrong")}</div>${answerBlock(ans,false)}<button class="btn" data-act="next">${Q.i+1<Q.qs.length?T("next"):T("seeAll")}</button>`:""}</div></div>`;
}
function pick(i){
  const Q=S.quiz, q=Q.qs[Q.i]; if(Q.picked!=null) return;
  Q.picked=i; const opt=q.opts[i], ok=!!opt.ok;
  const w=S.words.get(q.w.key)||q.w;
  if(!w.filler) persist(w.key,{...w, correct:(w.correct||0)+(ok?1:0), wrong:(w.wrong||0)+(ok?0:1), lastTested:today()});
  else if(!ok){ const {filler,...rec}=w; persist(w.key,{...rec, firstSeen:today(), lookups:0, lastLookup:new Date().toISOString(), correct:0, wrong:1, lastTested:today()}); }
  if(ok) Q.score++;
  const ans={w, ok, picked:opt}; Q.answers[Q.i]=ans;
  if(Q.i+1>=Q.qs.length){
    const d=dayRec();
    if(Q.kind==="pre"){ saveDay({...d, preDone:true, preScore:Q.score, preTotal:Q.qs.length}); Q.reward=awardQuiz("pre",Q.score,Q.qs.length,false); }
    else { const art=S.articles.find(a=>a.id===Q.artId)||mainArticle(); finishPost(art, Q.score, Q.qs.length); Q.reward=awardQuiz("post",Q.score,Q.qs.length,isMain(art)); }
  }
  explainAnswer(ans);
  render();
}

function conquered(){ const g=game(); g.conq=g.conq||{}; return g.conq; }
function taxToday(){ const c=conquered(); return TOWNS.filter(t=>c[t.id]).reduce((s,t)=>s+t.tax,0); }
function collectTax(){ const g=game(); if(g.taxDate===today()) return; const n=taxToday(); if(!n) return; g.gold+=n; g.taxDate=today(); saveGame(); toast(T("taxGot",{n})); render(); }

function mapSvg(){
  const c=conquered(), sel=S.selTown;
  const d="M"+COAST.map(([x,y])=>PX(x).toFixed(1)+" "+PY(y).toFixed(1)).join("L")+"Z";
  const dots=TOWNS.map(t=>{ const x=PX(t.lon).toFixed(1), y=PY(t.lat).toFixed(1); const r=t.boss?8:t.pop>=60000?6.5:5;
    const cls=c[t.id]?"tw-own":canAttack(t)?`tw-open el-fill-${t.el}`:"tw-lock";
    return `<g data-town="${t.id}" class="tw${sel===t.id?" sel":""}"><circle cx="${x}" cy="${y}" r="15" class="tw-hit"/>${sel===t.id?`<circle cx="${x}" cy="${y}" r="${r+5}" class="tw-ring"/>`:""}<circle cx="${x}" cy="${y}" r="${r}" class="${cls}"/></g>`; }).join("");

  return `<svg viewBox="0 0 320 400" class="ire-map" role="img" aria-label="${T("mapAria")}"><path d="${d}" class="land"/>${dots}${lab}</svg>`;

function townCard(t){

const G_DEFAULT={type:"game", gold:0, tickets:1, lv:1, exp:0, inv:[], weapon:null, armor:null, wins:{}, battles:0, conq:{}, taxDate:null};
function game(){ return S.game || (S.game={...G_DEFAULT}); }
function saveGame(){ lsSave(); cloudMark(null); }
const expNeed=lv=>Math.round(40*Math.pow(lv,1.6));
function stats(g=game()){
  const w=g.weapon&&ITEMS[g.weapon], a=g.armor&&ITEMS[g.armor];
  return {hp:100+20*(g.lv-1)+(a?a.hp:0), atk:10+3*(g.lv-1)+(w?w.atk:0), def:5+2*(g.lv-1)+(a?a.def:0), wEl:w?w.el:null, aEl:a?a.el:null};
}

/* ----- rewards from studying ----- */
function awardQuiz(kind, score, total, isMainPost){
  if(!total) return null;
  const g=game(), acc=score/total;
  const r={base:score*10, acc:(acc>=0.8?20:0)+(acc===1?20:0), tickets:1, bonus:0, bonusTickets:0, acc100:Math.round(acc*100)};
  if(isMainPost){
    const d=dayRec();
    if(!d.bonus){ r.bonus=30; r.bonusTickets=1; saveDay({...d, bonus:true}); }
  }
  r.gold=r.base+r.acc+r.bonus;
  g.gold+=r.gold; g.tickets+=r.tickets+r.bonusTickets; saveGame();
  return r;
}
function rewardBox(r){
  if(!r) return "";
  return `<div class="reward"><div class="eyebrow">${T("loot")}</div>
    <div class="rw-row"><span>${T("lootRight",{n:r.base/10})}</span><b>${T("goldAmt",{n:r.base})}</b></div>
    ${r.acc?`<div class="rw-row"><span>${T("lootAcc",{p:r.acc100})}</span><b>${T("goldAmt",{n:r.acc})}</b></div>`:`<div class="rw-row muted"><span>${T("lootAccNo",{p:r.acc100})}</span><b>+0</b></div>`}
    ${r.bonus?`<div class="rw-row"><span>${T("lootDay")}</span><b>${T("goldAmt",{n:r.bonus})}</b></div>`:""}
    <div class="rw-row"><span>${T("tickets")}</span><b>${T("lootT",{n:r.tickets+r.bonusTickets})}</b></div>
    <button class="btn ghost" data-tab="adv" style="align-self:flex-start;padding:6px 14px;font-size:13px">${T("goAdv")}</button></div>`;
}

/* ----- shop & equipment ----- */
function buy(id){
  const g=game(), it=ITEMS[id]; if(!it) return;
  if(g.inv.includes(id)) return toast(T("owned"));
  if(g.lv<it.lv) return toast(T("needLv",{n:it.lv}));
  if(g.gold<it.price) return toast(T("noGold",{n:it.price-g.gold}));
  g.gold-=it.price; g.inv.push(id); g[it.slot]=id; saveGame();
  toast(T("bought",{i:itemName(it)})); render();
}
function equip(id){
  const g=game(), it=ITEMS[id]; if(!it||!g.inv.includes(id)) return;
  g[it.slot]= g[it.slot]===id ? null : id; saveGame(); render();
}

/* ----- battle ----- */
function advice(m){
  const s=stats(), out=[];
  const wm=elMult(s.wEl,m.el), am=elMult(m.el,s.aEl);
  if(wm>1) out.push(`<span class="adv good">${T("advWin")}</span>`); else if(wm<1) out.push(`<span class="adv bad">${T("advWlose")}</span>`);
  if(am<1) out.push(`<span class="adv good">${T("advAwin")}</span>`); else if(am>1) out.push(`<span class="adv bad">${T("advAlose")}</span>`);
  return out.join("");
}
function simulate(m, spellOk){
  const s=stats();
  let php=s.hp, mhp=m.hp; const ev=[]; let first=true;
  const roll=()=>0.9+Math.random()*0.2;
  for(let round=1; round<=40 && php>0 && mhp>0; round++){
    const crit=Math.random()<0.1 || (first&&spellOk);
    let dmg=Math.max(1, Math.round((s.atk*elMult(s.wEl,m.el) - m.def*0.5)*roll()*(crit?(first&&spellOk?2:1.5):1)));
    mhp=Math.max(0,mhp-dmg); ev.push({who:"p", dmg, crit, spell:first&&spellOk, php, mhp}); first=false;
    if(mhp<=0) break;
    let taken=Math.max(1, Math.round((m.atk*elMult(m.el,s.aEl) - s.def*0.5)*roll()));
    php=Math.max(0,php-taken); ev.push({who:"m", dmg:taken, php, mhp});
  }
  return {ev, win:mhp<=0 && php>0, maxP:s.hp};
}
function startBattle(mid){
  const g=game(), m=MONS[mid]; if(!m) return;
  if(g.tickets<1) return toast(T("noTicket"));
  S.battle={m, stage:"spell"};
  // spell question needs at least one word in the dictionary
  if(!S.words.size) S.battle.stage="ready";
  else { const w=weightedPick([...S.words.values()],1)[0]; S.battle.q=makeQuestion(w); }
  S.view="battle"; render(); window.scrollTo(0,0);
}
function castSpell(i){
  const B=S.battle; if(!B||B.stage!=="spell"||B.picked!=null) return;
  B.picked=i; const opt=B.q.opts[i]; B.spellOk=!!opt.ok;
  const w=S.words.get(B.q.w.key)||B.q.w;
  persist(w.key,{...w, correct:(w.correct||0)+(B.spellOk?1:0), wrong:(w.wrong||0)+(B.spellOk?0:1), lastTested:today()});
  render();
}
function fight(){
  const B=S.battle, g=game(); if(!B) return;
  g.tickets-=1; g.battles=(g.battles||0)+1;
  const res=simulate(B.m, !!B.spellOk);
  B.res=res; B.stage="fight"; B.idx=0;
  if(res.win){
    const before=g.lv; g.exp+=B.m.exp; g.gold+=B.m.gold; g.wins[B.m.id]=(g.wins[B.m.id]||0)+1;
    const c=conquered(); if(!c[B.m.id]){ c[B.m.id]=today(); B.conquered=true; }
    while(g.exp>=expNeed(g.lv)){ g.exp-=expNeed(g.lv); g.lv++; }
    B.lvUp=g.lv-before;
  }
  saveGame(); render();
  clearInterval(S.btimer);
  S.btimer=setInterval(()=>{ if(!S.battle||S.battle.stage!=="fight"){ clearInterval(S.btimer); return; } S.battle.idx++; if(S.battle.idx>=S.battle.res.ev.length){ S.battle.stage="end"; clearInterval(S.btimer); } renderBattleOnly(); }, matchMedia("(prefers-reduced-motion: reduce)").matches?150:650);
}
function renderBattleOnly(){ if(S.view==="battle") $("#app").innerHTML=viewBattle(); }
function monArt(m, hit){
  return `<div class="mon-seal el-bg-${m.el}${hit?" hit":""}${m.boss?" boss":""}">${monSvg(m,"ms-art")}<span class="ms-badge">${elBadge(m.el)}</span></div>`;
}
function hpBar(cur,max,cls){ return `<div class="hp ${cls}"><i style="width:${Math.max(0,cur/max*100)}%"></i><span>${cur} / ${max}</span></div>`; }
function viewBattle(){
  const B=S.battle; if(!B) return "";
  const m=B.m, s=stats(), g=game();
  if(B.stage==="spell"||B.stage==="ready"){
    const q=B.q, p=B.picked;
    const spell = B.stage==="spell" ? `<div class="card qcard"><div class="eyebrow">${T("spell")}</div><div class="muted" style="font-size:14px">${T("spellSub")}</div>
      ${q.type==="cloze"?`<div class="qprompt cloze">${esc(q.prompt).replace(new RegExp("\\b"+reEsc(esc(q.blank))+"\\b"),"<u></u>")}</div>`:`<div class="qprompt ${q.type==="zh2en"?"zh":""}">${esc(q.prompt)}</div>`}
      <div class="opts">${q.opts.map((o,i)=>{ let c="opt"+(q.type==="en2zh"?"":" en"); if(p!=null){ if(o.ok) c+=" right"; else if(i===p) c+=" wrong"; } return `<button class="${c}" data-spell="${i}" ${p!=null?"disabled":""}>${esc(o.label)}</button>`; }).join("")}</div>
      ${p!=null?`<div class="fb ${B.spellOk?"ok":"no"}">${B.spellOk?T("spellOk"):T("spellFail",{w:esc(q.w.word),m:esc(mean(q.w))})}</div>`:""}</div>` : "";
    return `<div class="view">
      <button class="btn ghost" data-act="advback" style="align-self:flex-start;padding:6px 14px;font-size:13px">${T("retreat")}</button>
      <div class="vs">${monArt(m)}<div><div class="eyebrow">${esc(townName(m))} · Lv ${m.lv} · ${elBadge(m.el)} ${T("elAttr",{e:elName(m.el)})}</div><h2 style="font-size:24px">${esc(monName(m))}</h2><p class="lore">${esc(m.lore)}</p></div></div>
      <div class="row">${advice(m)||`<span class="adv">${T("advNone")}</span>`}</div>
      <div class="stats"><div class="stat"><b>${s.hp}</b><span>${T("yourHp")}</span></div><div class="stat"><b>${s.atk}</b><span>${T("atk")} ${elBadge(s.wEl)}</span></div><div class="stat"><b>${s.def}</b><span>${T("def")} ${elBadge(s.aEl)}</span></div></div>
      ${spell}
      <button class="btn" data-act="fight" ${B.stage==="spell"&&p==null?"":""}>${B.stage==="spell"&&p==null?T("skipSpell"):T("fight")}</button>
    </div>`;
  }
  const ev=B.res.ev, upto=B.stage==="end"?ev.length:B.idx+1, cur=ev[Math.min(upto,ev.length)-1]||{php:B.res.maxP,mhp:m.hp};
  const log=ev.slice(0,upto).map(e=>e.who==="p"?`<li class="lp">${e.spell?T("logSpell"):e.crit?T("logCrit"):""}${T("logYou",{n:e.dmg})}</li>`:`<li class="lm">${T("logMon",{m:esc(monName(m)),n:e.dmg})}</li>`).reverse().join("");
  const last=ev[upto-1];
  const end = B.stage==="end" ? (B.res.win
    ? `<div class="reward win"><div class="eyebrow">${T("win")}</div><div class="rw-row"><span>${T("exp")}</span><b>+${m.exp}</b></div><div class="rw-row"><span>${T("gold")}</span><b>+${m.gold}</b></div>${B.lvUp?`<div class="rw-row lvup"><span>${T("lvUp")}</span><b>Lv ${g.lv}</b></div>`:""}${B.conquered?`<div class="rw-row lvup"><span>${T("conqNew",{c:esc(townName(m))})}</span></div><div class="rw-row muted"><span>${T("taxLine",{n:m.tax})}</span></div>`:""}</div>`
    : `<div class="reward lose"><div class="eyebrow">${T("lose")}</div><p style="margin:0">${T("loseTip",{m:esc(monName(m)),e:elName(m.el),c:elName(Object.keys(BEATS).find(k=>BEATS[k]===m.el))})}</p></div>`) : "";
  return `<div class="view">
    <div class="arena">
      <div class="side">${monArt(m, last&&last.who==="p")}${hpBar(cur.mhp,m.hp,"m")}</div>
      <div class="side you${last&&last.who==="m"?" hit":""}"><div class="you-card"><b>${T("you",{lv:g.lv})}</b><span>${elBadge(s.wEl)} ${elBadge(s.aEl)}</span></div>${hpBar(cur.php,B.res.maxP,"p")}</div>
    </div>
    ${end}
    <ul class="blog">${log}</ul>
    ${B.stage==="end"?`<div class="row"><button class="btn" data-act="advback">${T("backAdv")}</button>${g.tickets>0?`<button class="btn ghost" data-mon="${m.id}">${T("fightAgain")}</button>`:""}</div>`:`<button class="btn ghost" data-act="skip">${T("skipAnim")}</button>`}
  </div>`;
}

/* ----- adventure tab ----- */
function cycleSvg(){
  const pts=ELS.map((e,i)=>{ const a=-Math.PI/2+i*2*Math.PI/5; return {k:e.k,z:e.z,x:110+78*Math.cos(a),y:100+78*Math.sin(a)}; });
  const pos=Object.fromEntries(pts.map(p=>[p.k,p]));
  const arrows=Object.entries(BEATS).map(([a,b])=>{ const p=pos[a], q=pos[b]; const dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    return `<line x1="${(p.x+ux*20).toFixed(1)}" y1="${(p.y+uy*20).toFixed(1)}" x2="${(q.x-ux*24).toFixed(1)}" y2="${(q.y-uy*24).toFixed(1)}" class="cy-arrow" marker-end="url(#ah)"/>`; }).join("");
  return `<svg viewBox="0 0 220 200" class="cycle" role="img" aria-label="${T("cycleAria")}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="cy-head"/></marker></defs>
    ${arrows}${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="18" class="cy-n el-fill-${p.k}"/><text x="${p.x.toFixed(1)}" y="${(p.y+6).toFixed(1)}" text-anchor="middle" class="cy-t">${elShort(p.k)}</text>`).join("")}</svg>`;
}
function itemRow(it, mode){
  const g=game(), own=g.inv.includes(it.id), on=g[it.slot]===it.id, locked=g.lv<it.lv;
  const stat = it.slot==="weapon" ? T("atkPlus",{n:it.atk}) : T("defPlus",{d:it.def,h:it.hp});
  let act;
  if(mode==="bag") act=`<button class="btn ${on?"ghost":""} sm" data-equip="${it.id}">${on?T("unequip"):T("equip")}</button>`;
  else if(own) act=`<button class="btn ghost sm" data-equip="${it.id}">${on?T("equipped"):T("equip")}</button>`;
  else if(locked) act=`<span class="muted sm-t">${T("unlockAt",{n:it.lv})}</span>`;
  else act=`<button class="btn sm" data-buy="${it.id}" ${g.gold<it.price?"disabled":""}>${T("price",{n:it.price})}</button>`;
  return `<div class="item${on?" on":""}">${elBadge(it.el,true)}<div class="it-main"><b>${esc(itemName(it))} <span class="tier">${TIER[it.tier].n}</span></b><span class="muted">${it.slot==="weapon"?T("weapon"):T("armor")} · ${stat}</span></div>${act}</div>`;
}
function viewAdv(){
  const g=game(), s=stats(), need=expNeed(g.lv);
  const sub=S.advTab||"go";
  const seg=(k,l)=>`<button data-advtab="${k}" aria-pressed="${sub===k}">${l}</button>`;
  let body="";
  if(sub==="go"){
    body=viewConquest();
  } else if(sub==="shop"){
    const f=S.shopEl||"all";
    const fseg=`<div class="seg">${[["all",T("all")],...ELS.map(e=>[e.k,elName(e.k)])].map(([k,l])=>`<button data-shopel="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>`;
    const list=Object.values(ITEMS).filter(it=>f==="all"||it.el===f).sort((a,b)=>a.tier-b.tier||a.slot.localeCompare(b.slot)||ELS.findIndex(e=>e.k===a.el)-ELS.findIndex(e=>e.k===b.el));
    body=fseg+`<div class="items">${list.map(it=>itemRow(it,"shop")).join("")}</div>`;
  } else {
    const own=g.inv.map(id=>ITEMS[id]).filter(Boolean);
    body= own.length?`<div class="items">${own.map(it=>itemRow(it,"bag")).join("")}</div>`:`<div class="card empty"><h3>${T("bagEmpty")}</h3><p>${T("bagEmptySub")}</p></div>`;
  }
  return `<div class="view">
    <section class="hero-card">
      <div class="hc-top"><div><div class="eyebrow">${T("hero")}</div><h2>Lv ${g.lv}</h2></div><div class="purse"><b>${g.gold}</b><span>${T("gold")}</span></div><div class="purse"><b>${g.tickets}</b><span>${T("tickets")}</span></div></div>
      <div class="xp"><i style="width:${g.exp/need*100}%"></i></div><div class="muted sm-t">${T("expLine",{e:g.exp,n:need})}</div>
      <div class="hc-stats"><span>HP <b>${s.hp}</b></span><span>${T("atk")} <b>${s.atk}</b></span><span>${T("def")} <b>${s.def}</b></span></div>
      <div class="slots"><div class="slot">${elBadge(s.wEl)}<span><small>${T("weapon")}</small>${g.weapon?esc(itemName(ITEMS[g.weapon])):T("bare")}</span></div><div class="slot">${elBadge(s.aEl)}<span><small>${T("armor")}</small>${g.armor?esc(itemName(ITEMS[g.armor])):T("cloth")}</span></div></div>
    </section>
    <details class="card rules"><summary>${T("rulesQ")}</summary>${cycleSvg()}
      <p>${T("rules1")}</p>
      <p>${T("rules2")}</p>
      <p>${T("rules3")}</p></details>
    <div class="seg" role="group">${seg("go",T("tabGo"))}${seg("shop",T("tabShop"))}${seg("bag",T("tabBag"))}</div>
    ${body}
  </div>`;
}

const ART_BASES=["../Che_daily_improvement/articles/","articles/"]; let ART_BASE=ART_BASES[0];
async function loadArticle(id){
  if(S.articles.some(a=>a.id===id)) return true;
  try{ const r=await fetch(ART_BASE+encodeURIComponent(id)+".json",{cache:"no-cache"}); if(!r.ok) throw 0; const a=await r.json(); a.id=id; S.articles.push(a); S.articles.sort(byOrder); return true; }
  catch(e){ toast(T("artLoadFail")); return false; }
}
const byOrder=(a,b)=>b.date.localeCompare(a.date)||(a.rank||1)-(b.rank||1);
async function openArticle(id){ if(!(await loadArticle(id))) return; S.articleId=id; S.backTo=S.view==="arch"?"arch":"today"; S.view="read"; S.quiz=null; render(); window.scrollTo(0,0); }
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-level],[data-town],[data-lang],[data-advtab],[data-shopel],[data-buy],[data-equip],[data-mon],[data-spell],[data-tab],[data-act],[data-w],[data-pick],[data-open],[data-sort],[data-say],[data-artid],[data-del],[data-askdel],[data-explain]");
  if(!t) return;
  if(t.dataset.lang) return setLang(t.dataset.lang);
  if(t.dataset.level) return setLevel(t.dataset.level);
  if(t.dataset.town){ S.selTown=S.selTown===t.dataset.town?null:t.dataset.town; render(); if(S.selTown&&t.tagName==="BUTTON"){ const m=document.querySelector(".map-wrap"); if(m) m.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  if(t.dataset.advtab){ S.advTab=t.dataset.advtab; return render(); }
  if(t.dataset.shopel){ S.shopEl=t.dataset.shopel; return render(); }
  if(t.dataset.buy) return buy(t.dataset.buy);
  if(t.dataset.equip) return equip(t.dataset.equip);
  if(t.dataset.mon) return startBattle(t.dataset.mon);
  if(t.dataset.spell!=null) return castSpell(+t.dataset.spell);
  if(t.dataset.tab){ S.quiz=null; S.battle=null; return setTab(t.dataset.tab); }
  if(t.dataset.say){ speak(t.dataset.say); return; }
  if(t.dataset.w){ lookup(t.dataset.w); return; }
  if(t.dataset.pick!=null) return pick(+t.dataset.pick);
  
  if(t.dataset.open){ S.open=S.open===t.dataset.open?null:t.dataset.open; S.confirmDel=null; return render(); }
  if(t.dataset.sort){ S.dictSort=t.dataset.sort; return render(); }
  if(t.dataset.askdel){ S.confirmDel=t.dataset.askdel; return render(); }
  if(t.dataset.del){ remove(t.dataset.del); S.open=null; S.confirmDel=null; toast(T("removed")); return render(); }
  if(t.dataset.artid){ openArticle(t.dataset.artid); return; }
  const a=t.dataset.act;
  if(a==="close"){ S.sheet=null; return renderSheet(); }
  if(a==="lang"){ S.sheet=null; S.langSheet=true; return renderSheet(); }
  if(a==="closelang"){ S.langSheet=false; return renderSheet(); }
  if(a==="level"){ S.sheet=null; S.langSheet=false; S.levelSheet=true; return renderSheet(); }
  if(a==="closelevel"){ S.levelSheet=false; return renderSheet(); }
  if(a==="export") return exportData();
  if(a==="signin") return cloudSignIn();
  if(a==="signout") return cloudSignOut();
  if(a==="fight") return fight();
  if(a==="tax") return collectTax();
  if(a==="skip"){ if(S.battle){ S.battle.stage="end"; clearInterval(S.btimer); render(); } return; }
  if(a==="advback"){ clearInterval(S.btimer); S.battle=null; S.tab="adv"; S.view="adv"; render(); window.scrollTo(0,0); return; }
  if(a==="nodel"){ S.confirmDel=null; return render(); }
  if(a==="home"){ S.tab="today"; S.view="today"; S.quiz=null; render(); window.scrollTo(0,0); return; }
  if(a==="back"){ const b=S.backTo||"today"; S.tab=b; S.view=b; render(); window.scrollTo(0,0); return; }
  if(a==="pre") return startQuiz("pre");
  if(a==="post") return startQuiz("post", mainArticle());
  if(a==="read"){ S.tab="today"; S.backTo="today"; S.articleId=mainArticle()&&mainArticle().id; S.view="read"; S.quiz=null; render(); window.scrollTo(0,0); return; }
  if(a==="finish"){ const d=dayRec(); saveDay({...d, read:mainArticle().id}); return startQuiz("post", mainArticle()); }
  if(a==="finishx") return startQuiz("post", currentArticle());
  if(a==="next"){ S.quiz.i++; S.quiz.picked=null; render(); window.scrollTo(0,0); return; }
});

const CLOUD={ready:false, user:null, status:"idle", fb:null, dirtyWords:new Set(), delWords:new Set(), dirtyMain:false, timer:null};
async function cloudInit(){
  try{
    const [appM,authM,fsM]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)]);
    const app=appM.initializeApp(FB_CONFIG);
    const auth=authM.getAuth(app);
    const db=fsM.getFirestore(app);
    CLOUD.fb={authM,fsM,auth,db};
    authM.getRedirectResult(auth).catch(()=>{});
    authM.onAuthStateChanged(auth, async u=>{
      CLOUD.user=u; CLOUD.ready=true;
      if(u) await cloudPull(); else { CLOUD.status="idle"; render(); }
    });
  }catch(e){ CLOUD.ready=true; CLOUD.status="off"; render(); }
}
async function cloudSignIn(){
  if(!CLOUD.fb){ toast(T("cloudOff")); return; }
  const {authM,auth}=CLOUD.fb; const p=new authM.GoogleAuthProvider();
  try{ await authM.signInWithPopup(auth,p); }
  catch(e){
    const c=e&&e.code||"";
    if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return;
    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported"){ try{ await authM.signInWithRedirect(auth,p); return; }catch(_){} }
    toast(T("loginFail"));
  }
}
async function cloudSignOut(){ if(!CLOUD.fb) return; await cloudFlush(); await CLOUD.fb.authM.signOut(CLOUD.fb.auth); toast(T("signedOut")); render(); }
const userRef=()=>CLOUD.fb.fsM.doc(CLOUD.fb.db,"users",CLOUD.user.uid);
const wordsCol=()=>CLOUD.fb.fsM.collection(CLOUD.fb.db,"users",CLOUD.user.uid,"words");
const wScore=v=>(v.correct||0)+(v.wrong||0)+(v.lookups||0);
const dScore=v=>(v.preDone?1:0)+(v.read?1:0)+(v.postDone?1:0)+Object.keys(v.postBy||{}).length;
function mergeDay(a,b){ if(!a) return b; if(!b) return a; const base=dScore(b)>dScore(a)?b:a, o=base===a?b:a;
  const lb={...(o.lookedUpBy||{})}; for(const [k,v] of Object.entries(base.lookedUpBy||{})) lb[k]=[...new Set([...(lb[k]||[]),...v])];
  return {...base, lookedUp:[...new Set([...(base.lookedUp||[]),...(o.lookedUp||[])])], lookedUpBy:lb, postBy:{...(o.postBy||{}),...(base.postBy||{})}, bonus:!!(a.bonus||b.bonus)}; }
function mergeGame(a,b){ if(!a) return b; if(!b) return a;
  const base=(b.lv>a.lv||(b.lv===a.lv&&(b.exp||0)>(a.exp||0)))?b:a, o=base===a?b:a;
  const wins={...(o.wins||{})}; for(const [k,v] of Object.entries(base.wins||{})) wins[k]=Math.max(v,wins[k]||0);
  return {...G_DEFAULT, ...base, inv:[...new Set([...(base.inv||[]),...(o.inv||[])])], conq:{...(o.conq||{}),...(base.conq||{})}, wins,
    taxDate:[base.taxDate,o.taxDate].filter(Boolean).sort().pop()||null, battles:Math.max(base.battles||0,o.battles||0)}; }
async function cloudPull(){
  const {fsM}=CLOUD.fb; CLOUD.status="syncing"; render();
  try{
    const [us,ws]=await Promise.all([fsM.getDoc(userRef()), fsM.getDocs(wordsCol())]);
    const cloud=us.exists()?us.data():{}; const hadLocal=S.words.size>0||S.days.size>0||(S.game&&(S.game.lv>1||S.game.exp>0||S.game.gold>0));
    const cw=new Map(); ws.forEach(d=>cw.set(d.id,d.data()));
    // words: keep the more-practised copy of each word
    for(const [k,v] of cw){ const l=S.words.get(k); if(!l||wScore(v)>=wScore(l)) S.words.set(k,v); }
    for(const [k,v] of S.words) if(!cw.has(k)||wScore(v)>wScore(cw.get(k))) CLOUD.dirtyWords.add(k);
    for(const [k,v] of Object.entries(cloud.days||{})) S.days.set(k, mergeDay(S.days.get(k),v));
    S.game=mergeGame(S.game, cloud.game?{...G_DEFAULT,...cloud.game}:null) || S.game;
    CLOUD.dirtyMain=true; lsSave();
    await cloudFlush();
    if(hadLocal && (cw.size||cloud.game)) toast(T("merged"));
    CLOUD.status="ok";
  }catch(e){ CLOUD.status="err"; }
  render();
}
function cloudMark(id, deleted){ if(!CLOUD.user) return; if(id&&id.startsWith("w~")){ (deleted?CLOUD.delWords:CLOUD.dirtyWords).add(id); if(deleted) CLOUD.dirtyWords.delete(id); } else CLOUD.dirtyMain=true;
  clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush,1500); }
async function cloudFlush(){
  if(!CLOUD.user||!CLOUD.fb) return; clearTimeout(CLOUD.timer);
  const {fsM,db}=CLOUD.fb; const words=[...CLOUD.dirtyWords], dels=[...CLOUD.delWords], main=CLOUD.dirtyMain;
  if(!words.length&&!dels.length&&!main) return;
  CLOUD.dirtyWords.clear(); CLOUD.delWords.clear(); CLOUD.dirtyMain=false;
  try{
    const ops=[];
    if(main) ops.push(b=>b.set(userRef(),{game:S.game||null, days:Object.fromEntries(S.days), updatedAt:new Date().toISOString(), v:1}));
    for(const k of words){ const v=S.words.get(k); if(v) ops.push(b=>b.set(fsM.doc(wordsCol(),k), JSON.parse(JSON.stringify(v)))); }
    for(const k of dels) ops.push(b=>b.delete(fsM.doc(wordsCol(),k)));
    for(let i=0;i<ops.length;i+=400){ const b=fsM.writeBatch(db); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); }
    if(CLOUD.status!=="ok"){ CLOUD.status="ok"; render(); }
  }catch(e){
    words.forEach(k=>CLOUD.dirtyWords.add(k)); dels.forEach(k=>CLOUD.delWords.add(k)); if(main) CLOUD.dirtyMain=true;
    if(CLOUD.status!=="err"){ CLOUD.status="err"; toast(T("syncFail")); render(); }
    clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush,30000);
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") cloudFlush(); });
window.addEventListener("online",()=>cloudFlush());
const G_SVG='<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>';
function accountCard(compact){
  if(!CLOUD.ready) return "";
  if(CLOUD.status==="off") return compact?"":`<section class="card acct"><b>${T("acctTitle")}</b><span class="muted sm-t">${T("cloudOff")}</span></section>`;
  const u=CLOUD.user;
  if(!u) return `<section class="card acct"><div><b>${T("acctTitle")}</b>${compact?"":`<p class="muted" style="margin:4px 0 0;font-size:13px">${T("acctOff")}</p>`}</div><button class="btn gbtn" data-act="signin">${G_SVG}<span>${T("signIn")}</span></button></section>`;
  const st={ok:T("synced"),syncing:T("syncing"),err:T("syncFail")}[CLOUD.status]||"";
  return compact?"":`<section class="card acct"><div class="row" style="gap:10px;flex-wrap:nowrap">${u.photoURL?`<img src="${esc(u.photoURL)}" alt="" class="avatar" referrerpolicy="no-referrer">`:""}<div style="min-width:0;flex:1"><b>${T("signedAs",{n:esc(u.displayName||u.email||"")})}</b><div class="muted sm-t ${CLOUD.status==="err"?"bad-t":""}">${st}</div></div><button class="btn ghost" data-act="signout" style="padding:6px 12px;font-size:13px">${T("signOut")}</button></div></section>`;
}

/* ---------- boot ---------- */
S.index=[];
document.documentElement.lang={zh:"zh-Hant",en:"en",hi:"hi",es:"es"}[LANG]; applyStaticText();
render();
(async ()=>{
  const o=lsLoad(); for(const [k,v] of Object.entries(o)){ if(v.type==="word") S.words.set(k,v); else if(v.type==="day") S.days.set(k,v); else if(v.type==="game") S.game={...G_DEFAULT, ...v}; }
  S.ready.personal=true; render();
  cloudInit();
  try{
    let j=null;
    for(const b of ART_BASES){ try{ const r=await fetch(b+"index.json",{cache:"no-cache"}); if(r.ok){ j=await r.json(); ART_BASE=b; break; } }catch(_){} }
    if(!j) throw 0;
    S.index=(j.articles||[]).slice().sort(byOrder);
    const recent=S.index.slice(0,12);
    const docs=await Promise.all(recent.map(a=>fetch(ART_BASE+encodeURIComponent(a.id)+".json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null)));
    S.articles=docs.map((d,i)=>d&&{...d, id:recent[i].id}).filter(Boolean).sort(byOrder);
  }catch(e){ toast(T("artLoadFail")); }
  S.ready.articles=true; fillMeanings(); render();
})();
