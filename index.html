const HELP={"zh": {"title": "使用說明", "intro": "每天花 10–15 分鐘讀一篇愛爾蘭新聞，邊學英文邊玩遊戲。", "close": "💚 做這個 App，是希望能幫助每一個想學好英文的人。每天進步一點點，英文就會越來越好。祝你學習愉快！", "sign": "— CheChe", "ok": "開始使用", "secs": [["📰", "每日三步驟", "① 複習測驗：抽考前幾天查過的單字，越不熟的字越容易被抽到。② 閱讀頭條：看不懂的字直接點，會顯示翻譯、相似詞、反義詞和例句，並自動存進字典。③ 讀後測驗：固定 10 題，每題都有講解，答錯的更要看。"], ["📚", "字典", "查過的字都會存在這裡，可以搜尋，也可以依「最不熟」排序。上方的「字典複習」每完成一次可以拿 1 張彩券（每天最多 3 張）。"], ["🎯", "英文程度", "到「設定」選 B1、B2、C1 或 IELTS 7–8，文章會換成對應難度的版本。"], ["⚔️", "冒險", "測驗答對就能賺金幣和出征令。到商店買五行裝備，用出征令攻打愛爾蘭各城鎮的怪物，打贏就能佔領城鎮、每天收稅。武器屬性克制怪物時傷害 ×1.5，出征前記得看五行圖挑裝備。目標：從最小的小鎮一路打到都柏林，佔領整座島！"], ["🍀", "幸運屋", "1 張彩券可以轉一次幸運轉盤，2 張以上可以買刮刮樂。刮到的元素碎片，同屬性、同等級集滿 5 個就能合成一件裝備。"], ["🤝", "合作與排行榜", "登入後可以和朋友開房間，一起找文章裡的錯字打倒魔王。在設定取個暱稱，就能用等級、HP、攻擊力和大家比排名。"], ["⚙️", "設定", "用 Google 登入一次，進度就會存到雲端，換手機也不會不見。語言、英文程度和備份也都在這裡。"], ["📱", "小技巧", "在 Safari 按「分享」→「加入主畫面」，就能像 App 一樣從主畫面打開。"]]}, "en": {"title": "How to use", "intro": "Spend 10–15 minutes a day reading one Irish news story, and play a game while you learn.", "close": "💚 I made this app hoping it helps everyone who wants to learn English. A little progress every day adds up. Enjoy learning!", "sign": "— CheChe", "ok": "Let's go", "secs": [["📰", "Three steps a day", "① Review quiz: words you looked up on earlier days, and the ones you know least come up most. ② Read the headline: tap any word you don't know to see its meaning, synonyms, opposites and an example; it's saved to your dictionary. ③ After-reading quiz: always 10 questions, each with an explanation, especially the ones you get wrong."], ["📚", "Words", "Every word you look up is saved here. Search it or sort by \"Weakest\". Each finished Dictionary review at the top earns 1 lucky ticket (up to 3 a day)."], ["🎯", "English level", "In Settings choose B1, B2, C1 or IELTS 7–8 and articles switch to a version at that level."], ["⚔️", "Quest", "Correct answers earn gold and quest passes. Buy elemental gear in the shop and use passes to fight the monsters in Ireland's towns. Win to conquer a town and collect taxes every day. A weapon whose element beats the monster deals ×1.5 damage, so check the five-element chart first. Goal: fight from the smallest village all the way to Dublin and conquer the whole island!"], ["🍀", "Luck", "1 lucky ticket spins the wheel once; 2 or more buy a scratch card. Collect 5 element shards of the same element and tier to forge a piece of gear."], ["🤝", "Co-op & ranking", "Once signed in, open a room with a friend and hunt for the mistakes in an article together to beat the boss. Set a nickname in Settings to compare level, HP and attack on the leaderboard."], ["⚙️", "Settings", "Sign in with Google once and your progress is saved to the cloud, so a new phone won't lose anything. Language, English level and backups are here too."], ["📱", "Tip", "In Safari tap Share → Add to Home Screen to open it from your home screen like an app."]]}, "hi": {"title": "कैसे इस्तेमाल करें", "intro": "रोज़ 10–15 मिनट एक आयरिश ख़बर पढ़ें, और सीखते हुए खेल भी खेलें।", "close": "💚 मैंने यह ऐप इस उम्मीद में बनाया है कि यह अंग्रेज़ी सीखना चाहने वाले हर व्यक्ति की मदद करे। रोज़ थोड़ा-थोड़ा सुधार बड़ा फ़र्क़ लाता है। सीखने का आनंद लें!", "sign": "— CheChe", "ok": "शुरू करें", "secs": [["📰", "रोज़ के तीन चरण", "① दोहराई क्विज़: पिछले दिनों देखे गए शब्द; जो कम आते हैं वे ज़्यादा पूछे जाते हैं। ② मुख्य ख़बर पढ़ें: न समझ आने वाले शब्द पर टैप करें; अर्थ, समानार्थी, विलोम और उदाहरण दिखेंगे और शब्द शब्दकोश में सहेजा जाएगा। ③ पढ़ने के बाद क्विज़: हमेशा 10 प्रश्न, हर एक की व्याख्या के साथ।"], ["📚", "शब्दकोश", "देखे गए सभी शब्द यहाँ सहेजे जाते हैं। खोजें या \"सबसे कमज़ोर\" से क्रम लगाएँ। ऊपर की शब्दकोश दोहराई पूरी करने पर 1 लकी टिकट मिलता है (दिन में अधिकतम 3)।"], ["🎯", "अंग्रेज़ी स्तर", "सेटिंग्स में B1, B2, C1 या IELTS 7–8 चुनें; लेख उसी स्तर के संस्करण में बदल जाएँगे।"], ["⚔️", "साहसिक", "सही उत्तरों से सोना और अभियान पास मिलते हैं। दुकान से तत्व वाले उपकरण खरीदें और पास से आयरलैंड के शहरों के दानवों से लड़ें। जीतने पर शहर आपका, और रोज़ कर मिलेगा। जो हथियार दानव के तत्व को हराता है वह ×1.5 नुकसान करता है, इसलिए पहले पंचतत्व चार्ट देखें। लक्ष्य: सबसे छोटे गाँव से डबलिन तक जीतकर पूरा द्वीप जीतना!"], ["🍀", "किस्मत", "1 लकी टिकट से पहिया एक बार घूमता है; 2 या ज़्यादा से स्क्रैच कार्ड। एक ही तत्व और स्तर के 5 टुकड़े जमा करके उपकरण बनाएँ।"], ["🤝", "साथ में और रैंकिंग", "साइन इन के बाद दोस्त के साथ कमरा बनाएँ और लेख की ग़लतियाँ साथ ढूँढकर दानव को हराएँ। सेटिंग्स में उपनाम चुनें और लीडरबोर्ड पर लेवल, HP व आक्रमण की तुलना करें।"], ["⚙️", "सेटिंग्स", "एक बार Google से साइन इन करें, प्रगति क्लाउड में सहेजी जाएगी और फ़ोन बदलने पर भी नहीं खोएगी। भाषा, अंग्रेज़ी स्तर और बैकअप भी यहीं हैं।"], ["📱", "सुझाव", "Safari में शेयर → होम स्क्रीन में जोड़ें दबाएँ, फिर इसे ऐप की तरह होम स्क्रीन से खोलें।"]]}, "es": {"title": "Cómo se usa", "intro": "Dedica 10–15 minutos al día a leer una noticia irlandesa y juega mientras aprendes.", "close": "💚 Hice esta app con la esperanza de ayudar a todas las personas que quieren aprender inglés. Un poco cada día marca la diferencia. ¡Disfruta aprendiendo!", "sign": "— CheChe", "ok": "¡Vamos!", "secs": [["📰", "Tres pasos al día", "① Test de repaso: palabras que consultaste otros días; las que menos dominas salen más. ② Lee el titular: toca cualquier palabra que no entiendas para ver su significado, sinónimos, antónimos y un ejemplo; se guarda en tu diccionario. ③ Test después de leer: siempre 10 preguntas, cada una con su explicación."], ["📚", "Diccionario", "Aquí se guardan todas las palabras que consultas. Puedes buscarlas u ordenarlas por «Más débiles». Cada repaso del diccionario terminado da 1 boleto de la suerte (máximo 3 al día)."], ["🎯", "Nivel de inglés", "En Ajustes elige B1, B2, C1 o IELTS 7–8 y los artículos cambian a la versión de ese nivel."], ["⚔️", "Aventura", "Las respuestas correctas dan oro y pases. Compra equipo elemental en la tienda y usa los pases para luchar contra los monstruos de las ciudades de Irlanda. Si ganas, conquistas la ciudad y cobras impuestos cada día. Un arma cuyo elemento vence al del monstruo hace ×1,5 de daño, así que mira primero el gráfico de los cinco elementos. Objetivo: llegar desde el pueblo más pequeño hasta Dublín y conquistar toda la isla."], ["🍀", "Suerte", "Con 1 boleto giras la ruleta; con 2 o más compras un rasca y gana. Junta 5 fragmentos del mismo elemento y nivel para forjar un equipo."], ["🤝", "Cooperativo y ranking", "Con la sesión iniciada, abre una sala con un amigo y buscad juntos los errores de un artículo para vencer al jefe. Elige un apodo en Ajustes para comparar nivel, HP y ataque en la clasificación."], ["⚙️", "Ajustes", "Inicia sesión con Google una vez y tu progreso se guarda en la nube; si cambias de móvil no pierdes nada. Aquí también están el idioma, el nivel de inglés y las copias de seguridad."], ["📱", "Consejo", "En Safari toca Compartir → Añadir a pantalla de inicio para abrirla como una app."]]}, "ja": {"title": "使い方", "intro": "1日10〜15分、アイルランドのニュースを1本読んで、ゲームも楽しみながら英語を学びましょう。", "close": "💚 このアプリは、英語を学びたいすべての人の役に立てたらと思って作りました。毎日少しずつの積み重ねが力になります。楽しく学んでください！", "sign": "— CheChe", "ok": "はじめる", "secs": [["📰", "毎日の3ステップ", "① 復習テスト：前の日に調べた単語から出題。苦手な単語ほど出やすくなります。② トップ記事を読む：わからない単語をタップすると、意味・類義語・反対語・例文が表示され、単語帳に保存されます。③ 読後テスト：いつも10問、全問に解説付き。"], ["📚", "単語帳", "調べた単語はすべてここに保存されます。検索や「苦手順」での並べ替えもできます。上の「単語帳の復習」を1回終えるとくじ券が1枚（1日最大3枚）。"], ["🎯", "英語レベル", "設定で B1・B2・C1・IELTS 7–8 を選ぶと、記事がそのレベルの版に切り替わります。"], ["⚔️", "冒険", "正解するとゴールドと出撃券がもらえます。ショップで五行の装備を買い、出撃券でアイルランド各地の魔物に挑みましょう。勝てばその町を征服し、毎日税金が入ります。武器の属性が魔物に勝っているとダメージ×1.5なので、出撃前に五行の図を確認しましょう。目標：いちばん小さな村からダブリンまで攻め上がり、島全体を征服！"], ["🍀", "幸運", "くじ券1枚でルーレットを1回、2枚以上でスクラッチカードが買えます。同じ属性・ランクのかけらを5個集めると装備を合成できます。"], ["🤝", "協力とランキング", "ログインすると友達とルームを作り、記事の間違いを一緒に探してボスを倒せます。設定でニックネームを決めると、レベル・HP・攻撃力でランキングに参加できます。"], ["⚙️", "設定", "Google で一度ログインすると進行状況がクラウドに保存され、機種変更しても消えません。言語・英語レベル・バックアップもここにあります。"], ["📱", "ヒント", "Safari で「共有」→「ホーム画面に追加」を押すと、アプリのようにホーム画面から開けます。"]]}, "ko": {"title": "사용 방법", "intro": "하루 10~15분, 아일랜드 뉴스 한 편을 읽고 게임도 즐기며 영어를 배워 보세요.", "close": "💚 영어를 배우고 싶은 모든 분께 도움이 되길 바라며 이 앱을 만들었어요. 매일 조금씩 쌓이면 영어가 점점 늘어요. 즐겁게 공부하세요!", "sign": "— CheChe", "ok": "시작하기", "secs": [["📰", "매일 3단계", "① 복습 퀴즈: 전에 찾아본 단어가 나와요. 잘 모르는 단어일수록 더 자주 나와요. ② 헤드라인 읽기: 모르는 단어를 누르면 뜻, 비슷한 말, 반대말, 예문이 나오고 단어장에 저장돼요. ③ 읽은 후 퀴즈: 항상 10문제, 모든 문제에 해설이 있어요."], ["📚", "단어장", "찾아본 단어는 모두 여기에 저장돼요. 검색하거나 '약한 순'으로 정렬할 수 있어요. 위의 '단어장 복습'을 한 번 끝낼 때마다 복권 1장 (하루 최대 3장)."], ["🎯", "영어 수준", "설정에서 B1, B2, C1, IELTS 7–8 중에서 고르면 기사가 그 수준의 버전으로 바뀌어요."], ["⚔️", "모험", "정답을 맞히면 골드와 출정권을 받아요. 상점에서 오행 장비를 사고, 출정권으로 아일랜드 마을의 괴물과 싸우세요. 이기면 마을을 정복하고 매일 세금을 받아요. 무기 속성이 괴물을 이기면 피해 ×1.5이니 출정 전에 오행 그림을 확인하세요. 목표: 가장 작은 마을부터 더블린까지 정복해 섬 전체를 차지하기!"], ["🍀", "행운", "복권 1장으로 룰렛을 한 번, 2장 이상이면 긁는 복권을 살 수 있어요. 같은 속성·등급 조각 5개를 모으면 장비를 합성할 수 있어요."], ["🤝", "협동과 랭킹", "로그인하면 친구와 방을 만들어 기사 속 틀린 곳을 함께 찾아 보스를 물리칠 수 있어요. 설정에서 닉네임을 정하면 레벨·HP·공격력으로 랭킹에 참여해요."], ["⚙️", "설정", "Google로 한 번 로그인하면 진행 상황이 클라우드에 저장돼 휴대폰을 바꿔도 사라지지 않아요. 언어, 영어 수준, 백업도 여기에 있어요."], ["📱", "팁", "Safari에서 '공유' → '홈 화면에 추가'를 누르면 앱처럼 홈 화면에서 열 수 있어요."]]}};
function helpSheet(){
  const h=HELP[LANG]||HELP.en;
  return `<div class="scrim" data-act="closehelp"></div><div class="sheet help-sheet" role="dialog" aria-label="${esc(h.title)}"><div class="grab"></div>
    <div class="eyebrow">BinBin daily</div><h2>${esc(h.title)}</h2><p class="muted" style="margin:0 0 6px">${esc(h.intro)}</p>
    ${h.secs.map(([i,t,p])=>`<div class="help-sec"><span class="hi" aria-hidden="true">${i}</span><b>${esc(t)}</b><p>${esc(p)}</p></div>`).join("")}
    <div class="help-close">${esc(h.close)}<i>${esc(h.sign)}</i></div>
    <button class="btn" data-act="closehelp" style="width:100%">${esc(h.ok)}</button></div>`;
}

/* ================= IELTS mock test (listening + reading) ================= */
const IE_MIN=20;                       // test length in minutes
let IE_TESTS=null, IE_PRAC=[], IE_ALL=[], IE_WEEKLY=false;
const ieFind=id=>IE_ALL.concat(IE_TESTS||[],IE_PRAC).find(x=>x.id===id);
let IE_AUDIO={tests:{}};
async function ieLoad(){ if(IE_TESTS) return IE_TESTS;
  fetch("ielts/audio/index.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.tests){ IE_AUDIO=j; if(S.view==="adv") render(); } }).catch(()=>{});
  let base={tests:[],practice:[]};
  try{ const r=await fetch("ielts/tests.json",{cache:"no-cache"}); base=await r.json(); }catch(e){}
  IE_TESTS=base.tests||[]; IE_PRAC=base.practice||[]; IE_ALL=IE_TESTS.concat(IE_PRAC);
  // a fresh set is written every week: ielts/weeks/<ISO week>.json = {week, tests:[7, Mon..Sun], practice:[3]}
  try{ const r=await fetch("ielts/weeks/"+isoWeek().id+".json",{cache:"no-cache"}); if(r.ok){ const j=await r.json(); if(j.tests&&j.tests.length>=7){ IE_TESTS=j.tests; IE_WEEKLY=true; if(j.practice&&j.practice.length) IE_PRAC=j.practice; IE_ALL=IE_ALL.concat(j.tests,j.practice||[]); } } }catch(e){}
  return IE_TESTS; }
function isoWeek(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); const w=Math.ceil(((t-y0)/864e5+1)/7); return {id:t.getUTCFullYear()+"-W"+String(w).padStart(2,"0"), n:t.getUTCFullYear()*53+w}; }
const dayNum=()=>{ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); };
function weekTest(){ if(!IE_TESTS||!IE_TESTS.length) return null; if(IE_WEEKLY){ const wd=(new Date().getDay()+6)%7; return IE_TESTS[wd%IE_TESTS.length]; } return IE_TESTS[dayNum()%IE_TESTS.length]; }   // a different ranked test every day
function untilTomorrow(){ const n=new Date(), d=new Date(n); d.setDate(n.getDate()+1); d.setHours(0,0,0,0); const ms=d-n; return {h:Math.floor(ms/36e5), m:Math.floor(ms%36e5/6e4)}; }
function untilReset(){ const now=new Date(), d=new Date(now); const add=((8-(now.getDay()||7))%7)||7; d.setDate(now.getDate()+add); d.setHours(0,0,0,0); const ms=d-now; return {d:Math.floor(ms/864e5), h:Math.floor(ms%864e5/36e5)}; }
// raw score (scaled to 40 questions) → band, after the usual IELTS conversion tables
const IE_TABLE=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[6,3.5],[4,3],[2,2.5],[1,2],[0,0]];
function ieBand(c,t){ if(!t) return 0; const s=Math.round(c/t*40); for(const [m,b] of IE_TABLE) if(s>=m) return b; return 0; }
const fmtBand=b=>Number(b).toFixed(1).replace(/\.0$/,".0");
function ieState(){ const g=game(); g.ielts=g.ielts||{best:null,hist:[],badges:{},weeks:{}}; g.ielts.days=g.ielts.days||{}; g.ielts.months=g.ielts.months||{}; return g.ielts; }

/* speech for the listening parts */
// Voices: skip the novelty/"Eloquence" voices (they sound robotic) and prefer enhanced/premium/neural ones
const IE_BAD=/eloquence|compact|espeak|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|grandma|grandpa|rocko|shelley|flo\b|eddy|reed|sandy|kathy/i;
const IE_FEM=/female|serena|kate|martha|stephanie|moira|karen|tessa|fiona|samantha|victoria|susan|libby|sonia|hazel|emily|catherine|siri.*(voice ?[24])|aria|jenny|natasha|clara|niamh|emma|olivia|amy/i;
const IE_MAL=/\bmale|daniel|arthur|oliver|george|ryan|thomas|rishi|aaron|gordon|malcolm|lee\b|tom\b|alex\b|connor|guy|william|brian|james|liam|nathan/i;
function ieVoiceScore(v){ let s=0; if(/premium|enhanced|neural|natural|online|plus/i.test(v.name)) s+=60; if(/google/i.test(v.name)) s+=35; if(/siri/i.test(v.name)) s+=40; if(/^en[-_](GB|IE)/i.test(v.lang)) s+=20; else if(/^en[-_](AU|NZ)/i.test(v.lang)) s+=12; else if(/^en/i.test(v.lang)) s+=5; if(v.localService===false) s+=5; return s; }
function ieVoiceList(){ const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; return vs.filter(v=>/^en/i.test(v.lang)&&!IE_BAD.test(v.name)).sort((a,b)=>ieVoiceScore(b)-ieVoiceScore(a)); }
function ieVoices(){
  const list=ieVoiceList(); let saved={}; try{ saved=JSON.parse(localStorage.getItem("che-pro-voice")||"{}"); }catch(e){}
  const byName=n=>list.find(v=>v.name===n);
  const F=byName(saved.F)||list.find(v=>IE_FEM.test(v.name)&&!IE_MAL.test(v.name))||list[0]||null;
  const M=byName(saved.M)||list.find(v=>IE_MAL.test(v.name)&&!/female/i.test(v.name)&&v!==F)||list.find(v=>v!==F)||F;
  return {F, M, same:F===M};
}
if(window.speechSynthesis){ try{ speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged",()=>{ if(S.view==="adv"&&(S.compMode||"ielts")==="ielts") render(); }); }catch(e){} }
function ieSay(text, v, sp, same, onend){ const u=new SpeechSynthesisUtterance(text); u.lang=(v&&v.lang)||"en-GB"; if(v) u.voice=v; u.rate=1; u.pitch=same?(sp==="F"?1.08:0.94):1; u.onend=onend; u.onerror=onend; speechSynthesis.speak(u); }

function iePlay(pi){
  const R=game().ieltsRun; if(!R) return; const t=ieFind(R.test), part=t.listening[pi];
  if(R.ranked&&R.played[pi]) return;
  const rec=(IE_AUDIO.tests||{})[t.id], files=rec&&rec.parts&&rec.parts[pi];
  if(files&&files.length===part.script.length) return iePlayRec(pi, part, files);
  if(!window.speechSynthesis){ R.played[pi]="nots"; saveGame(); return render(); }
  speechSynthesis.cancel(); const V=ieVoices(); const lines=part.script; let i=0;
  R.played[pi]=true; saveGame(); S.iePlaying={pi,i:0,n:lines.length}; render();
  const next=()=>{ if(!S.iePlaying||S.iePlaying.pi!==pi) return; if(i>=lines.length){ S.iePlaying=null; render(); return; }
    const [sp,text]=lines[i];
    ieSay(text, V[sp]||V.F, sp, V.same, ()=>{ i++; S.iePlaying&&(S.iePlaying.i=i); const el=document.getElementById("iePlayState"); if(el) el.textContent=T("iePlaying",{i:Math.min(i+1,lines.length),n:lines.length}); setTimeout(next,450); }); };
  next();
}
function iePlayRec(pi, part, files){
  const R=game().ieltsRun; ieStopAudio();
  const au=S.ieAudioEl||(S.ieAudioEl=new Audio()); au.preload="auto";
  const pre=new Audio(); pre.preload="auto";
  let i=0; R.played[pi]=true; saveGame(); S.iePlaying={pi,i:0,n:files.length,rec:true}; render();
  const url=k=>"ielts/audio/"+k+".mp3";
  const fallback=()=>{ const V=ieVoices(), [sp,text]=part.script[i]; if(window.speechSynthesis) ieSay(text, V[sp]||V.F, sp, V.same, step); else step(); };
  const step=()=>{ i++; if(S.iePlaying) S.iePlaying.i=i; const el=document.getElementById("iePlayState"); if(el) el.textContent=T("iePlaying",{i:Math.min(i+1,files.length),n:files.length}); setTimeout(next,380); };
  const next=()=>{ if(!S.iePlaying||S.iePlaying.pi!==pi) return; if(i>=files.length){ S.iePlaying=null; render(); return; }
    au.onended=step; au.onerror=fallback; au.src=url(files[i]); const pr=au.play(); if(pr&&pr.catch) pr.catch(fallback);
    if(files[i+1]) pre.src=url(files[i+1]); };
  next();
}
function ieStopAudio(){ try{ speechSynthesis.cancel(); }catch(e){} try{ if(S.ieAudioEl){ S.ieAudioEl.onended=null; S.ieAudioEl.onerror=null; S.ieAudioEl.pause(); } }catch(e){} S.iePlaying=null; }

  let input="";
  if(q.type==="gap") input=review?`<span class="ie-ans">${a?esc(a):`<i class="muted">${T("ieBlank")}</i>`}</span>`:`<input class="search ie-gap" data-iq="${key}" value="${esc(a||"")}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  else if(q.type==="mcq") input=`<div class="ie-opts">${q.opts.map((o,i)=>`<button class="ie-opt${+a===i&&a!==undefined&&a!==""?" on":""}${review&&i===q.a?" right":""}${review&&+a===i&&i!==q.a?" wrong":""}" ${review?"disabled":`data-iqk="${key}" data-iqv="${i}"`}><b>${"ABCD"[i]}</b> ${esc(o)}</button>`).join("")}</div>`;
  else input=`<div class="ie-opts row">${[["T","TRUE"],["F","FALSE"],["NG","NOT GIVEN"]].map(([v,l])=>`<button class="ie-opt tf${a===v?" on":""}${review&&v===q.a?" right":""}${review&&a===v&&v!==q.a?" wrong":""}" ${review?"disabled":`data-iqk="${key}" data-iqv="${v}"`}>${l}</button>`).join("")}</div>`;
  const exp=review?`<div class="ie-exp">${!ieCorrect(q,a)?`<div><span class="lab">${T("ieAns")}</span><b>${esc(q.type==="gap"?q.a[0]:q.type==="mcq"?"ABCD"[q.a]+" "+q.opts[q.a]:({T:"TRUE",F:"FALSE",NG:"NOT GIVEN"})[q.a])}</b></div>`:""}<div class="muted">${esc(q.exp)}</div></div>`:"";
  return `<div class="ie-q${review?(ieCorrect(q,a)?" ok":" no"):""}"><div class="ie-qh"><span class="ie-n">${num}</span>${mark}<span>${esc(q.q).replace("______",'<u class="blank"></u>')}</span></div>${input}${exp}</div>`;

function ieSectionHtml(t,R,review){

    body=`<div class="ie-part"><h3>${esc(p.title)}</h3><p class="ie-instr">${esc(p.instr)}</p>${audio}${script}${items.filter(x=>x.sec==="L"&&x.part===pi).map(x=>ieQHtml(x,R,review)).join("")}</div>`;
  } else {

function ieSubmit(){
  const g=game(), R=g.ieltsRun; if(!R) return; ieStopAudio(); clearInterval(S.ieTimer); trackPlay(R.ranked?"ielts":"ieltsPrac");

  const st=ieState(), res={test:t.id, week:R.week, ranked:R.ranked, lc, rc, lt:L.length, rt:Rd.length, lb, rb, band:ob, ans:R.ans, date:today()};

    st.hist=(st.hist||[]).concat({week:R.week,band:ob,l:lb,r:rb,date:today()}).slice(-120);

const BADGE_STYLE={"6.0":["#B87333","#E3A16B"],"6.5":["#8E99A3","#E3E8EC"],"7.0":["#C9A227","#FFE58A"],"7.5":["#1F9E74","#7FE0B8"],"8.0":["#2563C9","#8EC1FF"],"8.5":["#7B3FC4","#D3A8FF"],"9.0":["#E0457B","#FFD25A"]};
function badgeSvg(k, count, size){
  const [c1,c2]=BADGE_STYLE[k]||BADGE_STYLE["6.0"], b=parseFloat(k), glow=b>=8, rainbow=b>=9, id="bg"+k.replace(".","")+Math.random().toString(36).slice(2,6);
  const stars=Math.max(0,count||0), shown=Math.min(stars,7);
  const starEls=Array.from({length:shown},(_,i)=>{ const a=-Math.PI/2+(i-(shown-1)/2)*0.45; const x=50+44*Math.cos(a), y=48+44*Math.sin(a); return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(.6)" d="M0-10L2.9-3.1L10.5-3.1L4.3 1.6L6.6 9L0 4.6L-6.6 9L-4.3 1.6L-10.5-3.1L-2.9-3.1Z" fill="#FFD25A" stroke="#7A5A00" stroke-width="1.2"/>`; }).join("");
  return `<svg viewBox="-6 -6 112 118" width="${size||56}" height="${(size||56)*1.05}" class="badge${glow?" glow":""}${rainbow?" rainbow":""}" aria-label="IELTS Band ${k}${stars?` +${stars}★`:""}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <path d="M30 70L22 104L38 96L46 108L50 78Z" fill="${c1}" opacity=".85"/><path d="M70 70L78 104L62 96L54 108L50 78Z" fill="${c1}" opacity=".85"/>
    <circle cx="50" cy="48" r="38" fill="url(#${id})" stroke="${c1}" stroke-width="4"/>
    <circle cx="50" cy="48" r="30" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="${b>=7?"4 3":"0"}"/>
    <text x="50" y="44" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" style="letter-spacing:.08em">BAND</text>
    <text x="50" y="66" text-anchor="middle" font-size="24" font-weight="900" fill="#fff" paint-order="stroke" stroke="${c1}" stroke-width="3">${k}</text>
    ${starEls}${stars>7?`<text x="96" y="12" font-size="12" font-weight="800" fill="#7A5A00">×${stars}</text>`:""}
  </svg>`;
}

async function cloudInit(){
  try{
    const [appM,authM,fsM]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)]);
    const app=appM.initializeApp(FB_CONFIG);
    const auth=authM.getAuth(app);
    const db=fsM.getFirestore(app);
    CLOUD.fb={authM,fsM,auth,db};
    setTimeout(()=>actPing(),2500);
    setTimeout(pushRefresh,1200);
    setTimeout(supLoad,0);

      if(u){ await cloudPull(); regionPing(false); nickVerify(); } else { CLOUD.status="idle"; render(); }

    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported"){ try{ await authM.signInWithRedirect(auth,p); return; }catch(_){} }
    toast(T("loginFail"));
  }
}

async function nickClaim(n){
  if(CLOUD.fb&&!CLOUD.user) return toast(T("nickLogin"));
  if(DEV){ game().nick=n; saveGame(); toast(T("nickSaved")); return render(); }
  if(CLOUD.fb&&CLOUD.user){
    const {fsM,db}=CLOUD.fb, me=CLOUD.user.uid, old=game().nick, ref=fsM.doc(db,"nicks",nickKey(n));
    try{
      await fsM.runTransaction(db, async tx=>{ const d=await tx.get(ref); if(d.exists()&&d.data().uid!==me) throw {code:"taken"}; tx.set(ref,{uid:me, n, at:Date.now()}); });
      if(old&&nickKey(old)!==nickKey(n)){ const oref=fsM.doc(db,"nicks",nickKey(old)); try{ const od=await fsM.getDoc(oref); if(od.exists()&&od.data().uid===me) await fsM.deleteDoc(oref); }catch(e){} }
    }catch(e){ return toast(e&&e.code==="taken"?T("nickTaken"):T("syncFail")); }
  }

/* Word sync reads only what changed: every word doc carries _u (time written); deleted words leave a
   tombstone {_del:1,_u}. A full read happens on the first sync on a device and then once a week. */
const WSYNC_KEY="che-pro-wsync", DIRTY_KEY="che-pro-dirty", WSYNC_FULL=7*864e5, WSYNC_MARGIN=15*60e3;
function wsyncGet(){ try{ const v=JSON.parse(localStorage.getItem(WSYNC_KEY)||"null"); return v&&CLOUD.user&&v.uid===CLOUD.user.uid?v:null; }catch(e){ return null; } }
function wsyncSet(o){ try{ localStorage.setItem(WSYNC_KEY,JSON.stringify({uid:CLOUD.user.uid,...o})); }catch(e){} }
function dirtySave(){ if(!CLOUD.user) return; try{ localStorage.setItem(DIRTY_KEY,JSON.stringify({uid:CLOUD.user.uid,w:[...CLOUD.dirtyWords],d:[...CLOUD.delWords]})); }catch(e){} }
function dirtyLoad(){ try{ const v=JSON.parse(localStorage.getItem(DIRTY_KEY)||"null"); if(v&&v.uid===CLOUD.user.uid){ (v.w||[]).forEach(k=>CLOUD.dirtyWords.add(k)); (v.d||[]).forEach(k=>CLOUD.delWords.add(k)); } }catch(e){} }
async function cloudPull(){
  const {fsM}=CLOUD.fb; CLOUD.status="syncing"; render();
  try{
    // each Google account has its own progress: never mix another account's (or a guest's) data into an existing account
    let owner=null; try{ owner=localStorage.getItem(OWNER_KEY); }catch(e){}
    const info=wsyncGet(), started=Date.now();
    const delta=!!(info&&owner===CLOUD.user.uid&&started-(info.full||0)<WSYNC_FULL);
    const wq=delta?fsM.query(wordsCol(), fsM.where("_u",">",(info.at||0)-WSYNC_MARGIN)):wordsCol();
    const [us,ws]=await Promise.all([fsM.getDoc(userRef()), fsM.getDocs(wq)]);
    const cloud=us.exists()?us.data():{};
    const cw=new Map(), tomb=new Set(); ws.forEach(d=>{ const v=d.data(); if(v&&v._del) tomb.add(d.id); else if(v){ const {_u,...w}=v; cw.set(d.id,w); } });
    CLOUD.lastPull={delta, n:cw.size+tomb.size};
    const cloudHas=!!(cloud.game||cw.size||Object.keys(cloud.days||{}).length);
    if((owner&&owner!==CLOUD.user.uid)||(!owner&&cloudHas)) localReset();
    try{ localStorage.setItem(OWNER_KEY,CLOUD.user.uid); }catch(e){}
    const hadLocal=S.words.size>0||S.days.size>0||(S.game&&(S.game.lv>1||S.game.exp>0||S.game.gold>0));
    dirtyLoad();
    // words deleted on another device
    for(const k of tomb) if(!CLOUD.dirtyWords.has(k)) S.words.delete(k);
    // words: keep the more-practised copy of each word
    for(const [k,v] of cw){ const l=S.words.get(k); if(!l||wScore(v)>=wScore(l)) S.words.set(k,v); }
    if(delta){ for(const [k,v] of cw){ const l=S.words.get(k); if(l&&wScore(l)>wScore(v)) CLOUD.dirtyWords.add(k); } }
    else for(const [k,v] of S.words) if(!tomb.has(k)&&(!cw.has(k)||wScore(v)>wScore(cw.get(k)))) CLOUD.dirtyWords.add(k);
    for(const [k,v] of Object.entries(cloud.days||{})) S.days.set(k, mergeDay(S.days.get(k),v));
    S.game=mergeGame(S.game, cloud.game?{...G_DEFAULT,...cloud.game}:null) || S.game;
    CLOUD.dirtyMain=true; lsSave();
    await cloudFlush();
    wsyncSet({at:started, full:delta?info.full:started});
    if(hadLocal && !delta && (cw.size||cloud.game)) toast(T("merged"));
    CLOUD.status="ok";
  }catch(e){ CLOUD.status="err"; }
  render();
}
function cloudMark(id, deleted){ if(!CLOUD.user) return; if(id&&id.startsWith("w~")){ (deleted?CLOUD.delWords:CLOUD.dirtyWords).add(id); if(deleted) CLOUD.dirtyWords.delete(id); else CLOUD.delWords.delete(id); dirtySave(); } else { CLOUD.dirtyMain=true; if(CLOUD.dirtyWords.size) dirtySave(); }
  clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush,1500); }
async function cloudFlush(){
  if(!CLOUD.user||!CLOUD.fb||CLOUD.deleting) return; clearTimeout(CLOUD.timer);
  const {fsM,db}=CLOUD.fb; const words=[...CLOUD.dirtyWords], dels=[...CLOUD.delWords], main=CLOUD.dirtyMain;
  if(!words.length&&!dels.length&&!main) return;
  CLOUD.dirtyWords.clear(); CLOUD.delWords.clear(); CLOUD.dirtyMain=false; dirtySave();
  try{
    const ops=[];
    if(main&&!DEV) setTimeout(lbPush,0);
    if(main) ops.push(b=>b.set(userRef(),{name:(CLOUD.user&&CLOUD.user.displayName)||"", region:regionKey(), game:(DEV?DEV.game:S.game)||null, days:Object.fromEntries(S.days), updatedAt:new Date().toISOString(), v:1}));
    const now=Date.now();
    for(const k of words){ const v=S.words.get(k); if(v) ops.push(b=>b.set(fsM.doc(wordsCol(),k), {...JSON.parse(JSON.stringify(v)), _u:now})); }
    for(const k of dels) ops.push(b=>b.set(fsM.doc(wordsCol(),k), {_del:1, _u:now}));
    for(let i=0;i<ops.length;i+=400){ const b=fsM.writeBatch(db); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); }
    if(CLOUD.status!=="ok"){ CLOUD.status="ok"; render(); }
  }catch(e){
    words.forEach(k=>CLOUD.dirtyWords.add(k)); dels.forEach(k=>CLOUD.delWords.add(k)); if(main) CLOUD.dirtyMain=true; dirtySave();
    if(CLOUD.status!=="err"){ CLOUD.status="err"; toast(T("syncFail")); render(); }
    clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush,30000);
  }
}

    ${f==="power"?`<p class="muted sm-t">${T("rkPowerNote")}</p>`:""}`;
}

/* ----- error passages ----- */
const CONF={affect:"effect",effect:"affect",their:"there",there:"their",than:"then",then:"than",lose:"loose",advice:"advise",advise:"advice",accept:"except",quite:"quiet",were:"where",where:"were",whose:"who's",rise:"raise",raise:"rise",its:"it's",economic:"economical",principal:"principle",too:"to",lead:"led",past:"passed",passed:"past",weather:"whether",whether:"weather",cite:"site",site:"sight",fewer:"less",among:"between"};
function rng(seed){ let x=seed>>>0||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%100000)/100000; }; }
function misspell(w, r){
  const lw=w.toLowerCase();
  const m=lw.match(/([a-z])\1/); if(m && r()<0.8) return w.slice(0,m.index)+w.slice(m.index+1);
  if(/ie/.test(lw) && !/cie/.test(lw)) return w.replace(/ie/,"ei");
  if(/ei/.test(lw)) return w.replace(/ei/,"ie");
  if(/ence$/.test(lw)) return w.replace(/ence$/,"ance"); if(/ance$/.test(lw)) return w.replace(/ance$/,"ence");
  if(/ible$/.test(lw)) return w.replace(/ible$/,"able"); if(/able$/.test(lw)&&lw.length>7) return w.replace(/able$/,"ible");
  const i=2+Math.floor(r()*(w.length-4)); return w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2);
}
function keepCase(src,w){ return src[0]===src[0].toUpperCase()?w[0].toUpperCase()+w.slice(1):w; }
function makeErrorPassage(art, seed, n=8){
  const r=rng(seed); const paras=parasOf(art).slice(0,4); const gl=art.gloss||{};
  const forms={}; for(const [k,g] of Object.entries(gl)){ if(!g.base||g.lvl==="PN") continue; (forms[g.base.toLowerCase()]=forms[g.base.toLowerCase()]||new Set()).add(k); }
  let idx=0; const toks=[]; const parts=paras.map(p=>p.split(/([A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*)/).map((t,i)=>{ if(i%2){ toks.push({t, i:idx}); return {w:t, i:idx++}; } return {s:t}; }));
  const cands=[];
  for(const {t,i} of toks){
    const k=t.toLowerCase(), g=gl[k]; if(!g||g.lvl==="PN"||i===0) continue;
    if(CONF[k]) cands.push({i,type:"conf",wrong:keepCase(t,CONF[k]),right:t,g,pri:3});
    const fs=forms[(g.base||"").toLowerCase()];
    if(fs&&fs.size>1&&k.length>=4){ const alt=[...fs].filter(x=>x!==k&&x.slice(0,3)===k.slice(0,3)); if(alt.length) cands.push({i,type:"form",wrong:keepCase(t,alt[Math.floor(r()*alt.length)]),right:t,g,pri:2}); }
    if(k.length>=6 && !/['’-]/.test(k)){ const w=misspell(t,r); if(w.toLowerCase()!==k && !gl[w.toLowerCase()]) cands.push({i,type:"spell",wrong:w,right:t,g,pri:1}); }
  }
  // spread: shuffle, then prefer variety, keep 3+ tokens apart
  const order=cands.map(c=>({c,k:r()+c.pri*0.15})).sort((a,b)=>b.k-a.k).map(o=>o.c);
  const picked=[], used=new Set(), cnt={conf:0,form:0,spell:0};
  for(const c of order){ if(picked.length>=n) break; if([...used].some(u=>Math.abs(u-c.i)<4)) continue; if(cnt[c.type]>=Math.ceil(n*0.5)) continue; picked.push(c); used.add(c.i); cnt[c.type]++; }
  picked.sort((a,b)=>a.i-b.i);
  const byI=Object.fromEntries(picked.map(c=>[c.i,c]));
  const text=parts.map(pp=>pp.map(x=>x.s!==undefined?x.s:(byI[x.i]?byI[x.i].wrong:x.w)).join(""));
  const errs=picked.map(c=>({i:c.i, type:c.type, wrong:c.wrong, right:c.right, pos:c.g.pos||"", m:{zh:c.g.zh,en:c.g.en||"",hi:c.g.hi||"",es:c.g.es||"",ja:c.g.ja||"",ko:c.g.ko||""}}));
  return {text, errs, title:art.title, artId:art.id};
}
function errExplain(e){ const m=(e.m&&(e.m[LANG]||e.m.en))||""; return e.type==="spell"?T("coExpSpell",{r:`<b>${esc(e.right)}</b>`}):e.type==="form"?T("coExpForm",{r:`<b>${esc(e.right)}</b>`,p:esc(e.pos),w:esc(e.wrong),m:esc(m)}):T("coExpConf",{w:esc(e.wrong),r:`<b>${esc(e.right)}</b>`,m:esc(m)}); }

/* ----- co-op state ----- */
const CO_TIME=180, CO_MISSES=5;
const coMe=()=>CLOUD.user?CLOUD.user.uid:"solo";
function coRoom(){ return S.co&&S.co.room; }
function coSpendTicket(){ const g=game(); if(g.tickets<1){ toast(T("noTicket")); return false; } g.tickets--; saveGame(); return true; }
function coNewPassage(){ const art=mainArticle(); if(!art){ toast(T("coNoArt")); return null; } const pool=S.articles.filter(a=>a.date===art.date); const pick=pool[Math.floor(Math.random()*pool.length)]||art; return makeErrorPassage(pick, Math.floor(Math.random()*1e9)); }
function coStartSolo(){
  const p=coNewPassage(); if(!p) return; if(!coSpendTicket()) return;
  S.co={solo:true, room:{state:"play", host:"solo", names:{solo:game().nick||T("coOwn")}, ...p, found:{}, misses:{}, endAt:Date.now()+CO_TIME*1000}};
  coTick(); render();
}
async function coCreate(){
  if(!CLOUD.user) return; const p=coNewPassage(); if(!p) return;
  const {fsM,db}=CLOUD.fb; S.co={busy:T("coOpening")}; render();
  try{
    let code, ref;
    for(let k=0;k<6;k++){ code=String(1000+Math.floor(Math.random()*9000)); ref=fsM.doc(db,"rooms",code); const s=await fsM.getDoc(ref); if(!s.exists()||s.data().state==="done"||Date.now()-(s.data().created||0)>3600e3) break; }
    if(!coSpendTicket()){ S.co=null; render(); return; }
    await fsM.setDoc(ref,{host:CLOUD.user.uid, guest:null, names:{[CLOUD.user.uid]:game().nick||CLOUD.user.displayName||"P1"}, state:"wait", created:Date.now(), ...p, found:{}, misses:{}, endAt:0, lang:LANG});
    coListen(code);
  }catch(e){ S.co=null; toast(T("syncFail")); render(); }
}
async function coJoin(code){
  if(!CLOUD.user) return; code=(code||"").trim(); if(!/^\d{4}$/.test(code)){ toast(T("coNoRoom")); return; }
  const {fsM,db}=CLOUD.fb; const ref=fsM.doc(db,"rooms",code); S.co={busy:T("coJoining")}; render();
  try{
    const s=await fsM.getDoc(ref);
    if(!s.exists()||s.data().state==="done"){ S.co=null; toast(T("coNoRoom")); render(); return; }
    const d=s.data();
    if(d.host!==CLOUD.user.uid && d.guest && d.guest!==CLOUD.user.uid){ S.co=null; toast(T("coFull")); render(); return; }
    if(d.host!==CLOUD.user.uid && !d.guest){
      if(game().tickets<1){ S.co=null; toast(T("noTicket")); render(); return; }
      await fsM.updateDoc(ref,{guest:CLOUD.user.uid, ["names."+CLOUD.user.uid]:game().nick||CLOUD.user.displayName||"P2", state:"play", endAt:Date.now()+CO_TIME*1000+3000});
      coSpendTicket();
    }
    coListen(code);
  }catch(e){ S.co=null; toast(e&&e.code==="permission-denied"?T("coFull"):T("syncFail")); render(); }
}
function coListen(code){
  const {fsM,db}=CLOUD.fb; coStop();
  S.co={code, room:null};
  S.co.unsub=fsM.onSnapshot(fsM.doc(db,"rooms",code), snap=>{
    if(!S.co||S.co.code!==code) return;
    if(!snap.exists()){ coStop(); S.co=null; toast(T("coLeftRoom")); render(); return; }
    S.co.room=snap.data(); coCheckEnd(); coTick(); if(S.view==="play"&&S.playMode==="coop") coRender();
  }, ()=>{});
}
function coStop(){ if(S.co&&S.co.unsub){ S.co.unsub(); } clearInterval(S.coTimer); }
function coTick(){ clearInterval(S.coTimer); S.coTimer=setInterval(()=>{ const R=coRoom(); if(!R||R.state!=="play"){ clearInterval(S.coTimer); return; } coCheckEnd(); const el=document.getElementById("coClock"); if(el) el.textContent=T("coTime",{s:Math.max(0,Math.ceil((R.endAt-Date.now())/1000))}); },500); }
function coMissTotal(R){ return Object.values(R.misses||{}).reduce((a,b)=>a+b,0); }
function coCheckEnd(){
  const R=coRoom(); if(!R||R.state!=="play") { if(R&&R.state==="done") coReward(); return; }
  const all=Object.keys(R.found||{}).length>=R.errs.length, dead=coMissTotal(R)>=CO_MISSES, late=R.endAt&&Date.now()>R.endAt;
  if(all||dead||late){
    const win=all; R.state="done"; R.win=win;
    if(!S.co.solo){ const {fsM,db}=CLOUD.fb; fsM.updateDoc(fsM.doc(db,"rooms",S.co.code),{state:"done", win}).catch(()=>{}); }
    coReward(); coRender();
  }
}
function coReward(){
  const R=coRoom(); const key=(S.co.solo?"solo-":"")+(S.co.code||"")+"-"+(R.created||R.endAt);
  const g=game(); g.coopDone=g.coopDone||{}; if(g.coopDone[key]) return;
  const mine=Object.values(R.found||{}).filter(u=>u===coMe()).length;
  const win=R.win!==undefined?R.win:Object.keys(R.found||{}).length>=R.errs.length;
  const gold=mine*8+(win?(S.co.solo?15:30):0), exp=6+mine*5+(win?(S.co.solo?8:20):0);
  trackPlay(S.co.solo?"coopSolo":"coop");
  const lotto=win&&!S.co.solo?2:0, pass=win&&!S.co.solo?1:0; g.lotto=(g.lotto||0)+lotto; g.tickets+=pass;
  g.gold+=gold; g.exp+=exp; const before=g.lv; while(g.exp>=expNeed(g.lv)){ g.exp-=expNeed(g.lv); g.lv++; }
  g.coopDone[key]=1; const ks=Object.keys(g.coopDone); if(ks.length>40) delete g.coopDone[ks[0]];
  S.co.reward={gold, exp, lotto, pass, lvUp:g.lv-before}; saveGame();
}
async function coTap(i){
  const R=coRoom(); if(!R||R.state!=="play") return;
  if(R.found&&R.found[i]!==undefined) return;
  const isErr=R.errs.some(e=>e.i===i);
  if(S.co.solo){ if(isErr){ R.found[i]="solo"; } else { R.misses.solo=(R.misses.solo||0)+1; S.co.flash=i; } coCheckEnd(); coRender(); return; }
  const {fsM,db}=CLOUD.fb; const ref=fsM.doc(db,"rooms",S.co.code);
  if(isErr){
    R.found={...(R.found||{}),[i]:coMe()}; coRender();
    try{ await fsM.runTransaction(db, async tx=>{ const s=await tx.get(ref); const f=(s.data().found)||{}; if(f[i]===undefined) tx.update(ref,{["found."+i]:coMe()}); }); }catch(e){}
  } else {
    S.co.flash=i; toast(T("coWrongTap")); coRender();
    fsM.updateDoc(ref,{["misses."+coMe()]:fsM.increment(1)}).catch(()=>{});
  }
}
async function coLeave(){
  const co=S.co; coStop(); S.co=null;
  if(co&&!co.solo&&co.code&&co.room&&co.room.state==="wait"&&co.room.host===coMe()){ const {fsM,db}=CLOUD.fb; fsM.deleteDoc(fsM.doc(db,"rooms",co.code)).catch(()=>{}); game().tickets++; saveGame(); }
  render();
}
function coRender(){ if(S.view==="play"&&S.playMode==="coop"){ const el=document.getElementById("coBox"); if(el) el.innerHTML=coInner(); else render(); } }
function bar(cur,max,cls,label){ return `<div class="co-bar ${cls}"><span>${label}</span><div class="hp ${cls==="boss"?"m":"p"}"><i style="width:${Math.max(0,cur/max*100)}%"></i><span>${cur} / ${max}</span></div></div>`; }
function coInner(){
  const co=S.co;
  if(co&&co.busy) return `<p class="muted">${co.busy}</p>`;
  if(!co){
    const login=CLOUD.user?"":`<p class="muted sm-t">${T("coNeedLogin")}</p>${accountCard(true)}`;
    return `<div class="card co-hero"><div class="co-art">${coBossSvg()}</div><div><h3>${T("coTitle")}</h3><p class="muted" style="margin:4px 0 0">${T("coSub")}</p></div></div>
      ${login}
      ${CLOUD.user?`<button class="btn" data-act="cocreate">${T("coCreate")}</button>
      <div class="row" style="flex-wrap:nowrap"><input id="coCode" class="search" inputmode="numeric" maxlength="4" placeholder="${T("coCodePh")}" autocomplete="off"><button class="btn ghost" data-act="cojoin" style="flex:none">${T("coJoin")}</button></div>`:""}
      <div class="card"><b>${T("coSolo")}</b><p class="muted sm-t" style="margin:4px 0 8px">${T("coSoloSub")}</p><button class="btn ghost" data-act="cosolo">${T("coSolo")}</button></div>`;
  }
  const R=co.room; if(!R) return `<p class="muted">${T("loading")}</p>`;
  if(R.state==="wait") return `<div class="card co-wait"><div class="muted">${T("coShare")}</div><div class="co-code">${esc(co.code)}</div><div class="muted">${T("coWaiting")}</div><button class="btn ghost" data-act="coleave">${T("coCancel")}</button></div>`;
  const names=R.names||{}; const nm=u=>u===coMe()?T("coOwn"):esc(names[u]||"?");
  const found=R.found||{}, nf=Object.keys(found).length, total=R.errs.length, miss=coMissTotal(R);
  const errAt=Object.fromEntries(R.errs.map(e=>[e.i,e]));
  let idx=0;
  const body=R.text.map(p=>"<p>"+p.split(/([A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*)/).map((t,j)=>{ if(j%2===0) return esc(t); const i=idx++;
    if(found[i]!==undefined){ const e=errAt[i]; return `<span class="cw fixed ${found[i]===coMe()?"mine":"mate"}"><s>${esc(t)}</s> <ins>${esc(e?e.right:t)}</ins></span>`; }
    if(R.state==="done"&&errAt[i]) return `<span class="cw missed"><s>${esc(t)}</s> <ins>${esc(errAt[i].right)}</ins></span>`;
    return `<span class="cw${co.flash===i?" bad":""}" data-co="${i}">${esc(t)}</span>`; }).join("")+"</p>").join("");
  co.flash=null;
  const head=`<div class="co-top">${bar(total-nf,total,"boss",T("coBoss"))}${bar(CO_MISSES-miss,CO_MISSES,"team",T("coTeam"))}
    <div class="row" style="justify-content:space-between"><span class="muted sm-t">${co.solo?esc(T("coSolo")):T("coPlayers",{a:nm(R.host),b:nm(R.guest)})}</span>${R.state==="play"?`<b id="coClock" class="sm-t">${T("coTime",{s:Math.max(0,Math.ceil((R.endAt-Date.now())/1000))})}</b>`:""}</div></div>`;
  if(R.state==="done"){
    const mine=Object.values(found).filter(u=>u===coMe()).length, mate=nf-mine, win=R.win!==undefined?R.win:nf>=total;

async function pgJoin(code){

/* ----- game 1: word race (multiplayer Wordle) ----- */
const WD={rounds:5, len:5, tries:6, sec:150, gap:6000};
const WD_KB=["qwertyuiop","asdfghjkl","+zxcvbnm-"];
function spRound(P){ return Object.keys(P.rounds||{}).length; }
function spStartOf(P,i){ return i===0?P.start:((P.rounds[i-1]||{}).at||P.start)+WD.gap; }
function wdMine(i){ const pg=S.pg; pg.wd=pg.wd||{}; if(!pg.wd[i]){ const prev=(((pg.ps[pgMe()]||{}).wd)||{})[i]; pg.wd[i]=prev?{g:[...(prev.g||[])],done:prev.done||null,t:prev.t||0}:{g:[],done:null,t:0}; } return pg.wd[i]; }
function wdRec(u,i){ return u===pgMe()?wdMine(i):((((S.pg.ps[u]||{}).wd)||{})[i]||{g:[]}); }
function wdColors(guess,ans){ const res=Array(guess.length).fill("b"), cnt={}; for(let k=0;k<ans.length;k++){ if(guess[k]===ans[k]) res[k]="g"; else cnt[ans[k]]=(cnt[ans[k]]||0)+1; } for(let k=0;k<guess.length;k++){ if(res[k]==="g") continue; if(cnt[guess[k]]){ res[k]="y"; cnt[guess[k]]--; } } return res; }
function wdFirstT(P,i){ let m=Infinity; for(const u in P.players){ const r=wdRec(u,i); if(r.done==="win"&&r.t<m) m=r.t; } return m; }
function wdScore(r,first){ if(!r||r.done!=="win") return 0; return 10+(WD.tries-r.g.length)*2+(r.t===first?5:0); }
function spScores(P){ const sc={}; for(const u in P.players){ sc[u]=0; for(let i=0;i<(P.words||[]).length;i++) sc[u]+=wdScore(wdRec(u,i),wdFirstT(P,i)); } return sc; }
function wdPush(i){ const pg=S.pg, r=wdMine(i); CLOUD.fb.fsM.updateDoc(pgRef(pg.code,"p",pgMe()),{n:pgName(), ["wd."+i]:{g:r.g, done:r.done, t:r.t}}).catch(()=>{}); }
function pgSpellTick(){
  const pg=S.pg, P=pg.party, i=spRound(P), n=(P.words||[]).length||WD.rounds;
  if(i>=n) return pgEndGame();
  const st=spStartOf(P,i), dl=st+WD.sec*1000, now=Date.now(); if(now<st) return;
  if(pg.curFor!==i){ pg.curFor=i; pg.cur=""; }
  const me=wdMine(i); if(!me.done&&now>dl){ me.done="lose"; wdPush(i); }
  const allDone=Object.keys(P.players).every(u=>wdRec(u,i).done);
  if((allDone||now>dl+800)&&pg.closeFor!==i){ pg.closeFor=i; const {fsM,db}=CLOUD.fb, ref=pgRef(pg.code);
    setTimeout(()=>fsM.runTransaction(db, async tx=>{ const r=((await tx.get(ref)).data().rounds)||{}; if(!r[i]&&Object.keys(r).length===i) tx.update(ref,{["rounds."+i]:{at:Date.now()}}); }).catch(()=>{ pg.closeFor=null; }), allDone?900:0); }
}
function wdKey(k){
  const pg=S.pg; if(!pg||!pg.party||pg.party.state!=="play"||pg.party.game!=="spell") return false;
  const P=pg.party, i=spRound(P); if(i>=(P.words||[]).length||Date.now()<spStartOf(P,i)) return true;
  const me=wdMine(i); if(me.done) return true;
  if(pg.curFor!==i){ pg.curFor=i; pg.cur=""; }
  if(k==="enter") wdSubmit(); else if(k==="back") pg.cur=(pg.cur||"").slice(0,-1); else if(/^[a-z]$/.test(k)&&(pg.cur||"").length<WD.len) pg.cur=(pg.cur||"")+k;
  pgRender(); return true;
}
function wdSubmit(){
  const pg=S.pg, P=pg.party, i=spRound(P), W=P.words[i], me=wdMine(i), g=pg.cur||"";
  if(g.length<WD.len){ pg.shake=Date.now(); return toast(T("wdShort",{n:WD.len})); }
  if(!PG_WORDS||!PG_WORDS.size){ pgLoadWords(); return toast(T("loading")); }
  if(g!==W.w&&!PG_WORDS.has(g)){ pg.shake=Date.now(); return toast(T("pgInvalid")); }
  me.g.push(g); pg.cur=""; pg.flip={i, row:me.g.length-1, at:Date.now()};
  if(g===W.w){ me.done="win"; me.t=Date.now()-spStartOf(P,i); toast(T("wdWin",{n:me.g.length})); }
  else if(me.g.length>=WD.tries){ me.done="lose"; toast(T("wdLose",{w:W.w.toUpperCase()})); }
  wdPush(i);
}
function wdGrid(r,ans,opt){ opt=opt||{}; const rows=[];
  for(let k=0;k<WD.tries;k++){ const g=r.g[k];
    if(g){ const c=wdColors(g,ans), flip=opt.flip&&opt.flip===k; rows.push(`<div class="wd-row">${[...g].map((ch,j)=>`<span class="wd-c ${c[j]}${flip?" flip":""}" style="${flip?`animation-delay:${j*0.12}s`:""}">${opt.mini?"":esc(ch.toUpperCase())}</span>`).join("")}</div>`); }
    else if(!opt.mini&&k===r.g.length&&!r.done){ const cur=opt.cur||""; rows.push(`<div class="wd-row cur${opt.shake?" shake":""}">${Array.from({length:WD.len},(_,j)=>`<span class="wd-c${cur[j]?" typed":""}">${cur[j]?esc(cur[j].toUpperCase()):""}</span>`).join("")}</div>`); }
    else rows.push(`<div class="wd-row">${Array.from({length:WD.len},()=>`<span class="wd-c"></span>`).join("")}</div>`); }
  return `<div class="wd-grid${opt.mini?" mini":""}">${rows.join("")}</div>`; }
function wdKeyboard(r,ans){ const best={}; const rank={g:3,y:2,b:1};
  for(const g of r.g){ const c=wdColors(g,ans); [...g].forEach((ch,j)=>{ if((rank[c[j]]||0)>(rank[best[ch]]||0)) best[ch]=c[j]; }); }
  return `<div class="wd-kb">${WD_KB.map(row=>`<div class="wd-kr">${[...row].map(ch=>ch==="+"?`<button class="wd-k wide" data-act="pgkey" data-k="enter">${T("wdEnter")}</button>`:ch==="-"?`<button class="wd-k wide" data-act="pgkey" data-k="back" aria-label="back">⌫</button>`:`<button class="wd-k ${best[ch]||""}" data-act="pgkey" data-k="${ch}">${ch.toUpperCase()}</button>`).join("")}</div>`).join("")}</div>`; }
function wdEmoji(r,ans){ return r.g.map(g=>wdColors(g,ans).map(c=>c==="g"?"🟩":c==="y"?"🟨":"⬜").join("")).join("<br>"); }
function spMeaning(W){ return esc((W.m&&(W.m[LANG]||W.m.en))||""); }
function spSections(){
  const pg=S.pg, P=pg.party, i=spRound(P), now=Date.now(), sc=spScores(P), n=(P.words||[]).length;
  const board=Object.keys(P.players).sort((a,b)=>(sc[b]||0)-(sc[a]||0)).map(u=>`<div class="pg-chip${u===pgMe()?" me":""}"><b>${esc(pgNm(u))}</b><span>${sc[u]||0}</span></div>`).join("");
  if(i>=n) return [["pgBoard",`<div class="pg-board">${board}</div>`],["pgStage",`<p class="muted">${T("loading")}</p>`]];
  const st=spStartOf(P,i), W=P.words[i];
  if(now<st){
    const pw=i>0?P.words[i-1]:null;
    const recap=pw?`<div class="eyebrow">${T("wdAnswer")}</div><div class="wd-ans">${esc(pw.w.toUpperCase())}</div><p class="sp-mean"><span class="chip">${esc(pw.pos||"")}</span> ${spMeaning(pw)}</p>
      <div class="wd-others">${Object.keys(P.players).map(u=>{ const r=wdRec(u,i-1); return `<div class="wd-op"><b>${esc(pgNm(u))}</b>${wdGrid(r,pw.w,{mini:1})}<small>${r.done==="win"?`✅ ${r.g.length}/${WD.tries}`:`❌`}</small></div>`; }).join("")}</div>`:`<div class="eyebrow">${T("pgGetReady")}</div>`;
    return [["pgBoard",`<div class="pg-board">${board}</div>`],["pgStage",`<div class="sp-wait">${recap}<div class="sp-count">${Math.ceil((st-now)/1000)}</div><p class="muted sm-t">${T("pgRound",{i:i+1,n})}</p></div>`]];
  }
  const me=wdMine(i), left=Math.max(0,Math.ceil((st+WD.sec*1000-now)/1000)), shake=pg.shake&&now-pg.shake<500, flip=pg.flip&&pg.flip.i===i&&now-pg.flip.at<1200?pg.flip.row:-1;
  const head=`<div class="row" style="justify-content:space-between"><span class="eyebrow">${T("pgRound",{i:i+1,n})}</span><b class="sm-t ${left<=20?"bad-t":""}">${T("pgLeft",{s:left})}</b></div>
    <p class="sp-mean"><span class="chip">${esc(W.pos||"")}</span> ${me.done?spMeaning(W):`<span class="muted">${T("wdHint")}</span> ${left<=WD.sec/2||me.g.length>=3?spMeaning(W):"🔒"}`}</p>`;
  const others=`<div class="wd-others">${Object.keys(P.players).filter(u=>u!==pgMe()).map(u=>{ const r=wdRec(u,i); return `<div class="wd-op"><b>${esc(pgNm(u))}</b>${wdGrid(r,W.w,{mini:1})}<small>${r.done==="win"?"✅":r.done?"❌":"⏳ "+(r.g||[]).length+"/"+WD.tries}</small></div>`; }).join("")}</div>`;
  const status=me.done?`<p class="wd-status ${me.done}">${me.done==="win"?T("wdWin",{n:me.g.length}):T("wdLose",{w:esc(W.w.toUpperCase())})} · ${T("wdWaitOthers")}</p>`:"";
  return [["pgBoard",`<div class="pg-board">${board}</div>`],["pgHead2",head],["pgOthers",others],
    ["pgGrid",wdGrid(me,W.w,{cur:pg.curFor===i?pg.cur:"", shake, flip})+status],
    ["pgKb",me.done?"":wdKeyboard(me,W.w)]];
}

/* ----- game 2: letter rain ----- */
function dpOut(p,now){ return !!(p&&(p.out||(p.last&&now>p.last+PG.life*1000+1500))); }
function pgDropTick(){
  const pg=S.pg, P=pg.party, now=Date.now(); if(now<P.start) return;
  if(!pg.L){ const hand=[]; const prev=pg.ps[pgMe()];

/* ----- game 3: word bomb (BombParty style) ----- */
const BM={lives:3, maxLives:4, intro:2500, fuse:15000, step:1000, min:4000, cap:15000, abc:"abcdefghilmnoprstuvwy"};
/* tiny sound effects (WebAudio, unlocked on the first tap) */
function sfxUnlock(){ try{ if(!S.ac){ const C=window.AudioContext||window.webkitAudioContext; if(C) S.ac=new C(); } if(S.ac&&S.ac.state==="suspended") S.ac.resume(); }catch(e){} }
function sfx(freq,dur,type,vol,slide){ const ac=S.ac; if(!ac||ac.state!=="running") return; try{ const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime; o.type=type||"square"; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(vol||0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02); }catch(e){} }
let PG_SYL=null;
async function pgLoadSyl(){ if(PG_SYL) return PG_SYL; try{ PG_SYL=await (await fetch("games/syl.json")).json(); }catch(e){ PG_SYL={easy:["in","er","an","re","on","at","en","es"],mid:[],hard:[]}; } return PG_SYL; }
function bmPickSyl(k){ const L=PG_SYL||{easy:["in","er","an","re"]}, r=Math.random(); const tier=k<6?"easy":k<16?(r<0.6?"easy":"mid"):(r<0.3?"easy":r<0.7?"mid":"hard"); const a=(L[tier]&&L[tier].length?L[tier]:L.easy); return a[Math.floor(Math.random()*a.length)]; }
const bmFuse=()=>BM.fuse;

function bmNext(P,u){ const o=P.order||Object.keys(P.players), al=o.filter(x=>(P.lives||{})[x]>0&&x!==u); if(!al.length) return u; let i=o.indexOf(u); for(let k=1;k<=o.length;k++){ const x=o[(i+k)%o.length]; if(al.includes(x)) return x; } return al[0]; }

  return {order, lives, out:{}, used:{}, ty:{u:"",s:""}, last:null, boom:null, bomb:{h:order[0], syl:bmPickSyl(0), n:0, k:0, p:0, ts:now+BM.intro, end:now+BM.intro+bmFuse()}}; }
function bmTick(){
  const pg=S.pg, P=pg.party, B=P.bomb, now=Date.now(); if(!B) return;

function bmPushTy(){ const pg=S.pg; clearTimeout(pg.tyT); pg.tyT=setTimeout(()=>{ CLOUD.fb.fsM.updateDoc(pgRef(pg.code),{ty:{u:pgMe(), s:(pg.bcur||"").slice(0,20)}}).catch(()=>{}); },220); }

async function bmSubmit(){

let PG_QUIZ=null;
async function pgLoadQuiz(){ if(PG_QUIZ) return PG_QUIZ; try{ PG_QUIZ=(await (await fetch("games/quiz.json")).json()).q||[]; }catch(e){ PG_QUIZ=[]; } return PG_QUIZ; }
function qzMine(){ const pg=S.pg; if(!pg.Q){ const p=pg.ps[pgMe()]||{}; pg.Q={gold:p.gold||0, ok:p.ok||0, ng:p.ng||0, streak:0, best:p.best||0, inc:p.inc||0, mult:p.mult||0, shield:p.shield||0, frozen:0, frozenBy:"", miss:[...(p.miss||[])], seen:{}, q:null, fb:null, gifted:Object.fromEntries(Object.keys(p.gifts||{}).map(k=>[k,1])), sent:0}; } return pg.Q; }
function qzSave(){ const pg=S.pg, Q=qzMine(); clearTimeout(pg.qT); pg.qT=setTimeout(()=>CLOUD.fb.fsM.setDoc(pgRef(pg.code,"p",pgMe()),{n:pgName(), gold:Math.round(Q.gold), ok:Q.ok, ng:Q.ng, best:Q.best, inc:Q.inc, mult:Q.mult, shield:Q.shield, miss:Q.miss.slice(-40)},{merge:true}).catch(()=>{}),200); }
const qzMean=o=>o.m[PG_LI[LANG]]||o.m[5];
function qzNew(){
  const Q=qzMine(), all=PG_QUIZ||[]; if(all.length<8) return null;
  let o, tries=0; do{ o=all[Math.floor(Math.random()*all.length)]; tries++; }while(Q.seen[o.w]&&tries<40); Q.seen[o.w]=1;
  const same=all.filter(x=>x.w!==o.w&&x.p===o.p), pool=same.length>=6?same:all.filter(x=>x.w!==o.w);
  const pick3=(f)=>{ const out=[], used=new Set(); let g=0; while(out.length<3&&g<200){ const x=pool[Math.floor(Math.random()*pool.length)]; g++; const v=f(x); if(!v||used.has(v)||v===f(o)) continue; used.add(v); out.push(v); } return out; };
  const types=["m2w","w2m"]; if(o.s&&o.s.length) types.push("syn"); if(o.x) types.push("blank");
  const t=types[Math.floor(Math.random()*types.length)];
  let prompt, right, wrong;
  if(t==="m2w"){ prompt=`<span class="chip">${esc(o.p)}</span> ${esc(qzMean(o))}`; right=o.w; wrong=pick3(x=>x.w); }
  else if(t==="w2m"){ prompt=`<b class="qz-word">${esc(o.w)}</b> <span class="chip">${esc(o.p)}</span>`; right=qzMean(o); wrong=pick3(x=>qzMean(x)); }
  else if(t==="syn"){ prompt=`<b class="qz-word">${esc(o.w)}</b>`; right=o.s[0]; wrong=pick3(x=>(o.s.includes(x.w)?null:x.w)); }
  else { prompt=`<span class="qz-ex">${esc(o.x).replace(new RegExp("\\b"+o.w+"\\b","i"),"<b>_____</b>")}</span>`; right=o.w; wrong=pick3(x=>x.w); }
  const opts=pgShuffle([right,...wrong]);
  Q.q={o, t, prompt, opts, a:opts.indexOf(right)}; return Q.q;
}
const qzEarn=Q=>Math.round(QZ.inc[Q.inc]*QZ.mult[Q.mult]*(1+Math.min(Q.streak,5)*0.1));
function qzAnswer(i){
  const pg=S.pg, Q=qzMine(), now=Date.now(); if(!Q.q||Q.fb||now<Q.frozen||pg.party.state!=="play") return;
  const q=Q.q, ok=i===q.a;
  if(ok){ Q.streak++; Q.best=Math.max(Q.best,Q.streak); const g=qzEarn(Q); Q.gold+=g; Q.ok++; Q.fb={ok:true, i, g, at:now}; }
  else { Q.streak=0; const lose=Math.round(QZ.inc[Q.inc]/2); Q.gold=Math.max(0,Q.gold-lose); Q.ng++; if(!Q.miss.includes(q.o.w)) Q.miss.push(q.o.w); Q.fb={ok:false, i, g:-lose, at:now}; }
  qzSave(); pgRender();
  setTimeout(()=>{ if(S.pg!==pg) return; Q.fb=null; qzNew(); pgRender(); }, ok?650:1600);
}
function qzBuy(k){
  const Q=qzMine();
  const cost=k==="inc"?QZ.incCost[Q.inc+1]:k==="mult"?QZ.multCost[Q.mult+1]:k==="shield"?QZ.shield:null;
  if(cost==null) return toast(T("qzMax"));
  if(Q.gold<cost) return toast(T("qzNoMoney"));
  Q.gold-=cost; if(k==="inc") Q.inc++; else if(k==="mult") Q.mult++; else Q.shield++;
  toast(T("qzBought")); qzSave(); pgRender();
}
function qzAttack(kind,to){
  const pg=S.pg, Q=qzMine(), cost=kind==="freeze"?QZ.freeze:QZ.steal;
  if(Q.gold<cost) return toast(T("qzNoMoney"));
  Q.gold-=cost; qzSave(); const id=pgMe().slice(0,6)+"-q"+(++Q.sent)+"-"+Date.now();
  CLOUD.fb.fsM.updateDoc(pgRef(pg.code,"p",to),{["gifts."+id]:{k:kind, f:pgMe(), at:Date.now()}}).then(()=>toast(T("qzSentAtk",{n:pgNm(to)}))).catch(()=>toast(T("syncFail")));
  pg.qzPick=null; pg.qzShop=false; pgRender();
}
function qzGifts(){
  const pg=S.pg; if(!pg||!pg.party) return; const Q=qzMine(), gs=(pg.ps[pgMe()]||{}).gifts||{};
  for(const [id,g] of Object.entries(gs)){ if(Q.gifted[id]) continue; Q.gifted[id]=1;
    if(g.k==="loot"){ Q.gold+=g.amt||0; toast(T("qzLoot",{a:g.amt||0})); continue; }
    if(g.k!=="freeze"&&g.k!=="steal") continue;
    if(Q.shield>0){ Q.shield--; toast(T("qzBlocked",{n:pgNm(g.f)})); continue; }
    if(g.k==="freeze"){ Q.frozen=Date.now()+QZ.freezeMs; Q.frozenBy=g.f; toast(T("qzFrozen",{n:pgNm(g.f)})); }
    else { const amt=Math.floor(Q.gold*QZ.stealPct); Q.gold-=amt; toast(T("qzStolen",{n:pgNm(g.f),a:amt})); if(amt>0){ const lid=pgMe().slice(0,6)+"-l"+(++Q.sent)+"-"+Date.now(); CLOUD.fb.fsM.updateDoc(pgRef(pg.code,"p",g.f),{["gifts."+lid]:{k:"loot", f:pgMe(), amt, at:Date.now()}}).catch(()=>{}); } }
  }
  qzSave(); pgRender();
}
function qzTick(){ const pg=S.pg, P=pg.party, now=Date.now(); if(now<P.start) return; if(!PG_QUIZ){ pgLoadQuiz(); return; } const Q=qzMine(); if(!Q.q&&!Q.fb) qzNew(); if(now>P.start+QZ.sec*1000+500) pgEndGame(); }
function qzSections(){

  const board=`<div class="pg-board">${golds.map(x=>`<div class="pg-chip${x.u===pgMe()?" me":""}"><b>${esc(pgNm(x.u))}</b><span>🪙${x.g}</span></div>`).join("")}</div>`;
  const top=`<div class="row" style="justify-content:space-between;align-items:center"><span class="eyebrow">${T("pgTotal",{s:left})}</span><span class="qz-gold">🪙 ${Math.round(Q.gold)}</span></div>
    <div class="dp-life"><i style="width:${left/QZ.sec*100}%"></i></div>
    <div class="qz-stat sm-t"><span>+${qzEarn(Q)}/${T("qzPerQ")}</span><span>×${QZ.mult[Q.mult]}</span><span>🔥 ${Q.streak}</span>${Q.shield?`<span>🛡×${Q.shield}</span>`:""}<button class="btn sm qz-shopbtn" data-act="qzshop">🛒 ${T("qzShop")}</button></div>`;
  let main;
  if(pg.qzShop){
    const mates=Object.keys(P.players).filter(u=>u!==pgMe());
    const up=(k,lab,lv,costs,vals)=>{ const nx=costs[lv+1]; return `<div class="qz-item"><div><b>${lab}</b><div class="muted sm-t">${vals[lv]} ${nx!=null?`→ ${vals[lv+1]}`:""}</div></div>${nx!=null?`<button class="btn sm" data-act="qzbuy" data-k="${k}" ${Q.gold<nx?"disabled":""}>🪙${nx}</button>`:`<span class="chip done">${T("qzMax")}</span>`}</div>`; };
    const atk=(k,lab,c)=>`<div class="qz-item"><div><b>${lab}</b></div>${mates.length?`<button class="btn sm" data-act="qzpick" data-k="${k}" ${Q.gold<c?"disabled":""}>🪙${c}</button>`:`<span class="muted sm-t">–</span>`}</div>${pg.qzPick===k?`<div class="qz-targets">${mates.map(u=>`<button class="btn ghost sm" data-act="qzatk" data-k="${esc(u)}">${esc(pgNm(u))} 🪙${(pg.ps[u]||{}).gold||0}</button>`).join("")}</div>`:""}`;
    main=`<div class="qz-shop"><div class="row" style="justify-content:space-between"><b>🛒 ${T("qzShop")}</b><button class="btn ghost sm" data-act="qzshop">${T("qzClose")}</button></div>
      ${up("inc",T("qzUpInc"),Q.inc,QZ.incCost,QZ.inc.map(x=>"+"+x))}${up("mult",T("qzUpMult"),Q.mult,QZ.multCost,QZ.mult.map(x=>"×"+x))}
      <div class="qz-item"><div><b>${T("qzShield")}</b><div class="muted sm-t">🛡×${Q.shield}</div></div><button class="btn sm" data-act="qzbuy" data-k="shield" ${Q.gold<QZ.shield?"disabled":""}>🪙${QZ.shield}</button></div>
      ${atk("freeze",T("qzFreeze"),QZ.freeze)}${atk("steal",T("qzSteal"),QZ.steal)}</div>`;
  } else if(now<Q.frozen){
    main=`<div class="qz-frozen"><div class="qz-ice">❄️</div><b>${T("qzFrozen",{n:esc(pgNm(Q.frozenBy))})}</b><div class="sp-count">${Math.ceil((Q.frozen-now)/1000)}</div></div>`;
  } else if(Q.q){
    const q=Q.q, fb=Q.fb, title={m2w:T("qzQ1"),w2m:T("qzQ2"),syn:T("qzQ3"),blank:T("qzQ4")}[q.t];
    main=`<div class="qz-card${fb?(fb.ok?" ok":" ng"):""}"><div class="eyebrow">${title}</div><div class="qz-prompt">${q.prompt}</div>
      ${fb?`<div class="qz-fb ${fb.ok?"ok":"ng"}">${fb.ok?T("qzRight",{g:fb.g}):`${T("qzWrongA",{w:esc(q.opts[q.a])})} · <span class="sm-t">${esc(q.o.w)} = ${esc(qzMean(q.o))}</span>`}</div>`:""}</div>
      <div class="qz-opts">${q.opts.map((t,i)=>`<button class="qz-opt${fb?(i===q.a?" right":i===fb.i?" wrong":" dim"):""}" data-act="qzans" data-k="${i}" ${fb?"disabled":""}>${esc(t)}</button>`).join("")}</div>`;
  } else main=`<p class="muted">${T("loading")}</p>`;
  return [["pgBoard",board],["pgTop",top],["pgStage",main]];
}

/* ----- results ----- */
function pgRows(){
  const pg=S.pg, P=pg.party, ids=Object.keys(P.players);
  if(P.game==="spell"){ const sc=spScores(P), n=(P.words||[]).length||1;
    return ids.map(u=>{ let tries=0, hits=0; for(let i=0;i<n;i++){ const r=wdRec(u,i); tries+=(r.g||[]).length; if(r.done==="win") hits++; } return {u, score:sc[u]||0, tries, hits, misses:tries-hits, acc:Math.round(hits/n*100)}; }).sort((a,b)=>b.score-a.score||b.hits-a.hits||a.tries-b.tries); }
  if(P.game==="bomb") return ids.map(u=>{ const p=u===pgMe()&&pg.B?pg.B:(pg.ps[u]||{}), words=p.words||[], alive=((P.lives||{})[u]||0)>0; return {u, words, bad:p.bad||[], n:words.length, alive, lives:(P.lives||{})[u]||0, outAt:(P.out||{})[u]||0, longest:words.reduce((a,w)=>w.length>a.length?w:a,""), score:words.length*5+(alive?20:0)}; }).sort((a,b)=>(b.alive-a.alive)||(b.outAt-a.outAt)||(b.n-a.n));
  if(P.game==="quiz") return ids.map(u=>{ const p=u===pgMe()&&pg.Q?pg.Q:(pg.ps[u]||{}), gold=Math.round(p.gold||0), ok=p.ok||0, ng=p.ng||0; return {u, gold, ok, ng, best:p.best||0, acc:ok+ng?Math.round(ok/(ok+ng)*100):0, miss:p.miss||[], score:Math.min(120,Math.round(gold/25))}; }).sort((a,b)=>b.gold-a.gold||b.acc-a.acc);
  return ids.map(u=>{ const p=u===pgMe()&&pg.L?{words:pg.L.words,bad:pg.L.bad,pts:pg.L.pts,last:pg.L.last}:(pg.ps[u]||{}); return {u, words:p.words||[], bad:p.bad||[], score:p.pts||0, n:(p.words||[]).length}; }).sort((a,b)=>b.n-a.n||b.score-a.score);
}
function pgFinish(){
  const pg=S.pg; if(!pg||pg.rewarded) return; const P=pg.party; pg.rewarded=1;
  const g=game(); g.partyDone=g.partyDone||{}; const key=pg.code+"-"+P.created; if(g.partyDone[key]) return;
  trackPlay(P.game); if(Object.keys(P.players).length<2) { g.partyDone[key]=1; saveGame(); }
  const n=Object.keys(P.players).length; if(n<2){ pg.reward={none:true}; return; }
  const rows=pgRows(), rank=rows.findIndex(r=>r.u===pgMe()), r=rows[rank]||{score:0};
  const gold=10+Math.round(r.score/2)+([40,25,15][rank]||0), exp=12+Math.round(r.score/3)+(rank===0?20:0);
  g.gold+=gold; g.exp+=exp; const before=g.lv; while(g.exp>=expNeed(g.lv)){ g.exp-=expNeed(g.lv); g.lv++; }
  g.partyDone[key]=1; const ks=Object.keys(g.partyDone); if(ks.length>40) delete g.partyDone[ks[0]];
  pg.reward={gold, exp, lvUp:g.lv-before}; saveGame();
}
function pgConfetti(){ const cs=["#F0BE45","#E0457B","#2563C9","#2E8B57","#7B3FC4","#E3A16B"]; return `<div class="confetti" aria-hidden="true">${Array.from({length:36},(_,k)=>`<i style="left:${(k*37)%100}%;background:${cs[k%cs.length]};animation-delay:${(k%12)*0.18}s;animation-duration:${2.4+(k%5)*0.35}s"></i>`).join("")}</div>`; }
function pgPodium(rows){
  const gm=S.pg.party.game, lab=r=>gm==="spell"?T("pgPtsN",{n:r.score}):gm==="quiz"?"🪙 "+r.gold:gm==="bomb"?(r.alive?"🏆 "+T("bmSurvive"):T("pgWordsN",{n:r.n})):T("pgWordsN",{n:r.n});

  return `<div class="podium">${pgConfetti()}${slot(rows[1],2)}${slot(rows[0],1)}${slot(rows[2],3)}</div>`;
}

function pgSections(){
  if(S.pgBusy) return [["pgMain",`<p class="muted">${S.pgBusy}</p>`]];
  const pg=S.pg;
  if(!pg){
    const login=CLOUD.user?"":`<p class="muted sm-t">${T("pgNeedLogin")}</p>${accountCard(true)}`;
    const card=(k,ic)=>`<div class="card pg-game"><div class="pg-ic">${ic}</div><div style="flex:1"><b>${T({spell:"pgSpell",drop:"pgDrop",bomb:"bmName",quiz:"qzName"}[k])}</b><p class="muted sm-t" style="margin:4px 0 8px">${T({spell:"pgSpellSub",drop:"pgDropSub",bomb:"bmSub",quiz:"qzSub"}[k],{s:PG.life})}</p>${CLOUD.user?`<button class="btn sm" data-act="pgcreate" data-k="${k}">${T("pgCreate")}</button>`:""}</div></div>`;
    return [["pgMain",`<div class="card co-hero"><div><h3>${T("pgTitle")}</h3><p class="muted" style="margin:4px 0 0">${T("pgSub")}</p></div></div>${login}
      ${card("bomb","💣")}${card("quiz","🎯")}${card("spell","🟩")}${card("drop","🌧")}
      ${CLOUD.user?`<div class="row" style="flex-wrap:nowrap"><input id="pgCode" class="search" inputmode="numeric" maxlength="4" placeholder="${T("pgCodePh")}" autocomplete="off"><button class="btn ghost" data-act="pgjoin" style="flex:none">${T("pgJoin")}</button></div>`:""}`]];
  }
  const P=pg.party; if(!P) return [["pgMain",`<p class="muted">${T("loading")}</p>`]];
  const kind=T({spell:"pgSpell",drop:"pgDrop",bomb:"bmName",quiz:"qzName"}[P.game]||"pgDrop");
  if(P.state==="wait"){
    const ids=Object.keys(P.players||{}), host=P.host===pgMe();
    return [["pgMain",`<div class="card co-wait"><div class="eyebrow">${kind}</div><div class="muted">${T("coShare")}</div><div class="co-code">${esc(pg.code)}</div>
      <div class="pg-board">${ids.map(u=>`<div class="pg-chip${u===pgMe()?" me":""}"><b>${esc(pgNm(u))}</b>${supB(u,16)}${u===P.host?"<span>👑</span>":""}</div>`).join("")}</div>
      <div class="muted">${T("pgWaiting",{n:ids.length})}</div>
      ${host?`<button class="btn" data-act="pgstart">${ids.length<2?T("pgStartSolo"):T("pgStart")}</button>`:`<p class="muted sm-t">${T("pgHostStarts")}</p>`}
      <button class="btn ghost" data-act="pgleave">${T("pgLeave")}</button></div>`]];
  }
  if(P.state==="done") return [["pgMain",pgResults()]];
  const secs=({spell:spSections, drop:dpSections, bomb:bmSections, quiz:qzSections}[P.game]||dpSections)();
  return [["pgHead",`<div class="row" style="justify-content:space-between"><b>${kind}</b><button class="btn ghost sm" data-act="pgquit">${T("pgLeave")}</button></div>${S.pgQuitAsk?`<div class="ie-exitask"><b>${T("pgQuitQ")}</b><div class="row"><button class="btn danger sm" data-act="pgleave">${T("pgLeave")}</button><button class="btn ghost sm" data-act="pgquitno">${T("ieExitNo")}</button></div></div>`:""}`], ...secs];
}
function pgInner(){ return pgSections().map(([id,h])=>`<div id="${id}">${h}</div>`).join(""); }
const pgPlaying=()=>!!(S.pg&&S.pg.party&&S.pg.party.state==="play"&&S.view==="play"&&(S.playMode||"party")==="party");
function pgLockSync(){ const on=pgPlaying(); document.body.classList.toggle("pg-lock",on); const box=document.getElementById("pgBox"); if(box) box.classList.toggle("pg-full",on); if(on) window.scrollTo(0,0); }
function pgRender(force){
  if(!(S.view==="play"&&(S.playMode||"party")==="party")){ document.body.classList.remove("pg-lock"); return; }
  const box=document.getElementById("pgBox"); if(!box) return render();
  if(box.classList.contains("pg-full")!==pgPlaying()) pgLockSync();
  const secs=pgSections(), key=secs.map(s=>s[0]).join(",");
  if(force||box.dataset.k!==key){ box.innerHTML=secs.map(([id,h])=>`<div id="${id}">${h}</div>`).join(""); box.dataset.k=key; box._c={}; secs.forEach(([id,h])=>box._c[id]=h); return; }
  box._c=box._c||{};
  for(const [id,h] of secs){ if(box._c[id]===h) continue; const el=document.getElementById(id); if(el) el.innerHTML=h; box._c[id]=h; }
}
function pgAct(a,t){
  sfxUnlock();
  if(a==="pgcreate") return pgCreate(t.dataset.k);
  if(a==="pgjoin") return pgJoin(($("#pgCode")||{}).value);
  if(a==="pgstart") return pgStartGame();
  if(a==="pgleave"){ S.pgQuitAsk=false; return pgLeave(); }
  if(a==="pgquit"){ S.pgQuitAsk=true; return pgRender(); }
  if(a==="pgquitno"){ S.pgQuitAsk=false; return pgRender(); }
  if(a==="pgkey"){ if(!wdKey(t.dataset.k)) bmKey(t.dataset.k); return; }
  if(a==="qzans") return qzAnswer(+t.dataset.k);
  if(a==="qzshop"){ S.pg.qzShop=!S.pg.qzShop; S.pg.qzPick=null; return pgRender(); }
  if(a==="qzbuy") return qzBuy(t.dataset.k);
  if(a==="qzpick"){ S.pg.qzPick=S.pg.qzPick===t.dataset.k?null:t.dataset.k; return pgRender(); }
  if(a==="qzatk") return qzAttack(S.pg.qzPick,t.dataset.k);
  if(a==="pgwatch"){ if(S.pg) S.pg.watch=t.dataset.k; return pgRender(); }
  if(a==="pgkeep") return pgFallKeep();
  if(a==="pgpass") return pgFallPass(t.dataset.k);
  if(a==="pgpick") return pgPick(+t.dataset.k);
  if(a==="pgclear") return pgClearSel();
  if(a==="pgdiscard") return pgDiscard();
  if(a==="pgsubmit") return pgSubmitWord();
}

(()=>{ const TIP={"zh": ["📱", "加到主畫面（像 App 一樣使用）", "iPhone（Safari）：① 點右下角「⋯」三個點 ② 點「分享」③ 往下滑，點「加入主畫面」④ 右上角按「加入」。之後從主畫面的圖示打開就像一般 App。Android（Chrome）：點右上角「⋮」→「加入主畫面」或「安裝應用程式」。"], "en": ["📱", "Add it to your home screen (use it like an app)", "iPhone (Safari): ① tap the three dots “⋯” at the bottom right ② tap Share ③ scroll down and tap Add to Home Screen ④ tap Add at the top right. Then open it from the icon like any app. Android (Chrome): tap “⋮” at the top right → Add to Home screen or Install app."], "hi": ["📱", "होम स्क्रीन पर जोड़ें (ऐप की तरह इस्तेमाल करें)", "iPhone (Safari): ① नीचे दाईं ओर तीन बिंदु “⋯” दबाएँ ② Share दबाएँ ③ नीचे स्क्रॉल करके Add to Home Screen दबाएँ ④ ऊपर दाईं ओर Add दबाएँ। Android (Chrome): ऊपर दाईं ओर “⋮” → Add to Home screen या Install app।"], "es": ["📱", "Añádela a la pantalla de inicio (úsala como una app)", "iPhone (Safari): ① toca los tres puntos «⋯» abajo a la derecha ② toca Compartir ③ desliza hacia abajo y toca Añadir a pantalla de inicio ④ toca Añadir arriba a la derecha. Android (Chrome): toca «⋮» arriba a la derecha → Añadir a pantalla de inicio o Instalar aplicación."], "ja": ["📱", "ホーム画面に追加（アプリのように使う）", "iPhone（Safari）：① 右下の「⋯」（3 つの点）をタップ ② 「共有」をタップ ③ 下にスクロールして「ホーム画面に追加」 ④ 右上の「追加」をタップ。Android（Chrome）：右上の「⋮」→「ホーム画面に追加」または「アプリをインストール」。"], "ko": ["📱", "홈 화면에 추가 (앱처럼 사용하기)", "iPhone (Safari): ① 오른쪽 아래 점 세 개 “⋯”를 누르기 ② ‘공유’ 누르기 ③ 아래로 내려 ‘홈 화면에 추가’ 누르기 ④ 오른쪽 위 ‘추가’ 누르기. Android (Chrome): 오른쪽 위 “⋮” → ‘홈 화면에 추가’ 또는 ‘앱 설치’."]}, IEH={"zh": ["🎓", "線上競賽：IELTS 模擬測驗", "每天一份新的聽力＋閱讀正式試題（約 20 分鐘），每天只能考一次，交卷後看到預估 Band，Band 6 以上拿徽章、同分再拿就多一顆星；本週最佳成績會上 IELTS 排行榜，每週一重置。練習模式的題目不同，可以無限次練習。"], "en": ["🎓", "Online contests: IELTS mock test", "A new listening + reading ranked test every day (about 20 minutes), one attempt per day. See your estimated band when you finish; Band 6+ earns a badge, and repeating the same band adds a star. Your best result each week goes on the IELTS leaderboard, which resets every Monday. Practice tests are different and unlimited."], "hi": ["🎓", "ऑनलाइन प्रतियोगिता: IELTS मॉक टेस्ट", "हर दिन एक नया लिसनिंग + रीडिंग रैंक टेस्ट (लगभग 20 मिनट), दिन में एक प्रयास। बैंड 6+ पर बैज, वही बैंड दोबारा आने पर तारा। हफ़्ते का सर्वश्रेष्ठ IELTS लीडरबोर्ड पर, हर सोमवार रीसेट। अभ्यास टेस्ट अलग और असीमित हैं।"], "es": ["🎓", "Competiciones: simulacro IELTS", "Un examen oficial nuevo de listening + reading cada día (unos 20 minutos), un intento al día. Con Band 6+ ganas una insignia y, si repites banda, una estrella. Tu mejor resultado semanal entra en el ranking IELTS, que se reinicia cada lunes. Las prácticas son distintas e ilimitadas."], "ja": ["🎓", "オンライン対戦：IELTS 模擬テスト", "毎日新しいリスニング＋リーディングの本番テスト（約 20 分）、1 日 1 回。Band 6 以上でバッジ、同じバンドをもう一度取ると星が増えます。今週のベストが IELTS ランキングに載り、毎週月曜にリセット。練習問題は別で、何度でも受けられます。"], "ko": ["🎓", "온라인 대회: IELTS 모의고사", "매일 새로운 듣기 + 읽기 정식 시험 (약 20분), 하루 1회. Band 6 이상이면 배지, 같은 밴드를 다시 받으면 별 추가. 이번 주 최고 기록이 IELTS 랭킹에 올라가고 매주 월요일 초기화. 연습 문제는 따로 있고 무제한이에요."]}; for(const k in HELP){ const secs=HELP[k].secs; const i=secs.findIndex(x=>x[0]==="📱"); if(i>=0) secs[i]=TIP[k]; const j=secs.findIndex(x=>x[0]==="⚙️"); if(j>=0) secs.splice(j,0,IEH[k]); } })();

(()=>{ const PH={zh:["🎮","線上競賽：多人遊戲（2–6 人）","登入後建立房間，把 4 位數房號給朋友。🟩 單字猜猜（Wordle）：大家同時猜同一個 5 個字母的單字，每人 6 次，越少次猜中分數越高，5 題後頒獎。 🌧 字母雨：每 3 秒掉下一個字母，留著或傳給隊友，拼出單字送出，30 秒內沒拼出就出局；結束後會解釋大家拼的字，也會列出奇怪的錯字。 💣 單字炸彈：輪到你時打出含有指定字母組合的單字把炸彈傳走，爆炸時拿著的人扣命。🎯 單字搶金賽：3 分鐘答題賺金幣，可以升級、冰凍或偷別人的金幣。"],en:["🎮","Contests: party games (2–6 players)","Sign in, create a room and give friends the 4-digit code. 🟩 Word race (Wordle): everyone guesses the same 5-letter word at once with 6 tries; fewer guesses score more, with a podium after 5 rounds. 🌧 Letter rain: a letter drops every 3 seconds; keep it or pass it to a teammate, and send real words. No word for 30 seconds and you're out. At the end you'll see everyone's words explained and the strange made-up ones. 💣 Word bomb: on your turn, type a word containing the given letters to pass the bomb; whoever holds it when it blows loses a life. 🎯 Quiz gold rush: answer for 3 minutes to earn gold, upgrade, and freeze or rob your rivals."],hi:["🎮","प्रतियोगिता: पार्टी गेम (2–6 खिलाड़ी)","साइन इन करके कमरा बनाएँ और दोस्तों को 4 अंकों का कोड दें। 🟩 शब्द दौड़ (Wordle): सब एक साथ एक ही 5 अक्षर का शब्द 6 मौकों में बूझते हैं; कम कोशिश = ज़्यादा अंक, 5 राउंड के बाद विजेता मंच। 🌧 अक्षरों की बारिश: हर 3 सेकंड एक अक्षर गिरता है; रखें या साथी को दें, सही शब्द भेजें। 30 सेकंड तक शब्द नहीं तो बाहर। 💣 शब्द बम: अपनी बारी पर दिए गए अक्षरों वाला शब्द लिखकर बम आगे भेजें; फटने पर जिसके पास हो उसकी जान जाती है। 🎯 क्विज़ सोना दौड़: 3 मिनट जवाब देकर सोना कमाएँ, अपग्रेड करें, विरोधियों को जमाएँ या लूटें।"],es:["🎮","Concursos: juegos en grupo (2–6 jugadores)","Inicia sesión, crea una sala y da a tus amigos el código de 4 cifras. 🟩 Carrera de palabras (Wordle): todos adivinan a la vez la misma palabra de 5 letras con 6 intentos; menos intentos dan más puntos, y hay podio tras 5 rondas. 🌧 Lluvia de letras: cae una letra cada 3 segundos; quédatela o pásala y envía palabras reales. 30 segundos sin palabra y quedas fuera. 💣 Bomba de palabras: en tu turno escribe una palabra con las letras indicadas para pasar la bomba; quien la tenga al explotar pierde una vida. 🎯 Fiebre del oro: responde 3 minutos para ganar oro, mejorar y congelar o robar a tus rivales."],ja:["🎮","オンライン対戦：パーティーゲーム（2〜6人）","ログインしてルームを作り、4桁のコードを友達に送ろう。🟩 ワードレース（Wordle）：全員で同じ5文字の単語を6回以内に当てる。少ない回数ほど高得点、5問のあと表彰式。 🌧 文字の雨：3秒ごとに文字が落ちてくるので、持つか仲間に渡して単語を作ろう。30秒単語を作れないと脱落。最後にみんなの単語の意味と、へんな造語が表示されます。 💣 単語ボム：自分の番に指定の文字を含む単語を入力して爆弾を回す。爆発時に持っている人はライフ−1。🎯 単語ゴールドラッシュ：3分間答えてゴールドを稼ぎ、強化したり相手を凍らせたり盗んだり。"],ko:["🎮","온라인 대회: 파티 게임 (2~6명)","로그인 후 방을 만들고 4자리 코드를 친구에게 주세요. 🟩 단어 레이스 (Wordle): 모두 같은 5글자 단어를 6번 안에 맞혀요. 적은 횟수일수록 고득점, 5문제 후 시상식. 🌧 글자 비: 3초마다 글자가 떨어지면 갖거나 팀원에게 넘기고 단어를 만들어 보내요. 30초 동안 단어를 못 만들면 탈락. 끝나면 모두의 단어 뜻과 이상한 단어들을 보여 줘요. 💣 단어 폭탄: 내 차례에 주어진 글자가 들어간 단어를 입력해 폭탄을 넘겨요. 터질 때 들고 있으면 생명 −1. 🎯 단어 골드 러시: 3분 동안 문제를 풀어 골드를 벌고, 업그레이드하거나 상대를 얼리고 훔쳐요."]}; for(const k in HELP){ const secs=HELP[k].secs; const j=secs.findIndex(x=>x[0]==="⚙️"); if(j>=0) secs.splice(j,0,PH[k]||PH.en); } })();

/* ----- auto update check: compare the deployed APP_VERSION with this one ----- */
async function upCheck(){ try{ const t=await (await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})).text(); const m=t.match(/const APP_VERSION="([^"]+)"/); if(m&&m[1]!==APP_VERSION&&!document.getElementById("upBar")){ const b=document.createElement("div"); b.id="upBar"; b.className="up-bar"; b.innerHTML=`<span>🔄 ${T("upNew")} (${esc(m[1])})</span><button class="btn sm" onclick="location.replace(location.pathname+'?v='+Date.now())">${T("upBtn")}</button>`; document.body.append(b); } }catch(e){} }
setTimeout(upCheck,4000); setInterval(upCheck,5*60e3); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") upCheck(); });

/* ---------- daily news reminders (web push; sent by .github/workflows/news-push.yml) ---------- */
const VAPID_PUB="BG8pT7pCPH1boxpKEe_fFinoQBJQDHonJyA7E-4Rf-5Wkxv0hM6cphsBOzz9M3ulvp6za-IVA6zItxjqXUV_zsw";
const PUSH={id:null,on:false,read:null,sent:null,hide:false};
try{ Object.assign(PUSH, JSON.parse(localStorage.getItem("che-pro-push")||"{}")||{}); }catch(e){}
function pushSaveLocal(){ try{ localStorage.setItem("che-pro-push",JSON.stringify(PUSH)); }catch(e){} }
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>{ try{ return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }catch(e){ return false; } };
function pushState(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return IS_IOS&&!isStandalone()?"ios":"no";
  if(Notification.permission==="denied") return "denied";
  return PUSH.on&&Notification.permission==="granted"?"on":"off";
}
function b64uToU8(s){ const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushHash(s){ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(h)].slice(0,20).map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function pushWrite(fields){ if(!CLOUD.fb||!PUSH.id) return false; const {fsM,db}=CLOUD.fb; try{ await fsM.setDoc(fsM.doc(db,"push",PUSH.id),fields,{merge:true}); return true; }catch(e){ return false; } }
function pushFields(sub){ const j=sub.toJSON(); let tz="Europe/Dublin"; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz; }catch(e){}
  const f={endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,tz,lang:LANG,sc:SC,on:true,ts:Date.now()}; if(PUSH.read===today()) f.lastRead=PUSH.read; return f; }
async function pushSubscribe(){
  const reg=await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(VAPID_PUB)});
  PUSH.id=await pushHash(sub.endpoint); return sub;
}
async function pushEnable(){
  const st=pushState();
  if(st==="ios"){ S.pushHelp=true; render(); return; }
  if(st==="no"){ toast(T("pushNo")); return; }
  if(!CLOUD.fb){ toast(T("cloudOff")); return; }
  S.pushBusy=true; render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast(T("pushDenied")); return; }
    const sub=await pushSubscribe();
    if(!(await pushWrite(pushFields(sub)))){ toast(T("pushFail")); return; }
    PUSH.on=true; PUSH.hide=true; if(PUSH.read===today()) PUSH.sent=PUSH.read; pushSaveLocal(); toast(T("pushOnToast"));
  }catch(e){ toast(T("pushFail")); }
  finally{ S.pushBusy=false; render(); }
}
async function pushDisable(){
  const id=PUSH.id; PUSH.on=false; pushSaveLocal(); render();

}
// Called whenever an article is opened: the evening reminder only goes to players who haven't read today.
async function pushMarkRead(){
  const d=today(); PUSH.read=d;
  if(PUSH.on&&PUSH.sent!==d&&await pushWrite({lastRead:d})) PUSH.sent=d;
  pushSaveLocal();
}
// On every start: keep the subscription, time zone and language up to date.
async function pushRefresh(){

  try{ const sub=await pushSubscribe(); const f=pushFields(sub); if(await pushWrite(f)&&f.lastRead) PUSH.sent=f.lastRead; pushSaveLocal(); }catch(e){}
}

  const btn=st==="on"?`<button class="btn ghost sm" data-act="pushoff">${T("pushOff")}</button>`:st==="off"?`<button class="btn sm" data-act="pushon"${busy?" disabled":""}>${busy?T("pushBusy"):T("pushOn")}</button>`:"";

}

function devPushHtml(P){
  const head=`<div class="eyebrow">🔔 ${T("dpTitle")}</div>`;
  if(!P) return head+`<p class="muted sm-t">${T("dpNone")}</p>`;
  const days=P.days||{}, keys=Object.keys(days).sort().reverse(), dk=(()=>{ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Dublin"}).format(new Date()); }catch(e){ return today(); } })();
  const t=days[dk]||{}, tile=(v,l)=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const upd=P.updatedAt?new Date(P.updatedAt).toLocaleString():"–";
  return head+`<div class="stats ds-tiles">${tile(P.subs??0,T("dpSubs"))}${tile(t.am||0,T("dpAm"))}${tile(t.pm||0,T("dpPm"))}</div>
    <table class="ds-t"><tr><th>${T("dpDate")}</th><th>${T("dpAmS")}</th><th>${T("dpPmS")}</th><th>${T("dpGone")}</th><th>${T("dpFail")}</th></tr>${keys.slice(0,7).map(k=>{ const d=days[k]||{}; return `<tr><td>${esc(k.slice(5))}${k===dk?" ★":""}</td><td>${d.am||0}</td><td>${d.pm||0}</td><td>${d.gone||0}</td><td>${d.fail||0}</td></tr>`; }).join("")}</table>
    <p class="muted sm-t">${T("dpUpd",{t:esc(upd)})}</p>`;
}

// the player's hero, dressed in the equipped weapon and armour (shown above the element guide)
function heroStage(){
  const g=game(), w=g.weapon&&ITEMS[g.weapon], a=g.armor&&ITEMS[g.armor];
  const side=(it,slot,none)=>`<div class="hs-side"><small>${T(slot)}</small>${it?`${itemTile(it,true)}<b>${esc(itemName(it))}</b><span class="hs-el">${elBadge(it.el)}</span>`:`${elBadge(null)}<b class="muted">${T(none)}</b>`}</div>`;
  const tint=a?ARMC[a.el][1]:"#C8B89A";
  return `<section class="card hero-stage" style="--hs-tint:${tint}">${side(w,"weapon","bare")}<div class="hs-fig"><div class="hs-ground"></div>${heroSvg()}</div>${side(a,"armor","cloth")}</section>`;
}
/* ----- monthly reading leaderboard: articles finished this calendar month (readMonths/{YYYY-MM}/u/{uid}) ----- */
const monthKey=()=>today().slice(0,7);
function readsThisMonth(){ const m=monthKey(), ids=new Set();
  for(const [k,d] of S.days){ const dt=(d&&d.date)||k.slice(4); if(!d||!dt.startsWith(m)) continue; if(d.read) ids.add(d.read); for(const id of Object.keys(d.postBy||{})) ids.add(id); }
  return ids.size; }
function untilMonthEnd(){ const now=new Date(), e=new Date(now.getFullYear(), now.getMonth()+1, 1); const ms=e-now; return {d:Math.floor(ms/864e5), h:Math.floor(ms%864e5/36e5)}; }
let RD_SIG=null;
async function rdPush(){
  if(DEV||CLOUD.deleting||!CLOUD.user||!CLOUD.fb||!game().nick) return;
  const m=monthKey(), n=Math.min(400,readsThisMonth()); if(!n) return;
  const e={name:game().nick.slice(0,16), n, flag:myFlag(), lv:game().lv|0, at:new Date().toISOString()};
  const sig=m+JSON.stringify({...e,at:0}); if(sig===RD_SIG) return;
  const {fsM,db}=CLOUD.fb; try{ await fsM.setDoc(fsM.doc(db,"readMonths",m,"u",CLOUD.user.uid), e); RD_SIG=sig; }catch(err){ console.warn("readrank",err&&err.code); }
}
