cesibilidad → Contenido leído → Voces → Inglés y descarga una voz británica «Mejorada» o «Premium» (p. ej. Serena, Daniel); luego elígela arriba. En Chrome de escritorio, elige una voz «Google UK English». ★ = alta calidad."});Object.assign(STR.ja,{"iePracticeSub": "練習用の問題は毎週の本番テストとは別なので、何度でも練習できます。ランキング・バッジ対象外。", "ieVoiceTitle": "リスニングの音声", "ieVoiceF": "女性", "ieVoiceM": "男性", "ieVoiceTry": "試聴", "ieVoiceNone": "この端末で使える英語の音声がありません。", "ieVoiceHint": "ロボットっぽく聞こえる場合：iPhone は「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 英語」で「拡張」または「プレミアム」のイギリス英語の声（Serena、Daniel など）をダウンロードし、上で選んでください。パソコンの Chrome では「Google UK English」を選べます。★ は高音質の声です。"});Object.assign(STR.ko,{"iePracticeSub": "연습 문제는 매주 정식 시험과 다른 문제라서 마음껏 연습할 수 있어요. 랭킹·배지 없음.", "ieVoiceTitle": "듣기 음성", "ieVoiceF": "여성", "ieVoiceM": "남성", "ieVoiceTry": "미리 듣기", "ieVoiceNone": "이 기기에서 쓸 수 있는 영어 음성이 없어요.", "ieVoiceHint": "로봇 같은 소리가 나나요? iPhone은 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 영어에서 '향상됨' 또는 '프리미엄' 영국 음성(Serena, Daniel 등)을 내려받은 뒤 위에서 고르세요. 컴퓨터 Chrome에서는 \"Google UK English\"를 고르면 돼요. ★ = 고음질."});
Object.assign(STR.zh,{"ieVoiceHint": "聲音聽起來像機器人？iPhone 可到「設定 → 輔助使用 → 朗讀與說話 → 聲音 → 英文」（英文介面是 Settings → Accessibility → Read & Speak → Voices → English；較舊的 iOS 叫「朗讀內容」），下載標示「高品質」或「增強版」的英國口音聲音（例如 Serena、Daniel），下載後回來在上面選它，會自然很多。電腦版 Chrome 可選「Google UK English」。標 ★ 的是高品質聲音。"});Object.assign(STR.en,{"ieVoiceHint": "Sounds robotic? On iPhone, go to Settings → Accessibility → Read & Speak → Voices → English (on older iOS: Spoken Content → Voices) and download a British voice marked Enhanced or Premium (e.g. Serena, Daniel), then pick it above. On desktop Chrome, choose a \"Google UK English\" voice. ★ marks high-quality voices."});Object.assign(STR.hi,{"ieVoiceHint": "आवाज़ रोबोट जैसी लगती है? iPhone पर Settings → Accessibility → Read & Speak → Voices → English (पुराने iOS में Spoken Content → Voices) में Enhanced या Premium ब्रिटिश आवाज़ (जैसे Serena, Daniel) डाउनलोड करें और ऊपर चुनें। कंप्यूटर पर Chrome में \"Google UK English\" चुनें। ★ = उच्च गुणवत्ता।"});Object.assign(STR.es,{"ieVoiceHint": "¿Suena a robot? En iPhone ve a Ajustes → Accesibilidad → Leer y hablar → Voces → Inglés (en iOS antiguos: Contenido leído → Voces) y descarga una voz británica «Mejorada» o «Premium» (p. ej. Serena, Daniel); luego elígela arriba. En Chrome de escritorio, elige una voz «Google UK English». ★ = alta calidad."});Object.assign(STR.ja,{"ieVoiceHint": "ロボットっぽく聞こえる場合：iPhone の「設定 → アクセシビリティ → 読み上げと音声 → 声 → 英語」（英語表示では Settings → Accessibility → Read & Speak → Voices、古い iOS では「読み上げコンテンツ」）で「拡張」または「プレミアム」のイギリス英語の声（Serena、Daniel など）をダウンロードし、上で選んでください。パソコンの Chrome では「Google UK English」を選べます。★ は高音質の声です。"});Object.assign(STR.ko,{"ieVoiceHint": "로봇 같은 소리가 나나요? iPhone 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 영어 (영문: Settings → Accessibility → Read & Speak → Voices)에서 '향상됨' 또는 '프리미엄' 영국 음성(Serena, Daniel 등)을 내려받은 뒤 위에서 고르세요. 컴퓨터 Chrome에서는 \"Google UK English\"를 고르면 돼요. ★ = 고음질."});
Object.assign(STR.zh,{"ieWeek": "今日試題：{t}", "ieReset": "{h} 小時 {m} 分後換明天的試題", "ieWeekReset": "{d} 天 {h} 小時後本週排行重置", "ieRanked": "開始今日正式測驗", "ieRankedNote": "每天只有第一次作答會計分、算徽章，開始後就算一次。排行榜記錄你本週的最佳成績，每週一重置。練習模式不限次數。", "ieDone": "今日成績：Band {b}（明天再來挑戰）", "ieWeekBest": "本週最佳：Band {b}", "ieBadgeStar": "Band {b} 已達成 {n} 次，徽章周圍有 {n} 顆星 ⭐", "ieNoBadge": "考到 Band 6 以上就能拿到徽章，每拿到一次同樣的分數，徽章周圍就多一顆星（一週最多 7 顆）。", "ieSub": "聽力＋閱讀，約 20 分鐘。每天一份新的正式試題，交卷後馬上看到預估 IELTS 分數，Band 6 以上可以拿到徽章。", "ieExit": "離開", "ieExitQ": "確定要離開測驗嗎？", "ieExitRanked": "這是今天的正式測驗：離開後今天的機會就用掉了，這次作答不會計分。", "ieExitPrac": "離開後這次練習的作答不會保存。", "ieExitYes": "確定離開", "ieExitNo": "繼續作答"});Object.assign(STR.en,{"ieWeek": "Today's test: {t}", "ieReset": "Tomorrow's test in {h} h {m} min", "ieWeekReset": "Weekly ranking resets in {d} d {h} h", "ieRanked": "Start today's ranked test", "ieRankedNote": "Only your first attempt each day counts for your score and badges, and it counts as soon as you start. The leaderboard shows your best result this week and resets every Monday. Practice is unlimited.", "ieDone": "Today: Band {b} (come back tomorrow)", "ieWeekBest": "Best this week: Band {b}", "ieBadgeStar": "Band {b} reached {n} times: your badge now has {n} stars ⭐", "ieNoBadge": "Score Band 6 or above to earn a badge. Each time you get the same band again, it gains a star (up to 7 a week).", "ieSub": "Listening + reading, about 20 minutes. A new ranked test every day; see your estimated IELTS band as soon as you finish, and Band 6+ earns a badge.", "ieExit": "Exit", "ieExitQ": "Leave the test?", "ieExitRanked": "This is today's ranked test: if you leave now, today's attempt is used up and won't be scored.", "ieExitPrac": "Your answers in this practice test won't be saved.", "ieExitYes": "Yes, leave", "ieExitNo": "Keep going"});Object.assign(STR.hi,{"ieWeek": "आज का टेस्ट: {t}", "ieReset": "कल का टेस्ट {h} घंटे {m} मिनट में", "ieWeekReset": "साप्ताहिक रैंकिंग {d} दिन {h} घंटे में रीसेट", "ieRanked": "आज का रैंक वाला टेस्ट शुरू कर (()=>{ const TIP={"zh": ["📱", "加到主畫面（像 App 一樣使用）", "iPhone（Safari）：① 點右下角「⋯」三個點 ② 點「分享」③ 往下滑，點「加入主畫面」④ 右上角按「加入」。之後從主畫面的圖示打開就像一般 App。Android（Chrome）：點右上角「⋮」→「加入主畫面」或「安裝應用程式」。"], "en": ["📱", "Add it to your home screen (use it like an app)", "iPhone (Safari): ① tap the three dots “⋯” at the bottom right ② tap Share ③ scroll down and tap Add to Home Screen ④ tap Add at the top right. Then open it from the icon like any app. Android (Chrome): tap “⋮” at the top right → Add to Home screen or Install app."], "hi": ["📱", "होम स्क्रीन पर जोड़ें (ऐप की तरह इस्तेमाल करें)", "iPhone (Safari): ① नीचे दाईं ओर तीन बिंदु “⋯” दबाएँ ② Share दबाएँ ③ नीचे स्क्रॉल करके Add to Home Screen दबाएँ ④ ऊपर दाईं ओर Add दबाएँ। Android (Chrome): ऊपर दाईं ओर “⋮” → Add to Home screen या Install app।"], "es": ["📱", "Añádela a la pantalla de inicio (úsala como una app)", "iPhone (Safari): ① toca los tres puntos «⋯» abajo a la derecha ② toca Compartir ③ desliza hacia abajo y toca Añadir a pantalla de inicio ④ toca Añadir arriba a la derecha. Android (Chrome): toca «⋮» arriba a la derecha → Añadir a pantalla de inicio o Instalar aplicación."], "ja": ["📱", "ホーム画面に追加（アプリのように使う）", "iPhone（Safari）：① 右下の「⋯」（3 つの点）をタップ ② 「共有」をタップ ③ 下にスクロールして「ホーム画面に追加」 ④ 右上の「追加」をタップ。Android（Chrome）：右上の「⋮」→「ホーム画面に追加」または「アプリをインストール」。"], "ko": ["📱", "홈 화면에 추가 (앱처럼 사용하기)", "iPhone (Safari): ① 오른쪽 아래 점 세 개 “⋯”를 누르기 ② ‘공유’ 누르기 ③ 아래로 내려 ‘홈 화면에 추가’ 누르기 ④ 오른쪽 위 ‘추가’ 누르기. Android (Chrome): 오른쪽 위 “⋮” → ‘홈 화면에 추가’ 또는 ‘앱 설치’."]}, IEH={"zh": ["🎓", "線上競賽：IELTS 模擬測驗", "每天一份新的聽力＋閱讀正式試題（約 20 分鐘），每天只能考一次，交卷後看到預估 Band，Band 6 以上拿徽章、同分再拿就多一顆星；本週最佳成績會上 IELTS 排行榜，每週一重置。練習模式的題目不同，可以無限次練習。"], "en": ["🎓", "Online contests: IELTS mock test", "A new listening + reading ranked test every day (about 20 minutes), one attempt per day. See your estimated band when you finish; Band 6+ earns a badge, and repeating the same band adds a star. Your best result each week goes on the IELTS leaderboard, which resets every Monday. Practice tests are different and unlimited."], "hi": ["🎓", "ऑनलाइन प्रतियोगिता: IELTS मॉक टेस्ट", "हर दिन एक नया लिसनिंग + रीडिंग रैंक टेस्ट (लगभग 20 मिनट), दिन में एक प्रयास। बैंड 6+ पर बैज, वही बैंड दोबारा आने पर तारा। हफ़्ते का सर्वश्रेष्ठ IELTS लीडरबोर्ड पर, हर सोमवार रीसेट। अभ्यास टेस्ट अलग और असीमित हैं।"], "es": ["🎓", "Competiciones: simulacro IELTS", "Un examen oficial nuevo de listening + reading cada día (unos 20 minutos), un intento al día. Con Band 6+ ganas una insignia y, si repites banda, una estrella. Tu mejor resultado semanal entra en el ranking IELTS, que se reinicia cada lunes. Las prácticas son distintas e ilimitadas."], "ja": ["🎓", "オンライン対戦：IELTS 模擬テスト", "毎日新しいリスニング＋リーディングの本番テスト（約 20 分）、1 日 1 回。Band 6 以上でバッジ、同じバンドをもう一度取ると星が増えます。今週のベストが IELTS ランキングに載り、毎週月曜にリセット。練習問題は別で、何度でも受けられます。"], "ko": ["🎓", "온라인 대회: IELTS 모의고사", "매일 새로운 듣기 + 읽기 정식 시험 (약 20분), 하루 1회. Band 6 이상이면 배지, 같은 밴드를 다시 받으면 별 추가. 이번 주 최고 기록이 IELTS 랭킹에 올라가고 매주 월요일 초기화. 연습 문제는 따로 있고 무제한이에요."]}; for(const k in HELP){ const secs=HELP[k].secs; const i=secs.findIndex(x=>x[0]==="📱"); if(i>=0) secs[i]=TIP[k]; const j=secs.findIndex(x=>x[0]==="⚙️"); if(j>=0) secs.splice(j,0,IEH[k]); } })();

(()=>{ const PH={zh:["🎮","線上競賽：多人遊戲（2–6 人）","登入後建立房間，把 4 位數房號給朋友。🟩 單字猜猜（Wordle）：大家同時猜同一個 5 個字母的單字，每人 6 次，越少次猜中分數越高，5 題後頒獎。 🌧 字母雨：每 3 秒掉下一個字母，留著或傳給隊友，拼出單字送出，30 秒內沒拼出就出局；結束後會解釋大家拼的字，也會列出奇怪的錯字。 💣 單字炸彈：輪到你時打出含有指定字母組合的單字把炸彈傳走，爆炸時拿著的人扣命。🎯 單字搶金賽：3 分鐘答題賺金幣，可以升級、冰凍或偷別人的金幣。"],en:["🎮","Contests: party games (2–6 players)","Sign in, create a room and give friends the 4-digit code. 🟩 Word race (Wordle): everyone guesses the same 5-letter word at once with 6 tries; fewer guesses score more, with a podium after 5 rounds. 🌧 Letter rain: a letter drops every 3 seconds; keep it or pass it to a teammate, and send real words. No word for 30 seconds and you're out. At the end you'll see everyone's words explained and the strange made-up ones. 💣 Word bomb: on your turn, type a word containing the given letters to pass the bomb; whoever holds it when it blows loses a life. 🎯 Quiz gold rush: answer for 3 minutes to earn gold, upgrade, and freeze or rob your rivals."],hi:["🎮","प्रतियोगिता: पार्टी गेम (2–6 खिलाड़ी)","साइन इन करके कमरा बनाएँ और दोस्तों को 4 अंकों का कोड दें। 🟩 शब्द दौड़ (Wordle): सब एक साथ एक ही 5 अक्षर का शब्द 6 मौकों में बूझते हैं; कम कोशिश = ज़्यादा अंक, 5 राउंड के बाद विजेता मंच। 🌧 अक्षरों की बारिश: हर 3 सेकंड एक अक्षर गिरता है; रखें या साथी को दें, सही शब्द भेजें। 30 सेकंड तक शब्द नहीं तो बाहर। 💣 शब्द बम: अपनी बारी पर दिए गए अक्षरों वाला शब्द लिखकर बम आगे भेजें; फटने पर जिसके पास हो उसकी जान जाती है। 🎯 क्विज़ सोना दौड़: 3 मिनट जवाब देकर सोना कमाएँ, अपग्रेड करें, विरोधियों को जमाएँ या लूटें।"],es:["🎮","Concursos: juegos en grupo (2–6 jugadores)","Inicia sesión, crea una sala y da a tus amigos el código de 4 cifras. 🟩 Carrera de palabras (Wordle): todos adivinan a la vez la misma palabra de 5 letras con 6 intentos; menos intentos dan más puntos, y hay podio tras 5 rondas. 🌧 Lluvia de letras: cae una letra cada 3 segundos; quédatela o pásala y envía palabras reales. 30 segundos sin palabra y quedas fuera. 💣 Bomba de palabras: en tu turno escribe una palabra con las letras indicadas para pasar la bomba; quien la tenga al explotar pierde una vida. 🎯 Fiebre del oro: responde 3 minutos para ganar oro, mejorar y congelar o robar a tus rivales."],ja:["🎮","オンライン対戦：パーティーゲーム（2〜6人）","ログインしてルームを作り、4桁のコードを友達に送ろう。🟩 ワードレース（Wordle）：全員で同じ5文字の単語を6回以内に当てる。少ない回数ほど高得点、5問のあと表彰式。 🌧 文字の雨：3秒ごとに文字が落ちてくるので、持つか仲間に渡して単語を作ろう。30秒単語を作れないと脱落。最後にみんなの単語の意味と、へんな造語が表示されます。 💣 単語ボム：自分の番に指定の文字を含む単語を入力して爆弾を回す。爆発時に持っている人はライフ−1。🎯 単語ゴールドラッシュ：3分間答えてゴールドを稼ぎ、強化したり相手を凍らせたり盗んだり。"],ko:["🎮","온라인 대회: 파티 게임 (2~6명)","로그인 후 방을 만들고 4자리 코드를 친구에게 주세요. 🟩 단어 레이스 (Wordle): 모두 같은 5글자 단어를 6번 안에 맞혀요. 적은 횟수일수록 고득점, 5문제 후 시상식. 🌧 글자 비: 3초마다 글자가 떨어지면 갖거나 팀원에게 넘기고 단어를 만들어 보내요. 30초 동안 단어를 못 만들면 탈락. 끝나면 모두의 단어 뜻과 이상한 단어들을 보여 줘요. 💣 단어 폭탄: 내 차례에 주어진 글자가 들어간 단어를 입력해 폭탄을 넘겨요. 터질 때 들고 있으면 생명 −1. 🎯 단어 골드 러시: 3분 동안 문제를 풀어 골드를 벌고, 업그레이드하거나 상대를 얼리고 훔쳐요."]}; for(const k in HELP){ const secs=HELP[k].secs; const j=secs.findIndex(x=>x[0]==="⚙️"); if(j>=0) secs.splice(j,0,PH[k]||PH.en); } })();

/* ----- auto update check: compare the deployed APP_VERSION with this one ----- */
/* new-version check reads the tiny version.json (kept in sync with APP_VERSION on every commit) instead of the whole 740 KB page */
async function upCheck(){ try{ const j=await (await fetch("version.json?t="+Date.now(),{cache:"no-store"})).json(); const m=j&&typeof j.v==="string"?[null,j.v.slice(0,20)]:null; if(m&&m[1]!==APP_VERSION&&!document.getElementById("upBar")){ const b=document.createElement("div"); b.id="upBar"; b.className="up-bar"; b.innerHTML=`<span>🔄 ${T("upNew")} (${esc(m[1])})</span><button class="btn sm" onclick="location.replace(location.pathname+'?v='+Date.now())">${T("upBtn")}</button>`; document.body.append(b); } }catch(e){} }
setTimeout(upCheck,4000); setInterval(upCheck,5*60e3); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") upCheck(); });

const VAPID_PUB="BG8pT7pCPH1boxpKEe_fFinoQBJQDHonJyA7E-4Rf-5Wkxv0hM6cphsBOzz9M3ulvp6za-IVA6zItxjqXUV_zsw";

function pushSaveLocal(){ try{ localStorage.setItem("che-pro-push",JSON.stringify(PUSH)); }catch(e){} }
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>{ try{ return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }catch(e){ return false; } };
function pushState(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return IS_IOS&&!isStandalone()?"ios":"no";
  if(Notification.permission==="denied") return "denied";
  return PUSH.on&&Notification.permission==="granted"?"on":"off";
}
function b64uToU8(s){ const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushHash(s){ const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(h)].slice(0,20).map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function pushWrite(fields){ if(!CLOUD.fb||!PUSH.id) return false; const {fsM,db}=CLOUD.fb; try{ await fsM.setDoc(fsM.doc(db,"push",PUSH.id),fields,{merge:true}); return true; }catch(e){ return false; } }
function pushFields(sub){ const j=sub.toJSON(); let tz="Europe/Dublin"; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz; }catch(e){}
  const f={endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,tz,lang:LANG,sc:SC,on:true,ts:Date.now()}; if(PUSH.read===today()) f.lastRead=PUSH.read; return f; }
async function pushSubscribe(){
  const reg=await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(VAPID_PUB)});
  PUSH.id=await pushHash(sub.endpoint); return sub;
}
async function pushEnable(){
  const st=pushState();
  if(st==="ios"){ S.pushHelp=true; render(); return; }
  if(st==="no"){ toast(T("pushNo")); return; }
  if(!CLOUD.fb){ toast(T("cloudOff")); return; }
  S.pushBusy=true; render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast(T("pushDenied")); return; }
    const sub=await pushSubscribe();
    if(!(await pushWrite(pushFields(sub)))){ toast(T("pushFail")); return; }
    PUSH.on=true; PUSH.hide=true; if(PUSH.read===today()) PUSH.sent=PUSH.read; pushSaveLocal(); toast(T("pushOnToast"));
  }catch(e){ toast(T("pushFail")); }
  finally{ S.pushBusy=false; render(); }
}
async function pushDisable(){
  const id=PUSH.id; PUSH.on=false; pushSaveLocal(); render();
  try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  if(CLOUD.fb&&id){ try{ await CLOUD.fb.fsM.deleteDoc(CLOUD.fb.fsM.doc(CLOUD.fb.db,"push",id)); }catch(e){} }
  toast(T("pushOffToast"));
}
// Called whenever an article is opened: the evening reminder only goes to players who haven't read today.
async function pushMarkRead(){
  const d=today(); PUSH.read=d;
  if(PUSH.on&&PUSH.sent!==d&&await pushWrite({lastRead:d})) PUSH.sent=d;
  pushSaveLocal();
}
// On every start: keep the subscription, time zone and language up to date.
async function pushRefresh(){
  if(!PUSH.on) return; const st=pushState();
  if(st==="denied"||st==="no"||st==="ios"){ PUSH.on=false; pushSaveLocal(); return; }
  try{ const sub=await pushSubscribe(); const f=pushFields(sub); if(await pushWrite(f)&&f.lastRead) PUSH.sent=f.lastRead; pushSaveLocal(); }catch(e){}
}

}

/* ================= spaced repetition: each word has a box (1–6) and a due date ================= */
const SRS_INT=[0,1,2,4,7,15,30], SRS_MAX=15;
function srsAdd(d,n){ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return ymd(x); }
const srsDue=w=>w.srsDue||srsAdd(w.firstSeen||today(),1);
function srsNext(w,ok){ const b=ok?Math.min(6,(w.srsB||0)+1):1; return {srsB:b, srsDue:srsAdd(today(), ok?SRS_INT[b]:1)}; }
function srsDueList(){ const t=today(); return [...S.words.values()].filter(w=>!w.filler&&srsDue(w)<=t).sort((a,b)=>srsDue(a).localeCompare(srsDue(b))||(a.srsB||0)-(b.srsB||0)); }
const srsCountOn=d=>[...S.words.values()].filter(w=>!w.filler&&srsDue(w)===d).length;
function srsCard(){
  if(!S.words.size) return "";
  const due=srsDueList().length, tm=srsCountOn(srsAdd(today(),1));
  const boxes=[1,2,3,4,5,6].map(b=>[...S.words.values()].filter(w=>(w.srsB||0)===b).length), fresh=[...S.words.values()].filter(w=>!w.srsB).length;

  return `<section class="card srs-card"><div class="srs-top"><div class="srs-ic" aria-hidden="true">🧠</div><div><b>${T("srsTitle")}</b><span class="muted sm-t">${due?T("srsDueN",{n:due}):T("srsClear",{n:tm})}</span>${due?(()=>{ const l=revLeft(); return due<SRS_TICKET_MIN?`<span class="rev-left sm-t muted">🎟 ${T("srsTicketMin",{n:SRS_TICKET_MIN})}</span>`:`<span class="rev-left sm-t ${l?"":"muted"}">🎟 ${l?T("srsTicket",{n:l}):T("revNoMore")}</span>`; })():""}</div>${due?`<button class="btn sm" data-act="srs">${T("srsStart",{n:Math.min(SRS_MAX,due)})}</button>`:""}</div>${bar}<p class="muted sm-t" style="margin:6px 0 0">${T("srsHow")}</p></section>`;
}

const READ_RATES=[0.8,1,1.2];

let NEWS_AUDIO=null;
fetch("news-audio.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ NEWS_AUDIO=j; if(S.view==="read") readUi(); }).catch(()=>{});
function readRec(){ const art=currentArticle(); if(!art||!NEWS_AUDIO||!NEWS_AUDIO.sha) return null;

  return `${rec?`<span class="read-rec">🎙 ${T("readRec")}</span>`:""}<button class="btn sm" data-act="readgo">${!READ.on?"🔊 "+T("readAloud"):playing?"⏸ "+T("readPause"):"▶ "+T("readResume")}</button>${READ.on?`<button class="btn ghost sm" data-act="readstop" aria-label="${esc(T("readStop"))}">⏹</button>`:""}<button class="btn ghost sm" data-act="readrate">${T("readSpeed",{r:READ.rate})}</button>${READ.on?`<span class="muted sm-t">${Math.min(READ.i+1,READ.chunks.length)} / ${READ.chunks.length}</span>`:""}`;
}
function readUi(){ const b=document.getElementById("readBar"); if(b) b.innerHTML=readBarInner(); if(typeof SND!=="undefined"&&SND.ctx) musicDuck(!!(READ.on&&!READ.paused)||examOn()); }
function readMark(pi){ READ.cur=pi; document.querySelectorAll("#article p").forEach((p,i)=>p.classList.toggle("reading",i===pi)); const el=document.querySelectorAll("#article p")[pi]; if(el&&READ.lastPi!==pi){ READ.lastPi=pi; el.scrollIntoView({behavior:"smooth",block:"center"}); } }
function readChunks(){ const out=[]; document.querySelectorAll("#article p").forEach((p,pi)=>{ p.textContent.split(/(?<=[.!?…])\s+(?=["“‘(]?[A-Z0-9])/).forEach(t=>{ t=t.trim(); if(t) out.push({pi,t}); }); }); return out; }

  readNext(); readUi();
}
function readAudio(rec){
  const a=new Audio(rec.url); READ.audio=a; READ.times=rec.t; a.preload="auto"; a.playbackRate=READ.rate;
  const tok=++READ.tok; readMark(READ.chunks[0].pi);
  a.ontimeupdate=()=>{ if(tok!==READ.tok) return; const ct=a.currentTime+0.05; let i=0; while(i+1<READ.times.length&&READ.times[i+1]<=ct) i++; if(i!==READ.i){ READ.i=i; readMark(READ.chunks[i].pi); readUi(); } };
  a.onended=()=>{ if(tok===READ.tok) readStop(); };
  const fallback=()=>{ if(tok!==READ.tok||!READ.on) return; READ.audio=null; try{ a.pause(); }catch(e){} readNext(); readUi(); };   // recording unavailable → phone voice from the same sentence
  a.onerror=fallback; a.play().catch(err=>{ if(err&&err.name==="NotAllowedError"){ READ.paused=true; readUi(); } else fallback(); });

function readNext(){
  if(!READ.on||READ.paused) return; const c=READ.chunks[READ.i]; if(!c){ readStop(); return; }
  readMark(c.pi); const tok=++READ.tok, u=new SpeechSynthesisUtterance(c.t), v=ieVoices().F;
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB"; u.rate=READ.rate;
  const go=()=>{ if(tok!==READ.tok||!READ.on||READ.paused) return; READ.i++; readUi(); readNext(); };
  u.onend=go; u.onerror=go; speechSynthesis.speak(u);
}
function readPause(){ READ.paused=true; if(READ.audio){ READ.audio.pause(); return readUi(); } READ.tok++; try{ speechSynthesis.cancel(); }catch(e){} readUi(); }
function readResume(){ READ.paused=false; if(READ.audio){ READ.audio.play().catch(()=>{}); return readUi(); } readNext(); readUi(); }
function readStop(){ READ.on=false; READ.paused=false; READ.tok++; if(READ.audio){ try{ READ.audio.pause(); }catch(e){} READ.audio=null; } try{ speechSynthesis.cancel(); }catch(e){} READ.cur=-1; document.querySelectorAll("#article p.reading").forEach(p=>p.classList.remove("reading")); readUi(); }

function privacyCard(){
  const u=CLOUD.user;
  return `<section class="card priv-card"><b>🔒 ${T("pvCard")}</b><span class="muted sm-t">${T("pvCardSub")}</span>
    <div class="row"><button class="btn ghost sm" data-act="privacy">${T("pvOpen")}</button><button class="btn ghost sm del-btn" data-act="delask">${u?T("delBtn"):T("delBtnLocal")}</button></div>
    ${S.delAsk?`<div class="del-ask"><b>⚠️ ${T("delQ")}</b><p class="sm-t">${u?T("delWhat"):T("delWhatLocal")}</p><div class="row"><button class="btn sm danger-solid" data-act="delgo" ${S.delBusy?"disabled":""}>${S.delBusy?T("delBusy"):T("delYes")}</button><button class="btn ghost sm" data-act="delask">${T("nickNo")}</button></div></div>`:""}</section>`;
}
async function deleteAccount(){
  if(S.delBusy) return; S.delBusy=true; render();
  const wipeLocal=()=>{ try{ Object.keys(localStorage).filter(k=>/^che-(pro|daily-pro)/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){} };
  try{
    if(CLOUD.user&&CLOUD.fb){
      const {fsM,db,authM,auth}=CLOUD.fb, uid=CLOUD.user.uid, g=game();
      // Google requires a recent sign-in before an account can be deleted: ask first, while we still have the tap
      const last=Date.parse((auth.currentUser&&auth.currentUser.metadata&&auth.currentUser.metadata.lastSignInTime)||0);
      if(authM.reauthenticateWithPopup&&!(Date.now()-last<4*60e3)){ await authM.reauthenticateWithPopup(auth.currentUser,new authM.GoogleAuthProvider()); }
      CLOUD.deleting=true; clearTimeout(CLOUD.timer); CLOUD.dirtyWords.clear(); CLOUD.delWords.clear(); CLOUD.dirtyMain=false;
      const del=async ref=>{ try{ await fsM.deleteDoc(ref); }catch(e){} };
      const ws=await fsM.getDocs(wordsCol()); const ids=[]; ws.forEach(d=>ids.push(d.id));
      for(let i=0;i<ids.length;i+=400){ const b=fsM.writeBatch(db); ids.slice(i,i+400).forEach(id=>b.delete(fsM.doc(wordsCol(),id))); await b.commit(); }
      await del(userRef()); await del(fsM.doc(db,"leaderboard",uid)); await del(fsM.doc(db,"allies",uid));
      if(g.nick){ try{ const r=fsM.doc(db,"nicks",nickKey(g.nick)), d=await fsM.getDoc(r); if(d.exists()&&d.data().uid===uid) await fsM.deleteDoc(r); }catch(e){} }
      const pm=(()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return ymd(d).slice(0,7); })();
      for(const m of [monthKey(),pm]){ await del(fsM.doc(db,"readMonths",m,"u",uid)); await del(fsM.doc(db,"ieltsMonths",m,"scores",uid)); }
      await del(fsM.doc(db,"ieltsWeeks",isoWeek().id,"scores",uid));
      if(PUSH.id) await del(fsM.doc(db,"push",PUSH.id));
      const did=devId(); if(did) await del(fsM.doc(db,"act",did));
      try{ const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
      if(authM.deleteUser) await authM.deleteUser(auth.currentUser);
    } else if(CLOUD.fb){ const {fsM,db}=CLOUD.fb; const did=devId(); try{ if(PUSH.id) await fsM.deleteDoc(fsM.doc(db,"push",PUSH.id)); if(did) await fsM.deleteDoc(fsM.doc(db,"act",did)); }catch(e){} }
    wipeLocal(); toast(T("delDone")); setTimeout(()=>location.reload(),1200);
  }catch(e){
    CLOUD.deleting=false; S.delBusy=false;
    const c=e&&e.code||""; toast(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?T("delCancel"):T("delFail")); render();
  }
}

Object.assign(STR.zh,{"stName": "德魯伊長老 基蘭", "stNext": "繼續", "stGift": "收下 5 張出征令", "stOk": "我知道了", "stGo": "出發吧！", "stSkip": "略過", "in1": "年輕的旅人，你終於來了！我是守護這座島的德魯伊長老基蘭。魔眼巴洛爾從海底醒來，帶著妖怪佔領了愛爾蘭的城鎮，我們需要一位挑戰者！", "in2": "妖怪最怕知識的力量。每天讀「今天」的英文新聞，完成讀後測驗，每篇就能拿到 1 張出征令（一天最多 4 篇）；把當天三個步驟都做完，我再多送你 2 張。", "in3": "用出征令攻打城鎮，打贏就能佔領，每天還會收到稅金。記住五行相剋：金剋木、木剋土、土剋水、水剋火、火剋金。選對屬性的裝備，事半功倍！", "in4": "野外的野獸不用出征令，只會消耗體力（最多 6 點，每 4 小時恢復 1 點）。打牠們可以練等、賺金幣；同一隻打太多次，金幣會越來越少。", "in5": "這 5 張出征令先送給你，去打下第一座城鎮丁格爾吧！從 1 級一路變強到 50 級，最後打敗都柏林的巴洛爾，拯救整個愛爾蘭！", "d21": "歡迎回來！今天教你一個好東西：幸運草 ☘️。到字典完成一次間隔複習（5 個字以上），就能拿 1 片，每天最多 3 片。", "d22": "幸運草可以拿到「幸運屋」轉命運輪盤，有機會拿到金幣、出征令或裝備碎片；2 片以上還能買刮刮卡，刮出更高級的碎片。", "d23": "同屬性、同等級的碎片集滿 3 個，就能合成一件你等級附近的裝備。好好收集，說不定能省下一大筆金幣！", "d31": "你已經是個像樣的冒險者了！到 24 級，會有盟友陪你挑戰野外的強敵，你也可以邀請朋友當盟友。", "d32": "無聊的時候，可以到「多人遊戲」和朋友連線玩，免費但獎勵不多。真正變強的路只有一條：每天讀新聞。我在都柏林等你的好消息！", "stGot": "收到 5 張出征令！"});
Object.assign(STR.en,{"stName": "Ciarán the Druid Elder", "stNext": "Next", "stGift": "Take the 5 quest passes", "stOk": "Got it", "stGo": "Let's go!", "stSkip": "Skip", "in1": "Young traveller, you've finally come! I am Ciarán, the druid elder who watches over this island. Balor of the Evil Eye has woken beneath the sea, and his monsters have taken the towns of Ireland. We need a challenger!", "in2": "Monsters fear the power of knowledge. Each day, read TODAY's English news and finish the quiz after it: every story gives you 1 quest pass (up to 4 a day). Finish all three daily steps and I'll add 2 more.", "in3": "Use quest passes to attack towns. Win, and the town is yours and pays you tax every day. Remember the five elements: metal beats wood, wood beats earth, earth beats water, water beats fire, fire beats metal.", "in4": "Wild beasts don't need quest passes, only stamina (up to 6, one point back every 4 hours). Hunt them to level up and earn gold, but the same beast pays less each time.", "in5": "Take these 5 quest passes and free Dingle, the first town! Grow from Lv 1 all the way to Lv 50, defeat Balor in Dublin and save all of Ireland!", "d21": "Welcome back! Today I'll show you something lucky: shamrocks ☘️. Finish a spaced review in your dictionary (5+ words) to earn one, up to 3 a day.", "d22": "Take your shamrocks to the Lucky House and spin the Wheel of Fate for gold, quest passes or gear shards. With 2 or more you can buy a scratch card for better shards.", "d23": "Collect 3 shards of the same element and tier to forge gear close to your level. Collect them well and you can save a lot of gold!", "d31": "You're becoming a real adventurer! At Lv 24 an ally will join you against strong wild beasts, and you can invite a friend as your ally.", "d32": "When you're bored, play with friends in Multiplayer. It's free, but the rewards are small. The only real road to strength is reading the news every day. I'll be waiting for good news from Dublin!", "stGot": "You received 5 quest passes!"});
Object.assign(STR.hi,{"stName": "ड्रुइड बुज़ुर्ग कीरान", "stNext": "आगे", "stGift": "5 अभियान पास लें", "stOk": "समझ गया", "stGo": "चलो!", "stSkip": "छोड़ें", "in1": "युवा यात्री, आख़िर तुम आ गए! मैं कीरान हूँ, इस द्वीप का रखवाला ड्रुइड बुज़ुर्ग। बुरी आँख वाला बलोर समुद्र के नीचे जाग गया है और उसके दानवों ने आयरलैंड के शहर छीन लिए हैं। हमें एक योद्धा चाहिए!", "in2": "दानव ज्ञान की शक्ति से डरते हैं। हर दिन आज की अंग्रेज़ी ख़बर पढ़ो और उसके बाद का क्विज़ पूरा करो: हर ख़बर पर 1 अभियान पास (दिन में अधिकतम 4)। दिन के तीनों चरण पूरे करो तो मैं 2 और दूँगा।", "in3": "अभियान पास से शहरों पर हमला करो। जीतोगे तो शहर तुम्हारा, और हर दिन कर मिलेगा। पाँच तत्व याद रखो: धातु लकड़ी को, लकड़ी पृथ्वी को, पृथ्वी जल को, जल अग्नि को, अग्नि धातु को हराती है।", "in4": "जंगली जानवरों के लिए पास नहीं, सिर्फ़ स्टैमिना चाहिए (अधिकतम 6, हर 4 घंटे में 1)। उनका शिकार करके स्तर बढ़ाओ और सोना कमाओ, पर एक ही जानवर से बार-बार कम सोना मिलता है।", "in5": "ये 5 अभियान पास लो और पहला शहर डिंगल आज़ाद करो! Lv 1 से Lv 50 तक बढ़ो, डबलिन में बलोर को हराओ और पूरे आयरलैंड को बचाओ!", "d21": "फिर से स्वागत है! आज तुम्हें कुछ भाग्यशाली दिखाता हूँ: शैमरॉक ☘️। शब्दकोश में एक अंतराल दोहराव (5+ शब्द) पूरा करो और एक पाओ, दिन में अधिकतम 3।", "d22": "शैमरॉक लेकर भाग्य घर जाओ और भाग्य चक्र घुमाओ: सोना, अभियान पास या उपकरण के टुकड़े मिल सकते हैं। 2 या ज़्यादा हों तो स्क्रैच कार्ड भी ले सकते हो।", "d23": "एक ही तत्व और स्तर के 3 टुकड़े जमा करके अपने स्तर के पास का उपकरण बनाओ। अच्छे से जमा करो, बहुत सोना बचेगा!", "d31": "तुम सच्चे साहसी बन रहे हो! Lv 24 पर एक साथी जंगल के ताक़तवर जानवरों से लड़ने आएगा, और तुम किसी दोस्त को भी साथी बना सकते हो।", "d32": "बोर हो तो मल्टीप्लेयर में दोस्तों के साथ खेलो — मुफ़्त है, पर इनाम कम हैं। ताक़तवर बनने का असली रास्ता एक ही है: हर दिन ख़बर पढ़ना। डबलिन से अच्छी ख़बर का इंतज़ार रहेगा!", "stGot": "तुम्हें 5 अभियान पास मिले!"});
Object.assign(STR.es,{"stName": "Ciarán, el anciano druida", "stNext": "Siguiente", "stGift": "Aceptar 5 pases", "stOk": "Entendido", "stGo": "¡Vamos!", "stSkip": "Saltar", "in1": "¡Joven viajero, por fin has llegado! Soy Ciarán, el anciano druida que protege esta isla. Balor del Mal de Ojo ha despertado bajo el mar y sus monstruos han tomado las ciudades de Irlanda. ¡Necesitamos un retador!", "in2": "Los monstruos temen el poder del saber. Cada día lee la noticia en inglés de HOY y termina el test: cada noticia te da 1 pase de expedición (hasta 4 al día). Completa los tres pasos del día y te daré 2 más.", "in3": "Usa los pases para atacar ciudades. Si ganas, la ciudad es tuya y te paga impuestos cada día. Recuerda los cinco elementos: metal vence a madera, madera a tierra, tierra a agua, agua a fuego y fuego a metal.", "in4": "Las bestias salvajes no necesitan pases, solo energía (máx. 6, recuperas 1 punto cada 4 horas). Cázalas para subir de nivel y ganar oro, pero la misma bestia da menos cada vez.", "in5": "Toma estos 5 pases y libera Dingle, la primera ciudad. ¡Crece del Lv 1 al Lv 50, derrota a Balor en Dublín y salva toda Irlanda!", "d21": "¡Bienvenido de nuevo! Hoy te enseño algo de suerte: los tréboles ☘️. Termina un repaso espaciado en tu diccionario (5+ palabras) para ganar uno, hasta 3 al día.", "d22": "Lleva tus tréboles a la Casa de la suerte y gira la Rueda del destino: oro, pases o fragmentos de equipo. Con 2 o más puedes comprar un rasca y gana con mejores fragmentos.", "d23": "Junta 3 fragmentos del mismo elemento y nivel para forjar equipo cerca de tu nivel. ¡Si los juntas bien, ahorrarás mucho oro!", "d31": "¡Ya eres todo un aventurero! En el Lv 24 un aliado te acompañará contra las bestias más fuertes, y también puedes invitar a un amigo como aliado.", "d32": "Cuando te aburras, juega con amigos en Multijugador: es gratis, pero las recompensas son pequeñas. El único camino para hacerse fuerte es leer las noticias cada día. ¡Espero buenas noticia Object.assign(STR.ja,{"stName": "ドルイドの長老キーラン", "stNext": "次へ", "stGift": "出撃券5枚を受け取る", "stOk": "わかった", "stGo": "出発！", "stSkip": "スキップ", "in1": "若き旅人よ、よく来てくれた！わしはこの島を守るドルイドの長老キーラン。魔眼のバロールが海の底で目を覚まし、魔物たちがアイルランドの町を占領してしまった。挑戦者が必要なのじゃ！", "in2": "魔物は知識の力を恐れる。毎日「今日」の英語ニュースを読んで読後テストを終えれば、1本ごとに出撃券が1枚（1日最大4枚）。その日の3ステップを全部終えたら、さらに2枚あげよう。", "in3": "出撃券で町を攻めるのじゃ。勝てば町はおぬしのもの、毎日税金も入る。五行の相克を忘れるな：金は木に、木は土に、土は水に、水は火に、火は金に勝つ。", "in4": "野外の獣には出撃券はいらん。体力を使うだけじゃ（最大6、4時間ごとに1回復）。狩ってレベルを上げ、ゴールドを稼げ。ただし同じ獣ばかり狩るとゴールドは減っていく。", "in5": "この出撃券5枚を持って、最初の町ディングルを取り戻すのじゃ！Lv 1 から Lv 50 まで強くなり、ダブリンのバロールを倒してアイルランドを救え！", "d21": "おかえり！今日は幸運のしるし、クローバー ☘️ を教えよう。単語帳で間隔反復（5語以上）を1回終えると1枚、1日最大3枚もらえる。", "d22": "クローバーは「幸運の家」で運命のルーレットを回すのに使う。ゴールド、出撃券、装備のかけらが当たるぞ。2枚以上あればスクラッチカードも買える。", "d23": "同じ属性・ランクのかけらを3個集めると、今のレベルに近い装備を作れる。上手に集めれば、ゴールドの節約になるぞ！", "d31": "立派な冒険者になってきたな！Lv 24 になると、野外の強敵と戦う仲間が加わる。友達を仲間に誘うこともできるぞ。", "d32": "退屈なときは「マルチプレイ」で友達と遊ぶといい。無料じゃが、報酬は少なめじゃ。本当に強くなる道はただ一つ、毎日ニュースを読むこと。ダブリンからの吉報を待っておるぞ！", "stGot": "出撃券を5枚手に入れた！"});
Object.assign(STR.ko,{"stName": "드루이드 장로 키어런", "stNext": "다음", "stGift": "출정권 5장 받기", "stOk": "알겠어요", "stGo": "출발!", "stSkip": "건너뛰기", "in1": "젊은 여행자여, 드디어 왔구나! 나는 이 섬을 지키는 드루이드 장로 키어런이다. 마안의 발로르가 바다 밑에서 깨어나 괴물들이 아일랜드의 마을을 점령했어. 도전자가 필요하단다!", "in2": "괴물들은 지식의 힘을 두려워해. 매일 '오늘'의 영어 뉴스를 읽고 퀴즈를 마치면 기사마다 출정권 1장 (하루 최대 4장). 하루 3단계를 모두 마치면 내가 2장을 더 주마.", "in3": "출정권으로 마을을 공격하렴. 이기면 마을은 네 것이 되고 매일 세금도 들어온다. 오행 상극을 기억해: 금은 목을, 목은 토를, 토는 수를, 수는 화를, 화는 금을 이긴다.", "in4": "야생 짐승에게는 출정권이 필요 없고 체력만 든단다 (최대 6, 4시간마다 1 회복). 사냥해서 레벨을 올리고 골드를 벌어. 단, 같은 짐승은 잡을수록 골드가 줄어.", "in5": "이 출정권 5장으로 첫 번째 마을 딩글을 되찾으렴! Lv 1부터 Lv 50까지 강해져서 더블린의 발로르를 물리치고 아일랜드를 구해 다오!", "d21": "다시 왔구나! 오늘은 행운의 클로버 ☘️를 알려 주마. 단어장에서 간격 복습 (5단어 이상)을 한 번 끝내면 1장, 하루 최대 3장 받을 수 있어.", "d22": "클로버는 '행운의 집'에서 운명의 룰렛을 돌리는 데 쓴단다. 골드, 출정권, 장비 조각이 나와. 2장 이상이면 스크래치 카드도 살 수 있지.", "d23": "같은 속성·등급의 조각 3개를 모으면 네 레벨에 가까운 장비를 만들 수 있어. 잘 모으면 골드를 많이 아낄 수 있단다!", "d31": "제법 모험가다워졌구나! Lv 24가 되면 야생의 강적과 함께 싸울 동료가 생겨. 친구를 동료로 초대할 수도 있단다.", "d32": "심심할 땐 '멀티플레이'에서 친구들과 놀아 보렴. 무료지만 보상은 적어. 진짜 강해지는 길은 하나뿐, 매일 뉴스를 읽는 거야. 더블린에서 좋은 소식을 기다리마!", "stGot": "출정권 5장을 받았어요!"});
/* ===== Story: Ciarán the druid elder. Day 1 (first visit to Adventure): the quest + basics + 5 quest passes.
   Later days: shamrocks & the Wheel of Fate, then allies & multiplayer. ===== */
const STORY={intro:["in1","in2","in3","in4","in5"], d2:["d21","d22","d23"], d3:["d31","d32","d33"]};
function elderArt(mood){ const k="elder-"+(mood||"talk"); return PICS.has(k)?`<img src="assets/art/${k}.webp" alt="" class="st-elder">`:`<div class="st-elder st-elder-ph" aria-hidden="true">🧙‍♂️</div>`; }
function storyDue(){
  const g=game(), st=g.story||{};
  if(!st.intro) return S.view==="adv"&&g.gender?"intro":null;
  if(!st.d2&&st.intro<today()) return "d2";
  if(st.d2&&!st.d3&&st.d2<today()) return "d3";
  return null;
}
function storyCheck(){ if(S.onb||S.story) return; const k=storyDue(); if(k){ S.story={k,step:0}; storyRender(); } }
function storyRender(){
  let el=document.getElementById("story");
  if(!S.story){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="story"; el.className="onb st-wrap"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); document.body.append(el); }
  const P=STORY[S.story.k], i=S.story.step, last=i===P.length-1, mood=last?"happy":i===0?"wave":"talk";
  const btn=last?(S.story.k==="intro"?T("stGift"):S.story.k==="d2"?T("stOk"):T("stGo")):T("stNext");
  el.innerHTML=`<div class="onb-card st-card">${S.story.k!=="intro"?`<button class="onb-skip" data-st="skip">${T("stSkip")}</button>`:""}
    ${elderArt(mood)}<div class="st-name">${T("stName")}</div><p class="st-text">${T(P[i])}</p>
    <div class="onb-dots">${P.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>
    <div class="onb-nav"><button class="btn" data-st="${last?"done":"next"}">${btn}</button>${i>0?`<button class="btn ghost" data-st="back">‹</button>`:""}</div></div>`;
}
function storyDone(){ const g=game(); g.story=g.story||{}; const k=S.story.k;
  g.story[k]=today(); if(k==="intro"&&!g.story.gift){ g.story.gift=1; g.tickets+=5; toast(T("stGot")); if(!S.words.size&&(g.lv||1)<=1) g.story.lock=1; }
  saveGame(); S.story=null; storyRender(); render(); }
document.addEventListener("click",e=>{ const t=e.target.closest("#story [data-st]"); if(!t||!S.story) return; e.stopPropagation(); const a=t.dataset.st;
  if(a==="next"){ S.story.step++; storyRender(); } else if(a==="back"){ S.story.step=Math.max(0,S.story.step-1); storyRender(); } else storyDone(); });
async function fetchT(url,ms){ const c=new AbortController(), t=setTimeout(()=>c.abort(),ms||12000); try{ return await fetch(url,{cache:"no-cache",signal:c.signal}); } finally{ clearTimeout(t); } }
async function loadArticles(){
  S.artFail=false;
  try{
    let j=null;
    for(const b of ART_BASES){ try{ const r=await fetchT(b+"index.json"); if(r.ok){ j=await r.json(); ART_BASE=b; break; } }catch(_){} }
    if(!j) throw 0;
    let rj=null; try{ const r=await fetchT(ART_BASE+"regional.json"); if(r.ok) rj=await r.json(); }catch(_){}
    RAW_INDEX=[...(j.articles||[]), ...((rj&&rj.articles)||[])];
    S.index=RAW_INDEX.filter(a=>!a.region||a.region===regionKey()).sort(byOrder);
    const recent=S.index.slice(0,12);
    const docs=await Promise.all(recent.map(a=>fetchT(ART_BASE+encodeURIComponent(a.id)+".json",20000).then(r=>r.ok?r.json():null).catch(()=>null)));
    S.articles=docs.map((d,i)=>d&&{...d, id:recent[i].id}).filter(Boolean).sort(byOrder);
    if(!S.articles.length) throw 0;
  }catch(e){ S.artFail=true; toast(T("artLoadFail")); }
  S.ready.articles=true; try{ fillMeanings(); }catch(_){} render();
}
document.addEventListener("click",e=>{ if(e.target.closest('[data-act="artRetry"]')){ S.ready.articles=false; render(); loadArticles(); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.artFail){ loadArticles(); } });

Object.assign(STR.zh,{"d32": "無聊的時候，可以到「多人遊戲」和朋友連線玩，免費但獎勵不多。在「排行榜」能看到大家的戰力、雅思成績和閱讀量，每個月重新比一次。", "d33": "想挑戰雅思的話，冒險頁的「IELTS」有模擬測驗，聽力加閱讀約 20 分鐘，交卷馬上看到預估分數。不過真正變強的路只有一條：每天讀新聞。我在都柏林等你的好消息！"});
Object.assign(STR.en,{"d32": "When you're bored, play with friends in Multiplayer. It's free, but the rewards are small. The Leaderboard shows everyone's power, IELTS scores and how much they've read, and it starts fresh every month.", "d33": "If you're aiming for IELTS, the IELTS tab in Adventure has practice tests: listening and reading in about 20 minutes, with an estimated band straight away. But the only real road to strength is reading the news every day. I'll be waiting for good news from Dublin!"});
Object.assign(STR.hi,{"d32": "बोर हो तो मल्टीप्लेयर में दोस्तों के साथ खेलो — मुफ़्त है, पर इनाम कम हैं। लीडरबोर्ड पर सबकी ताक़त, IELTS स्कोर और पढ़ाई दिखती है, और हर महीने नई शुरुआत होती है।", "d33": "अगर IELTS की तैयारी है, तो रोमांच में IELTS टैब पर अभ्यास टेस्ट हैं — लगभग 20 मिनट की सुनना और पढ़ना, और तुरंत अनुमानित बैंड। पर ताक़तवर बनने का असली रास्ता एक ही है: हर दिन ख़बर पढ़ना। डबलिन से अच्छी ख़बर का इंतज़ार रहेगा!"});
Object.assign(STR.es,{"d32": "Cuando te aburras, juega con amigos en Multijugador: es gratis, pero las recompensas son pequeñas. En la Clasificación verás el poder, las notas de IELTS y lo que lee cada uno, y cada mes empieza de nuevo.", "d33": "Si te preparas para el IELTS, en la pestaña IELTS de Aventura hay exámenes de práctica: comprensión auditiva y lectura en unos 20 minutos, con una nota estimada al instante. Pero el único camino para hacerse fuerte es leer las noticias cada día. ¡Espero buenas noticias desde Dublín!"});
Object.assign(STR.ja,{"d32": "退屈なときは「マルチプレイ」で友達と遊ぶといい。無料じゃが、報酬は少なめじゃ。「ランキング」ではみんなの戦力やIELTSの成績、読んだ量が見られる。毎月リセットされるぞ。", "d33": "IELTSを目指すなら、冒険ページの「IELTS」に模擬テストがある。リスニングとリーディングで約20分、終わればすぐに予想スコアがわかる。じゃが本当に強くなる道はただ一つ、毎日ニュースを読むこと。ダブリンからの吉報を待っておるぞ！"});
Object.assign(STR.ko,{"d32": "심심할 땐 '멀티플레이'에서 친구들과 놀아 보렴. 무료지만 보상은 적어. '랭킹'에서는 모두의 전투력, IELTS 점수, 읽은 양을 볼 수 있고 매달 새로 시작한단다.", "d33": "IELTS를 준비한다면 모험 페이지의 'IELTS'에 모의고사가 있어. 듣기와 읽기 약 20분, 끝나면 바로 예상 점수를 볼 수 있지. 하지만 진짜 강해지는 길은 하나뿐, 매일 뉴스를 읽는 거야. 더블린에서 좋은 소식을 기다리마!"});

function viewThinkRun(){

      <div class="row"><button class="btn" data-act="tkhome">${T("tkBack")}</button>${!R.daily?`<button class="btn ghost" data-act="tkprac" data-k="${R.type}">${T("tkMore")}</button>`:""}</div></section></div>`;
  }

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act; if(!/^tk/.test(a)) return;

  if(a==="tkdaily") return tkStart("daily");
  if(a==="tkprac") return tkStart(t.dataset.k);
  if(a==="tkhome"){ clearInterval(S.tkTimer); S.tk=null; S.view="adv"; S.tab="adv"; S.advTab="think"; render(); window.scrollTo(0,0); return; }
  const R=S.tk; if(!R) return;
  if(a==="tksel"){ const i=+t.dataset.k, k=R.sel.indexOf(i); if(k>=0) R.sel.splice(k,1); else if(R.sel.length<4) R.sel.push(i); render(); return; }
  if(a==="tkreset"){ R.sel=[]; render(); return; }
  if(a==="tkgo"){ if(R.sel.length===4) tkAnswer([...R.sel]); return; }
  if(a==="tkpick") return tkAnswer(+t.dataset.k);
  if(a==="tknext") return tkNext();
}, true);

      body+=`<div class="to-grp">${text}${qs.map(x=>toQHtml(x,R,review)).join("")}</div>`; });
  }
  const sub=TO_TABS.map(([s,p],i)=>{ const qs=items.filter(x=>x.part===p); const done=qs.filter(x=>R.ans[x.key]!==undefined&&R.ans[x.key]!=="").length; return {i,done,n:qs.length}; });

function viewToeic(){

function toSubmit(){
  const g=game(), R=g.toeicRun; if(!R) return; toStop(); clearInterval(S.toTimer); trackPlay(R.ranked?"toeic":"toeicPrac");
  const t=toFind(R.test), items=toItems(t), L=items.filter(x=>x.sec==="L"), Rd=items.filter(x=>x.sec==="R");
  const lc=L.filter(x=>toOk(x.q,R.ans[x.key])).length, rc=Rd.filter(x=>toOk(x.q,R.ans[x.key])).length;
  const ls=toSec(lc/L.length), rs=toSec(rc/Rd.length), total=ls+rs, st=toState();
  const res={test:t.id, week:R.week, ranked:R.ranked, lc, rc, lt:L.length, rt:Rd.length, ls, rs, total, ans:R.ans, date:today()};
  const gold=(lc+rc)*(R.ranked?4:1); g.gold+=gold; res.gold=gold;
  if(R.ranked){ st.days[today()]=total; st.hist=(st.hist||[]).concat({week:R.week,total,l:ls,r:rs,date:today()}).slice(-120);
    if(!st.best||total>st.best.total){ st.best={total,date:today()}; res.newBest=true; }
    const k=toTier(total)[1]; st.tiers[k]=(st.tiers[k]||0)+1; res.tier=k;
    const mk=monthKey(), prev=typeof st.months[mk]==="number"?st.months[mk]:-1; st.months[mk]=Math.max(prev,total); if(total>prev) toPush(total,ls,rs,mk); }
  g.toeicRun=null; saveGame(); S.toResult=res; S.toRevTab=0; render(); window.scrollTo(0,0);
}
async function toPush(score,l,r,month){

}

async function toLoadTop(){

document.addEventListener("click",e=>{
  const o=e.target.closest("[data-tok]"); if(o){ const R=game().toeicRun; if(!R) return; e.stopPropagation(); R.ans[o.dataset.tok]=+o.dataset.tov; S.toConfirm=false; saveGame(); render(); return; }
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act; if(!/^to[a-z0-9]+$/.test(a)||["toggle","top"].includes(a)) return;
  const R=game().toeicRun;
  if(a==="toranked"){ e.stopPropagation(); const w=toWeekTest(); if(w) toStart(w.id,true); return; }
  if(a==="topractice"){ e.stopPropagation(); toStart(t.dataset.k,false); return; }
  if(a==="toresume"){ e.stopPropagation(); if(R){ S.view="toeic"; render(); toTick(); } return; }
  if(a==="toplay"){ e.stopPropagation(); toPlay(+t.dataset.k); return; }
  if(a==="totab"){ e.stopPropagation(); toStop(); if(S.toResult) S.toRevTab=+t.dataset.k; else if(R) R.tab=+t.dataset.k; saveGame(); render(); window.scrollTo(0,0); return; }
  if(a==="tosubmit"){ e.stopPropagation(); if(!S.toConfirm){ S.toConfirm=true; render(); return; } S.toConfirm=false; toSubmit(); return; }
  if(a==="toexit"){ e.stopPropagation(); S.toExitAsk=true; render(); return; }
  if(a==="toexitno"){ e.stopPropagation(); S.toExitAsk=false; render(); return; }
  if(a==="toexit2"){ e.stopPropagation(); S.toExitAsk=false; toStop(); clearInterval(S.toTimer); game().toeicRun=null; saveGame(); S.view="adv"; S.tab="adv"; S.advTab="coop"; S.compMode="toeic"; render(); window.scrollTo(0,0); return; }
  if(a==="toback"){ e.stopPropagation(); S.toResult=null; S.view="adv"; S.tab="adv"; S.advTab="coop"; S.compMode="toeic"; TO_TOP=null; render(); window.scrollTo(0,0); return; }
}, true);

/* ================= 彩虹寶庫 · Rainbow Vault (future real-money shop) + gifting =================
   The paid items are placeholders until payments are added (shown as "coming soon"; developer mode can test-claim them).
   Gifting (works now, needs sign-in on both sides): the sender picks a nickname and items, checks twice, pays a gold fee;
   the items leave the sender's bag at once and wait in Firestore gifts/{id} (status pending).
   The receiver checks twice and accepts (items added) or declines (the sender can take them back; the fee is not refunded).
   The sender may also take back a gift that is still pending. */
const VAULT_ITEMS=[
  {id:"charm3", kind:"charm", n:3, ic:"🪄", pay:"charm3", price:"€1", test:true}, {id:"charm10", kind:"charm", n:10, ic:"🪄"},
  {id:"gold5k", kind:"gold", n:5000, ic:"🪙"}, {id:"gold20k", kind:"gold", n:20000, ic:"💰"}, {id:"gold60k", kind:"gold", n:60000, ic:"👑"}];
const GIFT={feeShard:[10,20,40,80], feeGem:[40,80,160,320], feeCharm:60, minFee:20, maxEach:20};
function giftFee(it){ let f=0; for(const [k,n] of Object.entries(it.gems||{})) f+=n*GIFT.feeGem[+k.split("-")[1]]; for(const [k,n] of Object.entries(it.shards||{})) f+=n*GIFT.feeShard[+k.split("-")[1]]; f+=(it.charms||0)*GIFT.feeCharm; return f?Math.max(GIFT.minFee,f):0; }
function giftCount(it){ return Object.values(it.gems||{}).reduce((a,b)=>a+b,0)+Object.values(it.shards||{}).reduce((a,b)=>a+b,0)+(it.charms||0); }
const shardName=k=>{ const [e,t]=k.split("-"); return T("pShard",{e:elName(e),t:TIER[+t].n,n:1}).replace(/\s*×\s*1$/,""); };
function giftLines(it){ const out=[]; for(const [k,n] of Object.entries(it.gems||{})) if(n) out.push(`${gemDot(k)} ${esc(gemName(k))} ×${n}`); for(const [k,n] of Object.entries(it.shards||{})) if(n) out.push(`💠 ${esc(shardName(k))} ×${n}`); if(it.charms) out.push(`🪄 ${esc(T("charmName"))} ×${it.charms}`); return out; }
function giftApply(it, sign){ const g=game(), gs=gemsOf(), sh=shardsOf();
  for(const [k,n] of Object.entries(it.gems||{})){ gs[k]=(gs[k]||0)+sign*n; if(gs[k]<=0) delete gs[k]; }
  for(const [k,n] of Object.entries(it.shards||{})){ sh[k]=(sh[k]||0)+sign*n; if(sh[k]<=0) delete sh[k]; }
  g.charms=Math.max(0,(g.charms||0)+sign*(it.charms||0)); }
function giftHave(it){ const g=game(), gs=gemsOf(), sh=shardsOf();
  return Object.entries(it.gems||{}).every(([k,n])=>(gs[k]||0)>=n) && Object.entries(it.shards||{}).every(([k,n])=>(sh[k]||0)>=n) && (g.charms||0)>=(it.charms||0); }

let GIFT_IN=null;   // {at, recv:[...], sent:[...]}
async function giftLoad(force){
  if(!CLOUD.user||!CLOUD.fb||SANDBOX()) return; if(!force&&GIFT_IN&&Date.now()-GIFT_IN.at<90e3) return;
  GIFT_IN={...(GIFT_IN||{recv:[],sent:[]}), at:Date.now()};
  const {fsM,db}=CLOUD.fb, me=CLOUD.user.uid, q=(f,v)=>fsM.query(fsM.collection(db,"gifts"), fsM.where(f,"==",v), fsM.limit(30));
  try{ const [a,b]=await Promise.all([fsM.getDocs(q("to",me)), fsM.getDocs(q("from",me))]); const recv=[], sent=[];
    a.forEach(d=>{ const x={id:d.id,...safeDoc(d.data())}; if(x.to===me) recv.push(x); }); b.forEach(d=>{ const x={id:d.id,...safeDoc(d.data())}; if(x.from===me) sent.push(x); });
    const by=(x,y)=>String(y.at||"").localeCompare(String(x.at||"")); recv.sort(by); sent.sort(by);
    GIFT_IN={at:Date.now(), recv, sent}; recv.filter(x=>x.status==="done").forEach(giftClaim); }catch(e){ console.warn("gifts",e&&e.code); GIFT_IN={at:Date.now(), recv:[], sent:[], err:true}; }
  if(S.view==="adv") render(); }
const giftPending=()=>GIFT_IN?GIFT_IN.recv.filter(x=>x.status==="pending").length+GIFT_IN.sent.filter(x=>x.status==="accepted").length:0;
// the receiver collects a gift only after the sender taps Complete (status "done" -> "claimed", once, in a transaction)
const GIFT_CLAIMING=new Set();
async function giftClaim(x){
  if(!CLOUD.fb||!CLOUD.user||GIFT_CLAIMING.has(x.id)) return; GIFT_CLAIMING.add(x.id);
  const {fsM,db}=CLOUD.fb, ref=fsM.doc(db,"gifts",x.id), me=CLOUD.user.uid;
  try{ await fsM.runTransaction(db, async tx=>{ const snap=await tx.get(ref); const d=snap.exists()?snap.data():null;
      if(!d||d.status!=="done"||d.to!==me) throw new Error("state");
      tx.update(ref,{status:"claimed", doneAt:new Date().toISOString()}); });
    giftApply(x.items||{},1); x.status="claimed"; saveGame(); toast(T("giftGot",{n:x.fromName||"?"})); if(S.view==="adv") render(); }
  catch(e){ console.warn("gift claim",e&&(e.code||e.message)); }
  GIFT_CLAIMING.delete(x.id); }
async function giftFind(){
  const n=(($("#giftNick")||{}).value||"").trim(); if(!n) return toast(T("sbNickPh"));
  if(!CLOUD.user||!CLOUD.fb) return toast(T("giftLogin"));
  const {fsM,db}=CLOUD.fb;
  try{ const nd=await fsM.getDoc(fsM.doc(db,"nicks",nickKey(n))); if(!nd.exists()) return toast(T("sbNoNick")); const to=nd.data().uid;
    if(to===CLOUD.user.uid) return toast(T("giftSelf"));
    S.gift={...(S.gift||{}), to, toName:n.slice(0,16), items:(S.gift&&S.gift.items)||{gems:{},shards:{},charms:0}, ask:false}; render(); }
  catch(e){ toast(T("giftFail")); } }
function giftStep(kind, k, d){ const G=S.gift; if(!G) return; const it=G.items, g=game();
  if(kind==="charm"){ it.charms=Math.max(0,Math.min(g.charms||0, GIFT.maxEach, (it.charms||0)+d)); }
  else { const box=kind==="gem"?it.gems:it.shards, have=(kind==="gem"?gemsOf():shardsOf())[k]||0; box[k]=Math.max(0,Math.min(have,GIFT.maxEach,(box[k]||0)+d)); if(!box[k]) delete box[k]; }
  G.ask=false; render(); }
async function giftSend(){
  const G=S.gift, g=game(); if(!G||!G.to) return; const it=G.items, fee=giftFee(it);
  if(!giftCount(it)) return toast(T("giftEmpty"));
  if(!giftHave(it)) return toast(T("giftNotEnough"));
  if(g.gold<fee) return toast(T("noGold",{n:fee-g.gold}));
  if(!G.ask){ G.ask=true; render(); return; }   // first check: show the summary; second tap sends
  if(!CLOUD.user||!CLOUD.fb) return toast(T("giftLogin"));
  const clean={gems:{...it.gems}, shards:{...it.shards}, charms:it.charms||0};
  giftApply(clean,-1); g.gold-=fee; saveGame();
  const {fsM,db}=CLOUD.fb; const name=(g.nick||CLOUD.user.displayName||"").slice(0,16);
  const gid=CLOUD.user.uid.slice(0,6)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{ await fsM.setDoc(fsM.doc(db,"gifts",gid),{from:CLOUD.user.uid, fromName:name, to:G.to, toName:G.toName, items:clean, fee, status:"pending", at:new Date().toISOString(), doneAt:""});
    S.gift=null; toast(T("giftSent",{n:G.toName})); giftLoad(true); }
  catch(e){ giftApply(clean,1); g.gold+=fee; saveGame(); toast(T("giftFail")); console.warn("gift",e&&e.code); }
  render(); }
async function giftAct(id, act){
  const x=GIFT_IN&&(GIFT_IN.recv.concat(GIFT_IN.sent)).find(y=>y.id===id); if(!x||!CLOUD.fb) return;
  const ask=id+"|"+act; if(act!=="accept"&&S.giftAsk!==ask){ S.giftAsk=ask; render(); return; }   // one tap to accept (the sender still has to Complete); everything else needs a second tap
  S.giftAsk=null;
  const next={accept:"accepted", decline:"declined", cancel:"cancelled", reclaim:"returned", complete:"done"}[act];
  const need={accept:["pending"], decline:["pending"], cancel:["pending","accepted"], reclaim:["declined"], complete:["accepted"]}[act], me=CLOUD.user&&CLOUD.user.uid;
  const {fsM,db}=CLOUD.fb, ref=fsM.doc(db,"gifts",id);

async function payBuy(id){
  const v=VAULT_ITEMS.find(i=>i.id===id); if(!v||PAY_BUSY) return;
  if(!CLOUD.user) return toast(T("payLogin"));
  PAY_BUSY=true; render(); toast(T("payGo"));

    const r=await fetch(PAY_FN+"/createCheckout",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({item:v.pay,lang:({zh:"zh-TW",cn:"zh"})[langKey()]||langKey()})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.url){ location.href=j.url; return; }
    toast(j.error==="closed"?T("vaultSoon"):T("payFail")); console.warn("checkout",r.status,j); }

async function payLoad(waitSid, tries){
  if(!CLOUD.user||!CLOUD.fb||SANDBOX()) return;
  const {fsM,db}=CLOUD.fb, me=CLOUD.user.uid;
  try{ const q=await fsM.getDocs(fsM.query(fsM.collection(db,"purchases"),fsM.where("uid","==",me),fsM.limit(40)));
    const L=[]; q.forEach(d=>{ const x={id:d.id,...d.data()}; if(x.uid===me) L.push(x); });
    L.sort((a,b)=>String(b.id).localeCompare(String(a.id))); PAY_IN=L;
    for(const x of L){
      if(x.status==="paid"&&!x.claimed) await payClaim(x,"claim");
      else if((x.status==="refunded"||x.status==="disputed")&&x.claimed&&!x.revoked) await payClaim(x,"revoke");
    }
    // just came back from Stripe: the webhook can take a few seconds
    if(waitSid){ const w=L.find(x=>x.id===waitSid); if(!w||w.status==="open"){ if((tries||0)<12){ if(!tries) toast(T("payPending")); setTimeout(()=>payLoad(waitSid,(tries||0)+1),3000); } else toast(T("payFail")); } }
  }catch(e){ console.warn("purchases",e&&e.code); }
  if(S.view==="adv") render(); }
async function payClaim(x, mode){
  const {fsM,db}=CLOUD.fb, ref=fsM.doc(db,"purchases",x.id);
  try{ await fsM.runTransaction(db, async tx=>{ const sn=await tx.get(ref); const d=sn.exists()?sn.data():null;
      if(!d||d.uid!==CLOUD.user.uid) throw new Error("state");
      if(mode==="claim"){ if(d.status!=="paid"||d.claimed) throw new Error("state"); tx.update(ref,{claimed:true, claimedAt:new Date().toISOString()}); }
      else { if(!d.claimed||d.revoked||!(d.status==="refunded"||d.status==="disputed")) throw new Error("state"); tx.update(ref,{revoked:true, revokedAt:new Date().toISOString()}); } });
    if(mode==="claim"){ payGrant(x.grant,1); x.claimed=true; payShowDone(x); if(typeof sfx==="function") sfx("prize"); }
    else { payGrant(x.grant,-1); x.revoked=true; toast(T("payRevoked")); }
    saveGame(); }
  catch(e){ if(e&&e.message!=="state") console.warn("purchase claim",e&&(e.code||e.message)); } }

const examOn=()=>S.view==="ielts"||S.view==="toeic";   // IELTS / TOEIC test in progress: no music, no effects
function sfx(name){ if(!SND.opt.sfx||examOn()) return; if(typeof name==="number") return sfxTone(...arguments); const c=sndInit(); if(!c||!SFX[name]) return; try{ SFX[name](c.currentTime+0.01); }catch(e){} }
function sndToggle(k){ SND.opt[k]=!SND.opt[k]; sndSave(); if(k==="music"){ if(SND.opt.music){ SND.track=null; musicForView(); } else musicPlay(null); } else if(SND.opt.sfx) sfx("tap"); }
function soundCard(){ return `<section class="card set-sec"><b>🔊 ${T("sndTitle")}</b><span class="muted sm-t">${T("sndSub")}</span>
  <div class="row"><button class="btn sm ${SND.opt.music?"":"ghost"}" data-act="sndmusic">🎵 ${T("sndMusic")}：${SND.opt.music?T("sndOn"):T("sndOff")}</button><button class="btn sm ${SND.opt.sfx?"":"ghost"}" data-act="sndsfx">💥 ${T("sndSfx")}：${SND.opt.sfx?T("sndOn"):T("sndOff")}</button></div></section>`; }
// the browser only allows sound after a tap: unlock on the first one, then start the right music
document.addEventListener("pointerdown",()=>{ if(!SND.ctx&&(SND.opt.music||SND.opt.sfx)){ sndInit(); musicForView(); } else if(SND.ctx&&SND.ctx.state==="suspended") SND.ctx.resume().catch(()=>{}); },{capture:true});
document.addEventListener("visibilitychange",()=>{ if(!SND.ctx) return; if(document.hidden) SND.ctx.suspend().catch(()=>{}); else SND.ctx.resume().catch(()=>{}); });
document.addEventListener("click",e=>{ const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(a==="sndmusic"||a==="sndsfx"){ e.stopPropagation(); sndToggle(a==="sndmusic"?"music":"sfx"); render(); } }, true);
