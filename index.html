<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: phone app shell — sticky masthead, one scrolling column, bottom tab bar; article set like a newspaper column */
:root{
  --paper:#F2F5F3; --card:#FFFFFF; --ink:#18221F; --muted:#5B6A66; --line:#D3DCD8;
  --accent:#1D6A5A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7;
  --gorse:#F0BE45; --gorse-soft:#FBEBC0; --good:#2E8B57; --good-soft:#DDF1E4; --bad:#C0443B; --bad-soft:#F7DEDB;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-read:"Newsreader","Iowan Old Style",Georgia,"Kohinoor Devanagari","Noto Sans Devanagari",serif;
  --f-ui:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Kohinoor Devanagari","Noto Sans Devanagari",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111816; --card:#19221F; --ink:#E4ECE9; --muted:#93A29D; --line:#2B3632;
  --accent:#5DB6A1; --accent-ink:#0D1513; --accent-soft:#1E3530;
  --gorse:#E2B23B; --gorse-soft:#3D3318; --good:#5CC48A; --good-soft:#1B3527; --bad:#E7756B; --bad-soft:#3E2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816; --card:#19221F; --ink:#E4ECE9; --muted:#93A29D; --line:#2B3632;
  --accent:#5DB6A1; --accent-ink:#0D1513; --accent-soft:#1E3530;
  --gorse:#E2B23B; --gorse-soft:#3D3318; --good:#5CC48A; --good-soft:#1B3527; --bad:#E7756B; --bad-soft:#3E2220; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
html:lang(ja){--f-ui:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;--f-read:"Newsreader","Iowan Old Style",Georgia,"Hiragino Mincho ProN","Noto Serif JP",serif}
html:lang(ko){--f-ui:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--f-read:"Newsreader","Iowan Old Style",Georgia,"AppleMyungjo","Noto Serif KR",serif}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.mast small{text-align:right}
.brand span{color:var(--accent)}
.mast small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Today: three steps */
.hero h1{font-size:26px;line-height:1.15;margin-top:4px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.step.now{border-color:var(--accent)}
.step.now .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.step.locked{opacity:.55}
.step b{display:block;font-size:15px}
.step span.s{font-size:13px;color:var(--muted)}
.step .go{font-size:13px;color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* Article */
.art-head h1{font-family:var(--f-read);font-weight:600;font-size:28px;line-height:1.18;margin:6px 0 8px}
.art-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.art-meta a{color:var(--accent)}
.zh-sum{font-size:14px;color:var(--muted);border-left:3px solid var(--gorse);padding-left:10px}
.article{font-family:var(--f-read);font-size:20px;line-height:1.62;max-width:65ch}
.article p{margin:0 0 1em}
.w{border-radius:3px;padding:0 1px;margin:0 -1px;cursor:pointer;transition:background .15s}
.w:active{background:var(--accent-soft)}
.w.known{text-decoration:underline dotted var(--accent);text-underline-offset:4px}
.w.hit{background:var(--gorse-soft);box-shadow:inset 0 -2px 0 var(--gorse)}
.tip{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tip i{display:inline-block;width:18px;height:12px;background:var(--gorse-soft);box-shadow:inset 0 -2px 0 var(--gorse);border-radius:2px}
.lock{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.12);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet .wd{font-family:var(--f-read);font-size:30px;font-weight:600;display:flex;align-items:center;gap:10px}
.sheet .zh{font-size:22px;margin:6px 0 4px;font-weight:600}
.pos{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);font-family:var(--f-ui);font-weight:500}
.say{background:var(--accent-soft);color:var(--accent);border:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.say svg{width:18px;height:18px}
.ex{font-family:var(--f-read);font-style:italic;color:var(--muted);font-size:16px;margin-top:10px}
.ex b{font-style:normal;color:var(--ink)}
/* Quiz */
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{display:flex;flex-direction:column;gap:14px}
.qprompt{font-family:var(--f-read);font-size:32px;font-weight:600;line-height:1.2}
.qprompt.zh{font-family:var(--f-ui);font-size:26px}
.qprompt.cloze{font-size:20px;font-weight:400;line-height:1.5}
.qprompt.cloze u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 1.5em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;font-size:16px}
.opt.en{font-family:var(--f-read);font-size:19px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;min-height:21px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.score{font-family:var(--f-display);font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
/* Dictionary */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dict{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ent{border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent>button{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.ent .en{font-family:var(--f-read);font-size:19px;font-weight:600}
.ent .z{grid-column:1;font-size:14px;color:var(--muted);min-width:0}
.ent .acc{grid-row:1/3;grid-column:2;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.meter{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600}
.chip.new{background:var(--gorse-soft);color:var(--ink)}
.more{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.arch{display:flex;flex-direction:column;gap:10px}
.arch button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.arch b{font-family:var(--f-read);font-size:18px;font-weight:600;line-height:1.25}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
.danger{color:var(--bad);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.topic{background:var(--accent-soft);color:var(--accent)}
.optm{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:2px}
.exp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.exp.bad{border-color:var(--bad)}
.exp p{margin:0}
.exp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exp-head .en{font-family:var(--f-read);font-size:21px;font-weight:600}
.exp-head .z{color:var(--muted);flex:1;min-width:0}
.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.mark.ok{background:var(--good-soft);color:var(--good)} .mark.no{background:var(--bad-soft);color:var(--bad)}
.lab{display:inline-block;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--muted);margin-right:8px;text-transform:uppercase}
.mist{background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.en-i{font-family:var(--f-read);font-style:italic;font-size:16px}
.en-i b{font-style:normal}

/* ---- adventure ---- */
:root{--metal:#A8861F;--wood:#3C8A4A;--water:#2A68B0;--fire:#C9461D;--earth:#8B6235;--none:#8A9592;--night:#16211E;--night-ink:#EAF2EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--metal:#E0BE55;--wood:#6CC27A;--water:#6AA6EC;--fire:#F07A4F;--earth:#C9965F;--none:#7F8B88;--night:#0B1210;--night-ink:#E4ECE9}}
:root[data-theme="dark"]{--metal:#E0BE55;--wood:#6CC27A;--water:#6AA6EC;--fire:#F07A4F;--earth:#C9965F;--none:#7F8B88;--night:#0B1210;--night-ink:#E4ECE9}
.mast small b{color:var(--accent);font-variant-numeric:tabular-nums}
.el{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;vertical-align:middle;flex:none;font-family:var(--f-ui)}
.el.big{width:40px;height:40px;font-size:19px;border-radius:12px}
.el-metal{background:var(--metal)}.el-wood{background:var(--wood)}.el-water{background:var(--water)}.el-fire{background:var(--fire)}.el-earth{background:var(--earth)}.el-none{background:var(--none)}
.el-fill-metal{fill:var(--metal)}.el-fill-wood{fill:var(--wood)}.el-fill-water{fill:var(--water)}.el-fill-fire{fill:var(--fire)}.el-fill-earth{fill:var(--earth)}
.mon-seal.el-bg-metal{--c:var(--metal)}.mon-seal.el-bg-wood{--c:var(--wood)}.mon-seal.el-bg-water{--c:var(--water)}.mon-seal.el-bg-fire{--c:var(--fire)}.mon-seal.el-bg-earth{--c:var(--earth)}
.adv-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--night);color:var(--night-ink);border:0;border-radius:var(--r);padding:14px 16px}
.adv-banner span{display:flex;flex-direction:column;gap:2px}.adv-banner .muted{color:var(--night-ink);opacity:.7;font-size:13px}.adv-banner .go{color:var(--gorse);font-weight:700}
.reward{background:var(--card);border:1.5px solid var(--gorse);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.reward.win{border-color:var(--good)}.reward.lose{border-color:var(--bad)}
.rw-row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}.rw-row b{font-family:var(--f-display)}
.rw-row.lvup b{color:var(--accent);font-size:20px}
.hero-card{background:var(--night);color:var(--night-ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero-card .eyebrow{color:var(--night-ink);opacity:.65}.hero-nick{opacity:1;font-size:13px;letter-spacing:0;text-transform:none}
.nk{font-weight:800}.nk0{color:#9AA3A0}.nk1{color:#F2F5F3}.nk2{color:#5CD685;text-shadow:0 0 4px rgba(92,214,133,.35)}.nk3{color:#5AA9FF;text-shadow:0 0 5px rgba(90,169,255,.45)}
.nk4{color:#C08BFF;text-shadow:0 0 6px rgba(192,139,255,.55)}.nk5{color:#FFA24A;text-shadow:0 0 7px rgba(255,162,74,.6)}.nk6{color:#FF5E5E;text-shadow:0 0 8px rgba(255,94,94,.7),0 0 2px #fff}
.nk7{background:linear-gradient(90deg,#FF5E5E,#FFD25A,#5CD685,#5AA9FF,#C08BFF,#FF5E5E);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,210,90,.6));animation:nkflow 3s linear infinite}
@keyframes nkflow{to{background-position:200% 0}}@media (prefers-reduced-motion:reduce){.nk7{animation:none}}
.hc-top{display:flex;align-items:flex-end;gap:16px}.hc-top>div:first-child{flex:1}.hc-top h2{font-size:30px}
.purse{text-align:right}.purse b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gorse);font-variant-numeric:tabular-nums}.purse span{font-size:11px;opacity:.7}
.xp{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.xp i{display:block;height:100%;background:var(--gorse)}
.hero-card .muted{color:var(--night-ink);opacity:.7}
.hc-stats{display:flex;gap:16px;font-size:14px}.hc-stats b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}
.slot span{display:flex;flex-direction:column;min-width:0}.slot small{opacity:.6;font-size:11px}
.rules summary{cursor:pointer;font-weight:600}.rules p{font-size:14px;margin:8px 0 0}
.region{display:flex;flex-direction:column;gap:8px}.region.locked{opacity:.5}
.rg-head{display:flex;justify-content:space-between;align-items:flex-end}.rg-head h3{font-size:18px}
.mons,.items{display:flex;flex-direction:column;gap:8px}
.mon,.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.item.on{border-color:var(--accent)}
.it-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;font-size:13px}.it-main b{font-size:15px}
.tier{font-family:var(--f-display);color:var(--muted);font-size:12px}
.go-t{color:var(--accent);font-weight:700;font-size:14px}
.btn.sm{padding:7px 14px;font-size:13px;flex:none}.sm-t{font-size:12px;flex:none}
.adv{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--muted);font-weight:600}
.adv.good{background:var(--good-soft);color:var(--good)}.adv.bad{background:var(--bad-soft);color:var(--bad)}
.vs{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.lore{font-family:var(--f-read);font-style:italic;color:var(--muted);margin:4px 0 0;font-size:15px}
.mon-seal{--c:var(--none);aspect-ratio:1;max-width:100%;border-radius:22px;background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--c) 75%,#fff), var(--c) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);transition:transform .15s}
.mon-seal.boss{box-shadow:inset 0 0 0 3px var(--gorse),0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.ms-el{font-size:44px;font-weight:800;line-height:1;font-family:var(--f-ui)}.ms-name{font-size:11px;font-weight:600;opacity:.9;text-align:center;padding:0 6px}
.mon-seal.hit,.you.hit .you-card{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.mon-seal.hit,.you.hit .you-card{animation:none}}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end;background:var(--night);border-radius:18px;padding:16px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.you-card{background:rgba(255,255,255,.08);color:var(--night-ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.hp{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.hp i{display:block;height:100%;transition:width .3s}.hp.m i{background:var(--bad)}.hp.p i{background:var(--good)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.blog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:260px;overflow:auto}
.blog li{padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.blog li.lm{color:var(--bad)} .blog li.lp b{color:var(--accent)}
.mast-r{display:flex;align-items:center;gap:10px}
.help-btn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);font-weight:800;font-size:16px;line-height:1;display:grid;place-items:center}
.help-sheet{max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.help-sheet h2{font-size:22px;margin:4px 0}.help-sec{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}.help-sec .hi{font-size:22px;line-height:1.2}.help-sec b{font-size:16px}.help-sec p{grid-column:2;margin:0;font-size:14px;line-height:1.6;color:var(--ink)}.help-close{background:var(--accent-soft);border-radius:var(--r);padding:16px;margin:8px 0 12px;font-size:15px;line-height:1.6}.help-close i{display:block;text-align:right;font-style:normal;color:var(--muted);margin-top:6px}
header.mast.dev{box-shadow:inset 0 -3px 0 var(--bad)}header.mast.dev .brand::after{content:"DEV";margin-left:8px;font-size:11px;background:var(--bad);color:#fff;border-radius:6px;padding:2px 6px;vertical-align:middle}
.dev-card{display:flex;flex-direction:column;gap:10px;border:2px solid var(--bad)}.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dev-grid .btn{padding:9px 8px;font-size:13px}
.dev-foot{display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px 0 4px}.ver{background:none;border:0;color:var(--muted);font-size:12px;padding:8px}
.lang-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--ink);min-width:36px}
.el{font-size:11px}.el.big{font-size:16px}
.conq-head{display:flex;flex-direction:column;gap:6px}
.conq-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.conq-bar i{display:block;height:100%;background:var(--gorse)}
.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:70px}
.ire-map{width:100%;max-width:380px;display:block;margin:0 auto}
.land{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round}
.tw{cursor:pointer}.tw-hit{fill:transparent}
.tw-own{fill:var(--gorse);stroke:var(--ink);stroke-width:1.5}
.tw-open{stroke:#fff;stroke-width:1.5}
.tw-lock{fill:var(--none);opacity:.55}
.tw-ring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2}
.tw-lab{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;font-family:var(--f-ui)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.lg{display:inline-block;width:11px;height:11px;border-radius:50%}
.lg.tw-own{background:var(--gorse);border:1.5px solid var(--ink)}.lg.tw-lock{background:var(--none)}.lg-open{background:linear-gradient(90deg,var(--metal),var(--wood),var(--water),var(--fire),var(--earth))}
.town-card{background:var(--card);border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.town-card.own{border-color:var(--gorse)}
.tc-top{display:flex;gap:12px;align-items:center}
.mon.own{border-color:var(--gorse)}.mon.locked{opacity:.55}
.lvl-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt b{display:block}
.mon-seal{position:relative;overflow:hidden}
.ms-art{width:86%;height:86%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.ms-badge{position:absolute;top:8px;right:8px}
.thumb{position:relative;flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--c) 70%,#fff), var(--c) 75%)}
.thumb.sm{width:52px;height:52px;border-radius:13px}
.thumb .mon-art{width:90%;height:90%}
.thumb .el{position:absolute;right:-4px;bottom:-4px;box-shadow:0 0 0 2px var(--card)}
.el-th-metal{--c:var(--metal)}.el-th-wood{--c:var(--wood)}.el-th-water{--c:var(--water)}.el-th-fire{--c:var(--fire)}.el-th-earth{--c:var(--earth)}
.mon.locked .thumb{filter:grayscale(.85)}
.wx{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.wx-row{display:flex;flex-direction:column;gap:6px}
.wx-row .lab{margin:0}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-family:var(--f-read);font-size:16px}
.wx-row .en-i{font-size:17px;line-height:1.5}
.sm-say{width:30px;height:30px;align-self:flex-start}
.sm-say svg{width:15px;height:15px}
.sheet{max-height:85vh;overflow-y:auto}
.acct{display:flex;flex-direction:column;gap:10px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;align-self:flex-start}
.avatar{width:36px;height:36px;border-radius:50%;flex:none}
.bad-t{color:var(--bad)}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rk-row{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;column-gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.rk-row:last-child{border-bottom:0}.rk-row.me{background:var(--accent-soft)}
.rk-n{grid-row:1/3;font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.rk-name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk-sub{grid-column:2;font-size:12px}
.rk-v{grid-row:1/3;grid-column:3;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.rk-me{font-weight:700;color:var(--accent)}
.nick{display:flex;flex-direction:column;gap:8px}
.co-box{display:flex;flex-direction:column;gap:14px}
.co-hero{display:flex;gap:14px;align-items:center}.co-art{width:72px;height:72px;flex:none}.co-art svg{width:100%;height:100%}
.co-wait{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.co-code{font-family:var(--f-display);font-size:52px;font-weight:700;letter-spacing:.15em;font-variant-numeric:tabular-nums;color:var(--accent)}
.co-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:3;background:var(--paper);padding-block:6px;display:flex;flex-direction:column;gap:6px}
.co-bar{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;font-size:12px;font-weight:700}
.co-bar .hp{background:var(--line)}
.co-text{font-size:19px}
.cw{cursor:pointer;border-radius:4px;padding:0 1px}
.cw:active{background:var(--accent-soft)}
.cw.bad{background:var(--bad-soft);animation:shake .3s}
.cw.fixed s,.cw.missed s{color:var(--muted)}
.cw.fixed ins{text-decoration:none;font-weight:700;border-radius:4px;padding:0 3px}
.cw.mine ins{background:var(--good-soft);color:var(--good)}.cw.mate ins{background:var(--gorse-soft);color:var(--ink)}
.cw.missed ins{text-decoration:none;font-weight:700;color:var(--bad)}
.co-list{display:flex;flex-direction:column;gap:8px}
.co-err{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.cw.bad{animation:none}}
/* ---- five-element chart ---- */
:root{--gen:#2E9B45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gen:#5CC877}}
:root[data-theme="dark"]{--gen:#5CC877}
.cycle{width:100%;max-width:310px;display:block;margin:10px auto 0}
.cy-gen{fill:none;stroke:var(--gen);stroke-width:3.2}.cy-gen-h{fill:var(--gen)}
.cy-beat{stroke-width:2.6}.cy-s-metal{stroke:var(--metal)}.cy-s-wood{stroke:var(--wood)}.cy-s-water{stroke:var(--water)}.cy-s-fire{stroke:var(--fire)}.cy-s-earth{stroke:var(--earth)}
.cy-n{stroke:var(--card);stroke-width:3}
.cy-t{fill:#fff;font-weight:700;font-size:11.5px;font-family:var(--f-ui)}.cy-t.big{font-size:20px}
.cy-tag rect{fill:var(--card);stroke-width:1.8}.cy-tag text{font-size:11px;font-weight:700;font-family:var(--f-ui)}
.cy-tag.gen rect{stroke:var(--gen)}.cy-tag.gen text{fill:var(--gen);font-size:12px}
.cy-c-metal rect{stroke:var(--metal)}.cy-c-metal text{fill:var(--metal)}.cy-c-wood rect{stroke:var(--wood)}.cy-c-wood text{fill:var(--wood)}
.cy-c-water rect{stroke:var(--water)}.cy-c-water text{fill:var(--water)}.cy-c-fire rect{stroke:var(--fire)}.cy-c-fire text{fill:var(--fire)}
.cy-c-earth rect{stroke:var(--earth)}.cy-c-earth text{fill:var(--earth)}
/* ---- dictionary review card ---- */
.rev-card{display:flex;gap:12px;align-items:flex-start;background:var(--gorse-soft);border:1.5px solid var(--gorse);border-radius:var(--r);padding:14px}
.rev-ic{color:var(--gorse);flex:none;padding-top:2px}.rev-ic svg{width:34px;height:34px}
.rev-main{display:flex;flex-direction:column;gap:6px;min-width:0}.rev-main .btn{align-self:flex-start;padding:9px 18px;font-size:14px}
.rev-left{font-size:13px;font-weight:600;color:var(--ink)}
/* ---- lucky house ---- */
.luck{display:flex;flex-direction:column;gap:12px}
.luck h3{font-size:18px;margin-bottom:6px}
.luck-head{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:14px 16px}
.luck-head .eyebrow{color:var(--night-ink);opacity:.65}.luck-head p{grid-column:1/-1;margin:4px 0 0;color:var(--night-ink);opacity:.75}
.luck-head .btn{grid-column:1/-1;justify-self:start;color:var(--gorse);border-color:rgba(255,255,255,.25)}
.lh-ic{color:var(--gorse)}.lh-ic svg{width:40px;height:40px}.lh-n{font-family:var(--f-display);font-size:30px;color:var(--gorse);font-variant-numeric:tabular-nums;line-height:1}
.wheel-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}.wheel-card h3{align-self:flex-start}
.wheel{position:relative;width:min(280px,100%);aspect-ratio:1}
.wheel-disc{width:100%;height:100%;transform-origin:50% 50%}.wheel-disc svg{width:100%;height:100%;display:block}
.wheel-ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.wh-big{fill:#fff;font:800 15px var(--f-display);text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2.4px}
.wh-small{fill:#fff;font:600 8.5px var(--f-ui);text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:2px}
.wheel-msg{min-height:22px;font-weight:700;color:var(--accent)}
.sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.sc-shop{border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;color:#2A2010;min-width:0}
.sc-shop b{font-size:14px}.sc-shop .btn{padding:7px 8px;font-size:12px;width:100%}
.sc-bronze{background:linear-gradient(135deg,#E9B98C,#B87333)}.sc-silver{background:linear-gradient(135deg,#F1F3F5,#AEB6BD)}.sc-gold{background:linear-gradient(135deg,#FBE38A,#D9A520)}
.odds-tiers{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-variant-numeric:tabular-nums;justify-content:center}.odds-tiers em{font-style:normal;font-weight:700;margin-right:3px}
.odds-tiers.sm{font-size:11px;gap:2px 6px}
.sh-grid{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sh-row{display:grid;grid-template-columns:40px repeat(4,1fr);gap:6px;align-items:center}
.sh-head span{text-align:center;font-weight:700;font-size:13px;color:var(--muted)}
.sh-cell{position:relative;height:40px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;overflow:hidden;background:var(--card)}
.sh-cell b{font-variant-numeric:tabular-nums;z-index:1}.sh-cell i{position:absolute;left:0;bottom:0;height:4px;background:var(--gorse)}
.sh-cell.zero{color:var(--muted);opacity:.6}
.sh-cell.ready{background:var(--gorse);border-color:var(--gorse);color:#2A2010;font-weight:700;animation:pulse 1.6s ease-in-out infinite}.sh-cell.ready span{font-size:11px}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.sh-cell.ready{animation:none}}
.odds summary{cursor:pointer;font-weight:600}.odds h4{margin:12px 0 4px;font-size:14px}.odds .rw-row{font-size:13px;padding:2px 0}
.odds-sc{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-top:1px solid var(--line)}.odds-sc .odds-tiers{justify-content:flex-start}
.sc-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;width:min(340px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px;align-items:stretch}.sc-modal.fresh{animation:pop .2s ease-out}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}}
.sc-ticket{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;color:#2A2010;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.sc-name{font:800 18px var(--f-display);text-align:center}
.sc-win{position:relative;height:150px;border-radius:12px;background:#FFFDF6;overflow:hidden}
.sc-prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;color:#2A2010}
.sc-prize b{font-size:16px}.sc-x2{position:absolute;top:8px;right:10px;font:800 16px var(--f-display);color:#C0443B}
.sc-win.open .sc-prize{animation:pop2 .4s ease-out}@keyframes pop2{from{transform:scale(.7);opacity:0}}
#scCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.sc-hint{text-align:center;font-size:13px;font-weight:600}
.sc-modal>.btn{background:var(--card);color:var(--accent)}.sc-modal>.btn:not(.ghost){background:var(--accent);color:var(--accent-ink)}
.set-sec{display:flex;flex-direction:column;gap:10px}.set-opt{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.sup{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--gorse);background:var(--gorse-soft)}.sup-cup{font-size:30px;line-height:1}.sup-main{display:flex;flex-direction:column;gap:6px}.sup-main .btn{align-self:flex-start;text-decoration:none;padding:8px 16px;font-size:14px}
/* ---- gear tiles ---- */
.it-tile{position:relative;flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 75%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.it-tile.sm{width:38px;height:38px;border-radius:10px}.it-tile.sm .it-tier{display:none}
.it-tile.el-metal{--c:var(--metal)}.it-tile.el-wood{--c:var(--wood)}.it-tile.el-water{--c:var(--water)}.it-tile.el-fire{--c:var(--fire)}.it-tile.el-earth{--c:var(--earth)}
.it-tile .it-art{width:88%;height:88%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.it-tier{position:absolute;right:-4px;bottom:-4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;font:700 10px var(--f-display);padding:0 4px;line-height:15px}
.slot .it-tile.sm{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 75%)}
/* ---- battle scene ---- */
.arena2{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:end;border-radius:18px;padding:14px 12px 10px;overflow:hidden;
  background:linear-gradient(180deg,#22343A 0%,#2D4A43 58%,#3E5B3A 58.2%,#2F4A2C 100%)}
.arena2::before{content:"";position:absolute;left:8%;top:10%;width:46px;height:46px;border-radius:50%;background:#F6E7B4;opacity:.25;box-shadow:0 0 30px #F6E7B4}
.fighter{position:relative;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;z-index:1}
.f-name{color:#EAF2EF;font-size:12px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fighter .hp{width:100%}
.f-stage{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:end center}
.hero-svg{width:100%;height:100%;overflow:visible}
.h-arm{transform-box:view-box;transform-origin:80px 78px}
.h-shield{transform-box:view-box;transform-origin:34px 92px}
.foe .mon-seal{width:86%;margin:0 auto 6%}
.fighter.atk.hero .hero-svg{animation:lungeR .55s ease-out}
.fighter.atk.hero .h-arm{animation:swing .55s ease-out}
.fighter.atk.foe .mon-seal{animation:lungeL .55s ease-out}
.fighter.def .h-shield{animation:guard .55s ease-out}
.fighter.hurt .hero-svg,.fighter.hurt .mon-seal{animation:hurt .45s ease-out .15s}
.fighter.atk.hero.hurt .hero-svg{animation:none}
@keyframes lungeR{40%{transform:translateX(26%)}100%{transform:none}}
@keyframes lungeL{40%{transform:translateX(-30%) scale(1.05)}100%{transform:none}}
@keyframes swing{0%{transform:rotate(-75deg)}45%{transform:rotate(55deg)}100%{transform:rotate(0)}}
@keyframes guard{0%,70%{transform:translateX(26px) scale(1.15)}100%{transform:none}}
@keyframes hurt{0%{filter:brightness(2.2) saturate(.3)}30%{transform:translateX(7px)}60%{transform:translateX(-5px)}100%{transform:none;filter:none}}
.slash{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.slash path{fill:none;stroke:#FFF8D6;stroke-width:7;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;filter:drop-shadow(0 0 6px #FFD25A);animation:cut .4s ease-out .15s forwards,fade .3s .55s forwards}
.slash.claw path{stroke:#FF6B5A;stroke-width:5;filter:drop-shadow(0 0 5px #FF6B5A)}
@keyframes cut{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:0}}
.dmg{position:absolute;left:50%;top:18%;transform:translateX(-50%);font:800 24px var(--f-display);color:#fff;text-shadow:0 2px 0 #0008,0 0 8px #000a;animation:float .8s ease-out forwards;pointer-events:none;white-space:nowrap}
.dmg.crit{color:#FFD25A;font-size:30px}.dmg.foe-hit{color:#FF8A7A}
.dmg small{display:block;font-size:11px;text-align:center;letter-spacing:.05em}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
.shield-fx{position:absolute;left:4%;top:38%;width:30%;aspect-ratio:1;border-radius:50%;border:3px solid #BFE6FF;box-shadow:0 0 14px #7FD3F7;opacity:0;animation:shieldfx .5s ease-out .05s}
@keyframes shieldfx{30%{opacity:.9;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
.arena2.win .foe .mon-seal{animation:none;filter:grayscale(1) brightness(.7);transform:rotate(8deg) translateY(8%);transition:all .6s}
.arena2.lose .hero-svg{filter:grayscale(1) brightness(.7);transform:rotate(-10deg) translateY(6%);transition:all .6s}
@media (prefers-reduced-motion:reduce){.fighter *,.slash path,.dmg{animation:none!important}.slash{display:none}}

const CEFR_RANK={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};

// harder words from the article text the learner is reading, hardest first
function fillerWords(art, exclude, n){
  const toks=parasOf(art).join(" ").match(WORD_RE)||[]; const seen=new Set(exclude), cand=[];
  for(const tok of toks){ const k=tok.toLowerCase(), g=glossFor(art,tok); if(!g||!g.lvl||g.lvl==="PN"||STOP.has(k)) continue;
    const b=(g.base||k).toLowerCase(); if(seen.has(b)) continue; seen.add(b); cand.push({tok,g,b,r:CEFR_RANK[g.lvl]||2}); }
  let min=LEVEL_MIN[LEVEL]||4, pool=[];
  while(pool.length<n && min>0){ pool=cand.filter(c=>c.r>=min); min--; }
  pool=shuffle(pool).sort((a,b)=>b.r-a.r).slice(0,n);
  return pool.map(({tok,g,b})=>{ const key=keyOf(g.base||tok); const saved=S.words.get(key); if(saved) return saved;
    return {type:"word", key, word:g.base||tok, zh:g.zh, hi:g.hi||"", en:g.en||"", es:g.es||"", ja:g.ja||"", ko:g.ko||"", pos:g.pos||"", forms:[...new Set([tok.toLowerCase(),b])], example:sentenceWith(art,tok), articleDate:art.date, note:g.note||null, noteHi:g.noteHi||null, noteEn:g.noteEn||null, noteEs:g.noteEs||null, noteJa:g.noteJa||null, noteKo:g.noteKo||null, filler:true}; });
}

const keyOf = lemma => "w~" + lemma.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9_.~:@+-]/g,"_").slice(0,120);

/* ---------- weighting: how likely each word is drawn in the review quiz ---------- */
function weightOf(w, ref=today()){
  const c=w.correct||0, x=w.wrong||0;
  const acc=(c+1)/(c+x+2);                       // smoothed accuracy, new words start at 50%
  const since=daysBetween(w.lastTested||w.firstSeen, ref);
  const stale=1+Math.min(Math.max(since,0),10)/10; // up to ×2 for words not seen in 10+ days
  return ((1-acc)+0.08)*stale;
}
function eligible(ref=today()){ return [...S.words.values()].filter(w=>w.firstSeen < ref); }
function probMap(){ const el=eligible(); const ws=el.map(w=>weightOf(w)); const tot=ws.reduce((a,b)=>a+b,0)||1; const m=new Map(); el.forEach((w,i)=>m.set(w.key, ws[i]/tot)); return m; }
function weightedPick(list, n){ // Efraimidis–Spirakis weighted sampling without replacement
  return list.map(w=>({w, k:Math.pow(Math.random(), 1/weightOf(w))})).sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.w);
}

}

function exportData(){
  const o={app:"che-daily-improvement", exported:new Date().toISOString(), items:{}};
  for(const [k,v] of S.words) o.items[k]=v; for(const [k,v] of S.days) o.items[k]=v; if(S.game) o.items.game=S.game;
  const url=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));
  const a=document.createElement("a"); a.href=url; a.download="che-pro-backup-"+today()+".json"; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function importData(file){
  try{
    const o=JSON.parse(await file.text()); const items=o.items||{}; let n=0;
    const score=v=>(v.correct||0)+(v.wrong||0)+(v.lookups||0);
    for(const [k,v] of Object.entries(items)){
      if(!v||typeof v!=="object") continue;
      if(v.type==="word"){ const cur=S.words.get(k); if(!cur||score(v)>score(cur)){ S.words.set(k,v); n++; } }
      else if(v.type==="day"){ if(!S.days.has(k)) S.days.set(k,v); }
      else if(v.type==="game"){ const cur=game(); if(v.lv>cur.lv || (v.lv===cur.lv && v.exp>=cur.exp)) S.game={...G_DEFAULT, ...v}; }
    }
    lsSave(); if(CLOUD.user){ for(const k of S.words.keys()) CLOUD.dirtyWords.add(k); cloudMark(null); } toast(T("imported",{n})); render();
  }catch(e){ toast(T("badFile")); }
}
function notePack(n){
  // n: {note, noteHi, noteEn}; returns localized fields
  if(!n||!n.note) return null;
  const z=n.note, h=n.noteHi||{}, e=n.noteEn||{}, sp=n.noteEs||{}, jn=n.noteJa||{}, kn=n.noteKo||{};
  if(LANG==="ja") return {meaning:jn.meaning||e.meaning||z.meaning, usage:jn.usage||e.usage||z.usage, coll:z.collocations, exEn:z.example&&z.example.en, exTr:jn.exampleTr||""};
  if(LANG==="ko") return {meaning:kn.meaning||e.meaning||z.meaning, usage:kn.usage||e.usage||z.usage, coll:z.collocations, exEn:z.example&&z.example.en, exTr:kn.exampleTr||""};
  if(LANG==="es") return {meaning:sp.meaning||e.meaning||z.meaning, usage:sp.usage||e.usage||z.usage, coll:z.collocations, exEn:z.example&&z.example.en, exTr:sp.exampleTr||""};
  if(LANG==="hi") return {meaning:h.meaning||e.meaning||z.meaning, usage:h.usage||e.usage||z.usage, coll:z.collocations, exEn:z.example&&z.example.en, exTr:h.exampleTr||""};
  if(LANG==="en") return {meaning:e.meaning||z.meaning, usage:e.usage||z.usage, coll:z.collocations, exEn:z.example&&z.example.en, exTr:""};
  return {meaning:z.meaning, usage:z.usage, coll:z.collocations, exEn:z.example&&z.example.en, exTr:z.example&&z.example.zh};
}
function noteHtml(pack, bare){

function dictList(){
  const pm=probMap();
  let list=[...S.words.values()];
  const q=S.dictQ.trim().toLowerCase();
  if(q) list=list.filter(w=>w.word.toLowerCase().includes(q)||[w.zh,w.en,w.hi,w.es,w.ja,w.ko].some(x=>(x||"").toLowerCase().includes(q)));
  const acc=w=>{const t=(w.correct||0)+(w.wrong||0); return t?w.correct/t:-1;};
  if(S.dictSort==="recent") list.sort((a,b)=>(b.lastLookup||"").localeCompare(a.lastLookup||"")||a.word.localeCompare(b.word));
  else if(S.dictSort==="weak") list.sort((a,b)=>(pm.get(b.key)||0)-(pm.get(a.key)||0));
  else list.sort((a,b)=>a.word.localeCompare(b.word));
  const rows=list.map(w=>{
    const t=(w.correct||0)+(w.wrong||0), a=acc(w), p=pm.get(w.key);
    const col=a<0?"var(--line)":(a>=.8?"var(--good)":a>=.5?"var(--gorse)":"var(--bad)");
    const open=S.open===w.key;
    return `<div class="ent"><button data-open="${esc(w.key)}" aria-expanded="${open}">
      <span class="en">${esc(w.word)} <span class="pos">${esc(w.pos||"")}</span></span>
      <span class="acc">${t?Math.round(a*100)+"% · "+T("qCount",{n:t}):`<span class="chip new">${T("newWord")}</span>`}<span class="meter"><i style="width:${a<0?0:a*100}%;background:${col}"></i></span></span>
      <span class="z">${esc(mean(w))}</span></button>
      ${open?`<div class="more">
        ${w.example?`<div class="ex">${highlight(w.example,w.forms)}</div>`:""}
        ${noteHtml(findNote(w))}
        <dl class="kv"><dt>${T("kvLookups")}</dt><dd>${T("kvTimes",{n:w.lookups||1})}</dd><dt>${T("kvFirst")}</dt><dd>${esc(w.firstSeen)}</dd><dt>${T("kvRW")}</dt><dd>${w.correct||0} / ${w.wrong||0}</dd><dt>${T("kvProb")}</dt><dd>${p!=null?(p*100).toFixed(1)+"%":T("kvTomorrow")}</dd></dl>

/* ---------- word sheet ---------- */
async function lookup(surface){
  const art=currentArticle(); if(!art) return;
  let g=glossFor(art,surface);
  const ex=sentenceWith(art,surface);
  S.sheet={surface, g, ex, loading:!g};
  renderSheet();
  if(!g){
    if(!sample){ S.sheet.loading=false; S.sheet.err=T("noGloss"); renderSheet(); return; }
    try{
      const r=await sample.json(`Translate the English word "${surface}" as used in this sentence into Traditional Chinese (Taiwan). Sentence: "${ex}". Reply with only JSON: {"zh":"short meaning in context, ≤12 chars","pos":"n./v./adj./adv./prep./conj./pron./det.","base":"dictionary base form"}`,{modelTier:"quick",cache:{gcTime:86400000}});
      g={zh:String(r.zh||"?"),pos:String(r.pos||""),base:String(r.base||surface)};
      (art.gloss=art.gloss||{})[surface.toLowerCase()]=g;
    }catch(e){ S.sheet.loading=false; S.sheet.err= e&&e.code==="not_granted"?"未允許翻譯功能。":"翻譯失敗，請再點一次。"; renderSheet(); return; }
    if(!S.sheet||S.sheet.surface!==surface) return;
    S.sheet.g=g; S.sheet.loading=false;
  }
  if(g && !STOP.has(surface.toLowerCase())) record(surface,g,ex,art); else if(g) S.sheet.skip=true;
  render();
}
function record(surface,g,ex,art){
  const lemma=(g.base||surface).trim(), key=keyOf(lemma), now=today();
  const old=S.words.get(key);
  const forms=new Set([...(old&&old.forms||[]), surface.toLowerCase(), lemma.toLowerCase()]);
  const rec=old?{...old, forms:[...forms], lookups:(old.lookups||1)+1, lastLookup:new Date().toISOString(), example:old.example||ex, note:old.note||g.note||null, noteHi:old.noteHi||g.noteHi||null, noteEn:old.noteEn||g.noteEn||null, noteEs:old.noteEs||g.noteEs||null, noteJa:old.noteJa||g.noteJa||null, noteKo:old.noteKo||g.noteKo||null, hi:old.hi||g.hi||"", en:old.en||g.en||"", es:old.es||g.es||"", ja:old.ja||g.ja||"", ko:old.ko||g.ko||""}
    :{type:"word", key, word:lemma, zh:g.zh, pos:g.pos||"", forms:[...forms], example:ex, articleDate:art.date, firstSeen:now, lookups:1, lastLookup:new Date().toISOString(), correct:0, wrong:0, lastTested:null, note:g.note||null, noteHi:g.noteHi||null, noteEn:g.noteEn||null, noteEs:g.noteEs||null, noteJa:g.noteJa||null, noteKo:g.noteKo||null, hi:g.hi||"", en:g.en||"", es:g.es||"", ja:g.ja||"", ko:g.ko||""};
  persist(key,rec);
  S.sheet.rec=rec; S.sheet.isNew=!old;
  const d=dayRec(), ll=lemma.toLowerCase();
  if(isMain(art)){ if(!(d.lookedUp||[]).includes(ll)) saveDay({...d, lookedUp:[...(d.lookedUp||[]), ll]}); }
  else { const by={...(d.lookedUpBy||{})}; const cur=by[art.id]||[]; if(!cur.includes(ll)){ by[art.id]=[...cur,ll]; saveDay({...d, lookedUpBy:by}); } }
}

/* ---------- explanations (prepared with each article) ---------- */
function glossOf(w){
  const b=w.word.toLowerCase();
  for(const a of S.articles) for(const g of Object.values(a.gloss||{})) if((g.base||"").toLowerCase()===b && g.zh===w.zh) return g;
  for(const a of S.articles) for(const g of Object.values(a.gloss||{})) if((g.base||"").toLowerCase()===b) return g;
  return null;
}
function findNote(w){
  if(w.note) return {note:w.note, noteHi:w.noteHi, noteEn:w.noteEn, noteEs:w.noteEs, noteJa:w.noteJa, noteKo:w.noteKo};
  const g=glossOf(w); return g&&g.note?{note:g.note, noteHi:g.noteHi, noteEn:g.noteEn, noteEs:g.noteEs, noteJa:g.noteJa, noteKo:g.noteKo}:null;
}
// older saved words may lack Hindi/English meanings: fill them from loaded articles
function fillMeanings(){
  let changed=false;
  for(const [k,w] of S.words){ if(w.hi&&w.en&&w.es&&w.ja&&w.ko&&(w.note||!glossOf(w)||!glossOf(w).note)) continue; const g=glossOf(w); if(!g) continue;
    const nw={...w, hi:w.hi||g.hi||"", en:w.en||g.en||"", es:w.es||g.es||"", ja:w.ja||g.ja||"", ko:w.ko||g.ko||"", note:w.note||g.note||null, noteHi:w.noteHi||g.noteHi||null, noteEn:w.noteEn||g.noteEn||null, noteEs:w.noteEs||g.noteEs||null, noteJa:w.noteJa||g.noteJa||null, noteKo:w.noteKo||g.noteKo||null};
    if(JSON.stringify(nw)!==JSON.stringify(w)){ S.words.set(k,nw); changed=true; } }
  if(changed) lsSave();
}
function explainAnswer(ans){

function answerBlock(ans, full){

  const wrong = !ans.ok ? `<p class="mist"><span class="lab">${T("youPicked")}</span>${ans.picked.meaning?T("pickedMeans",{a:esc(ans.picked.label),b:esc(ans.picked.meaning)}):T("pickedPlain",{a:esc(ans.picked.label)})} ${T("correctIs",{w:esc(w.word),m:esc(mean(w))})}</p>` : "";
  const others=(w.forms||[]).filter(f=>f!==w.word.toLowerCase());
  const basic = `<p><span class="lab">${T("basic")}</span>${T("basicTxt",{w:esc(w.word),p:esc(w.pos||""),m:esc(mean(w))})}${others.length?T("forms",{f:esc(others.join(", "))}):""}</p>`;

/* ---------- quizzes ---------- */
function distractorPool(){
  const pool=new Map();
  for(const w of S.words.values()) pool.set(w.word.toLowerCase(),{en:w.word, zh:mean(w)});
  for(const a of S.articles.slice(0,8)) for(const [k,g] of Object.entries(a.gloss||{})){
    if(STOP.has(k)||!/^(n|v|adj|adv)\./.test(g.pos||"")||/[A-Z]/.test(g.base||"")) continue;
    const b=(g.base||k).toLowerCase(); if(!pool.has(b)) pool.set(b,{en:g.base||k, zh:mean(g)});
  }
  return [...pool.values()];
}
function makeQuestion(w){
  const wm=mean(w); const pool=distractorPool().filter(p=>p.en.toLowerCase()!==w.word.toLowerCase() && p.zh!==wm);
  const hasForm=f=>new RegExp("\\b"+reEsc(f)+"\\b","i").test(w.example||"");
  const types=["en2zh","zh2en"]; if(w.example && (w.forms||[]).some(hasForm)) types.push("cloze");
  const type=types[Math.floor(Math.random()*types.length)];
  const ds=shuffle(pool).slice(0,3);
  if(type==="en2zh") return {type, w, prompt:w.word, opts:shuffle([{label:wm, meaning:w.word, ok:true}, ...ds.map(d=>({label:d.zh, meaning:d.en}))])};
  if(type==="zh2en") return {type, w, prompt:wm, opts:shuffle([{label:w.word, meaning:wm, ok:true}, ...ds.map(d=>({label:d.en, meaning:d.zh}))])};
  const form=(w.forms||[]).find(hasForm);
  const m=w.example.match(new RegExp("\\b"+reEsc(form)+"\\b","i"));
  return {type, w, prompt:w.example, blank:m[0], opts:shuffle([{label:m[0], meaning:wm, ok:true}, ...ds.map(d=>({label:d.en, meaning:d.zh}))])};
}
function startQuiz(kind, art){
  let words;
  const d=dayRec();
  if(kind==="pre"){ const el=eligible(), due=srsDueList().filter(w=>w.firstSeen<today()).slice(0,10), dk=new Set(due.map(w=>w.key)); words=due.concat(weightedPick(el.filter(w=>!dk.has(w.key)), Math.max(0,Math.min(10,el.length)-due.length))); }
  else if(kind==="srs"){ words=srsDueList().slice(0,SRS_MAX); if(!words.length) return toast(T("srsNone")); }
  else if(kind==="rev"){ const all=[...S.words.values()]; if(all.length<LUCK.reviewMinWords) return toast(T("revNeed",{n:LUCK.reviewMinWords})); words=weightedPick(all, Math.min(LUCK.reviewQ, all.length)); }
  else {
    words=shuffle(lookedUpFor(d,art).map(l=>S.words.get(keyOf(l))).filter(Boolean)).slice(0,10);
    if(words.length<10) words=words.concat(fillerWords(art, words.map(w=>w.word.toLowerCase()), 10-words.length));
  }
  if(!words.length){
    if(kind==="pre") saveDay({...d, preDone:true, preScore:0, preTotal:0});
    else finishPost(art,0,0);
    S.view="today"; S.tab="today"; render(); return;
  }
  S.quiz={kind, artId:art&&art.id, qs:words.map(makeQuestion), i:0, score:0, picked:null, answers:[], hasFill:words.some(w=>w.filler)};
  S.view="quiz"; render(); window.scrollTo(0,0);
}
function finishPost(art, score, total){
  const d=dayRec();
  if(isMain(art)) saveDay({...d, read:d.read||art.id, postDone:true, postScore:score, postTotal:total});
  else saveDay({...d, postBy:{...(d.postBy||{}), [art.id]:{score,total}}});
  setTimeout(rdPush,500);

function viewQuiz(){
  const Q=S.quiz; if(!Q) return "";
  const title=Q.kind==="srs"?T("srsTitle"):Q.kind==="pre"?T("preTitle"):Q.kind==="rev"?T("revTitle"):T("postTitle");
  if(Q.i>=Q.qs.length){
    const order=[...Q.answers].sort((a,b)=>a.ok-b.ok);
    const nextBtn = Q.kind==="rev" ? `<div class="row"><button class="btn" data-act="goluck">${T("goLuck")}</button><button class="btn ghost" data-tab="dict">${T("backDict")}</button></div>` : Q.kind==="pre" ? `<button class="btn" data-act="read">${T("readNow")}</button>` : `<button class="btn" data-act="home">${T("backToday")}</button>`;
    return `<div class="view"><div class="eyebrow">${T("done",{t:title})}</div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="score">${Q.score}<span class="muted" style="font-size:28px">/${Q.qs.length}</span></div>
      <div class="muted">${Q.score<Q.qs.length?T("sumWrong"):T("sumAll")}</div>${Q.hasFill?`<div class="muted sm-t">${T("fillNote")}</div>`:""}</div>
      ${Q.kind==="rev"?lottoBox(Q.reward):Q.kind==="srs"?`<div class="card srs-after">${T("srsAfter",{n:srsDueList().length,t:srsCountOn(srsAdd(today(),1))})}</div>`:rewardBox(Q.reward)}
      <h2 style="font-size:20px">${T("explainAll")}</h2>
      <div style="display:flex;flex-direction:column;gap:12px">${order.map(a=>answerBlock(a,true)).join("")}</div>
      ${nextBtn}</div>`;
  }
  const q=Q.qs[Q.i], pickedI=Q.picked, ans=Q.answers[Q.i];
  const prompt = q.type==="cloze" ? `<div class="qprompt cloze">${esc(q.prompt).replace(new RegExp("\\b"+reEsc(esc(q.blank))+"\\b"), "<u></u>")}</div>`
    : `<div class="qprompt ${q.type==="zh2en"?"zh":""}">${esc(q.prompt)}</div>`;
  const lead={en2zh:T("qMeaning"),zh2en:T("qWord"),cloze:T("qCloze")}[q.type];
  return `<div class="view"><div class="row" style="justify-content:space-between"><span class="eyebrow">${title}</span><span class="muted" style="font-size:13px;font-variant-numeric:tabular-nums">${Q.i+1} / ${Q.qs.length}</span></div>
    <div class="qbar"><i style="width:${(Q.i+(pickedI!=null?1:0))/Q.qs.length*100}%"></i></div>
    <div class="qcard"><div class="muted" style="font-size:14px">${lead}${q.w.filler?` <span class="chip new">${T("fillTag")}</span>`:""}</div>${prompt}
    <div class="opts">${q.opts.map((o,i)=>{ let c="opt"+(q.type==="en2zh"?"":" en"); if(pickedI!=null){ if(o.ok) c+=" right"; else if(i===pickedI) c+=" wrong"; } return `<button class="${c}" data-pick="${i}" ${pickedI!=null?"disabled":""}>${esc(o.label)}${pickedI!=null&&!o.ok&&o.meaning?`<span class="optm">${esc(o.meaning)}</span>`:""}</button>`; }).join("")}</div>
    ${ans?`<div class="fb ${ans.ok?"ok":"no"}">${ans.ok?T("right"):T("wrong")}</div>${answerBlock(ans,false)}<button class="btn" data-act="next">${Q.i+1<Q.qs.length?T("next"):T("seeAll")}</button>`:""}</div></div>`;
}
function pick(i){
  const Q=S.quiz, q=Q.qs[Q.i]; if(Q.picked!=null) return;
  Q.picked=i; const opt=q.opts[i], ok=!!opt.ok;
  const w=S.words.get(q.w.key)||q.w;
  if(!w.filler) persist(w.key,{...w, correct:(w.correct||0)+(ok?1:0), wrong:(w.wrong||0)+(ok?0:1), lastTested:today(), ...srsNext(w,ok)});
  else if(!ok){ const {filler,...rec}=w; persist(w.key,{...rec, firstSeen:today(), lookups:0, lastLookup:new Date().toISOString(), correct:0, wrong:1, lastTested:today(), srsB:1, srsDue:srsAdd(today(),1)}); }
  if(ok) Q.score++;
  const ans={w, ok, picked:opt}; Q.answers[Q.i]=ans;
  if(Q.i+1>=Q.qs.length){
    const d=dayRec();
    if(Q.kind==="srs"){ Q.reward=null; }
    else if(Q.kind==="rev"){ Q.reward=awardReview(); }
    else if(Q.kind==="pre"){ saveDay({...d, preDone:true, preScore:Q.score, preTotal:Q.qs.length}); Q.reward=awardQuiz("pre",Q.score,Q.qs.length,false); }
    else { const art=S.articles.find(a=>a.id===Q.artId)||mainArticle(); finishPost(art, Q.score, Q.qs.length); Q.reward=awardQuiz("post",Q.score,Q.qs.length,isMain(art)); }
  }
  explainAnswer(ans);
  render();
}

     Lv 9–10  need both weapon and armour to beat the monster's element

/* Final boss (Dublin · Balor) rules — tweak here:
   BOSS.wAdv  weapon advantage multiplier vs the boss (normal monsters 1.5)
   BOSS.eyeEvery / BOSS.eye  every N boss turns the Evil Eye hits for atk × eye, ignoring armour element and half your defence
   BOSS.rageAt / BOSS.rage  below this share of HP the boss's attack is multiplied by rage */
const BOSS={wAdv:1.25, eyeEvery:3, eye:1.3, rageAt:0.35, rage:1.25};
function simulate(m, spellOk){
  const s=stats(), al=m.wild&&m.lv>ALLY_LV?todayAlly():null;
  let php=s.hp, mhp=m.hp, ahp=al?al.hp:0; const ev=[]; let first=true, mt=0, raged=false;
  const awm=al?elMult(al.wEl,m.el):1, aam=al?elMult(m.el,al.aEl):1;
  const roll=()=>0.9+Math.random()*0.2;
  let wm=elMult(s.wEl,m.el); if(m.boss&&wm>1) wm=BOSS.wAdv;
  for(let round=1; round<=40 && php>0 && mhp>0; round++){
    const crit=Math.random()<0.1 || (first&&spellOk);
    let dmg=Math.max(1, Math.round((s.atk*wm - m.def*0.5)*roll()*(crit?(first&&spellOk?2:1.5):1)));
    mhp=Math.max(0,mhp-dmg); ev.push({who:"p", dmg, crit, spell:first&&spellOk, php, mhp, ahp}); first=false;
    if(mhp<=0) break;
    if(al&&ahp>0){ const ac=Math.random()<0.1; const ad=Math.max(1, Math.round((al.atk*ALLY_HIT*awm - m.def*0.5)*roll()*(ac?1.5:1))); mhp=Math.max(0,mhp-ad); ev.push({who:"a", dmg:ad, crit:ac, php, mhp, ahp}); if(mhp<=0) break; }
    mt++;
    let rage=1, rageNow=false;
    if(m.boss&&mhp<m.hp*BOSS.rageAt){ rage=BOSS.rage; if(!raged){ raged=true; rageNow=true; } }
    const eye=m.boss&&mt%BOSS.eyeEvery===0;
    if(al&&ahp>0&&Math.random()<ALLY_AGGRO){ const t2=Math.max(1, Math.round((m.atk*aam - al.def*0.5)*roll())); ahp=Math.max(0,ahp-t2); ev.push({who:"m", tgt:"a", dmg:t2, php, mhp, ahp}); continue; }
    let taken= eye ? Math.max(1, Math.round((m.atk*rage*BOSS.eye - s.def*0.25)*roll()))
                   : Math.max(1, Math.round((m.atk*rage*elMult(m.el,s.aEl) - s.def*0.5)*roll()));
    php=Math.max(0,php-taken); ev.push({who:"m", dmg:taken, eye, rage:rageNow, php, mhp, ahp});
  }
  return {ev, win:mhp<=0 && php>0, maxP:s.hp, ally:al};
}
function startBattle(mid){
  const g=game(), m=MONS[mid]; if(!m) return;
  if(g.tickets<1) return toast(T("noTicket"));
  S.battle={m, stage:"spell"};
  // spell question needs at least one word in the dictionary
  if(!S.words.size) S.battle.stage="ready";
  else { const w=weightedPick([...S.words.values()],1)[0]; S.battle.q=makeQuestion(w); }
  S.view="battle"; render(); window.scrollTo(0,0);
}
function castSpell(i){
  const B=S.battle; if(!B||B.stage!=="spell"||B.picked!=null) return;
  B.picked=i; const opt=B.q.opts[i]; B.spellOk=!!opt.ok;
  const w=S.words.get(B.q.w.key)||B.q.w;
  persist(w.key,{...w, correct:(w.correct||0)+(B.spellOk?1:0), wrong:(w.wrong||0)+(B.spellOk?0:1), lastTested:today(), ...srsNext(w,B.spellOk)});
  render();
}
function fight(){
  const B=S.battle, g=game(); if(!B) return;
  g.tickets-=1; g.battles=(g.battles||0)+1;
  const res=simulate(B.m, !!B.spellOk);
  B.res=res; B.stage="fight"; B.idx=0;
  if(res.win){
    const before=g.lv; g.exp+=B.m.exp; g.gold+=B.m.gold; g.wins[B.m.id]=(g.wins[B.m.id]||0)+1;
    const c=conquered(); if(!B.m.wild&&!c[B.m.id]){ c[B.m.id]=today(); B.conquered=true; }
    while(g.exp>=expNeed(g.lv)){ g.exp-=expNeed(g.lv); g.lv++; }
    B.lvUp=g.lv-before;
  }
  saveGame(); render();
  clearInterval(S.btimer);
  S.btimer=setInterval(()=>{ if(!S.battle||S.battle.stage!=="fight"){ clearInterval(S.btimer); return; } S.battle.idx++; if(S.battle.idx>=S.battle.res.ev.length){ S.battle.stage="end"; S.battle.justEnded=false; clearInterval(S.btimer); } renderBattleOnly(); }, matchMedia("(prefers-reduced-motion: reduce)").matches?150:650);
}

function cycleSvg(){
  // Classic layout: 生 (feeds) runs clockwise round the outside, 克 (beats) forms the star inside
  const GEN=["metal","water","wood","fire","earth"], C=160, R=112, NR=26;
  const ang=i=>-Math.PI/2+i*2*Math.PI/5, f=n=>n.toFixed(1);
  const P={}; GEN.forEach((k,i)=>P[k]={x:C+R*Math.cos(ang(i)), y:C+R*Math.sin(ang(i))});
  const cjk=/^(zh|ja|ko)$/.test(LANG);
  const tag=(x,y,txt,cls)=>{ const w=[...txt].length<=1?22:[...txt].length*6.4+14; return `<g class="cy-tag ${cls}" transform="translate(${f(x)} ${f(y)})"><rect x="${f(-w/2)}" y="-11" width="${f(w)}" height="22" rx="11"/><text y="4.5" text-anchor="middle">${esc(txt)}</text></g>`; };
  let gen="", genT="";
  GEN.forEach((k,i)=>{ const gap=(NR+7)/R, a0=ang(i)+gap, a1=ang(i+1)-gap-0.03;
    gen+=`<path d="M${f(C+R*Math.cos(a0))} ${f(C+R*Math.sin(a0))}A${R} ${R} 0 0 1 ${f(C+R*Math.cos(a1))} ${f(C+R*Math.sin(a1))}" class="cy-gen" marker-end="url(#mGen)"/>`;
    const am=ang(i)+Math.PI/5; genT+=tag(C+(R+27)*Math.cos(am), C+(R+27)*Math.sin(am), T("cyGen"), "gen"); });
  let beat="", beatT="";
  for(const [a,b] of Object.entries(BEATS)){ const p=P[a], q=P[b], dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    beat+=`<line x1="${f(p.x+ux*(NR+2))}" y1="${f(p.y+uy*(NR+2))}" x2="${f(q.x-ux*(NR+8))}" y2="${f(q.y-uy*(NR+8))}" class="cy-beat cy-s-${a}" marker-end="url(#mB-${a})"/>`;
    beatT+=tag(p.x+dx*0.3, p.y+dy*0.3, T("cyBeat"), "beat cy-c-"+a); }
  const marks=`<marker id="mGen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="cy-gen-h"/></marker>`
    +ELS.map(e=>`<marker id="mB-${e.k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="el-fill-${e.k}"/></marker>`).join("");
  const nodes=GEN.map(k=>`<circle cx="${f(P[k].x)}" cy="${f(P[k].y)}" r="${NR}" class="cy-n el-fill-${k}"/><text x="${f(P[k].x)}" y="${f(P[k].y+(cjk?7:4))}" text-anchor="middle" class="cy-t${cjk?" big":""}">${esc(elName(k))}</text>`).join("");
  return `<svg viewBox="0 0 320 320" class="cycle" role="img" aria-label="${T("cycleAria")}"><defs>${marks}</defs>${gen}${beat}${genT}${beatT}${nodes}</svg>`;
}

/* ================= 幸運屋 Lucky house =================
   ★ 想調機率，只要改下面 LUCK 這一塊的數字就好 ★
   w / odds 是「權重」：機率 = 這一項的權重 ÷ 同一組全部權重的總和。
   例：轉盤現在的 w 加起來剛好 100，所以 w 就直接等於百分比（22 = 22%）。
   想讓某個獎更常出現 → 把它的 w 調大；想讓它消失 → 改成 0。
*/
const LUCK={
  reviewQ:10,               // 字典複習一次幾題
  reviewMinWords:5,         // 字典至少要有幾個字才能複習
  reviewTicketsPerDay:3,    // 每天最多從複習拿幾張彩券
  shardsToForge:5,          // 幾個「同屬性同等級」碎片可以合成一件裝備
  dupGoldRate:0.5,          // 合成時武器和防具都已擁有 → 換成「裝備價格 × 這個比例」的金幣
  // 轉盤：type 可以是 gold（金幣）/ ticket（出征令）/ lotto（彩券）/ shard（碎片，tier 0=Ⅰ 1=Ⅱ 2=Ⅲ 3=Ⅳ）
  // 轉盤上的順序就是這裡的順序（從正上方順時針）
  wheel:[
    {type:"gold",   n:30,  w:22},
    {type:"shard",  tier:0, n:1, w:20},
    {type:"ticket", n:1,   w:14},
    {type:"gold",   n:80,  w:12},
    {type:"lotto",  n:1,   w:10},
    {type:"shard",  tier:1, n:1, w:10},
    {type:"gold",   n:200, w:6},
    {type:"shard",  tier:2, n:1, w:6}
  ],
  // 刮刮樂：cost = 要幾張彩券；odds = [Ⅰ, Ⅱ, Ⅲ, Ⅳ] 級碎片的權重；double = 一次拿到 2 個碎片的機率（%）
  scratch:[
    {id:"bronze", cost:2, odds:[70,25,5,0],   double:5},
    {id:"silver", cost:3, odds:[40,40,17,3],  double:10},
    {id:"gold",   cost:5, odds:[10,35,40,15], double:15}
  ],
  // 碎片是哪個屬性的權重（全部一樣 = 平均各 20%）
  element:{metal:1, wood:1, water:1, fire:1, earth:1}
};

function wpick(list, wf){ const tot=list.reduce((s,x)=>s+Math.max(0,wf(x)),0); let r=Math.random()*tot; for(const x of list){ r-=Math.max(0,wf(x)); if(r<0) return x; } return list.filter(x=>wf(x)>0).pop()||list[list.length-1]; }
const pct=(w,list,wf)=>{ const tot=list.reduce((s,x)=>s+Math.max(0,wf(x)),0)||1; const p=Math.max(0,w)/tot*100; return (p>=10||p===0?Math.round(p):Math.round(p*10)/10)+"%"; };
function randEl(){ return wpick(Object.keys(LUCK.element), k=>LUCK.element[k]); }
function shardsOf(){ const g=game(); g.shards=g.shards||{}; return g.shards; }
function addShard(el,tier,n){ const s=shardsOf(), k=el+"-"+tier; s[k]=(s[k]||0)+n; }
function prizeText(p){
  if(p.type==="gold") return T("pGold",{n:p.n});
  if(p.type==="ticket") return T("pTicket",{n:p.n});
  if(p.type==="lotto") return T("pLotto",{n:p.n});
  return p.el?T("pShard",{e:elName(p.el),t:TIER[p.tier].n,n:p.n}):T("pShardAny",{t:TIER[p.tier].n});
}
function applyPrize(p){
  const g=game(), out={...p};
  if(p.type==="gold") g.gold+=p.n;
  else if(p.type==="ticket") g.tickets+=p.n;
  else if(p.type==="lotto") g.lotto=(g.lotto||0)+p.n;
  else { out.el=randEl(); addShard(out.el,p.tier,p.n); }
  return out;
}

const WHEEL_COL=["var(--metal)","var(--wood)","var(--water)","var(--fire)","var(--earth)","var(--accent)","#7E5BB5","#C2477A"];
function wheelSvg(){
  const W=LUCK.wheel, N=W.length, R=100, step=360/N;
  const pt=(deg,r)=>{ const a=deg*Math.PI/180; return [(r*Math.sin(a)).toFixed(2), (-r*Math.cos(a)).toFixed(2)]; };
  const segs=W.map((p,i)=>{ const [x1,y1]=pt(i*step,R), [x2,y2]=pt((i+1)*step,R);
    const big=p.type==="gold"?"+"+p.n:p.type==="shard"?TIER[p.tier].n:"+"+p.n;
    const small=p.type==="gold"?T("gold"):p.type==="ticket"?T("tickets"):p.type==="lotto"?T("lotto"):T("shardWord");
    return `<path d="M0 0L${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}Z" fill="${WHEEL_COL[i%WHEEL_COL.length]}" stroke="var(--card)" stroke-width="2"/>
      <g transform="rotate(${(i+.5)*step})"><text y="-66" class="wh-big">${esc(big)}</text><text y="-50" class="wh-small">${esc(small)}</text></g>`; }).join("");
  return `<svg viewBox="-104 -104 208 208" aria-hidden="true">${segs}<circle r="102" fill="none" stroke="var(--ink)" stroke-width="3"/><circle r="16" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/></svg>`;

function spinWheel(){

  g.lotto--; const W=LUCK.wheel, N=W.length, step=360/N;
  const i=wpick(W.map((_,k)=>k), k=>W[k].w);
  const res=applyPrize(W[i]); saveGame();
  const cur=S.wheelRot||0, target=-((i+.5)*step)+(Math.random()-.5)*step*0.6;
  const rot=cur+360*5+(((target-cur)%360)+360)%360;
  S.wheelRot=rot; S.wheelBusy=true; S.wheelMsg=null;
  const el=document.getElementById("wheelDisc"), btn=document.querySelector("[data-act=spin]");

  const b=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(b.width*dpr); c.height=Math.round(b.height*dpr);
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const gr=x.createLinearGradient(0,0,b.width,b.height); gr.addColorStop(0,"#AEB6BB"); gr.addColorStop(.45,"#E8ECEE"); gr.addColorStop(.55,"#D5DADD"); gr.addColorStop(1,"#9CA5AB");

  x.globalCompositeOperation="destination-out"; x.fillStyle="#000"; x.strokeStyle="#000"; x.lineCap="round"; x.lineJoin="round"; x.lineWidth=34;
  let down=false, last=null, moves=0;
  const P=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const check=()=>{ const d=x.getImageData(0,0,c.width,c.height).data; let clr=0, tot=0; for(let i=3;i<d.length;i+=64){ tot++; if(d[i]<40) clr++; } if(tot&&clr/tot>0.55) scratchReveal(); };
  c.addEventListener("pointerdown",e=>{ down=true; last=P(e); try{ c.setPointerCapture(e.pointerId); }catch(_){} x.beginPath(); x.arc(last[0],last[1],17,0,Math.PI*2); x.fill(); e.preventDefault(); });
  c.addEventListener("pointermove",e=>{ if(!down) return; const p=P(e); x.beginPath(); x.moveTo(last[0],last[1]); x.lineTo(p[0],p[1]); x.stroke(); last=p; if(++moves%6===0) check(); });
  const up=()=>{ if(down){ down=false; check(); } }; c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up);
}

function forge(k){
  const s=shardsOf(); if((s[k]||0)<LUCK.shardsToForge) return;
  const [el,ti]=k.split("-"), tier=+ti, g=game();
  s[k]-=LUCK.shardsToForge; if(!s[k]) delete s[k];
  const opts=[`w-${el}-${tier}`,`a-${el}-${tier}`].filter(id=>!g.inv.includes(id));
  if(opts.length){ const id=opts[Math.floor(Math.random()*opts.length)]; g.inv.push(id); saveGame(); toast(T("forged",{i:itemName(ITEMS[id])+" "+TIER[tier].n})); }
  else { const n=Math.round(TIER[tier].price*LUCK.dupGoldRate); g.gold+=n; saveGame(); toast(T("forgeDup",{n})); }
  render();
}

/* ----- developer: player data & system stats (needs admin rule in Firestore) ----- */
async function devLoadStats(){
  if(!CLOUD.user||!CLOUD.fb){ S.devStats={err:T("dsLogin")}; return render(); }
  const {fsM,db}=CLOUD.fb; S.devStats={loading:true}; render();
  try{
    const us=await fsM.getDocs(fsM.collection(db,"users"));
    const users=[]; us.forEach(d=>users.push({id:d.id, ...d.data()}));
    const counts=await Promise.all(users.slice(0,300).map(u=>fsM.getCountFromServer(fsM.collection(db,"users",u.id,"words")).then(c=>c.data().count).catch(()=>null)));
    users.forEach((u,i)=>u.words=counts[i]);
    let lbN=null; try{ lbN=(await fsM.getCountFromServer(fsM.collection(db,"leaderboard"))).data().count; }catch(e){}
    let regions={}; try{ const r=await fsM.getDoc(fsM.doc(db,"stats","regions")); if(r.exists()) regions=r.data(); }catch(e){}
    let rooms=0; try{ const rs=await fsM.getDocs(fsM.collection(db,"rooms")); rs.forEach(d=>{ const x=d.data(); if(x.state!=="done"&&Date.now()-(x.created||0)<3600e3) rooms++; }); }catch(e){}
    const fb=await devLoadFeedback();
    // game play stats: per-user counters (game.plays) merged with room history (parties / rooms)
    const per={}; const bump=(u,k,n)=>{ per[k]=per[k]||{}; per[k][u]=Math.max(per[k][u]||0,n); };
    users.forEach(u=>{ const g=u.game||{}, pl=g.plays||{}; for(const [k,n] of Object.entries(pl)) bump(u.id,k,n);
      if(g.ielts&&g.ielts.days) bump(u.id,"ielts",Object.keys(g.ielts.days).length); if(g.battles) bump(u.id,"battle",g.battles); });
    try{ const ps=await fsM.getDocs(fsM.collection(db,"parties")); const cnt={}; ps.forEach(d=>{ const x=d.data(); if(x.state!=="done") return; for(const u of Object.keys(x.players||{})){ const k=x.game+"|"+u; cnt[k]=(cnt[k]||0)+1; } }); for(const [k,n] of Object.entries(cnt)){ const [g,u]=k.split("|"); bump(u,g,n); } }catch(e){}
    try{ const rs=await fsM.getDocs(fsM.collection(db,"rooms")); const cnt={}; rs.forEach(d=>{ const x=d.data(); if(x.state!=="done") return; [x.host,x.guest].filter(Boolean).forEach(u=>cnt[u]=(cnt[u]||0)+1); }); for(const [u,n] of Object.entries(cnt)) bump(u,"coop",n); }catch(e){}
    const games=Object.fromEntries(Object.entries(per).map(([k,m])=>[k,{players:Object.keys(m).length, plays:Object.values(m).reduce((a,b)=>a+b,0)}]));
    let push=null; try{ const r=await fsM.getDoc(fsM.doc(db,"config","pushStats")); if(r.exists()) push=r.data(); }catch(e){}
    let act=null; try{ const r=await fsM.getDocs(fsM.collection(db,"act")); const a=[]; r.forEach(d=>a.push(d.data())); act=a.length?a:null; }catch(e){}
    S.devStats={users, lbN, regions, rooms, fb, games, push, act, at:new Date()};
  }catch(e){ S.devStats={err:e&&e.code==="permission-denied"?T("dsDenied"):T("syncFail")}; }
  render();
}
