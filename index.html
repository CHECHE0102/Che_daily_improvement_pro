const HELP={"zh": {"title": "使用說明", "intro": "每天花 10–15 分鐘讀一篇愛爾蘭新聞，邊學英文邊玩遊戲。", "close": "💚 做這個 App，是希望能幫助每一個想學好英文的人。每天進步一點點，英文就會越來越好。祝你學習愉快！", "sign": "— CheChe", "ok": "開始使用", "secs": [["📰", "每日三步驟", "① 複習測驗：抽考前幾天查過的單字，越不熟的字越容易被抽到。② 閱讀頭條：看不懂的字直接點，會顯示翻譯、相似詞、反義詞和例句，並自動存進字典。③ 讀後測驗：固定 10 題，每題都有講解，答錯的更要看。"], ["📚", "字典", "查過的字都會存在這裡，可以搜尋，也可以依「最不熟」排序。上方的「間隔複習」每完成一次可以拿 1 片幸運草（每天最多 3 張）。"], ["🎯", "英文程度", "到「設定」選 B1、B2、C1 或 IELTS 7–8，文章會換成對應難度的版本。"], ["⚔️", "冒險", "測驗答對就能賺金幣和出征令。到商店買五行裝備，用出征令攻打愛爾蘭各城鎮的怪物，打贏就能佔領城鎮、每天收稅。武器屬性克制怪物時傷害 ×1.5，出征前記得看五行圖挑裝備。目標：從最小的小鎮一路打到都柏林，佔領整座島！ 城鎮可以比你的等級早 3 級挑戰，每隻怪物都會標「輕鬆／勢均力敵／危險」，那是用你現在的裝備預估的勝率。打輸了也不是白打：還沒佔領的城鎮，怪物會帶著傷，下次 HP 會少一點。隔幾天沒來，回來後前幾場勝利經驗值 ×2。"], ["🍀", "幸運屋", "1 片幸運草可以轉一次命運輪盤，2 片以上可以買刮刮樂。刮到的元素碎片，同屬性、同等級集滿 3 個就能合成元素寶石，鑲在武器或防具上變強。 合成寶石要付一點金幣；寶石可以直接換掉（舊的會碎掉），想留著舊寶石就用解鑲符取下。金幣也能換幸運草，每天最多 3 次。"], ["🤝", "合作與排行榜", "登入後可以和朋友開房間，一起找文章裡的錯字打倒魔王。在設定取個暱稱，就能用等級、HP、攻擊力和大家比排名。"], ["⚙️", "設定", "用 Google 登入一次，進度就會存到雲端，換手機也不會不見。語言、英文程度和備份也都在這裡。"], ["📱", "小技巧", "在 Safari 按「分享」→「加入主畫面」，就能像 App 一樣從主畫面打開。"]]}, "en": {"title": "How to use", "intro": "Spend 10–15 minutes a day reading one Irish news story, and play a game while you learn.", "close": "💚 I made this app hoping it helps everyone who wants to learn English. A little progress every day adds up. Enjoy learning!", "sign": "— CheChe", "ok": "Let's go", "secs": [["📰", "Three steps a day", "① Review quiz: words you looked up on earlier days, and the ones you know least come up most. ② Read the headline: tap any word you don't know to see its meaning, synonyms, opposites and an example; it's saved to your dictionary. ③ After-reading quiz: always 10 questions, each with an explanation, especially the ones you get wrong."], ["📚", "Words", "Every word you look up is saved here. Search it or sort by \"Weakest\". Each finished Spaced review at the top earns 1 shamrock (up to 3 a day)."], ["🎯", "English level", "In Settings choose B1, B2, C1 or IELTS 7–8 and articles switch to a version at that level."], ["⚔️", "Quest", "Correct answers earn gold and quest passes. Buy elemental gear in the shop and use passes to fight the monsters in Ireland's towns. Win to conquer a town and collect taxes every day. A weapon whose element beats the monster deals ×1.5 damage, so check the five-element chart first. Goal: fight from the smallest village all the way to Dublin and conquer the whole island! You can attack a town up to 3 levels early, and every monster is tagged Easy, Even fight or Risky based on your current gear. Losing still helps: a monster in a town you have not taken stays wounded, with less HP next time. If you miss a few days, your next wins give double EXP."], ["🍀", "Luck", "1 shamrock spins the Wheel of Fate once; 2 or more buy a scratch card. Collect 3 element shards of the same element and tier to forge a piece of gear. Making a gem costs a little gold. You can swap a gem straight away (the old one breaks), or keep it by taking it out with an unsocketing charm. You can also trade gold for shamrocks, up to 3 times a day."], ["🤝", "Co-op & ranking", "Once signed in, open a room with a friend and hunt for the mistakes in an article together to beat the boss. Set a nickname in Settings to compare level, HP and attack on the leaderboard."], ["⚙️", "Settings", "Sign in with Google once and your progress is saved to the cloud, so a new phone won't lose anything. Language, English level and backups are here too."], ["📱", "Tip", "In Safari tap Share → Add to Home Screen to open it from your home screen like an app."]]}, "hi": {"title": "कैसे इस्तेमाल करें", "intro": "रोज़ 10–15 मिनट एक आयरिश ख़बर पढ़ें, और सीखते हुए खेल भी खेलें।", "close": "💚 मैंने यह ऐप इस उम्मीद में बनाया है कि यह अंग्रेज़ी सीखना चाहने वाले हर व्यक्ति की मदद करे। रोज़ थोड़ा-थोड़ा सुधार बड़ा फ़र्क़ लाता है। सीखने का आनंद लें!", "sign": "— CheChe", "ok": "शुरू करें", "secs": [["📰", "रोज़ के तीन चरण", "① दोहराई क्विज़: पिछले दिनों देखे गए शब्द; जो कम आते हैं वे ज़्यादा पूछे जाते हैं। ② मुख्य ख़बर पढ़ें: न समझ आने वाले शब्द पर टैप करें; अर्थ, समानार्थी, विलोम और उदाहरण दिखेंगे और शब्द शब्दकोश में सहेजा जाएगा। ③ पढ़ने के बाद क्विज़: हमेशा 10 प्रश्न, हर एक की व्याख्या के साथ।"], ["📚", "शब्दकोश", "देखे गए सभी शब्द यहाँ सहेजे जाते हैं। खोजें या \"सबसे कमज़ोर\" से क्रम लगाएँ। ऊपर की अंतराल दोहराव पूरी करने पर 1 शैमरॉक मिलता है (दिन में अधिकतम 3)।"], ["🎯", "अंग्रेज़ी स्तर", "सेटिंग्स में B1, B2, C1 या IELTS 7–8 चुनें; लेख उसी स्तर के संस्करण में बदल जाएँगे।"], ["⚔️", "साहसिक", "सही उत्तरों से सोना और अभियान पास मिलते हैं। दुकान से तत्व वाले उपकरण खरीदें और पास से आयरलैंड के शहरों के दानवों से लड़ें। जीतने पर शहर आपका, और रोज़ कर मिलेगा। जो हथियार दानव के तत्व को हराता है वह ×1.5 नुकसान करता है, इसलिए पहले पंचतत्व चार्ट देखें। लक्ष्य: सबसे छोटे गाँव से डबलिन तक जीतकर पूरा द्वीप जीतना! आप किसी शहर पर अपने स्तर से 3 स्तर पहले भी हमला कर सकते हैं, और हर राक्षस पर आपके उपकरणों के हिसाब से आसान, बराबर की टक्कर या ख़तरनाक लिखा होता है। हारना भी बेकार नहीं: जिस शहर पर अभी क़ब्ज़ा नहीं हुआ, उसका राक्षस घायल रहता है और अगली बार उसका HP कम होता है। कुछ दिन न आएँ, तो लौटने पर अगली जीतों में EXP दोगुना मिलता है।"], ["🍀", "किस्मत", "1 शैमरॉक से पहिया एक बार घूमता है; 2 या ज़्यादा से स्क्रैच कार्ड। एक ही तत्व और स्तर के 3 टुकड़े जमा करके उपकरण बनाएँ। रत्न बनाने में थोड़ा सोना लगता है। रत्न सीधे बदल सकते हैं (पुराना टूट जाएगा), या मुक्ति-ताबीज़ से निकालकर रख सकते हैं। सोने से शैमरॉक भी ले सकते हैं, दिन में 3 बार तक।"], ["🤝", "साथ में और रैंकिंग", "साइन इन के बाद दोस्त के साथ कमरा बनाएँ और लेख की ग़लतियाँ साथ ढूँढकर दानव को हराएँ। सेटिंग्स में उपनाम चुनें और लीडरबोर्ड पर लेवल, HP व आक्रमण की तुलना करें।"], ["⚙️", "सेटिंग्स", "एक बार Google से साइन इन करें, प्रगति क्लाउड में सहेजी जाएगी और फ़ोन बदलने पर भी नहीं खोएगी। भाषा, अंग्रेज़ी स्तर और बैकअप भी यहीं हैं।"], ["📱", "सुझाव", "Safari में शेयर → होम स्क्रीन में जोड़ें दबाएँ, फिर इसे ऐप की तरह होम स्क्रीन से खोलें।"]]}, "es": {"title": "Cómo se usa", "intro": "Dedica 10–15 minutos al día a leer una noticia irlandesa y juega mientras aprendes.", "close": "💚 Hice esta app con la esperanza de ayudar a todas las personas que quieren aprender inglés. Un poco cada día marca la diferencia. ¡Disfruta aprendiendo!", "sign": "— CheChe", "ok": "¡Vamos!", "secs": [["📰", "Tres pasos al día", "① Test de repaso: palabras que consultaste otros días; las que menos dominas salen más. ② Lee el titular: toca cualquier palabra que no entiendas para ver su significado, sinónimos, antónimos y un ejemplo; se guarda en tu diccionario. ③ Test después de leer: siempre 10 preguntas, cada una con su explicación."], ["📚", "Diccionario", "Aquí se guardan todas las palabras que consultas. Puedes buscarlas u ordenarlas por «Más débiles». Cada «Repaso espaciado» terminado da 1 trébol (máximo 3 al día)."], ["🎯", "Nivel de inglés", "En Ajustes elige B1, B2, C1 o IELTS 7–8 y los artículos cambian a la versión de ese nivel."], ["⚔️", "Aventura", "Las respuestas correctas dan oro y pases. Compra equipo elemental en la tienda y usa los pases para luchar contra los monstruos de las ciudades de Irlanda. Si ganas, conquistas la ciudad y cobras impuestos cada día. Un arma cuyo elemento vence al del monstruo hace ×1,5 de daño, así que mira primero el gráfico de los cinco elementos. Objetivo: llegar desde el pueblo más pequeño hasta Dublín y conquistar toda la isla. Puedes atacar una ciudad hasta 3 niveles antes, y cada monstruo lleva la etiqueta Fácil, Igualado o Peligroso según tu equipo actual. Perder también ayuda: el monstruo de una ciudad que aún no has tomado sigue herido y tendrá menos PV la próxima vez. Si faltas unos días, tus siguientes victorias dan EXP doble."], ["🍀", "Suerte", "Con 1 trébol giras la Rueda del destino; con 2 o más compras un rasca y gana. Junta 3 fragmentos del mismo elemento y nivel para forjar un equipo. Crear una gema cuesta un poco de oro. Puedes cambiar una gema directamente (la antigua se rompe) o conservarla sacándola con un amuleto de desengaste. También puedes cambiar oro por tréboles, hasta 3 veces al día."], ["🤝", "Cooperativo y ranking", "Con la sesión iniciada, abre una sala con un amigo y buscad juntos los errores de un artículo para vencer al jefe. Elige un apodo en Ajustes para comparar nivel, HP y ataque en la clasificación."], ["⚙️", "Ajustes", "Inicia sesión con Google una vez y tu progreso se guarda en la nube; si cambias de móvil no pierdes nada. Aquí también están el idioma, el nivel de inglés y las copias de seguridad."], ["📱", "Consejo", "En Safari toca Compartir → Añadir a pantalla de inicio para abrirla como una app."]]}, "ja": {"title": "使い方", "intro": "1日10〜15分、アイルランドのニュースを1本読んで、ゲームも楽しみながら英語を学びましょう。", "close": "💚 このアプリは、英語を学びたいすべての人の役に立てたらと思って作りました。毎日少しずつの積み重ねが力になります。楽しく学んでください！", "sign": "— CheChe", "ok": "はじめる", "secs": [["📰", "毎日の3ステップ", "① 復習テスト：前の日に調べた単語から出題。苦手な単語ほど出やすくなります。② トップ記事を読む：わからない単語をタップすると、意味・類義語・反対語・例文が表示され、単語帳に保存されます。③ 読後テスト：いつも10問、全問に解説付き。"], ["📚", "単語帳", "調べた単語はすべてここに保存されます。検索や「苦手順」での並べ替えもできます。上の「間隔反復」を1回終えるとクローバーが1枚（1日最大3枚）。"], ["🎯", "英語レベル", "設定で B1・B2・C1・IELTS 7–8 を選ぶと、記事がそのレベルの版に切り替わります。"], ["⚔️", "冒険", "正解するとゴールドと出撃券がもらえます。ショップで五行の装備を買い、出撃券でアイルランド各地の魔物に挑みましょう。勝てばその町を征服し、毎日税金が入ります。武器の属性が魔物に勝っているとダメージ×1.5なので、出撃前に五行の図を確認しましょう。目標：いちばん小さな村からダブリンまで攻め上がり、島全体を征服！ 町は自分のレベルより3つ早く挑戦できます。どのモンスターにも、今の装備から予想した「楽勝／互角／危険」が表示されます。負けても無駄にはなりません。まだ占領していない町のモンスターは傷が残り、次はHPが少し減っています。何日か休んだあとは、次の何回かの勝利で経験値が2倍になります。"], ["🍀", "幸運", "クローバー1枚で運命のルーレットを1回、2枚以上でスクラッチカードが買えます。同じ属性・ランクのかけらを3個集めると装備を合成できます。 宝石を作るには金貨が少し必要です。宝石はそのまま入れ替えられ（古い宝石は砕けます）、残したいときは外しの護符で外せます。金貨でクローバーを交換することもでき、1日3回までです。"], ["🤝", "協力とランキング", "ログインすると友達とルームを作り、記事の間違いを一緒に探してボスを倒せます。設定でニックネームを決めると、レベル・HP・攻撃力でランキングに参加できます。"], ["⚙️", "設定", "Google で一度ログインすると進行状況がクラウドに保存され、機種変更しても消えません。言語・英語レベル・バックアップもここにあります。"], ["📱", "ヒント", "Safari で「共有」→「ホーム画面に追加」を押すと、アプリのようにホーム画面から開けます。"]]}, "ko": {"title": "사용 방법", "intro": "하루 10~15분, 아일랜드 뉴스 한 편을 읽고 게임도 즐기며 영어를 배워 보세요.", "close": "💚 영어를 배우고 싶은 모든 분께 도움이 되길 바라며 이 앱을 만들었어요. 매일 조금씩 쌓이면 영어가 점점 늘어요. 즐겁게 공부하세요!", "sign": "— CheChe", "ok": "시작하기", "secs": [["📰", "매일 3단계", "① 복습 퀴즈: 전에 찾아본 단어가 나와요. 잘 모르는 단어일수록 더 자주 나와요. ② 헤드라인 읽기: 모르는 단어를 누르면 뜻, 비슷한 말, 반대말, 예문이 나오고 단어장에 저장돼요. ③ 읽은 후 퀴즈: 항상 10문제, 모든 문제에 해설이 있어요."], ["📚", "단어장", "찾아본 단어는 모두 여기에 저장돼요. 검색하거나 '약한 순'으로 정렬할 수 있어요. 위의 '간격 복습'을 한 번 끝낼 때마다 클로버 1장 (하루 최대 3장)."], ["🎯", "영어 수준", "설정에서 B1, B2, C1, IELTS 7–8 중에서 고르면 기사가 그 수준의 버전으로 바뀌어요."], ["⚔️", "모험", "정답을 맞히면 골드와 출정권을 받아요. 상점에서 오행 장비를 사고, 출정권으로 아일랜드 마을의 괴물과 싸우세요. 이기면 마을을 정복하고 매일 세금을 받아요. 무기 속성이 괴물을 이기면 피해 ×1.5이니 출정 전에 오행 그림을 확인하세요. 목표: 가장 작은 마을부터 더블린까지 정복해 섬 전체를 차지하기! 마을은 내 레벨보다 3레벨 먼저 공격할 수 있고, 모든 몬스터에는 지금 장비로 예상한 '쉬움/막상막하/위험'이 표시돼요. 져도 헛수고가 아니에요. 아직 점령하지 않은 마을의 몬스터는 상처가 남아 다음엔 HP가 줄어 있어요. 며칠 쉬었다 돌아오면 다음 몇 번의 승리는 경험치가 2배예요."], ["🍀", "행운", "클로버 1장으로 운명의 룰렛을 한 번, 2장 이상이면 스크래치 카드를 살 수 있어요. 같은 속성·등급 조각 3개를 모으면 장비를 합성할 수 있어요. 보석을 만들려면 골드가 조금 들어요. 보석은 바로 바꿔 끼울 수 있고(예전 보석은 깨져요), 남기고 싶으면 해제 부적으로 빼면 돼요. 골드로 클로버를 교환할 수도 있어요. 하루 3번까지."], ["🤝", "협동과 랭킹", "로그인하면 친구와 방을 만들어 기사 속 틀린 곳을 함께 찾아 보스를 물리칠 수 있어요. 설정에서 닉네임을 정하면 레벨·HP·공격력으로 랭킹에 참여해요."], ["⚙️", "설정", "Google로 한 번 로그인하면 진행 상황이 클라우드에 저장돼 휴대폰을 바꿔도 사라지지 않아요. 언어, 영어 수준, 백업도 여기에 있어요."], ["📱", "팁", "Safari에서 '공유' → '홈 화면에 추가'를 누르면 앱처럼 홈 화면에서 열 수 있어요."]]}};
function helpSheet(){
  const h=HELP[LANG]||HELP.en;

/* ---------- news region ---------- */
const COUNTRIES=["IE","GB","US","CA","AU","NZ","IN","TW","HK","SG","JP","KR","ES","MX"];
const COUNTIES=["Antrim","Armagh","Carlow","Cavan","Clare","Cork","Derry","Donegal","Down","Dublin","Fermanagh","Galway","Kerry","Kildare","Kilkenny","Laois","Leitrim","Limerick","Longford","Louth","Mayo","Meath","Monaghan","Offaly","Roscommon","Sligo","Tipperary","Tyrone","Waterford","Westmeath","Wexford","Wicklow"];
let REGION=(()=>{ try{ const r=JSON.parse(localStorage.getItem("che-pro-region")||"null"); if(r&&COUNTRIES.includes(r.c)) return {c:r.c, county:r.c==="IE"&&COUNTIES.includes(r.county)?r.county:""}; }catch(e){} return {c:"IE",county:""}; })();
const regionKey=()=>REGION.c==="IE"?(REGION.county?"IE-"+REGION.county.toLowerCase():"IE"):REGION.c;
function countryName(c){ try{ return new Intl.DisplayNames([LOCALE[LANG]||"en"],{type:"region"}).of(c); }catch(e){ return c; } }
function regionLabel(key){ key=key||regionKey(); if(key.startsWith("IE-")){ const c=COUNTIES.find(x=>x.toLowerCase()===key.slice(3))||key.slice(3); return T("countyOf",{c}); } return countryName(key); }
function artPrio(a){ // lower = shown first on the same day
  const key=regionKey();
  if(a.region) return a.region===key?1+(a.rank||1)*0.1:99;
  if(key==="IE") return a.rank||1;
  if(key.startsWith("IE-")) return a.rank===1?0:a.rank===2?2:3;
  return 5+(a.rank||1)*0.1;
}
function setRegion(c, county){
  REGION={c, county:c==="IE"?(county||""):""};
  try{ localStorage.setItem("che-pro-region", JSON.stringify(REGION)); }catch(e){}
  regionPing(true); rebuildIndex(); render();
}
async function regionPing(force){
  const key=regionKey(), stamp=today()+"|"+key;
  try{ if(!force&&localStorage.getItem("che-pro-ping")===stamp) return; }catch(e){}
  if(!CLOUD.fb||!CLOUD.user) return;
  try{ const {fsM,db}=CLOUD.fb; await fsM.setDoc(fsM.doc(db,"stats","regions"), {[key]:today()}, {merge:true}); try{ localStorage.setItem("che-pro-ping",stamp); }catch(e){} }catch(e){ console.warn("region ping", e&&e.code); }
}
let RAW_INDEX=[];
function rebuildIndex(){
  const key=regionKey();
  S.index=RAW_INDEX.filter(a=>!a.region||a.region===key).slice().sort(byOrder);
  S.articles=S.articles.filter(a=>!a.region||a.region===key).sort(byOrder);
  const need=S.index.filter(a=>a.date===(S.index[0]||{}).date && !S.articles.some(x=>x.id===a.id));
  if(need.length) Promise.all(need.map(a=>loadArticleQuiet(a.id))).then(()=>render());
}
async function loadArticleQuiet(id){ if(S.articles.some(a=>a.id===id)) return; try{ const r=await fetch(ART_BASE+encodeURIComponent(id)+".json",{cache:"no-cache"}); if(r.ok){ const a=await r.json(); a.id=id; S.articles.push(a); S.articles.sort(byOrder); } }catch(e){} }
function regionSection(){

/* ================= IELTS mock test (listening + reading) ================= */
const IE_MIN=20;                       // test length in minutes
let IE_TESTS=null, IE_PRAC=[], IE_ALL=[], IE_WEEKLY=false;
const ieFind=id=>IE_ALL.concat(IE_TESTS||[],IE_PRAC).find(x=>x.id===id);
let IE_AUDIO={tests:{}};
async function ieLoad(){ if(IE_TESTS) return IE_TESTS;
  fetch("ielts/audio/index.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.tests){ IE_AUDIO=j; if(S.view==="adv") render(); } }).catch(()=>{});
  let base={tests:[],practice:[]};
  try{ const r=await fetch("ielts/tests.json",{cache:"no-cache"}); base=await r.json(); }catch(e){}
  IE_TESTS=base.tests||[]; IE_PRAC=base.practice||[]; IE_ALL=IE_TESTS.concat(IE_PRAC);
  // a fresh set is written every week: ielts/weeks/<ISO week>.json = {week, tests:[7, Mon..Sun], practice:[3]}
  try{ const r=await fetch("ielts/weeks/"+isoWeek().id+".json",{cache:"no-cache"}); if(r.ok){ const j=await r.json(); if(j.tests&&j.tests.length>=7){ IE_TESTS=j.tests; IE_WEEKLY=true; if(j.practice&&j.practice.length) IE_PRAC=j.practice; IE_ALL=IE_ALL.concat(j.tests,j.practice||[]); } } }catch(e){}
  return IE_TESTS; }
function isoWeek(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); const w=Math.ceil(((t-y0)/864e5+1)/7); return {id:t.getUTCFullYear()+"-W"+String(w).padStart(2,"0"), n:t.getUTCFullYear()*53+w}; }
const dayNum=()=>{ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); };
function weekTest(){ if(!IE_TESTS||!IE_TESTS.length) return null; if(IE_WEEKLY){ const wd=(new Date().getDay()+6)%7; return IE_TESTS[wd%IE_TESTS.length]; } return IE_TESTS[dayNum()%IE_TESTS.length]; }   // a different ranked test every day
function untilTomorrow(){ const n=new Date(), d=new Date(n); d.setDate(n.getDate()+1); d.setHours(0,0,0,0); const ms=d-n; return {h:Math.floor(ms/36e5), m:Math.floor(ms%36e5/6e4)}; }
function untilReset(){ const now=new Date(), d=new Date(now); const add=((8-(now.getDay()||7))%7)||7; d.setDate(now.getDate()+add); d.setHours(0,0,0,0); const ms=d-now; return {d:Math.floor(ms/864e5), h:Math.floor(ms%864e5/36e5)}; }
// raw score (scaled to 40 questions) → band, after the usual IELTS conversion tables
const IE_TABLE=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[6,3.5],[4,3],[2,2.5],[1,2],[0,0]];
function ieBand(c,t){ if(!t) return 0; const s=Math.round(c/t*40); for(const [m,b] of IE_TABLE) if(s>=m) return b; return 0; }
const fmtBand=b=>Number(b).toFixed(1).replace(/\.0$/,".0");
function ieState(){ const g=game(); g.ielts=g.ielts||{best:null,hist:[],badges:{},weeks:{}}; g.ielts.days=g.ielts.days||{}; g.ielts.months=g.ielts.months||{}; return g.ielts; }
function ieQuestions(t){ const out=[]; t.listening.forEach((p,pi)=>p.questions.forEach((q,qi)=>out.push({key:`L${pi}-${qi}`,sec:"L",part:pi,q}))); t.reading.questions.forEach((q,qi)=>out.push({key:`R-${qi}`,sec:"R",q})); return out; }
const ieNorm=s=>String(s||"").toLowerCase().replace(/[€$£.,!?'"’]/g,"").replace(/\s+/g," ").trim();
function ieCorrect(q,a){ if(a==null||a==="") return false; if(q.type==="gap") return q.a.some(x=>ieNorm(x)===ieNorm(a)); if(q.type==="mcq") return +a===q.a; return a===q.a; }
function ieRunLeft(){ const R=game().ieltsRun; return R?Math.max(0,Math.round((R.start+IE_MIN*60e3-Date.now())/1000)):0; }

async function ieStart(testId, ranked){
  await ieLoad(); const t=ieFind(testId); if(!t) return;
  const g=game(), st=ieState(), wk=isoWeek().id;
  if(ranked){ const td=today(); if(st.days[td]!==undefined) return toast(T("ieDone",{b:typeof st.days[td]==="number"?fmtBand(st.days[td]):"–"})); st.days[td]="started"; }
  g.ieltsRun={test:t.id, week:wk, ranked:!!ranked, start:Date.now(), ans:{}, played:{}, sec:0};
  saveGame(); S.view="ielts"; S.ieConfirm=false; render(); window.scrollTo(0,0); ieTick();
}
function ieResume(){ if(!game().ieltsRun) return; S.view="ielts"; render(); ieTick(); }
function ieTick(){ clearInterval(S.ieTimer); S.ieTimer=setInterval(()=>{ const R=game().ieltsRun; if(!R||S.view!=="ielts"){ clearInterval(S.ieTimer); return; } const left=ieRunLeft(); const el=document.getElementById("ieClock"); if(el){ el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; el.classList.toggle("low",left<120); } if(left<=0){ clearInterval(S.ieTimer); toast(T("ieTimeUp")); ieSubmit(); } },1000); }

/* speech for the listening parts */
// Voices: skip the novelty/"Eloquence" voices (they sound robotic) and prefer enhanced/premium/neural ones
const IE_BAD=/eloquence|compact|espeak|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|grandma|grandpa|rocko|shelley|flo\b|eddy|reed|sandy|kathy/i;
const IE_FEM=/female|serena|kate|martha|stephanie|moira|karen|tessa|fiona|samantha|victoria|susan|libby|sonia|hazel|emily|catherine|siri.*(voice ?[24])|aria|jenny|natasha|clara|niamh|emma|olivia|amy/i;
const IE_MAL=/\bmale|daniel|arthur|oliver|george|ryan|thomas|rishi|aaron|gordon|malcolm|lee\b|tom\b|alex\b|connor|guy|william|brian|james|liam|nathan/i;
function ieVoiceScore(v){ let s=0; if(/premium|enhanced|neural|natural|online|plus/i.test(v.name)) s+=60; if(/google/i.test(v.name)) s+=35; if(/siri/i.test(v.name)) s+=40; if(/^en[-_](GB|IE)/i.test(v.lang)) s+=20; else if(/^en[-_](AU|NZ)/i.test(v.lang)) s+=12; else if(/^en/i.test(v.lang)) s+=5; if(v.localService===false) s+=5; return s; }
function ieVoiceList(){ const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; return vs.filter(v=>/^en/i.test(v.lang)&&!IE_BAD.test(v.name)).sort((a,b)=>ieVoiceScore(b)-ieVoiceScore(a)); }
function ieVoices(){
  const list=ieVoiceList(); let saved={}; try{ saved=JSON.parse(localStorage.getItem("che-pro-voice")||"{}"); }catch(e){}
  const byName=n=>list.find(v=>v.name===n);
  const F=byName(saved.F)||list.find(v=>IE_FEM.test(v.name)&&!IE_MAL.test(v.name))||list[0]||null;
  const M=byName(saved.M)||list.find(v=>IE_MAL.test(v.name)&&!/female/i.test(v.name)&&v!==F)||list.find(v=>v!==F)||F;
  return {F, M, same:F===M};
}
if(window.speechSynthesis){ try{ speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged",()=>{ if(S.view==="adv"&&(S.compMode||"ielts")==="ielts") render(); }); }catch(e){} }
function ieSay(text, v, sp, same, onend){ const u=new SpeechSynthesisUtterance(text); u.lang=(v&&v.lang)||"en-GB"; if(v) u.voice=v; u.rate=1; u.pitch=same?(sp==="F"?1.08:0.94):1; u.onend=onend; u.onerror=onend; speechSynthesis.speak(u); }
function voiceCard(){
  if(!window.speechSynthesis) return "";
  const list=ieVoiceList(), V=ieVoices();
  const opt=sel=>list.map(v=>`<option value="${esc(v.name)}"${sel&&sel.name===v.name?" selected":""}>${ieVoiceScore(v)>=60?"★ ":""}${esc(v.name)} (${esc(v.lang)})</option>`).join("");
  const hasRec=Object.keys(IE_AUDIO.tests||{}).length>0;
  if(hasRec) return `<section class="card ie-voice"><b>🎧 ${T("ieVoiceTitle")}</b><p class="sm-t" style="margin:4px 0">🎙 ${T("ieRecOn")}</p>
    <details><summary class="muted sm-t">${T("ieRecFallback")}</summary>${list.length?`<label class="vrow"><span>${T("ieVoiceF")}</span><select id="ieVoiceF" class="search">${opt(V.F)}</select><button class="btn ghost sm" data-act="ievtry" data-k="F">${T("ieVoiceTry")}</button></label>
    <label class="vrow"><span>${T("ieVoiceM")}</span><select id="ieVoiceM" class="search">${opt(V.M)}</select><button class="btn ghost sm" data-act="ievtry" data-k="M">${T("ieVoiceTry")}</button></label>`:""}<p class="muted sm-t">${T("ieVoiceHint")}</p></details></section>`;
  return `<section class="card ie-voice"><b>🎧 ${T("ieVoiceTitle")}</b>
    ${list.length?`<label class="vrow"><span>${T("ieVoiceF")}</span><select id="ieVoiceF" class="search">${opt(V.F)}</select><button class="btn ghost sm" data-act="ievtry" data-k="F">${T("ieVoiceTry")}</button></label>
    <label class="vrow"><span>${T("ieVoiceM")}</span><select id="ieVoiceM" class="search">${opt(V.M)}</select><button class="btn ghost sm" data-act="ievtry" data-k="M">${T("ieVoiceTry")}</button></label>`:`<p class="muted sm-t">${T("ieVoiceNone")}</p>`}
    <p class="muted sm-t">${T("ieVoiceHint")}</p></section>`;
}
function iePlay(pi){
  const R=game().ieltsRun; if(!R) return; const t=ieFind(R.test), part=t.listening[pi];
  if(R.ranked&&R.played[pi]) return;
  const rec=(IE_AUDIO.tests||{})[t.id], files=rec&&rec.parts&&rec.parts[pi];
  if(files&&files.length===part.script.length) return iePlayRec(pi, part, files);
  if(!window.speechSynthesis){ R.played[pi]="nots"; saveGame(); return render(); }
  speechSynthesis.cancel(); const V=ieVoices(); const lines=part.script; let i=0;
  R.played[pi]=true; saveGame(); S.iePlaying={pi,i:0,n:lines.length}; render();
  const next=()=>{ if(!S.iePlaying||S.iePlaying.pi!==pi) return; if(i>=lines.length){ S.iePlaying=null; render(); return; }
    const [sp,text]=lines[i];
    ieSay(text, V[sp]||V.F, sp, V.same, ()=>{ i++; S.iePlaying&&(S.iePlaying.i=i); const el=document.getElementById("iePlayState"); if(el) el.textContent=T("iePlaying",{i:Math.min(i+1,lines.length),n:lines.length}); setTimeout(next,450); }); };
  next();
}
function iePlayRec(pi, part, files){
  const R=game().ieltsRun; ieStopAudio();
  const au=S.ieAudioEl||(S.ieAudioEl=new Audio()); au.preload="auto";
  const pre=new Audio(); pre.preload="auto";
  let i=0; R.played[pi]=true; saveGame(); S.iePlaying={pi,i:0,n:files.length,rec:true}; render();
  const url=k=>"ielts/audio/"+k+".mp3";
  const fallback=()=>{ const V=ieVoices(), [sp,text]=part.script[i]; if(window.speechSynthesis) ieSay(text, V[sp]||V.F, sp, V.same, step); else step(); };
  const step=()=>{ i++; if(S.iePlaying) S.iePlaying.i=i; const el=document.getElementById("iePlayState"); if(el) el.textContent=T("iePlaying",{i:Math.min(i+1,files.length),n:files.length}); setTimeout(next,380); };
  const next=()=>{ if(!S.iePlaying||S.iePlaying.pi!==pi) return; if(i>=files.length){ S.iePlaying=null; render(); return; }
    au.onended=step; au.onerror=fallback; au.src=url(files[i]); const pr=au.play(); if(pr&&pr.catch) pr.catch(fallback);
    if(files[i+1]) pre.src=url(files[i+1]); };
  next();
}
function ieStopAudio(){ try{ speechSynthesis.cancel(); }catch(e){} try{ if(S.ieAudioEl){ S.ieAudioEl.onended=null; S.ieAudioEl.onerror=null; S.ieAudioEl.pause(); } }catch(e){} S.iePlaying=null; }

function ieQHtml(item, R, review){
  const {key,q}=item, a=R.ans[key], num=item.num;
  const mark=review?(ieCorrect(q,a)?'<span class="mark ok">✓</span>':'<span class="mark no">✗</span>'):"";
  let input="";
  if(q.type==="gap") input=review?`<span class="ie-ans">${a?esc(a):`<i class="muted">${T("ieBlank")}</i>`}</span>`:`<input class="search ie-gap" data-iq="${key}" value="${esc(a||"")}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  else if(q.type==="mcq") input=`<div class="ie-opts">${q.opts.map((o,i)=>`<button class="ie-opt${+a===i&&a!==undefined&&a!==""?" on":""}${review&&i===q.a?" right":""}${review&&+a===i&&i!==q.a?" wrong":""}" ${review?"disabled":`data-iqk="${key}" data-iqv="${i}"`}><b>${"ABCD"[i]}</b> ${esc(o)}</button>`).join("")}</div>`;
  else input=`<div class="ie-opts row">${[["T","TRUE"],["F","FALSE"],["NG","NOT GIVEN"]].map(([v,l])=>`<button class="ie-opt tf${a===v?" on":""}${review&&v===q.a?" right":""}${review&&a===v&&v!==q.a?" wrong":""}" ${review?"disabled":`data-iqk="${key}" data-iqv="${v}"`}>${l}</button>`).join("")}</div>`;
  const exp=review?`<div class="ie-exp">${!ieCorrect(q,a)?`<div><span class="lab">${T("ieAns")}</span><b>${esc(q.type==="gap"?q.a[0]:q.type==="mcq"?"ABCD"[q.a]+" "+q.opts[q.a]:({T:"TRUE",F:"FALSE",NG:"NOT GIVEN"})[q.a])}</b></div>`:""}<div class="muted">${esc(q.exp)}</div></div>`:"";
  return `<div class="ie-q${review?(ieCorrect(q,a)?" ok":" no"):""}"><div class="ie-qh"><span class="ie-n">${num}</span>${mark}<span>${esc(q.q).replace("______",'<u class="blank"></u>')}</span></div>${input}${exp}</div>`;
}
function ieSectionHtml(t,R,review){
  const items=ieQuestions(t); items.forEach((it,i)=>it.num=i+1);
  const tab=R.sec||0;
  const tabs=[...t.listening.map((p,i)=>`${T("ieListen")} ${i+1}`),T("ieRead")].map((l,i)=>`<button data-iesec="${i}" aria-pressed="${tab===i}">${l}</button>`).join("");
  let body="";
  if(tab<t.listening.length){
    const p=t.listening[tab], pi=tab, played=R.played[pi], playing=S.iePlaying&&S.iePlaying.pi===pi;
    const noTTS=!window.speechSynthesis||played==="nots";
    const audio=review||noTTS?"":playing?`<div class="ie-audio playing"><span class="eq"><i></i><i></i><i></i></span><span id="iePlayState">${T("iePlaying",{i:S.iePlaying.i+1,n:p.script.length})}</span></div>`
      :played&&R.ranked?`<div class="ie-audio done">✓ ${T("iePlayed")}</div>`
      :`<div class="ie-audio"><button class="btn" data-act="ieplay" data-k="${pi}">${played?T("ieReplay"):T("iePlay")}</button>${R.ranked?`<span class="muted sm-t">${T("iePlayOnce")}</span>`:""}</div>`;
    const script=(review||noTTS)?`<details class="ie-script"${noTTS&&!review?" open":""}><summary>${T("ieScript")}</summary>${noTTS&&!review?`<p class="muted sm-t">${T("ieNoTTS")}</p>`:""}${p.script.map(([sp,x])=>`<p><b>${sp==="F"?"♀":"♂"}</b> ${esc(x)}</p>`).join("")}</details>`:"";
    body=`<div class="ie-part"><h3>${esc(p.title)}</h3><p class="ie-instr">${esc(p.instr)}</p>${audio}${script}${items.filter(x=>x.sec==="L"&&x.part===pi).map(x=>ieQHtml(x,R,review)).join("")}</div>`;
  } else {
    const rd=t.reading, rq=items.filter(x=>x.sec==="R");
    const grp=(type,instr)=>{ const qs=rq.filter(x=>x.q.type===type); return qs.length?`<p class="ie-instr">${instr}</p>${qs.map(x=>ieQHtml(x,R,review)).join("")}`:""; };
    body=`<div class="ie-part"><h3>${esc(rd.title)}</h3><div class="ie-passage">${rd.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      ${grp("tfng","Do the statements agree with the information in the passage? Choose TRUE, FALSE or NOT GIVEN.<br><span class='muted sm-t'>"+T("ieTFNG")+"</span>")}
      ${grp("mcq","Choose the correct letter, A, B, C or D.")}
      ${grp("gap",esc(rd.gapInstr||"Complete the sentences."))}</div>`;
  }
  return `<div class="seg ie-tabs">${tabs}</div>${body}`;
}
function viewIelts(){
  const R=game().ieltsRun;
  if(S.ieResult) return ieResultHtml();
  if(!R||!IE_TESTS){ return `<div class="view"><p class="muted">${T("loading")}</p></div>`; }
  const t=ieFind(R.test); const left=ieRunLeft();
  const unanswered=ieQuestions(t).filter(x=>R.ans[x.key]===undefined||R.ans[x.key]==="").length;
  return `<div class="view ie-view">
    <div class="ie-top"><div><div class="eyebrow">${R.ranked?esc(R.week):T("iePracticeTag")}</div><b>${esc(t.title)}</b></div><span class="ie-tr"><span id="ieClock" class="ie-clock${left<120?" low":""}">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span><button class="btn ghost sm" data-act="ieexit">${T("ieExit")}</button></span></div>
    ${S.ieExitAsk?`<div class="ie-exitask"><b>${T("ieExitQ")}</b><p class="sm-t">${R.ranked?T("ieExitRanked"):T("ieExitPrac")}</p><div class="row"><button class="btn danger sm" data-act="ieexit2">${T("ieExitYes")}</button><button class="btn sm" data-act="ieexitno">${T("ieExitNo")}</button></div></div>`:""}
    ${ieSectionHtml(t,R,false)}
    <button class="btn${S.ieConfirm?" danger":""}" data-act="iesubmit">${S.ieConfirm?T("ieConfirm2",{n:unanswered}):T("ieSubmit")}</button>
  </div>`;
}
function trackPlay(k){ if(DEV) return; const g=game(); g.plays=g.plays||{}; g.plays[k]=(g.plays[k]||0)+1; }
function ieSubmit(){
  const g=game(), R=g.ieltsRun; if(!R) return; ieStopAudio(); clearInterval(S.ieTimer); trackPlay(R.ranked?"ielts":"ieltsPrac");
  const t=ieFind(R.test), items=ieQuestions(t);
  const L=items.filter(x=>x.sec==="L"), Rd=items.filter(x=>x.sec==="R");
  const lc=L.filter(x=>ieCorrect(x.q,R.ans[x.key])).length, rc=Rd.filter(x=>ieCorrect(x.q,R.ans[x.key])).length;
  const lb=ieBand(lc,L.length), rb=ieBand(rc,Rd.length), ob=Math.round((lb+rb))/2;
  const st=ieState(), res={test:t.id, week:R.week, ranked:R.ranked, lc, rc, lt:L.length, rt:Rd.length, lb, rb, band:ob, ans:R.ans, date:today()};
  const gold=(lc+rc)*(R.ranked?4:1); g.gold+=gold; res.gold=gold;
  if(R.ranked){
    st.days[today()]=ob; const prevWeek=typeof st.weeks[R.week]==="number"?st.weeks[R.week]:-1; st.weeks[R.week]=Math.max(prevWeek,ob); res.weekBest=st.weeks[R.week];
    st.hist=(st.hist||[]).concat({week:R.week,band:ob,l:lb,r:rb,date:today()}).slice(-120);
    if(!st.best||ob>st.best.band){ st.best={band:ob,week:R.week,date:today()}; res.newBest=true; }
    if(ob>=6){ const k=fmtBand(ob); st.badges[k]=(st.badges[k]||0)+1; res.badge=k; res.badgeN=st.badges[k]; }
    const mk=monthKey(), prevMonth=typeof st.months[mk]==="number"?st.months[mk]:-1; st.months[mk]=Math.max(prevMonth,ob); res.monthBest=st.months[mk];
    if(ob>prevMonth) iePush(ob,lb,rb,mk);
  }
  g.ieltsRun=null; saveGame(); S.ieResult=res; S.ieReviewSec=0; render(); window.scrollTo(0,0);
}
async function iePush(band,l,r,week){
  if(DEV||!CLOUD.user||!CLOUD.fb) return; const g=game(); const name=(g.nick||CLOUD.user.displayName||"").slice(0,16); if(!name) return;
  try{ const {fsM,db}=CLOUD.fb; await fsM.setDoc(fsM.doc(db,"ieltsMonths",week,"scores",CLOUD.user.uid),{name, band, l, r, best:(ieState().best||{}).band||band, at:new Date().toISOString()}); }catch(e){ console.warn("ielts push",e&&e.code); }
}
/* badges: Band 6 bronze → 9 rainbow; repeated bands add stars */
const BADGE_STYLE={"6.0":["#B87333","#E3A16B"],"6.5":["#8E99A3","#E3E8EC"],"7.0":["#C9A227","#FFE58A"],"7.5":["#1F9E74","#7FE0B8"],"8.0":["#2563C9","#8EC1FF"],"8.5":["#7B3FC4","#D3A8FF"],"9.0":["#E0457B","#FFD25A"]};
function badgeSvg(k, count, size){
  const [c1,c2]=BADGE_STYLE[k]||BADGE_STYLE["6.0"], b=parseFloat(k), glow=b>=8, rainbow=b>=9, id="bg"+k.replace(".","")+Math.random().toString(36).slice(2,6);
  const stars=Math.max(0,count||0), shown=Math.min(stars,7);
  const starEls=Array.from({length:shown},(_,i)=>{ const a=-Math.PI/2+(i-(shown-1)/2)*0.45; const x=50+44*Math.cos(a), y=48+44*Math.sin(a); return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(.6)" d="M0-10L2.9-3.1L10.5-3.1L4.3 1.6L6.6 9L0 4.6L-6.6 9L-4.3 1.6L-10.5-3.1L-2.9-3.1Z" fill="#FFD25A" stroke="#7A5A00" stroke-width="1.2"/>`; }).join("");
  return `<svg viewBox="-6 -6 112 118" width="${size||56}" height="${(size||56)*1.05}" class="badge${glow?" glow":""}${rainbow?" rainbow":""}" aria-label="IELTS Band ${k}${stars?` +${stars}★`:""}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <path d="M30 70L22 104L38 96L46 108L50 78Z" fill="${c1}" opacity=".85"/><path d="M70 70L78 104L62 96L54 108L50 78Z" fill="${c1}" opacity=".85"/>
    <circle cx="50" cy="48" r="38" fill="url(#${id})" stroke="${c1}" stroke-width="4"/>
    <circle cx="50" cy="48" r="30" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="${b>=7?"4 3":"0"}"/>
    <text x="50" y="44" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" style="letter-spacing:.08em">BAND</text>
    <text x="50" y="66" text-anchor="middle" font-size="24" font-weight="900" fill="#fff" paint-order="stroke" stroke="${c1}" stroke-width="3">${k}</text>
    ${starEls}${stars>7?`<text x="96" y="12" font-size="12" font-weight="800" fill="#7A5A00">×${stars}</text>`:""}
  </svg>`;
}
function badgeShelf(){

  return ks.length?`<div class="badge-shelf">${ks.map(k=>`<div class="bs-item">${badgeSvg(k,st.badges[k],64)}<small>×${st.badges[k]}</small></div>`).join("")}</div>`:`<p class="muted sm-t">${T("ieNoBadge")}</p>`;
}

const FEEDBACK_URL="https://script.google.com/macros/s/AKfycbxL21sHbIGaY4OSAwQUGEYL6bw_Dnpv2b6gn8kSMtkG0_7tauCTLIuH4nEZg6vG93X2/exec";
function feedbackCard(){

async function sendFeedback(){
  const msg=(($("#fbText")||{}).value||"").trim(), contact=(($("#fbContact")||{}).value||"").trim().slice(0,120);
  if(!msg) return toast(T("fbEmpty"));
  try{ const last=+localStorage.getItem("che-pro-fb")||0; if(Date.now()-last<60e3) return toast(T("fbWait")); localStorage.setItem("che-pro-fb",String(Date.now())); }catch(e){}
  const g=game(), d={type:S.fbType||"idea", msg:msg.slice(0,1000), contact, nick:g.nick||"", name:(CLOUD.user&&CLOUD.user.displayName)||"", lv:g.lv, lang:LANG, level:LEVEL, region:regionKey(), uid:(CLOUD.user&&CLOUD.user.uid)||"", ua:navigator.userAgent.slice(0,120), at:new Date().toISOString()};
  if(FEEDBACK_URL){ try{ fetch(FEEDBACK_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}).catch(()=>{}); }catch(e){} }
  // the Firestore copy is the one we can confirm: keep the draft unless it was really saved
  let ok=false;
  if(CLOUD.fb){ try{ const {fsM,db}=CLOUD.fb; await fsM.setDoc(fsM.doc(db,"feedback",Date.now()+"-"+Math.random().toString(36).slice(2,8)), d); ok=true; }catch(e){ console.warn("feedback",e&&e.code); } }
  if(!ok){ S.fbDraft=msg; S.fbContactV=contact; try{ localStorage.removeItem("che-pro-fb"); }catch(e){} toast(T("fbFail")); return render(); }
  S.fbDraft=""; S.fbContactV=""; toast(T("fbThanks")); render();
}
async function devLoadFeedback(){
  if(!CLOUD.fb) return []; const {fsM,db}=CLOUD.fb;
  try{ const snap=await fsM.getDocs(fsM.query(fsM.collection(db,"feedback"), fsM.orderBy("at","desc"), fsM.limit(100))); const rows=[]; snap.forEach(d=>rows.push(safeDoc(d.data()))); return rows; }catch(e){ return null; }
}

const CLOUD={ready:false, user:null, status:"idle", fb:null, dirtyWords:new Set(), delWords:new Set(), dirtyMain:false, timer:null};
async function cloudInit(){
  try{
    const [appM,authM,fsM]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)]);
    const app=appM.initializeApp(FB_CONFIG);
    const auth=authM.getAuth(app);
    const db=fsM.getFirestore(app);
    CLOUD.fb={authM,fsM,auth,db};
    setTimeout(()=>actPing(),2500);
    setTimeout(pushRefresh,1200);
    setTimeout(supLoad,0);
    try{ fsM.onSnapshot(fsM.doc(db,"config","site"), sn=>{ S.maint=sn.exists()?sn.data():null; maintApply(); }, ()=>{}); }catch(e){}
    authM.getRedirectResult(auth).catch(()=>{});
    authM.onAuthStateChanged(auth, async u=>{
      CLOUD.user=u; CLOUD.ready=true; maintApply();
      if(u){ await cloudPull(); regionPing(false); nickVerify(); payTesterCheck(u); setTimeout(()=>payLoad(PAY_RET&&PAY_RET.sid),800); } else { CLOUD.status="idle"; render(); }
    });
  }catch(e){ CLOUD.ready=true; CLOUD.status="off"; render(); }
}
async function cloudSignIn(){
  if(!CLOUD.fb){ toast(T("cloudOff")); return; }
  const {authM,auth}=CLOUD.fb; const p=new authM.GoogleAuthProvider();
  try{ await authM.signInWithPopup(auth,p); }
  catch(e){
    const c=e&&e.code||"";
    if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return;
    if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported"){ try{ await authM.signInWithRedirect(auth,p); return; }catch(_){} }
    toast(T("loginFail"));
  }
}
// nicknames: letters (any language), numbers, space, _ . - only; no emoji or symbols
const nickOk=n=>/^[\p{L}\p{M}\p{N} _.\-]{1,16}$/u.test(n)&&/[\p{L}\p{N}]/u.test(n);
const nickKey=n=>encodeURIComponent(n.trim().toLowerCase()).replace(/\./g,"%2E").slice(0,200);
async function nickClaim(n){
  if(CLOUD.fb&&!CLOUD.user) return toast(T("nickLogin"));
  if(DEV){ game().nick=n; saveGame(); toast(T("nickSaved")); return render(); }
  if(CLOUD.fb&&CLOUD.user){
    const {fsM,db}=CLOUD.fb, me=CLOUD.user.uid, old=game().nick, ref=fsM.doc(db,"nicks",nickKey(n));
    try{
      await fsM.runTransaction(db, async tx=>{ const d=await tx.get(ref); if(d.exists()&&d.data().uid!==me) throw {code:"taken"}; tx.set(ref,{uid:me, n, at:Date.now()}); });
      if(old&&nickKey(old)!==nickKey(n)){ const oref=fsM.doc(db,"nicks",nickKey(old)); try{ const od=await fsM.getDoc(oref); if(od.exists()&&od.data().uid===me) await fsM.deleteDoc(oref); }catch(e){} }
    }catch(e){ return toast(e&&e.code==="taken"?T("nickTaken"):T("syncFail")); }
  }
  const g=game(); if(g.nick) g.nickAt=Date.now(); else g.nickAt=Date.now(); g.nick=n; saveGame(); CLOUD.lbSig=null; toast(T("nickSaved")); S.rk=null; lbPush().then(()=>render());
}
async function nickVerify(){
  const n=game().nick; if(!n||!CLOUD.user||!CLOUD.fb||DEV) return;
  if(!nickOk(n)){ game().nick=""; saveGame(); toast(T("nickCharsOld")); render(); return; }
  const {fsM,db}=CLOUD.fb, ref=fsM.doc(db,"nicks",nickKey(n));
  try{ let taken=false; await fsM.runTransaction(db, async tx=>{ const d=await tx.get(ref); if(d.exists()&&d.data().uid!==CLOUD.user.uid){ taken=true; return; } if(!d.exists()) tx.set(ref,{uid:CLOUD.user.uid, n, at:Date.now()}); });
    if(taken){ game().nick=""; saveGame(); toast(T("nickTakenOld")); render(); } }catch(e){}
}
const OWNER_KEY="che-pro-owner";
function localReset(){ S.words.clear(); S.days.clear(); try{ localStorage.removeItem("che-pro-wsync"); localStorage.removeItem("che-pro-dirty"); }catch(e){} S.game=JSON.parse(JSON.stringify(G_DEFAULT)); if(DEV){ DEV=null; devSave(); applyMast(); } lsSave(); }
async function cloudSignOut(){ if(!CLOUD.fb) return; await cloudFlush(); await CLOUD.fb.authM.signOut(CLOUD.fb.auth);
  localReset(); try{ localStorage.removeItem(OWNER_KEY); }catch(e){} toast(T("signedOut")); render(); }
const userRef=()=>CLOUD.fb.fsM.doc(CLOUD.fb.db,"users",CLOUD.user.uid);
const wordsCol=()=>CLOUD.fb.fsM.collection(CLOUD.fb.db,"users",CLOUD.user.uid,"words");
const wScore=v=>(v.correct||0)+(v.wrong||0)+(v.lookups||0);
const dScore=v=>(v.preDone?1:0)+(v.read?1:0)+(v.postDone?1:0)+Object.keys(v.postBy||{}).length;
function mergeDay(a,b){ if(!a) return b; if(!b) return a; const base=dScore(b)>dScore(a)?b:a, o=base===a?b:a;
  const lb={...(o.lookedUpBy||{})}; for(const [k,v] of Object.entries(base.lookedUpBy||{})) lb[k]=[...new Set([...(lb[k]||[]),...v])];
  // each step is kept if either device finished it (done flags are OR-ed, the score goes with whichever device did that step)
  const pre=base.preDone?base:o.preDone?o:base, post=base.postDone?base:o.postDone?o:base;
  return {...base, preDone:!!(a.preDone||b.preDone), preScore:pre.preScore, preTotal:pre.preTotal, postDone:!!(a.postDone||b.postDone), postScore:post.postScore, postTotal:post.postTotal,
    read:base.read||o.read||null, lookedUp:[...new Set([...(base.lookedUp||[]),...(o.lookedUp||[])])], lookedUpBy:lb, postBy:{...(o.postBy||{}),...(base.postBy||{})}, bonus:!!(a.bonus||b.bonus)}; }
function mergeGame(a,b){ if(!a) return b; if(!b) return a;
  const base=(b.lv>a.lv||(b.lv===a.lv&&(b.exp||0)>(a.exp||0)))?b:a, o=base===a?b:a;
  const wins={...(o.wins||{})}; for(const [k,v] of Object.entries(base.wins||{})) wins[k]=Math.max(v,wins[k]||0);
  return {...newGame(base), inv:[...new Set([...(base.inv||[]),...(o.inv||[])])], conq:{...(o.conq||{}),...(base.conq||{})}, wins,
    taxDate:[base.taxDate,o.taxDate].filter(Boolean).sort().pop()||null, battles:Math.max(base.battles||0,o.battles||0), gender:base.gender||o.gender||null}; }
/* Word sync reads only what changed: every word doc carries _u (time written); deleted words leave a
   tombstone {_del:1,_u}. A full read happens on the first sync on a device and then once a week. */
const WSYNC_KEY="che-pro-wsync", DIRTY_KEY="che-pro-dirty", WSYNC_FULL=7*864e5, WSYNC_MARGIN=15*60e3;
function wsyncGet(){ try{ const v=JSON.parse(localStorage.getItem(WSYNC_KEY)||"null"); return v&&CLOUD.user&&v.uid===CLOUD.user.uid?v:null; }catch(e){ return null; } }
function wsyncSet(o){ try{ localStorage.setItem(WSYNC_KEY,JSON.stringify({uid:CLOUD.user.uid,...o})); }catch(e){} }
function dirtySave(){ if(!CLOUD.user) return; try{ localStorage.setItem(DIRTY_KEY,JSON.stringify({uid:CLOUD.user.uid,w:[...CLOUD.dirtyWords],d:[...CLOUD.delWords]})); }catch(e){} }
function dirtyLoad(){ try{ const v=JSON.parse(localStorage.getItem(DIRTY_KEY)||"null"); if(v&&v.uid===CLOUD.user.uid){ (v.w||[]).forEach(k=>CLOUD.dirtyWords.add(k)); (v.d||[]).forEach(k=>CLOUD.delWords.add(k)); } }catch(e){} }
async function cloudPull(){
  const {fsM}=CLOUD.fb; CLOUD.status="syncing"; render();
  try{
    // each Google account has its own progress: never mix another account's (or a guest's) data into an existing account
    let owner=null; try{ owner=localStorage.getItem(OWNER_KEY); }catch(e){}
    const info=wsyncGet(), started=Date.now();
    const delta=!!(info&&owner===CLOUD.user.uid&&started-(info.full||0)<WSYNC_FULL);
    const wq=delta?fsM.query(wordsCol(), fsM.where("_u",">",(info.at||0)-WSYNC_MARGIN)):wordsCol();
    const [us,ws]=await Promise.all([fsM.getDoc(userRef()), fsM.getDocs(wq)]);
    const cloud=us.exists()?us.data():{};
    const cw=new Map(), tomb=new Set(); ws.forEach(d=>{ const v=d.data(); if(v&&v._del) tomb.add(d.id); else if(v){ const {_u,...w}=v; cw.set(d.id,w); } });
    CLOUD.lastPull={delta, n:cw.size+tomb.size};
    const cloudHas=!!(cloud.game||cw.size||Object.keys(cloud.days||{}).length);
    if((owner&&owner!==CLOUD.user.uid)||(!owner&&cloudHas)) localReset();
    try{ localStorage.setItem(OWNER_KEY,CLOUD.user.uid); }catch(e){}
    const hadLocal=S.words.size>0||S.days.size>0||(S.game&&(S.game.lv>1||S.game.exp>0||S.game.gold>0));
    dirtyLoad();
    // words deleted on another device
    for(const k of tomb) if(!CLOUD.dirtyWords.has(k)) S.words.delete(k);
    // words: keep the more-practised copy of each word
    for(const [k,v] of cw){ const l=S.words.get(k); if(!l||wScore(v)>=wScore(l)) S.words.set(k,v); }
    if(delta){ for(const [k,v] of cw){ const l=S.words.get(k); if(l&&wScore(l)>wScore(v)) CLOUD.dirtyWords.add(k); } }
    else for(const [k,v] of S.words) if(!tomb.has(k)&&(!cw.has(k)||wScore(v)>wScore(cw.get(k)))) CLOUD.dirtyWords.add(k);
    for(const [k,v] of Object.entries(cloud.days||{})) S.days.set(k, mergeDay(S.days.get(k),v));
    S.game=mergeGame(S.game, cloud.game?newGame(cloud.game):null) || S.game;
    CLOUD.dirtyMain=true; lsSave();
    await cloudFlush();
    wsyncSet({at:started, full:delta?info.full:started});
    if(hadLocal && !delta && (cw.size||cloud.game)) toast(T("merged"));
    CLOUD.status="ok";
  }catch(e){ CLOUD.status="err"; }
  render();
}
function cloudMark(id, deleted){ if(!CLOUD.user||SANDBOX()) return; if(id&&id.startsWith("w~")){ (deleted?CLOUD.delWords:CLOUD.dirtyWords).add(id); if(deleted) CLOUD.dirtyWords.delete(id); else CLOUD.delWords.delete(id); dirtySave(); } else { CLOUD.dirtyMain=true; if(CLOUD.dirtyWords.size) dirtySave(); }
  clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush,1500); }
async function cloudFlush(){
  if(!CLOUD.user||!CLOUD.fb||CLOUD.deleting||SANDBOX()) return; clearTimeout(CLOUD.timer);
  const {fsM,db}=CLOUD.fb; const words=[...CLOUD.dirtyWords], dels=[...CLOUD.delWords], main=CLOUD.dirtyMain;
  if(!words.length&&!dels.length&&!main) return;
  CLOUD.dirtyWords.clear(); CLOUD.delWords.clear(); CLOUD.dirtyMain=false; dirtySave();
  try{
    const ops=[];   // each op: {k, ref, data}
    if(main&&!DEV) setTimeout(lbPush,0);
    const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>typeof v==="number"&&!isFinite(v)?0:v));   // Firestore rejects undefined
    if(main) ops.push({k:"", ref:userRef(), data:clean({name:(CLOUD.user&&CLOUD.user.displayName)||"", region:regionKey(), game:(DEV?DEV.game:S.game)||null, days:Object.fromEntries(S.days), updatedAt:new Date().toISOString(), v:1})});
    const now=Date.now(), okId=k=>k&&k.length<700&&!k.includes("/")&&k!=="."&&k!==".."&&!/^__.*__$/.test(k);
    for(const k of words){ const v=S.words.get(k); if(v&&okId(k)) ops.push({k, ref:fsM.doc(wordsCol(),k), data:{...clean(v), _u:now}}); }
    for(const k of dels) if(okId(k)) ops.push({k, ref:fsM.doc(wordsCol(),k), data:{_del:1, _u:now}});
    try{ for(let i=0;i<ops.length;i+=400){ const b=fsM.writeBatch(db); ops.slice(i,i+400).forEach(o=>b.set(o.ref,o.data)); await b.commit(); } }
    catch(e0){
      if(e0&&/unavailable|network|offline|deadline/i.test(String(e0.code||e0.message))) throw e0;
      // one bad document must not block every save: write them one by one and drop the ones the server refuses
      const res=await Promise.allSettled(ops.map(o=>fsM.setDoc(o.ref,o.data)));
      const bad=res.map((r,i)=>r.status==="rejected"?[ops[i],r.reason]:null).filter(Boolean);
      if(bad.length){ const [o,err]=bad[0]; errReport({message:"sync "+(o.k||"main")+": "+String(err&&(err.code||"")+" "+(err&&err.message||"")).slice(0,200), stack:JSON.stringify(o.data).length+" bytes"},"cloudFlush");
        if(bad.some(([o])=>!o.k)) throw bad.find(([o])=>!o.k)[1]; }
    }
    if(CLOUD.status!=="ok"){ CLOUD.status="ok"; render(); }
  }catch(e){
    CLOUD.lastErr=String(e&&(e.code||e.message)||e).slice(0,80);
    words.forEach(k=>CLOUD.dirtyWords.add(k)); dels.forEach(k=>CLOUD.delWords.add(k)); if(main) CLOUD.dirtyMain=true; dirtySave();
    if(CLOUD.status!=="err"){ CLOUD.status="err"; toast(T("syncFail")+" ["+CLOUD.lastErr+"]"); render(); }
    clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(cloudFlush,30000);
  }
}

const powerOf=s=>s.hp+s.atk*3+s.def*2;
/* "look": how my character appears to others — gender | weapon | armour | weapon gems | armour gems */
function myLook(){ const g=game(); if(!g||!g.gender) return "";
  const sk=id=>id?socketsOf(id).filter(Boolean).join("."):"";
  return [g.gender, g.weapon||"", g.armor||"", sk(g.weapon), sk(g.armor)].join("|").slice(0,100); }
function parseLook(str){ if(typeof str!=="string") return null; const [g,w,a,ws,as]=str.split("|");
  if(g!=="m"&&g!=="f") return null; const gem=x=>(x||"").split(".").filter(k=>/^(metal|wood|water|fire|earth)-[0-3]$/.test(k)).slice(0,4);
  return {g, w:ITEMS[w]?w:null, a:ITEMS[a]?a:null, ws:gem(ws), as:gem(as)}; }
function lookArt(str, cls, pose){ const L=parseLook(str); if(!L) return `<div class="${cls} look-ph">🙂</div>`;
  return charArt(L.g, pose||"idle", L.w&&ITEMS[L.w], L.a&&ITEMS[L.a], cls, {ws:L.ws, as:L.as, lazy:true}); }
const LOOKS={};   // uid → look string (from leaderboard docs), for party lobbies
async function lookFetch(uids){ if(!CLOUD.fb) return; const {fsM,db}=CLOUD.fb; let got=false;
  await Promise.all(uids.filter(u=>!(u in LOOKS)).map(async u=>{ LOOKS[u]=""; try{ const d=await fsM.getDoc(fsM.doc(db,"leaderboard",u)); if(d.exists()&&d.data().look){ LOOKS[u]=String(d.data().look); got=true; } }catch(e){} }));
  if(got) render(); }
function lbEntry(){ const g=game(), s=stats(); const e={name:(g.nick||"").slice(0,16), lv:g.lv|0, hp:s.hp|0, atk:s.atk|0, def:s.def|0, power:powerOf(s)|0, conq:Object.keys(g.conq||{}).length, flag:myFlag(), updatedAt:new Date().toISOString()};
  const lk=myLook(); if(lk&&!CLOUD.lbNoLook) e.look=lk; return e; }
async function lbPush(){
  if(DEV||CLOUD.deleting) return;
  if(!CLOUD.user||!CLOUD.fb||!game().nick) return;
  const {fsM,db}=CLOUD.fb; const e=lbEntry(); const sig=JSON.stringify({...e,updatedAt:0});
  if(sig===CLOUD.lbSig) return;
  try{ await fsM.setDoc(fsM.doc(db,"leaderboard",CLOUD.user.uid), e); CLOUD.lbSig=sig; }
  catch(err){ // older security rules don't know "look" yet: save without it
    if(e.look&&err&&err.code==="permission-denied"){ CLOUD.lbNoLook=true; delete e.look; try{ await fsM.setDoc(fsM.doc(db,"leaderboard",CLOUD.user.uid), e); CLOUD.lbSig=sig; }catch(e2){ console.warn("leaderboard",e2&&e2.code); } }
    else console.warn("leaderboard",err&&err.code); }
}
async function lbLoad(){
  if(!CLOUD.user||!CLOUD.fb) return;
  const {fsM,db}=CLOUD.fb; const f=S.rkBy||"power";
  S.rk={loading:true, rows:S.rk&&S.rk.by===f?S.rk.rows:[], by:f}; render();
  try{
    const rd=f==="read", fld=rd?"n":f, col=rd?fsM.collection(db,"readMonths",monthKey(),"u"):fsM.collection(db,"leaderboard");
    if(rd) await rdPush(); else await lbPush();
    const q=fsM.query(col, fsM.orderBy(fld,"desc"), fsM.limit(50));
    const snap=await fsM.getDocs(q); const rows=[]; snap.forEach(d=>rows.push({id:d.id,...safeDoc(d.data())}));
    let me=null; const mine=rows.findIndex(r=>r.id===CLOUD.user.uid), myV=rd?readsThisMonth():lbEntry()[f];
    if(mine>=0) me=mine+1;
    else if(game().nick&&myV>0){ const c=await fsM.getCountFromServer(fsM.query(col, fsM.where(fld,">",myV))); me=c.data().count+1; }
    S.rk={rows, by:f, me};
  }catch(e){ S.rk={rows:[], by:f, err:true}; }
  render();
}

/* ----- error passages ----- */
const CONF={affect:"effect",effect:"affect",their:"there",there:"their",than:"then",then:"than",lose:"loose",advice:"advise",advise:"advice",accept:"except",quite:"quiet",were:"where",where:"were",whose:"who's",rise:"raise",raise:"rise",its:"it's",economic:"economical",principal:"principle",too:"to",lead:"led",past:"passed",passed:"past",weather:"whether",whether:"weather",cite:"site",site:"sight",fewer:"less",among:"between"};
function rng(seed){ let x=seed>>>0||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%100000)/100000; }; }
function misspell(w, r){
  const lw=w.toLowerCase();
  const m=lw.match(/([a-z])\1/); if(m && r()<0.8) return w.slice(0,m.index)+w.slice(m.index+1);
  if(/ie/.test(lw) && !/cie/.test(lw)) return w.replace(/ie/,"ei");
  if(/ei/.test(lw)) return w.replace(/ei/,"ie");
  if(/ence$/.test(lw)) return w.replace(/ence$/,"ance"); if(/ance$/.test(lw)) return w.replace(/ance$/,"ence");
  if(/ible$/.test(lw)) return w.replace(/ible$/,"able"); if(/able$/.test(lw)&&lw.length>7) return w.replace(/able$/,"ible");
  const i=2+Math.floor(r()*(w.length-4)); return w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2);
}
function keepCase(src,w){ return src[0]===src[0].toUpperCase()?w[0].toUpperCase()+w.slice(1):w; }
function makeErrorPassage(art, seed, n=8){
  const r=rng(seed); const paras=parasOf(art).slice(0,4); const gl=art.gloss||{};
  const forms={}; for(const [k,g] of Object.entries(gl)){ if(!g.base||g.lvl==="PN") continue; (forms[g.base.toLowerCase()]=forms[g.base.toLowerCase()]||new Set()).add(k); }
  let idx=0; const toks=[]; const parts=paras.map(p=>p.split(/([A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*)/).map((t,i)=>{ if(i%2){ toks.push({t, i:idx}); return {w:t, i:idx++}; } return {s:t}; }));
  const cands=[];
  for(const {t,i} of toks){
    const k=t.toLowerCase(), g=gl[k]; if(!g||g.lvl==="PN"||i===0) continue;
    if(CONF[k]) cands.push({i,type:"conf",wrong:keepCase(t,CONF[k]),right:t,g,pri:3});
    const fs=forms[(g.base||"").toLowerCase()];
    if(fs&&fs.size>1&&k.length>=4){ const alt=[...fs].filter(x=>x!==k&&x.slice(0,3)===k.slice(0,3)); if(alt.length) cands.push({i,type:"form",wrong:keepCase(t,alt[Math.floor(r()*alt.length)]),right:t,g,pri:2}); }
    if(k.length>=6 && !/['’-]/.test(k)){ const w=misspell(t,r); if(w.toLowerCase()!==k && !gl[w.toLowerCase()]) cands.push({i,type:"spell",wrong:w,right:t,g,pri:1}); }
  }
  // spread: shuffle, then prefer variety, keep 3+ tokens apart
  const order=cands.map(c=>({c,k:r()+c.pri*0.15})).sort((a,b)=>b.k-a.k).map(o=>o.c);
  const picked=[], used=new Set(), cnt={conf:0,form:0,spell:0};
  for(const c of order){ if(picked.length>=n) break; if([...used].some(u=>Math.abs(u-c.i)<4)) continue; if(cnt[c.type]>=Math.ceil(n*0.5)) continue; picked.push(c); used.add(c.i); cnt[c.type]++; }
  picked.sort((a,b)=>a.i-b.i);
  const byI=Object.fromEntries(picked.map(c=>[c.i,c]));
  const text=parts.map(pp=>pp.map(x=>x.s!==undefined?x.s:(byI[x.i]?byI[x.i].wrong:x.w)).join(""));
  const errs=picked.map(c=>({i:c.i, type:c.type, wrong:c.wrong, right:c.right, pos:c.g.pos||"", m:{zh:c.g.zh,en:c.g.en||"",hi:c.g.hi||"",es:c.g.es||"",ja:c.g.ja||"",ko:c.g.ko||""}}));
  return {text, errs, title:art.title, artId:art.id};
}
function errExplain(e){ const m=(e.m&&(e.m[LANG]||e.m.en))||""; return e.type==="spell"?T("coExpSpell",{r:`<b>${esc(e.right)}</b>`}):e.type==="form"?T("coExpForm",{r:`<b>${esc(e.right)}</b>`,p:esc(e.pos),w:esc(e.wrong),m:esc(m)}):T("coExpConf",{w:esc(e.wrong),r:`<b>${esc(e.right)}</b>`,m:esc(m)}); }

const CO_TIME=180, CO_MISSES=5;
const coMe=()=>CLOUD.user?CLOUD.user.uid:"solo";
function coRoom(){ return S.co&&S.co.room; }
/* multiplayer is for fun when you are bored: it costs nothing and gives only small rewards (not part of the main progress) */
function coSpendTicket(){ return true; }
const MP_DAILY=5;   // games per day that still give their small reward
function mpCount(){ const g=game(); if(!g.mpDay||g.mpDay.date!==today()) g.mpDay={date:today(),n:0,clover:0}; return g.mpDay; }
function coNewPassage(){ const art=mainArticle(); if(!art){ toast(T("coNoArt")); return null; } const pool=S.articles.filter(a=>a.date===art.date); const pick=pool[Math.floor(Math.random()*pool.length)]||art; return makeErrorPassage(pick, Math.floor(Math.random()*1e9)); }
function coStartSolo(){

}
async function coCreate(){

}
async function coJoin(code){

  const {fsM,db}=CLOUD.fb; const ref=fsM.doc(db,"rooms",code); S.co={busy:T("coJoining")}; render();

function coListen(code){
  const {fsM,db}=CLOUD.fb; coStop();

  S.co.unsub=fsM.onSnapshot(fsM.doc(db,"rooms",code), snap=>{
    if(!S.co||S.co.code!==code) return;
    if(!snap.exists()){ coStop(); S.co=null; toast(T("coLeftRoom")); render(); return; }
    S.co.room=safeDoc(snap.data()); coCheckEnd(); coTick(); if(S.view==="play"&&S.playMode==="coop") coRender();
  }, ()=>{});
}
function coStop(){ if(S.co&&S.co.unsub){ S.co.unsub(); } clearInterval(S.coTimer); }
function coTick(){ clearInterval(S.coTimer); S.coTimer=setInterval(()=>{ const R=coRoom(); if(!R||R.state!=="play"){ clearInterval(S.coTimer); return; } coCheckEnd(); const el=document.getElementById("coClock"); if(el) el.textContent=T("coTime",{s:Math.max(0,Math.ceil((R.endAt-Date.now())/1000))}); },500); }
function coMissTotal(R){ return Object.values(R.misses||{}).reduce((a,b)=>a+b,0); }
function coCheckEnd(){
  const R=coRoom(); if(!R||R.state!=="play") { if(R&&R.state==="done") coReward(); return; }
  const all=Object.keys(R.found||{}).length>=R.errs.length, dead=coMissTotal(R)>=CO_MISSES, late=R.endAt&&Date.now()>R.endAt;
  if(all||dead||late){
    const win=all; R.state="done"; R.win=win;
    if(!S.co.solo){ const {fsM,db}=CLOUD.fb; fsM.updateDoc(fsM.doc(db,"rooms",S.co.code),{state:"done", win}).catch(()=>{}); }
    coReward(); coRender();
  }
}
function coReward(){
  const R=coRoom(); const key=(S.co.solo?"solo-":"")+(S.co.code||"")+"-"+(R.created||R.endAt);
  const g=game(); g.coopDone=g.coopDone||{}; if(g.coopDone[key]) return;
  const mine=Object.values(R.found||{}).filter(u=>u===coMe()).length;
  const win=R.win!==undefined?R.win:Object.keys(R.found||{}).length>=R.errs.length;
  const mc=mpCount(), paid=mc.n<MP_DAILY; mc.n++;

  trackPlay(S.co.solo?"coopSolo":"coop");
  const lotto=paid&&win&&!S.co.solo&&mc.clover<2?1:0, pass=0; mc.clover+=lotto; g.lotto=(g.lotto||0)+lotto;
  g.gold+=gold; g.exp+=exp; const before=g.lv; while(g.lv<LV_MAX&&g.exp>=expNeed(g.lv)){ g.exp-=expNeed(g.lv); g.lv++; } if(g.lv>=LV_MAX) g.exp=Math.min(g.exp,expNeed(LV_MAX));
  g.coopDone[key]=1; const ks=Object.keys(g.coopDone); if(ks.length>40) delete g.coopDone[ks[0]];

}
async function coTap(i){
  const R=coRoom(); if(!R||R.state!=="play") return;

  if(S.co.solo){ if(isErr){ R.found[i]="solo"; } else { R.misses.solo=(R.misses.solo||0)+1; S.co.flash=i; } coCheckEnd(); coRender(); return; }
  const {fsM,db}=CLOUD.fb; const ref=fsM.doc(db,"rooms",S.co.code);
  if(isErr){
    R.found={...(R.found||{}),[i]:coMe()}; coRender();
    try{ await fsM.runTransaction(db, async tx=>{ const s=await tx.get(ref); const f=(s.data().found)||{}; if(f[i]===undefined) tx.update(ref,{["found."+i]:coMe()}); }); }catch(e){}
  } else {
    S.co.flash=i; toast(T("coWrongTap")); coRender();
    fsM.updateDoc(ref,{["misses."+coMe()]:fsM.increment(1)}).catch(()=>{});
  }
}

function pgSeenAdd(k, words, max){ try{ const o=pgSeen(); o[k]=[...o[k].filter(w=>!words.includes(w)), ...words].slice(-max); localStorage.setItem(PGSEEN_KEY,JSON.stringify(o)); }catch(e){} }
async function pgLoadWords(){ if(PG_WORDS) return; try{ const t=await (await fetch("games/words.txt")).text(); PG_WORDS=new Set(t.split("\n").map(x=>x.trim()).filter(Boolean)); }catch(e){ PG_WORDS=new Set(); } }
async function pgLoadSpell(){ if(PG_SPELL) return PG_SPELL; try{ PG_SPELL=(await (await fetch("games/spell.json")).json()).words||[]; }catch(e){ PG_SPELL=[]; } return PG_SPELL; }
async function pgLoadMean(){ if(PG_MEAN) return; try{ PG_MEAN=await (await fetch("games/meanings.json")).json(); }catch(e){ PG_MEAN={}; } }
const PG_LI={zh:0,hi:1,es:2,ja:3,ko:4,en:5};
const PG_VOW="aeiou", PG_FREQ="eeeeeeeeeeeaaaaaaaaiiiiiiiioooooooonnnnnnrrrrrrttttttllllsssssuuuddddgggbbccmmppffhhvvwwyykxjqz";
const pgMe=()=>CLOUD.user?CLOUD.user.uid:"";
const pgName=()=>(game().nick||(CLOUD.user&&CLOUD.user.displayName)||"Player").slice(0,16);
const pgNm=u=>{ const P=S.pg&&S.pg.party; const n=(P&&P.players&&P.players[u])||"?"; return u===pgMe()?T("pgYou"):n; };
const pgRef=(...p)=>CLOUD.fb.fsM.doc(CLOUD.fb.db,"parties",...p);
const pgPts=n=>[0,0,0,3,5,8,12,17,23,30,38][Math.min(n,10)];
const pgMask=w=>PG_BLOCK.has(w)?w[0]+"*".repeat(w.length-1):w;
function pgRandLetter(hand){ const v=(hand||[]).filter(c=>PG_VOW.includes(c)).length; if(v===0||(hand.length>=3&&v/hand.length<0.25)) return PG_VOW[Math.floor(Math.random()*5)]; return PG_FREQ[Math.floor(Math.random()*PG_FREQ.length)]; }
function pgShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ----- room ----- */
async function pgCreate(kind){
  if(!CLOUD.user||!CLOUD.fb) return;
  const {fsM}=CLOUD.fb; S.pgBusy=T("coOpening"); pgRender();
  try{
    let code;
    for(let k=0;k<8;k++){ code=String(1000+Math.floor(Math.random()*9000)); const s=await fsM.getDoc(pgRef(code)); if(!s.exists()||s.data().state==="done"||Date.now()-(s.data().created||0)>3600e3) break; }
    await fsM.setDoc(pgRef(code),{host:pgMe(), game:kind, state:"wait", created:Date.now(), players:{[pgMe()]:pgName()}});
    await fsM.setDoc(pgRef(code,"p",pgMe()),{n:pgName(), seenSp:pgSeen().sp.slice(-200)});
    S.pgBusy=null; pgListen(code);
  }catch(e){ S.pgBusy=null; toast(T("syncFail")); pgRender(); }
}
async function pgJoin(code){
  if(!CLOUD.user||!CLOUD.fb) return; code=(code||"").trim();
  if(!/^\d{4}$/.test(code)) return toast(T("pgNoRoom"));
  const {fsM}=CLOUD.fb; S.pgBusy=T("coJoining"); pgRender();
  try{
    const s=await fsM.getDoc(pgRef(code)); const d=s.exists()?s.data():null;
    if(!d||d.state==="done"||Date.now()-(d.created||0)>3600e3){ S.pgBusy=null; pgRender(); return toast(T("pgNoRoom")); }
    const inRoom=d.players&&d.players[pgMe()];
    if(!inRoom){
      if(d.state!=="wait"){ S.pgBusy=null; pgRender(); return toast(T("pgStarted")); }
      if(Object.keys(d.players||{}).length>=PG.max){ S.pgBusy=null; pgRender(); return toast(T("pgFull")); }
      await fsM.updateDoc(pgRef(code),{["players."+pgMe()]:pgName()});
      await fsM.setDoc(pgRef(code,"p",pgMe()),{n:pgName(), seenSp:pgSeen().sp.slice(-200)});
    }
    S.pgBusy=null; pgListen(code);
  }catch(e){ S.pgBusy=null; errReport({message:"pgJoin "+String(e&&(e.code||e.message)||e)},"pgJoin"); toast(T("pgJoinFail")); pgRender(); }
}
function pgStop(){ if(S.pg){ (S.pg.unsubs||[]).forEach(f=>{ try{ f(); }catch(e){} }); } clearInterval(S.pgTimer); S.pgTimer=null; }
function pgListen(code){
  pgStop(); const {fsM}=CLOUD.fb;
  S.pg={code, party:null, ps:{}, subbed:{}, unsubs:[], L:null};
  const me=S.pg;
  me.unsubs.push(fsM.onSnapshot(pgRef(code), snap=>{
    if(S.pg!==me) return;
    if(!snap.exists()){ pgStop(); S.pg=null; toast(T("coLeftRoom")); return pgRender(); }
    me.party=safeDoc(snap.data());
    for(const u of Object.keys(me.party.players||{})) if(!me.subbed[u]){ me.subbed[u]=1; me.unsubs.push(fsM.onSnapshot(pgRef(code,"p",u), s=>{ if(S.pg!==me) return; me.ps[u]=s.exists()?safeDoc(s.data()):{}; if(u===pgMe()) pgGifts(); pgRender(); }, ()=>{})); }
    if(me.party.state==="play"&&me.party.game==="spell"&&me.party.words&&!me.seenSaved){ me.seenSaved=1; pgSeenAdd("sp",me.party.words.map(o=>o.w),300); }
    if(me.party.state==="play"){ pgLoadWords(); if(me.party.game==="bomb") pgLoadSyl(); if(me.party.game==="quiz") pgLoadQuiz(); }
    if(me.party.state==="done") pgFinish();
    pgTickStart(); pgRender();
  }, ()=>{}));
  pgRender();
}
async function pgLeave(){
  const pg=S.pg; pgStop(); S.pg=null; S.pgGuessV="";
  if(pg&&pg.party&&CLOUD.fb){ const {fsM}=CLOUD.fb;
    if(pg.party.state==="wait"){
      if(pg.party.host===pgMe()) fsM.deleteDoc(pgRef(pg.code)).catch(()=>{});
      else fsM.updateDoc(pgRef(pg.code),{["players."+pgMe()]:fsM.deleteField()}).catch(()=>{});
    }
  }
  pgRender();
}
async function pgStartGame(){
  const pg=S.pg; if(!pg||!pg.party||pg.party.host!==pgMe()||pg.party.state!=="wait") return;
  const {fsM}=CLOUD.fb; const P=pg.party, up={state:"play", start:Date.now()+3500, seed:String(Math.floor(Math.random()*1e9))};
  if(P.game==="spell"){
    await pgLoadMean();
    const byW=new Map();
    // Wordle uses only the curated list; "h" holds hints rewritten so they never contain or look like the answer
    for(const o of await pgLoadSpell()) if(o.w.length===WD.len&&!/s$/.test(o.w)) byW.set(o.w,{w:o.w, pos:o.pos, m:{zh:o.zh,hi:o.hi,es:o.es,ja:o.ja,ko:o.ko,en:o.en, ...(o.h||{})}});
    const pool=[...byW.values()]; if(pool.length<WD.rounds) return toast(T("loading"));
    // avoid words anyone in the room has played recently (each player shares their recent list when joining)
    const seen=new Set(pgSeen().sp); for(const u of Object.keys(P.players||{})) for(const w of ((pg.ps[u]||{}).seenSp||[])) seen.add(w);
    const fresh=pgShuffle(pool.filter(o=>!seen.has(o.w))), old=pgShuffle(pool.filter(o=>seen.has(o.w)));
    up.words=[...fresh, ...old].slice(0,WD.rounds);
    up.rounds={};
  }
  if(P.game==="bomb") Object.assign(up, await bmInit(P));
  if(P.game==="hunt"){ const h=await huInit(P, up); if(!h.hu) return toast(T("loading")); Object.assign(up, h); }
  try{ await fsM.updateDoc(pgRef(pg.code),up); }catch(e){ toast(T("syncFail")); }
}

/* ----- shared tick ----- */
function pgTickStart(){ if(S.pgTimer) return; S.pgTimer=setInterval(pgTick,250); }
function pgTick(){
  const pg=S.pg; if(!pg||!pg.party){ clearInterval(S.pgTimer); S.pgTimer=null; return; }
  const P=pg.party; if(P.state!=="play"){ if(P.state==="done"){ clearInterval(S.pgTimer); S.pgTimer=null; } return; }
  ({spell:pgSpellTick, drop:pgDropTick, bomb:bmTick, quiz:qzTick, hunt:huTick}[P.game]||pgDropTick)();
  pgRender();
}
function pgEndGame(){ const pg=S.pg; if(!pg||pg.ending) return; pg.ending=1; if(pg.L){ pg.L.fall=null; pgPushMe(); } CLOUD.fb.fsM.updateDoc(pgRef(pg.code),{state:"done", end:Date.now()}).catch(()=>{ pg.ending=0; }); }

/* ----- game 1: word race (multiplayer Wordle) ----- */
const WD={rounds:5, len:5, tries:6, sec:150, gap:6000};
const WD_KB=["qwertyuiop","asdfghjkl","+zxcvbnm-"];
function spRound(P){ return Object.keys(P.rounds||{}).length; }
function spStartOf(P,i){ return i===0?P.start:((P.rounds[i-1]||{}).at||P.start)+WD.gap; }
function wdMine(i){ const pg=S.pg; pg.wd=pg.wd||{}; if(!pg.wd[i]){ const prev=(((pg.ps[pgMe()]||{}).wd)||{})[i]; pg.wd[i]=prev?{g:[...(prev.g||[])],done:prev.done||null,t:prev.t||0}:{g:[],done:null,t:0}; } return pg.wd[i]; }
function wdRec(u,i){ return u===pgMe()?wdMine(i):((((S.pg.ps[u]||{}).wd)||{})[i]||{g:[]}); }
function wdColors(guess,ans){ const res=Array(guess.length).fill("b"), cnt={}; for(let k=0;k<ans.length;k++){ if(guess[k]===ans[k]) res[k]="g"; else cnt[ans[k]]=(cnt[ans[k]]||0)+1; } for(let k=0;k<guess.length;k++){ if(res[k]==="g") continue; if(cnt[guess[k]]){ res[k]="y"; cnt[guess[k]]--; } } return res; }
function wdFirstT(P,i){ let m=Infinity; for(const u in P.players){ const r=wdRec(u,i); if(r.done==="win"&&r.t<m) m=r.t; } return m; }
function wdScore(r,first){ if(!r||r.done!=="win") return 0; return 10+(WD.tries-r.g.length)*2+(r.t===first?5:0); }
function spScores(P){ const sc={}; for(const u in P.players){ sc[u]=0; for(let i=0;i<(P.words||[]).length;i++) sc[u]+=wdScore(wdRec(u,i),wdFirstT(P,i)); } return sc; }
function wdPush(i){ const pg=S.pg, r=wdMine(i); CLOUD.fb.fsM.updateDoc(pgRef(pg.code,"p",pgMe()),{n:pgName(), ["wd."+i]:{g:r.g, done:r.done, t:r.t}}).catch(()=>{}); }
function pgSpellTick(){
  const pg=S.pg, P=pg.party, i=spRound(P), n=(P.words||[]).length||WD.rounds;
  if(i>=n) return pgEndGame();
  const st=spStartOf(P,i), dl=st+WD.sec*1000, now=Date.now(); if(now<st) return;
  if(pg.curFor!==i){ pg.curFor=i; pg.cur=""; }
  const me=wdMine(i); if(!me.done&&now>dl){ me.done="lose"; wdPush(i); }
  const allDone=Object.keys(P.players).every(u=>wdRec(u,i).done);
  if((allDone||now>dl+800)&&pg.closeFor!==i){ pg.closeFor=i; const {fsM,db}=CLOUD.fb, ref=pgRef(pg.code);
    setTimeout(()=>fsM.runTransaction(db, async tx=>{ const r=((await tx.get(ref)).data().rounds)||{}; if(!r[i]&&Object.keys(r).length===i) tx.update(ref,{["rounds."+i]:{at:Date.now()}}); }).catch(()=>{ pg.closeFor=null; }), allDone?900:0); }
}
function wdKey(k){
  const pg=S.pg; if(!pg||!pg.party||pg.party.state!=="play"||pg.party.game!=="spell") return false;
  const P=pg.party, i=spRound(P); if(i>=(P.words||[]).length||Date.now()<spStartOf(P,i)) return true;
  const me=wdMine(i); if(me.done) return true;
  if(pg.curFor!==i){ pg.curFor=i; pg.cur=""; }
  if(k==="enter") wdSubmit(); else if(k==="back") pg.cur=(pg.cur||"").slice(0,-1); else if(/^[a-z]$/.test(k)&&(pg.cur||"").length<WD.len) pg.cur=(pg.cur||"")+k;
  pgRender(); return true;
}
function wdSubmit(){
  const pg=S.pg, P=pg.party, i=spRound(P), W=P.words[i], me=wdMine(i), g=pg.cur||"";
  if(g.length<WD.len){ pg.shake=Date.now(); return toast(T("wdShort",{n:WD.len})); }
  if(!PG_WORDS||!PG_WORDS.size){ pgLoadWords(); return toast(T("loading")); }
  if(g!==W.w&&!PG_WORDS.has(g)){ pg.shake=Date.now(); return toast(T("pgInvalid")); }
  me.g.push(g); pg.cur=""; pg.flip={i, row:me.g.length-1, at:Date.now()};
  if(g===W.w){ me.done="win"; me.t=Date.now()-spStartOf(P,i); toast(T("wdWin",{n:me.g.length})); }
  else if(me.g.length>=WD.tries){ me.done="lose"; toast(T("wdLose",{w:W.w.toUpperCase()})); }
  wdPush(i);
}
function wdGrid(r,ans,opt){ opt=opt||{}; const rows=[];
  for(let k=0;k<WD.tries;k++){ const g=r.g[k];
    if(g){ const c=wdColors(g,ans), flip=opt.flip&&opt.flip===k; rows.push(`<div class="wd-row">${[...g].map((ch,j)=>`<span class="wd-c ${c[j]}${flip?" flip":""}" style="${flip?`animation-delay:${j*0.12}s`:""}">${opt.mini?"":esc(ch.toUpperCase())}</span>`).join("")}</div>`); }
    else if(!opt.mini&&k===r.g.length&&!r.done){ const cur=opt.cur||""; rows.push(`<div class="wd-row cur${opt.shake?" shake":""}">${Array.from({length:WD.len},(_,j)=>`<span class="wd-c${cur[j]?" typed":""}">${cur[j]?esc(cur[j].toUpperCase()):""}</span>`).join("")}</div>`); }
    else rows.push(`<div class="wd-row">${Array.from({length:WD.len},()=>`<span class="wd-c"></span>`).join("")}</div>`); }
  return `<div class="wd-grid${opt.mini?" mini":""}">${rows.join("")}</div>`; }
function wdKeyboard(r,ans){ const best={}; const rank={g:3,y:2,b:1};
  for(const g of r.g){ const c=wdColors(g,ans); [...g].forEach((ch,j)=>{ if((rank[c[j]]||0)>(rank[best[ch]]||0)) best[ch]=c[j]; }); }
  return `<div class="wd-kb">${WD_KB.map(row=>`<div class="wd-kr">${[...row].map(ch=>ch==="+"?`<button class="wd-k wide" data-act="pgkey" data-k="enter">${T("wdEnter")}</button>`:ch==="-"?`<button class="wd-k wide" data-act="pgkey" data-k="back" aria-label="back">⌫</button>`:`<button class="wd-k ${best[ch]||""}" data-act="pgkey" data-k="${ch}">${ch.toUpperCase()}</button>`).join("")}</div>`).join("")}</div>`; }
function wdEmoji(r,ans){ return r.g.map(g=>wdColors(g,ans).map(c=>c==="g"?"🟩":c==="y"?"🟨":"⬜").join("")).join("<br>"); }
function spMeaning(W, hide){ const m=(W.m&&(W.m[LANG]||W.m.en))||""; return esc(hide?qHide(m,W.w):m); }   // hide: strip English notes that give the answer away
function spSections(){
  const pg=S.pg, P=pg.party, i=spRound(P), now=Date.now(), sc=spScores(P), n=(P.words||[]).length;
  const board=Object.keys(P.players).sort((a,b)=>(sc[b]||0)-(sc[a]||0)).map(u=>`<div class="pg-chip${u===pgMe()?" me":""}"><b>${esc(pgNm(u))}</b><span>${sc[u]||0}</span></div>`).join("");
  if(i>=n) return [["pgBoard",`<div class="pg-board">${board}</div>`],["pgStage",`<p class="muted">${T("loading")}</p>`]];
  const st=spStartOf(P,i), W=P.words[i];
  if(now<st){
    const pw=i>0?P.words[i-1]:null;
    const recap=pw?`<div class="eyebrow">${T("wdAnswer")}</div><div class="wd-ans">${esc(pw.w.toUpperCase())}</div><p class="sp-mean"><span class="chip">${esc(pw.pos||"")}</span> ${spMeaning(pw,true)}</p>
      <div class="wd-others">${Object.keys(P.players).map(u=>{ const r=wdRec(u,i-1); return `<div class="wd-op"><b>${esc(pgNm(u))}</b>${wdGrid(r,pw.w,{mini:1})}<small>${r.done==="win"?`✅ ${r.g.length}/${WD.tries}`:`❌`}</small></div>`; }).join("")}</div>`:`<div class="eyebrow">${T("pgGetReady")}</div>`;
    return [["pgBoard",`<div class="pg-board">${board}</div>`],["pgStage",`<div class="sp-wait">${recap}<div class="sp-count">${Math.ceil((st-now)/1000)}</div><p class="muted sm-t">${T("pgRound",{i:i+1,n})}</p></div>`]];
  }
  const me=wdMine(i), left=Math.max(0,Math.ceil((st+WD.sec*1000-now)/1000)), shake=pg.shake&&now-pg.shake<500, flip=pg.flip&&pg.flip.i===i&&now-pg.flip.at<1200?pg.flip.row:-1;
  const head=`<div class="row" style="justify-content:space-between"><span class="eyebrow">${T("pgRound",{i:i+1,n})}</span><b class="sm-t ${left<=20?"bad-t":""}">${T("pgLeft",{s:left})}</b></div>
    <p class="sp-mean"><span class="chip">${esc(W.pos||"")}</span> ${me.done?spMeaning(W,true):`<span class="muted">${T("wdHint")}</span> ${left<=WD.sec/2||me.g.length>=3?spMeaning(W,true):"🔒"}`}</p>`;
  const others=`<div class="wd-others">${Object.keys(P.players).filter(u=>u!==pgMe()).map(u=>{ const r=wdRec(u,i); return `<div class="wd-op"><b>${esc(pgNm(u))}</b>${wdGrid(r,W.w,{mini:1})}<small>${r.done==="win"?"✅":r.done?"❌":"⏳ "+(r.g||[]).length+"/"+WD.tries}</small></div>`; }).join("")}</div>`;
  const status=me.done?`<p class="wd-status ${me.done}">${me.done==="win"?T("wdWin",{n:me.g.length}):T("wdLose",{w:esc(W.w.toUpperCase())})} · ${T("wdWaitOthers")}</p>`:"";
  return [["pgBoard",`<div class="pg-board">${board}</div>`],["pgHead2",head],["pgOthers",others],
    ["pgGrid",wdGrid(me,W.w,{cur:pg.curFor===i?pg.cur:"", shake, flip})+status],
    ["pgKb",me.done?"":wdKeyboard(me,W.w)]];
}

/* ----- game 2: letter rain ----- */
function dpOut(p,now){ return !!(p&&(p.out||(p.last&&now>p.last+PG.life*1000+1500))); }
function pgDropTick(){
  const pg=S.pg, P=pg.party, now=Date.now(); if(now<P.start) return;
  if(!pg.L){ const hand=[]; const prev=pg.ps[pgMe()];
    if(prev&&prev.last&&prev.last>=P.start){ pg.L={hand:[...(prev.hand||"")], sel:[], fall:null, fallId:0, next:now+PG.dropMs, last:prev.last, words:prev.words||[], bad:prev.bad||[], pts:prev.pts||0, out:!!prev.out, gifted:Object.fromEntries(Object.keys(prev.gifts||{}).map(k=>[k,1])), sent:0}; return; } for(let k=0;k<PG.startN;k++) hand.push(pgRandLetter(hand)); if(!hand.some(c=>PG_VOW.includes(c))) hand[2]=PG_VOW[Math.floor(Math.random()*5)];
    pg.L={hand, sel:[], fall:null, fallId:0, next:P.start+PG.dropMs, last:P.start, words:[], bad:[], pts:0, out:false, gifted:{}, sent:0};
    pgGifts(); pgPushMe(); }
  const L=pg.L;
  if(!L.out){
    if(now>L.last+PG.life*1000){ L.out=true; L.fall=null; toast(T("pgOut")); pgPushMe(); }
    else if(now>=L.next){
      if(L.fall){ if(L.hand.length<PG.handMax){ L.hand.push(L.fall.l); } else toast(T("pgDropped")); }
      L.fallId++; L.fall={l:pgRandLetter(L.hand), id:L.fallId}; L.next+=PG.dropMs; if(L.next<now) L.next=now+PG.dropMs; pgPushMe();
    }
  }
  const ids=Object.keys(P.players), allOut=ids.every(u=>u===pgMe()?L.out:dpOut(pg.ps[u],now));
  if(now>P.start+PG.total*1000||allOut) pgEndGame();
}
function pgPushMe(){ const pg=S.pg, L=pg&&pg.L; if(!L) return; clearTimeout(pg.pushT); pg.pushT=setTimeout(()=>{ CLOUD.fb.fsM.setDoc(pgRef(pg.code,"p",pgMe()),{n:pgName(), hand:L.hand.join(""), words:L.words, bad:L.bad.slice(-30), pts:L.pts, last:L.last, out:L.out, fall:L.fall?L.fall.l:"", cur:L.sel.map(k=>L.hand[k]).join("")},{merge:true}).catch(()=>{}); },250); }
function pgGifts(){ const pg=S.pg; if(pg&&pg.party&&pg.party.game==="quiz"&&pg.party.state==="play") return qzGifts(); if(!pg||!pg.L) return; const L=pg.L, gs=(pg.ps[pgMe()]||{}).gifts||{};
  for(const [id,g] of Object.entries(gs)){ if(L.gifted[id]) continue; L.gifted[id]=1; if(L.out) continue; if(L.hand.length<PG.giftMax){ L.hand.push(g.l); toast(T("pgGift",{n:pgNm(g.f), l:g.l.toUpperCase()})); } else toast(T("pgHandFull")); }
}
function pgFallKeep(){ const L=S.pg&&S.pg.L; if(!L||!L.fall) return; if(L.hand.length>=PG.handMax) return toast(T("pgHandFull")); L.hand.push(L.fall.l); L.fall=null; pgPushMe(); pgRender(); }
function pgFallPass(to){ const pg=S.pg, L=pg&&pg.L; if(!L||!L.fall) return; const now=Date.now();
  if(dpOut(pg.ps[to],now)) return toast(T("pgOutTag"));
  const id=pgMe().slice(0,6)+"-"+(++L.sent)+"-"+now; const l=L.fall.l; L.fall=null;
  CLOUD.fb.fsM.updateDoc(pgRef(pg.code,"p",to),{["gifts."+id]:{l, f:pgMe(), at:now}}).then(()=>toast(T("pgSent",{n:pgNm(to)}))).catch(()=>toast(T("syncFail"))); pgRender(); }
function pgPick(k){ const L=S.pg&&S.pg.L; if(!L||L.out) return; const j=L.sel.indexOf(k); if(j>=0) L.sel.splice(j,1); else L.sel.push(k); pgPushMe(); pgRender(); }
function pgClearSel(){ const L=S.pg&&S.pg.L; if(L){ L.sel=[]; pgPushMe(); pgRender(); } }
function pgDiscard(){ const L=S.pg&&S.pg.L; if(!L||!L.sel.length) return; L.hand=L.hand.filter((_,k)=>!L.sel.includes(k)); L.sel=[]; pgPushMe(); pgRender(); }
function pgSubmitWord(){
  const pg=S.pg, L=pg&&pg.L; if(!L||L.out) return;
  const w=L.sel.map(k=>L.hand[k]).join(""); if(w.length<3) return toast(T("pgTooShort"));
  if(!PG_WORDS||!PG_WORDS.size){ pgLoadWords(); return toast(T("loading")); }

function pgFinish(){

/* ----- game 5: team error hunt (2–6 players) — a short Irish legend / place / history story with a few planted mistakes ----- */
const HU={sec:180};
let HU_LIB=null;
async function huLoad(){ if(HU_LIB) return HU_LIB; try{ HU_LIB=(await (await fetch("games/hunt.json")).json()).p||[]; }catch(e){ HU_LIB=[]; } return HU_LIB; }
const HU_RE=/([A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*)/;
const huErrN=n=>Math.min(9,4+Math.max(1,n)), huLives=n=>3+Math.max(1,n);   // more players: more mistakes to find and a longer team life bar
function huBuild(ps, seed, n){
  const r=rng(seed); let idx=0; const toks=[];
  ps.p.forEach(par=>par.split(HU_RE).forEach((t,j)=>{ if(j%2) toks.push({t,i:idx++}); }));
  const alt=ps.alt||{}, cands=[];
  toks.forEach(({t,i},k)=>{ const lo=t.toLowerCase(), cap=t[0]!==lo[0];
    if(i===0) return;
    if(alt[lo]) cands.push({i,type:"form",wrong:keepCase(t,alt[lo]),right:t,pri:3});
    if(cap) return;   // never touch names
    if(CONF[lo]) cands.push({i,type:"conf",wrong:CONF[lo],right:t,pri:2});
    if(lo.length>=6&&/^[a-z]+$/.test(lo)){ const w=misspell(t,r); if(w.toLowerCase()!==lo&&!(PG_WORDS&&PG_WORDS.has(w.toLowerCase()))) cands.push({i,type:"spell",wrong:w,right:t,pri:1}); } });
  const order=cands.map(c=>({c,k:r()+c.pri*0.2})).sort((a,b)=>b.k-a.k).map(o=>o.c), picked=[], used=new Set(), cnt={conf:0,form:0,spell:0};
